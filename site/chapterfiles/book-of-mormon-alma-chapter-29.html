<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 29",
  audioSrc: "https://archive.org/download/alma-ch-29/Alma%20Ch%2029.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 29"},{"time":8.68,"text":"1. And now it came to pass that when Moroni had received this epistle, His heart did take courage and was filled with exceeding great joy because of the faithfulness of Pahoron, That he was not also a traitor to the freedom and cause of his country;"},{"time":17.36,"text":"2. But he did also mourn exceedingly because of the iniquity of those who had driven Pahoron from the judgment seat; Yea, in fine, because of those who had rebelled against their country, and also their God."},{"time":29.011,"text":"3. And it came to pass that Moroni took a small number of men according to the desire of Pahoron, And gave Lehi and Teancum command over the remainder of his army, And took his march toward the Land of Gideon;"},{"time":42.409,"text":"4. And he did raise the standard of liberty in whatsoever place he did enter, And gained whatsoever force he could in all his march toward the Land of Gideon."},{"time":52.08,"text":"5. And it came to pass that thousands did flock unto his standard and did take up their swords in the defense of their freedom, that they might not come into bondage."},{"time":61.049,"text":"6. And thus when Moroni had gathered together whatsoever men he could in all his march, he came to the Land of Gideon; And uniting his forces with that of Pahoron, they became exceeding strong, Even stronger than the men of Pachus, which was the king of those dissenters which had driven out the Freemen out of the Land of Zarahemla and had taken possession of the land."},{"time":82.274,"text":"7. And it came to pass that Moroni and Pahoron went down with their armies into the Land of Zarahemla, And went forth against the city and did meet the men of Pachus, insomuch that they did come to battle."},{"time":96.032,"text":"8. And behold, Pachus was slain and his men were taken prisoners; And Pahoron was restored to his judgment seat."},{"time":103.694,"text":"9. And the men of Pachus received their trial according to the law, and also those Kingmen which had been taken and cast into prison; And they were executed according to the law -"},{"time":115.28,"text":"10. Yea, those men of Pachus and those Kingmen - whosoever would not take up arms in the defense of their country, but would fight against it - were put to death."},{"time":124.866,"text":"11. And thus it became expedient that this law should be strictly observed for the safety of their country; Yea, and whosoever was found denying their freedom was speedily executed according to the law."},{"time":137.173,"text":"12. And thus ended the thirtieth year of the reign of the judges over the people of Nephi, Moroni and Pahoron having restored peace to the Land of Zarahemla among their own people, Having inflicted death upon all those who were not true to the cause of freedom."},{"time":153.44,"text":"13. And it came to pass in the commencement of the thirty and first year of the reign of the judges over the people of Nephi, Moroni immediately caused that provisions should be sent, and also an army of six thousand men should be sent unto Helaman, to assist him in preserving that part of the land;"},{"time":170.291,"text":"14. And he also caused that an army of six thousand men, with a sufficient quantity of food, should be sent to the armies of Lehi and Teancum."},{"time":179.388,"text":"15. And it came to pass that this was done to fortify the land against the Lamanites."},{"time":185.064,"text":"16. And it came to pass that Moroni and Pahoron, leaving a large body of men in the Land of Zarahemla, Took their march with a large body of men toward the Land of Nephihah, Being determined to overthrow the Lamanites in that city."},{"time":199.031,"text":"17. And it came to pass that as they were marching toward the land, They took a large body of men of the Lamanites and slew many of them, And took their provisions and their weapons of war."},{"time":210.749,"text":"18. And it came to pass after they had taken them, They caused them to enter into a covenant that they would no more take up their weapons of war against the Nephites;"},{"time":219.944,"text":"19. And when they had entered into this covenant, they sent them to dwell with the people of Ammon; And they were in number about four thousand which had not been slain."},{"time":231.44,"text":"20. And it came to pass that when they had sent them away, they pursued their march toward the Land of Nephihah."},{"time":236.952,"text":"21. And it came to pass that when they had come to the City Nephihah, They did pitch their tents in the Plains of Nephihah, which is near the City Nephihah."},{"time":247.227,"text":"22. Now Moroni was desirous that the Lamanites should come out to battle against them upon the plains; But the Lamanites knowing of their exceeding great courage and beholding the greatness of their numbers, Therefore, they durst not come out against them; Therefore, they did not come to battle in that day."},{"time":265.04,"text":"23. And when the night came, Moroni went forth in the darkness of the night and came upon the top of the wall to spy out in what part of the city the Lamanites did camp with their army."},{"time":276.32,"text":"24. And it came to pass that they were on the east by the entrance, And they were all asleep."},{"time":282.48,"text":"25. And now Moroni returned to his army and caused that they should prepare in haste strong cords and ladders to be let down from the top of the wall into the inner part of the wall."},{"time":292.975,"text":"26. And it came to pass that Moroni caused that his men should march forth and come up upon the top of the wall, And let themselves down into that part of the city - yea, even on the west - where the Lamanites did not camp with their armies."},{"time":306.709,"text":"27. And it came to pass that they were all let down into the city by night, by the means of their strong cords and their ladders; Thus when the morning came, they were all within the walls of the city."},{"time":319.312,"text":"28. And now when the Lamanites awoke and saw that the armies of Moroni were within the walls, They were affrightened exceedingly, insomuch that they did flee out by the pass."},{"time":330.06,"text":"29. And now when Moroni saw that they were fleeing before him, He did cause that his men should march forth against them and slew many and surrounded many others and took them prisoners; And the remainder of them fled into the Land of Moroni, which was in the borders by the seashore."},{"time":346.96,"text":"30. Thus had Moroni and Pahoron obtained the possession of the City of Nephihah without the loss of one soul; And there were many of the Lamanites which were slain."},{"time":355.92,"text":"31. Now it came to pass that as many of the Lamanites that were prisoners were desirous to join the people of Ammon and become a free people."},{"time":365.36,"text":"32. And it came to pass that as many as were desirous, unto them it was granted, according to their desires; Therefore, all the prisoners of the Lamanites did join the people of Ammon, And did begin to labor exceedingly, tilling the ground, raising all manner of grain and flocks and herds of every kind;"},{"time":383.454,"text":"33. And thus were the Nephites relieved from a great burden, Yea, insomuch that they were relieved from all the prisoners of the Lamanites."},{"time":393.44,"text":"34. Now it came to pass that Moroni - After he had obtained possession of the City of Nephihah, Having taken many prisoners, which did reduce the armies of the Lamanites exceedingly, And having retained many of the Nephites which had been taken prisoners, which did strengthen the army of Moroni exceedingly - Therefore, Moroni went forth from the Land of Nephihah to the Land of Lehi."},{"time":414.897,"text":"35. And it came to pass that when the Lamanites saw that Moroni was a coming against them, They were again frightened and fled before the army of Moroni."},{"time":424.907,"text":"36. And it came to pass that Moroni and his army did pursue them from city to city, until they were met by Lehi and Teancum; And the Lamanites fled from Lehi and Teancum, even down upon the borders by the seashore, until they came to the Land of Moroni."},{"time":440.52,"text":"37. And the armies of the Lamanites were all gathered together, insomuch that they were all in one body in the Land of Moroni;"},{"time":447.106,"text":"38. Now Ammaron, the king of the Lamanites, was also with them."},{"time":453.693,"text":"39. And it came to pass that Moroni and Lehi and Teancum did encamp with their armies round about in the borders of the Land of Moroni, Insomuch that the Lamanites were encircled about in the borders by the wilderness on the south, And in the borders by the wilderness on the east; And thus they did encamp for the night."},{"time":473.12,"text":"40. For behold, the Nephites and the Lamanites also were weary because of the greatness of the march; Therefore, they did not resolve upon any stratagem in the nighttime, save it were Teancum;"},{"time":485.52,"text":"41. For he was exceeding angry with Ammaron, Insomuch that he considered that Ammaron and Amalickiah, his brother, had been the cause of this great and lasting war between them and the Lamanites, Which had been the cause of so much war and bloodshed, yea, and so much famine."},{"time":502.48,"text":"42. And it came to pass that Teancum - in his anger - did go forth into the camp of the Lamanites and did let himself down over the walls of the city;"},{"time":511.512,"text":"43. And he went forth with a cord from place to place, insomuch that he did find the king; And he did cast a javelin at him, which did pierce him near the heart;"},{"time":521.476,"text":"44. But behold, the king did awake his servant before he died, insomuch that they did pursue Teancum and slew him."},{"time":529.718,"text":"45. Now it came to pass that when Lehi and Moroni knew that Teancum was dead, they were exceeding sorrowful; For behold, he had been a man which had fought valiantly for his country, yea, a true friend to liberty, And he had suffered very many exceeding sore afflictions;"},{"time":546.48,"text":"46. But behold, he was dead and had gone the way of all the earth."},{"time":550.853,"text":"47. Now it came to pass that Moroni marched forth on the morrow and came upon the Lamanites, insomuch that they did slay them with a great slaughter; And they did drive them out of the land; And they did flee, even that they did not return at that time against the Nephites."},{"time":566.589,"text":"48. And thus ended the thirty and first year of the reign of the judges over the people of Nephi; And thus they had had wars and bloodsheds and famine and affliction for the space of many years;"},{"time":579.473,"text":"49. And there had been murders and contentions and dissensions and all manner of iniquity among the people of Nephi; Nevertheless, for the righteous' sake, yea, because of the prayers of the righteous, they were spared."},{"time":593.266,"text":"50. But behold, because of the exceeding great length of the war between the Nephites and the Lamanites, Many had become hardened because of the exceeding great length of the war;"},{"time":603.825,"text":"51. And many were softened because of their afflictions, insomuch that they did humble themselves before God, even in the depth of humility."},{"time":611.951,"text":"52. And it came to pass that after Moroni had fortified those parts of the land which were most exposed to the Lamanites until they were sufficiently strong, he returned to the City of Zarahemla, And also Helaman returned to the place of his inheritance; And there was once more peace established among the people of Nephi."},{"time":631.247,"text":"53. And Moroni yielded up the command of his armies into the hands of his son, whose name was Moronihah; And he retired to his own house, that he might spend the remainder of his days in peace."},{"time":644.04,"text":"54. And Pahoron did return to his judgment seat; And Helaman did take upon him again to preach unto the people the word of God, For because of so many wars and contentions, it had become expedient that a regulation should be made again in the church;"},{"time":658.329,"text":"55. Therefore, Helaman and his brethren went forth and did declare the word of God with much power, Unto the convincing of many people of their wickedness, which did cause them to repent of their sins and to be baptized unto the Lord their God."},{"time":673.364,"text":"56. And it came to pass that they did establish again the church of God throughout all the land; Yea, and regulations were made concerning the law;"},{"time":682.711,"text":"57. And their judges and their chief judges were chosen;"},{"time":686.631,"text":"58. And the people of Nephi began to prosper again in the land, And began to multiply and to wax exceeding strong again in the land;"},{"time":699.916,"text":"59. And they began to grow exceeding rich. But notwithstanding their riches or their strength or their prosperity, they were not lifted up in the pride of their eyes; Neither were they slow to remember the Lord their God, But they did humble themselves exceedingly before Him;"},{"time":713.2,"text":"60. Yea, they did remember how great things the Lord had done for them - That He had delivered them from death, and from bonds and from prisons, and from all manner of afflictions; And He had delivered them out of the hands of their enemies -"},{"time":727.058,"text":"61. And they did pray unto the Lord their God continually, insomuch that the Lord did bless them according to His word, So that they did wax strong and prosper in the land."},{"time":737.264,"text":"62. And it came to pass that all these things were done."},{"time":742.64,"text":"63. And Helaman died in the thirty and fifth year of the reign of the judges over the people of Nephi."}]
};
