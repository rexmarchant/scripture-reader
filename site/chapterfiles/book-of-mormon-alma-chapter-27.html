<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 27",
  audioSrc: "https://archive.org/download/alma-ch-27/Alma%20Ch%2027.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 27"},{"time":9.825,"text":"1. Now it came to pass in the thirtieth year of the reign of the judges over the people of Nephi, after Moroni had received and had read Helaman's epistle, He was exceedingly rejoiced because of the welfare, yea, the exceeding success which Helaman had had in obtaining those lands which were lost;"},{"time":19.651,"text":"2. Yea, and he did make it known unto all his people in all the land round about in that part where he was, that they might rejoice also."},{"time":29.06,"text":"3. And it came to pass that he immediately sent an epistle to Pahoron, Desiring that he should cause men to be gathered together to strengthen Helaman, or the armies of Helaman, Insomuch that he might with ease maintain that part of the land which he had been so miraculously prospered in retaining."},{"time":46.139,"text":"4. And it came to pass when Moroni had sent this epistle to the Land of Zarahemla, He began again to lay a plan that he might obtain the remainder of those possessions and cities which the Lamanites had taken from them."},{"time":59.44,"text":"5. And it came to pass that while Moroni was thus making preparations to go against the Lamanites to battle, Behold, the people of Nephihah which were gathered together from the City of Moroni and the City of Lehi and the City of Morionton were attacked by the Lamanites."},{"time":75.751,"text":"6. Yea, even those which had been compelled to flee from the Land of Manti and from the land round about had come over and joined the Lamanites in this part of the land;"},{"time":86.249,"text":"7. And thus being exceeding numerous, yea, and receiving strength from day to day, By the command of Ammaron they came forth against the people of Nephihah, And they did begin to slay them with an exceeding great slaughter."},{"time":100.107,"text":"8. And their armies were so numerous that the remainder of the people of Nephihah were obliged to flee before them; And they came even and joined the army of Moroni."},{"time":109.456,"text":"9. And now as Moroni had supposed that there should be men sent to the City of Nephihah to the assistance of the people to maintain that city, And knowing that it was easier to keep the city from falling into the hands of the Lamanites than to retake it from them, He supposed that they would easily maintain that city;"},{"time":127.931,"text":"10. Therefore, he retained all his force to maintain those places which he had recovered."},{"time":133.715,"text":"11. And now when Moroni saw that the City of Nephihah was lost, He was exceeding sorrowful and began to doubt, because of the wickedness of the people, whether they should not fall into the hands of their brethren;"},{"time":146.529,"text":"12. Now this was the case with all his chief captains that doubted and marveled also because of the wickedness of the people, And this because of the success of the Lamanites over them."},{"time":157.006,"text":"13. And it came to pass that Moroni was angry with the government because of their indifference concerning the freedom of their country."},{"time":165.04,"text":"14. And it came to pass that he wrote again to the governor of the land, which was Pahoron, And these are the words which he wrote, saying: \"Behold, I direct mine epistle to Pahoron, in the City of Zarahemla, which is the chief judge and the governor over the land, And also to all those who hath been chosen by this people to govern and manage the affairs of this war;"},{"time":187.28,"text":"15. For behold, I have somewhat to say unto them by the way of condemnation. \"For behold, ye yourselves know that ye have been appointed to gather together men, And arm them with swords and with scimitars and all manner of weapons of war of every kind, And send forth against the Lamanites in whatsoever parts they should come into our land."},{"time":207.533,"text":"16. \"And now behold, I say unto you that myself and also my men and also Helaman and his men have suffered exceeding great sufferings - Yea, even hunger, thirst and fatigue and all manner of afflictions of every kind."},{"time":223.28,"text":"17. \"But behold, were this all we had suffered, we would not murmur nor complain; But behold, great has been the slaughter among our people -"},{"time":232.028,"text":"18. Yea, thousands have fallen by the sword, While it might have otherwise been if ye had rendered unto our armies sufficient strength and succor for them;"},{"time":242.504,"text":"19. Yea, great has been your neglect toward us. \"And now behold, we desire to know the cause of this exceeding great neglect; Yea, we desire to know the cause of your thoughtless state."},{"time":256.4,"text":"20. \"Can you think to sit upon your thrones in a state of thoughtless stupor, while your enemies are spreading the work of death around you?"},{"time":264.64,"text":"21. Yea, while they are murdering thousands of your brethren? Yea, even they which have looked up to you for protection - yea, have placed you in a situation that ye might have succored them?"},{"time":277.44,"text":"22. \"Yea, ye might have sent armies unto them to have strengthened them and have saved thousands of them from falling by the sword!"},{"time":285.378,"text":"23. \"But behold, this is not all - Ye have withheld your provisions from them, Insomuch that many have fought and bled out their lives because of their great desires which they had for the welfare of this people;"},{"time":297.996,"text":"24. Yea, and this they have done when they were about to perish with hunger because of your exceeding great neglect toward them."},{"time":306.5,"text":"25. \"And now, my beloved brethren - for ye had ought to be beloved - Yea, and ye had ought to have stirred yourselves more diligently for the welfare and the freedom of this people;"},{"time":318.1,"text":"26. But behold, ye have neglected them insomuch that the blood of thousands shall come upon your heads for vengeance; Yea, for known unto God were all their cries and all their sufferings."},{"time":329.97,"text":"27. \"Behold, could ye suppose that ye could sit upon your thrones, And because of the exceeding goodness of God, ye could do nothing and He would deliver you? Behold, if ye have supposed this, ye have supposed in vain."},{"time":345.28,"text":"28. \"Do ye suppose that, because so many of your brethren have been killed because of their wickedness? I say unto you, if ye have supposed this, ye have supposed in vain; For I say unto you, that there are many which have fallen by the sword."},{"time":361.76,"text":"29. \"And behold, it is to your condemnation; For the Lord suffereth the righteous to be slain that His justice and judgment may come upon the wicked; Therefore, ye need not suppose that the righteous are lost because they are slain; But behold, they do enter into the rest of the Lord their God."},{"time":379.36,"text":"30. \"And now behold, I say unto you, I fear exceedingly that the judgments of God will come upon this people because of their exceeding slothfulness, Yea, even the slothfulness of our government and their exceeding great neglect toward their brethren, yea, toward those which have been slain."},{"time":396.353,"text":"31. \"For were it not for the wickedness which first commenced at our head, We could have withstood our enemies, that they could have gained no power over us - \"Yea, had it not been for the war which broke out among ourselves -"},{"time":410.56,"text":"32. \"Yea, were it not for those Kingmen which caused so much bloodshed among ourselves - \"Yea, at the time we were contending among ourselves, if we had united our strength as we hitherto have done -"},{"time":423.68,"text":"33. \"Yea, had it not been for the desire of power and authority which those Kingmen had over us - \"Had they been true to the cause of our freedom and united with us and gone forth against our enemies instead of taking up their swords against us, which was the cause of so much bloodshed among ourselves -"},{"time":439.431,"text":"34. \"Yea, if we had gone forth against them, in the strength of the Lord - We should have dispersed our enemies, For it would have been done according to the fulfilling of His word."},{"time":452.08,"text":"35. \"But behold, now the Lamanites are coming upon us, And they are murdering our people with the sword, yea, our women and our children, Taking possession of our lands, and also carrying them away captive, Causing them that they should suffer all manner of afflictions; And this because of the great wickedness of those who are seeking for power and authority, yea, even those Kingmen."},{"time":475.68,"text":"36. \"But why should I say much concerning this matter? For we know not but what ye yourselves are a seeking for authority; We know not but what ye are also traitors to your country;"},{"time":486.512,"text":"37. Or is it that ye have neglected us because ye are in the heart of our country and ye are surrounded by security, That ye do not cause food to be sent unto us, and also men to strengthen our armies?"},{"time":500.08,"text":"38. \"Have ye forgot the commandments of the Lord your God? Yea, have ye forgot the captivity of our fathers?"},{"time":507.36,"text":"39. Have ye forgot the many times we have been delivered out of the hands of our enemies?"},{"time":514.32,"text":"40. Or do ye suppose that the Lord will still deliver us while we sit upon our thrones and do not make use of the means which the Lord hath provided for us?"},{"time":524.248,"text":"41. \"Yea, will ye sit in idleness, while ye are surrounded with thousands of those, yea, and tens of thousands of those which do also sit in idleness? While there are thousands round about in the borders of the land which are falling by the sword, yea, wounded and bleeding?"},{"time":541.124,"text":"42. \"Do ye suppose that God will look upon you as guiltless, while ye sit still and behold these things? Behold, I say unto you, Nay!"},{"time":554.08,"text":"43. \"Now I would that ye should remember that God hath said that the inward vessel shall be cleansed first, And then shall the outer vessel be cleansed also."},{"time":562.219,"text":"44. \"And now except ye do repent of that which ye have done and begin to be up and doing, And send forth food and men unto us, and also unto Helaman that he may support those parts of our country which he hath obtained, And that we may also recover the remainder of our possessions in these parts, Behold, it will be expedient that we contend no more with the Lamanites until we have first cleansed our inward vessel, yea, even the great head of our government."},{"time":589.979,"text":"45. \"And except ye grant mine epistle and come out and show unto me a true spirit of freedom, And strive to strengthen and fortify our armies and grant unto them food for their support, Behold, I will leave a part of my Freemen to maintain this part of our land; And I will leave the strength and the blessings of God upon them, that none other power can operate against them - and this because of their exceeding faith and their patience in their tribulations -"},{"time":615.2,"text":"46. And I will come unto you; And if there be any among you that hath a desire for freedom, yea, if there be even a spark of freedom remaining, Behold, I will stir up insurrections among you, even until those who hath desires to usurp power and authority shall become extinct."},{"time":632.48,"text":"47. \"Yea, behold I do not fear your power nor your authority, But it is my God whom I fear; And it is according to His commandments that I do take my sword to defend the cause of my country; And it is because of your iniquity that we have suffered so much loss."},{"time":650.56,"text":"48. \"Behold, it is time; Yea, the time is now at hand, that except ye do bestir yourselves in the defense of your country and your little ones, the sword of justice doth hang over you - Yea, and it shall fall upon you and visit you even to your utter destruction."},{"time":668.212,"text":"49. \"Behold, I wait for assistance from you; And except ye do administer unto our relief, Behold, I come unto you - even into the Land of Zarahemla - and smite you with the sword, Insomuch that ye can have no more power to impede the progress of this people in the cause of our freedom;"},{"time":686.582,"text":"50. For behold, the Lord will not suffer that ye shall live and wax strong in your iniquities to destroy His righteous people."},{"time":695.2,"text":"51. \"Behold, can you suppose that the Lord will spare you and come out in judgment against the Lamanites, when it is the tradition of their fathers that hath caused their hatred?"},{"time":706.32,"text":"52. Yea, and it hath been redoubled by those which have dissented from us, While your iniquity is for the cause of your love of glory and the vain things of the world."},{"time":716.503,"text":"53. \"Ye know that ye do transgress the laws of God, And ye do know that ye do trample them under your feet."},{"time":725.974,"text":"54. \"Behold, the Lord saith unto me: 'If those whom ye have appointed your governors do not repent of their sins and iniquities, ye shall go up to battle against them.'"},{"time":735.445,"text":"55. \"And now behold, I, Moroni, am constrained, according to the covenant which I have made, to keep the commandments of my God; Therefore, I would that ye should adhere to the word of God and send speedily unto me of your provisions and of your men, and also to Helaman;"},{"time":751.628,"text":"56. And behold, if ye will not do this, I come unto you speedily; For behold, God will not suffer that we should perish with hunger; Therefore, He will give unto us of your food, even if it must be by the sword;"},{"time":767.12,"text":"57. Now see that ye fulfill the word of God."},{"time":771.35,"text":"58. \"Behold, I am Moroni, your chief captain; I seek not for power, but to pull it down;"},{"time":778.018,"text":"59. I seek not for honor of the world, but for the glory of my God and the freedom and welfare of my country; And thus I close mine epistle.\""}]
};
