window.CHAPTER_DATA = {

  audioSrc: "https://archive.org/download/alma-ch-28/Alma%20Ch%2028.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 28"},{"time":6.6,"text":"1. Behold, now it came to pass that soon after Moroni had sent his epistle unto the chief governor, He received an epistle from Pahoron, the chief governor."},{"time":13.2,"text":"2. And these are the words which he received: \"I, Pahoron, which art the chief governor of this land, do send these words unto Moroni, the chief captain over the army. \"Behold I say unto you, Moroni, that I do not joy in your great afflictions, yea, it grieves my soul."},{"time":32.96,"text":"3. \"But behold, there are those who do joy in your afflictions, Yea, insomuch that they have risen up in rebellion against me, and also those of my people which are Freemen. \"Yea, and those which have risen up are exceeding numerous;"},{"time":47.6,"text":"4. And it is those who have sought to take away the judgment seat from me that have been the cause of this great iniquity;"},{"time":56.187,"text":"5. For they have used great flattery, And they have led away the hearts of many people, which will be the cause of sore affliction among us; They have withheld our provisions and have daunted our Freemen, that they have not come unto you."},{"time":68.02,"text":"6. \"And behold, they have driven me out before them, And I have fled to the Land of Gideon with as many men as it were possible that I could get."},{"time":78.538,"text":"7. \"And behold, I have sent a proclamation throughout this part of the land; And behold, they are flocking to us daily, to their arms, in the defense of their country and their freedom and to avenge our wrongs."},{"time":91.697,"text":"8. \"And they have come unto us, insomuch that those which have risen up in rebellion against us are set at defiance, Yea, insomuch that they do fear us and durst not come out against us to battle."},{"time":103.936,"text":"9. \"They have got possession of the Land - or the City of Zarahemla; They have appointed a king over them and he hath written unto the king of the Lamanites - In the which he hath joined an alliance with him,"},{"time":116.16,"text":"10. In the which alliance, he hath agreed to maintain the City of Zarahemla, In the which maintenance, he supposeth will enable the Lamanites to conquer the remainder of the land; And he shall be placed king over this people when they shall be conquered under the Lamanites."},{"time":130.031,"text":"11. \"And now, in your epistle ye hath censured me, but it mattereth not-I am not angry, but do rejoice in the greatness of your heart."},{"time":141.32,"text":"12. \"I, Pahoron, do not seek for power, save only to retain my judgment seat, that I may preserve the rights and the liberty of my people;"},{"time":151.12,"text":"13. My soul standeth fast in that liberty in the which God hath made us free!"},{"time":156.64,"text":"14. \"And now behold, we will resist wickedness, even unto bloodshed;"},{"time":160.875,"text":"15. We would not shed the blood of the Lamanites, if they would stay in their own land;"},{"time":167.335,"text":"16. We would not shed the blood of our brethren, if they would not rise up in rebellion and take the sword against us;"},{"time":175.52,"text":"17. We would subject ourselves to the yoke of bondage, if it were requisite with the justice of God, or if He should command us so to do."},{"time":183.342,"text":"18. \"But behold, He doth not command us that we shall subject ourselves to our enemies, But that we should put our trust in Him and He will deliver us;"},{"time":194.627,"text":"19. Therefore, my beloved brother Moroni, let us resist evil; And whatsoever evil we cannot resist with our words - yea, such as rebellions and dissensions - Let us resist them with our swords, that we may retain our freedom, That we may rejoice in the great privilege of our church and in the cause of our Redeemer and our God."},{"time":213.431,"text":"20. \"Therefore, come unto me speedily with a few of your men, And leave the remainder in the charge of Lehi and Teancum; Give unto them power to conduct the war in that part of the land, according to the Spirit of God - which is also the spirit of freedom - which is in them;"},{"time":229.966,"text":"21. Behold, I have sent a few provisions unto them, that they may not perish until ye can come unto me."},{"time":237.351,"text":"22. \"Gather together whatsoever force ye can upon your march hither; And we will go speedily against those dissenters in the strength of our God, according to the faith which is in us,"},{"time":249.36,"text":"23. And we will take possession of the City of Zarahemla, that we may obtain more food to send forth unto Lehi and Teancum; Yea, we will go forth against them in the strength of the Lord, And we will put an end to this great iniquity."},{"time":264.072,"text":"24. \"And now, Moroni, I do joy in receiving your epistle; For I was somewhat worried concerning what we should do - whether it should be just in us to go against our brethren;"},{"time":275.093,"text":"25. But ye have said, 'Except they repent, the Lord hath commanded you that ye should go against them.'"},{"time":284.759,"text":"26. \"See that ye strengthen Lehi and Teancum in the Lord; Tell them to fear not, for God will deliver them, yea, and also all those who stand fast in that liberty wherewith God hath made them free."},{"time":294.424,"text":"27. \"And now I close mine epistle to my beloved brother, Moroni.\""}]
};
