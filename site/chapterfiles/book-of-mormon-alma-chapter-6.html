window.CHAPTER_DATA = {

  audioSrc: "https://archive.org/download/alma-ch-6/Alma%20Ch%206.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 6"},{"time":8.398,"text":"1. And now it came to pass that Alma returned from the Land of Gideon after having taught the people of Gideon many things which cannot be written, Having established the order of the church according as he had before done in the Land of Zarahemla;"},{"time":20.35,"text":"2. Yea, he returned to his own house at Zarahemla to rest himself from the labors which he had performed."},{"time":23.906,"text":"3. And thus ended the ninth year of the reign of the judges over the people of Nephi."},{"time":29.28,"text":"4. And it came to pass in the commencement of the tenth year of the reign of the judges over the people of Nephi that Alma departed from thence and took his journey over into the Land of Melek on the west of the River Sidon, on the west by the borders of the wilderness;"},{"time":43.9,"text":"5. And he began to teach the people in the Land of Melek according to the holy order of God by which he had been called; And he began to teach the people throughout all the Land of Melek."},{"time":54.897,"text":"6. And it came to pass that the people came to him throughout all the borders of the land which was by the wilderness side."},{"time":62.88,"text":"7. And it came to pass that they were baptized throughout all the land; So that when he had finished his work at Melek, he departed thence and traveled three days' journey on the north of the Land of Melek, And he came to a city which was called Ammonihah."},{"time":76.514,"text":"8. Now it was the custom of the people of Nephi to call their lands and their cities and their villages, yea, even all their small villages, after the name of him who first possessed them; And thus it was with the Land of Ammonihah."},{"time":90.88,"text":"9. And it came to pass that when Alma had come to the City of Ammonihah, he began to preach the word of God unto them."},{"time":99.6,"text":"10. Now Satan had got great hold upon the hearts of the people of the City of Ammonihah; Therefore, they would not hearken unto the words of Alma."},{"time":108.62,"text":"11. Nevertheless, Alma labored much in the spirit, wrestling with God in mighty prayer that He would pour out His Spirit upon the people which were in the city, That He would also grant that he might baptize them unto repentance."},{"time":122.16,"text":"12. Nevertheless, they hardened their hearts, saying unto him: \"Behold, we know that thou art Alma; And we know that thou art high priest over the church which thou hast established in many parts of the land, according to your tradition;"},{"time":135.796,"text":"13. And we are not of thy church, And we do not believe in such foolish traditions."},{"time":141.52,"text":"14. \"And now, we know that because we are not of thy church, we know that thou hast no power over us;"},{"time":150.287,"text":"15. And thou hast delivered up the judgment seat unto Nephihah, Therefore, thou art not the chief judge over us.\""},{"time":157.92,"text":"16. Now when the people had said this and had withstood all his words and reviled him and spit upon him and caused that he should be cast out of their city, And he departed thence and took his journey toward the city which was called Aaron."},{"time":172.24,"text":"17. And it came to pass that while he was journeying thither - being weighed down with sorrow, wading through much tribulation and anguish of soul because of the wickedness of the people which were in the City of Ammonihah -"},{"time":183.709,"text":"18. And it came to pass that while Alma was thus weighed down with sorrow, Behold, an angel of the Lord appeared unto him, saying: \"Blessed art thou, Alma; Therefore, lift up thy head and rejoice, for thou hast great cause to rejoice,"},{"time":200.88,"text":"19. For thou hast been faithful in keeping the commandments of God from the time which thou received thy first message from Him."},{"time":208.33,"text":"20. \"Behold, I am he that delivered it unto thee. \"And behold, I am sent to command thee that thou return to the City of Ammonihah and preach again unto the people of the city, Yea, preach unto them,"},{"time":222.885,"text":"21. yea, say unto them, except they repent, the Lord God will destroy them."},{"time":228.574,"text":"22. \"For behold, they do study at this time that they may destroy the liberty of thy people - for thus saith the Lord - which is contrary to the statutes and judgments and commandments which He hath given unto His people.\""},{"time":242.056,"text":"23. Now it came to pass that after Alma had received his message from the angel of the Lord, he returned speedily to the Land of Ammonihah."},{"time":250.76,"text":"24. And it came to pass that he entered the city by another way, yea, by the way which was on the south of the City Ammonihah."},{"time":259.76,"text":"25. And it came to pass that as he entered the city, he was enhungered and he saith to a man: \"Will ye give to an humble servant of God something to eat?\""},{"time":270.56,"text":"26. And the man saith unto him: \"I am a Nephite and I know that thou art a holy prophet of God, for thou art the man which an angel saith in a vision, ' Thou shalt receive ';"},{"time":281.36,"text":"27. Therefore, go with me into my house and I will impart unto thee of my favor; And I know that thou will be a blessing unto me and my house.\""},{"time":289.92,"text":"28. And it came to pass that the man received him into his house, And the man was called Amulek; And he brought forth bread and meat and sat before Alma."},{"time":299.364,"text":"29. And it came to pass that Alma ate bread and he was filled; And he blessed Amulek and his house, And he gave thanks unto God."},{"time":308.32,"text":"30. And after he had eaten and was filled, he saith unto Amulek: \"I am Alma and am the high priest over the churches of God throughout the land."},{"time":318.445,"text":"31. \"And behold, I have been called to preach the word of God among all this people, according to the spirit of revelation and prophecy;"},{"time":326.64,"text":"32. And I was in this land and they would not receive me, but they cast me out. \"And I was about to set my back toward this land forever;"},{"time":337.36,"text":"33. But behold, I have been commanded that I should turn again and prophesy unto this people, Yea, and to testify against them concerning their iniquities."},{"time":346.64,"text":"34. \"And now Amulek, because thou hast fed me and took me in, thou art blessed, For I was enhungered for I had fasted many days.\""},{"time":356.455,"text":"35. And it came to pass that Alma tarried many days with Amulek before he began to preach unto the people."},{"time":363.36,"text":"36. And it came to pass that the people did wax more gross in their iniquities."},{"time":368.551,"text":"37. And the word came to Alma, saying: \"Go and also say unto My servant Amulek, 'Go forth and prophesy unto this people, saying: Repent ye! for thus saith the Lord, Except ye repent, I will visit this people in Mine anger, Yea, and I will not turn My fierce anger away.'\""},{"time":389.095,"text":"38. And it came to pass that Alma went forth, and also Amulek, among the people to declare the words of God unto them; And they were filled with the Holy Ghost,"},{"time":400.337,"text":"39. And they had power given unto them, insomuch that they could not be confined in dungeons, Neither were it possible that any man could slay them;"},{"time":409.376,"text":"40. Nevertheless, they did not exercise their power until they were bound in bands and cast into prison;"},{"time":415.964,"text":"41. Now this was done that the Lord might show forth His power in them."},{"time":420.768,"text":"42. And it came to pass that they went forth and began to preach and to prophesy unto the people, according to the spirit and power which the Lord had given them."}]
};
