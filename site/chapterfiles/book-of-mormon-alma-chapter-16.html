<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 16",
  audioSrc: "https://archive.org/download/alma-ch-16/Alma%20Ch%2016.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 16"},{"time":7.653,"text":"1. Behold, now it came to pass that after the people of Ammon were established in the Land of Jershon, Yea, and also after the Lamanites were driven out of the land and their dead were buried by the people of the land -"},{"time":15.307,"text":"2. Now their dead were not numbered because of the greatness of their numbers, neither were the dead of the Nephites numbered -"},{"time":22.24,"text":"3. But it came to pass that after they had buried their dead, and also after the days of fasting and mourning and prayer - and it was in the sixteenth year of the reign of the judges over the people of Nephi - there began to be continual peace throughout all the land, Yea, and the people did observe to keep the commandments of the Lord;"},{"time":42.48,"text":"4. And they were strict in observing the ordinances of God according to the law of Moses, for they were taught to keep the law of Moses until it should be fulfilled;"},{"time":51.789,"text":"5. And thus the people did have no disturbance in all the sixteenth year of the reign of the judges over the people of Nephi."},{"time":60.24,"text":"6. And it came to pass in the commencement of the seventeenth year of the reign of the judges, there was continual peace;"},{"time":66.508,"text":"7. But it came to pass in the latter end of the seventeenth year, there came a man into the Land of Zarahemla, And he was antichrist, for he began to preach unto the people against the prophecies which had been spoken by the prophets concerning the coming of Christ."},{"time":81.84,"text":"8. Now there was no law against a man's belief, for it was strictly contrary to the commandments of God that there should be a law which should bring men on to unequal grounds,"},{"time":90.294,"text":"9. For thus saith the scripture, \"Choose ye this day whom ye will serve.\""},{"time":98.748,"text":"10. Now if a man desired to serve God, it was his privilege, or rather if he believed in God, it was his privilege to serve Him, But if he did not believe in Him, there was no law to punish him;"},{"time":111.868,"text":"11. But if he murdered, he was punished unto death, And if he robbed, he was also punished, And if he stole, he was also punished, And if he committed adultery, he was also punished; Yea, for all this wickedness they were punished, for there was a law that men should be judged according to their crimes;"},{"time":131.182,"text":"12. Nevertheless, there was no law against a man's belief, Therefore, a man was punished only for the crimes which he had done, Therefore, all men were on equal grounds."},{"time":142.2,"text":"13. And this antichrist whose name was Korihor - and the law could have no hold upon him - and he began to preach unto the people that there should be no Christ;"},{"time":151.712,"text":"14. And after this manner did he preach, saying: \"O ye that are bound down under a foolish and a vain hope, Why do ye yoke yourselves with such foolish things? Why do ye look for a Christ? For no man can know of anything which is to come."},{"time":170.564,"text":"15. \"Behold, these things which ye call prophecies, which ye say are handed down by holy prophets, Behold, they are foolish traditions of your fathers; How do ye know of their surety?"},{"time":182.467,"text":"16. Behold, ye cannot know of things which ye do not see, Therefore, ye cannot know that there shall be a Christ."},{"time":194.217,"text":"17. \"Ye look forward and say that ye see a remission of your sins; But behold, it is the effects of a frenzied mind, And this derangement of your minds comes because of the tradition of your fathers which lead you away into a belief of things which are not so.\""},{"time":205.966,"text":"18. And many more such things did he say unto them, telling them that there could be no atonement made for the sins of men; But every man fared in this life, according to the management of the creature, Therefore, every man prospered, according to his genius, And that every man conquered, according to his strength; And whatsoever a man did was no crime."},{"time":228.4,"text":"19. And thus he did preach unto them, leading away the hearts of many, causing them to lift up their heads in their wickedness, Yea, leading away many women, and also men, to commit whoredoms, telling them that when a man was dead, that was the end thereof."},{"time":244.88,"text":"20. Now this man went over to the Land of Jershon also to preach these things among the people of Ammon, which were once the people of the Lamanites;"},{"time":253.339,"text":"21. But behold, they were more wise than many of the Nephites, for they took him and bound him and carried him before Ammon, which was a high priest over that people;"},{"time":263.416,"text":"22. And it came to pass that he caused that he should be carried out of the land."},{"time":268.72,"text":"23. And it came to pass that he came over into the Land of Gideon and began to preach unto them also; And here he did not have much success, for he was taken and bound and carried before the high priest, and also the chief judge over the land."},{"time":282.5,"text":"24. And it came to pass that the high priest saith unto him: \"Why do ye go about perverting the ways of the Lord?"},{"time":290.63,"text":"25. Why do ye teach this people that there shall be no Christ, to interrupt their rejoicings?"},{"time":297.735,"text":"26. Why do ye speak against all the prophecies of the holy prophets?\""},{"time":303.378,"text":"27. Now, the high priest's name was Giddonah;"},{"time":316.151,"text":"28. And Korihor saith unto him: \"Because I do not teach the foolish traditions of your fathers, And because I do not teach this people to bind themselves down under the foolish ordinances and performances which are laid down by ancient priests to usurp power and authority over them, To keep them in ignorance that they may not lift up their heads, but be brought down according to thy words."},{"time":328.924,"text":"29. \"Ye say that this people is a free people; Behold, I say they are in bondage."},{"time":336.32,"text":"30. \"Ye say that those ancient prophecies are true; Behold, I say that ye do not know that they are true."},{"time":342.329,"text":"31. \"Ye say that this people is a guilty and a fallen people because of the trangression of a parent; Behold, I say that a child is not guilty because of its parents."},{"time":354.16,"text":"32. \"And ye also say that Christ shall come; But behold, I say that ye do not know that there shall be a Christ;"},{"time":361.352,"text":"33. And ye say also that He shall be slain for the sins of the world.\"And thus ye lead away this people after the foolish traditions of your fathers and according to your own desires."},{"time":373.312,"text":"34. \"And ye keep them down, even as it were, in bondage, That ye may glut yourselves with the labors of their hands, That they durst not look up with boldness, And that they durst not enjoy their rights and privileges;"},{"time":387.36,"text":"35. Yea, they durst not make use of that which is their own, lest they should offend their priests which do yoke them according to their desires, And hath brought them to believe - by their traditions, and their dreams, and their whims, and their visions, and their pretended mysteries - That they should - if they did not do according to their words - offend some Unknown Being, which they say is God, A Being which never hath been seen nor known, which never was nor never will be.\""},{"time":415.136,"text":"36. Now when the high priest and the chief judge saw the hardness of his heart, Yea, when they saw that he would revile even against God, they would not make any reply to his words;"},{"time":426.814,"text":"37. But they caused that he should be bound, And they delivered him up into the hands of the officers and sent him to the Land of Zarahemla, that he might be brought before Alma and the chief judge which was governor over all the land."},{"time":440.049,"text":"38. And it came to pass that when he was brought before Alma and the chief judge, that he did go on in the same manner as he did in the Land of Gideon, Yea, he went on to blasphemy;"},{"time":451.182,"text":"39. And he did rise up in great swelling words before Alma, And did revile against the priests and teachers, accusing them of leading away the people after the silly traditions of their fathers for the sake of glutting by the labors of the people."},{"time":465.166,"text":"40. Now Alma saith unto him: \"Thou knowest that we do not glut ourselves upon the labors of this people, For behold, I have labored, even from the commencement of the reign of the judges until now, with mine own hands for my support; Notwithstanding my many travels round about the land to declare the word of God unto my people,"},{"time":485.28,"text":"41. And notwithstanding the many labors which I have performed in the church, I have never received so much as even one senine for my labor, Neither hath any of my brethren, save it were in the judgment seat, And then we have received only according to law for our time."},{"time":500.784,"text":"42. \"And now, if we do not receive anything for our labors in the church, what doth it profit us to labor in the church, save it were to declare the truth that we may have rejoicings in the joy of our brethren?"},{"time":514.013,"text":"43. Then why sayest thou that we preach unto this people to get gain when thou of thyself knowest that we receive no gain?"},{"time":522.79,"text":"44. \"And now, believest thou that we deceive this people that causeth such joy in their hearts?\""},{"time":529.76,"text":"45. And Korihor answered him: \"Yea.\""},{"time":532.138,"text":"46. And then Alma saith unto him: \"Believest thou that there is a God?\" And he answered: \"Nay.\""},{"time":539.884,"text":"47. Now Alma saith unto him: \"If ye deny again that there is a God, and also deny the Christ - For behold, I say unto you, I know there is a God, and also that Christ shall come -"},{"time":553.435,"text":"48. And now what evidence have ye that there is no God, or that Christ cometh not? I say unto you that ye have none, save it be your word only;"},{"time":565.44,"text":"49. But behold, I have all things as a testimony that these things are true, And ye also have all things as a testimony unto you that they are true; And will ye deny them?"},{"time":576.96,"text":"50. \"Believest thou that these things are true?"},{"time":586.88,"text":"51. Behold, I know that thou believest, But thou art possessed with a lying spirit; And ye have put off the Spirit of God, that it may have no place in you, But the devil hath power over you; And he doth carry you about, working devices that he may destroy the people of God.\""},{"time":596.8,"text":"52. And now Korihor saith unto Alma: \"If thou wilt show me a sign that I may be convinced that there is a God, Yea, show unto me that He hath power, And then will I be convinced of the truth of thy words.\""},{"time":610.494,"text":"53. But Alma saith unto him: \"Thou hast had signs enough; Will ye tempt your God? Will ye say, 'Show unto me a sign, ' when ye have the testimony of all these thy brethren, and also all the holy prophets?"},{"time":624.809,"text":"54. \"The scriptures are laid before thee, yea, and all things denote there is a God - Yea, even the earth and all things that are upon the face of it, yea, and its motion,"},{"time":636.776,"text":"55. Yea, and also all the planets which move in their regular form doth witness that there is a Supreme Creator; And yet do ye go about leading away the hearts of this people, testifying unto them there is no God? And yet will ye deny against all these witnesses?\""},{"time":655.44,"text":"56. And he said: \"Yea, I will deny except ye shall show me a sign.\""},{"time":660.88,"text":"57. And now it came to pass that Alma said unto him: \"Behold, I am grieved because of the hardness of your heart, Yea, that ye will still resist the Spirit of the truth that thy soul may be destroyed;"},{"time":672.88,"text":"58. But behold, it is better that thy soul should be lost than that thou shouldst be the means of bringing many souls down to destruction by thy lying and by thy flattering words;"},{"time":683.785,"text":"59. Therefore, if thou shalt deny again, Behold, God shall smite thee, that thou shalt become dumb, that thou shalt never open thy mouth anymore, that thou shalt not deceive this people anymore.\""},{"time":694.097,"text":"60. Now Korihor saith unto him: \"I do not deny the existence of a God, but I do not believe that there is a God; And I say also that ye do not know that there is a God, And except ye show me a sign, I will not believe.\""},{"time":715.051,"text":"61. Now Alma saith unto him: \"This will I give unto thee for a sign - that thou shalt be struck dumb according to my words; And I say that in the name of God that ye shall be struck dumb, that ye shall no more have utterance.\""},{"time":725.693,"text":"62. Now when Alma had said these words, Korihor was struck dumb, that he could not have utterance according to the words of Alma."},{"time":734.56,"text":"63. And now when the chief judge saw this, he put forth his hand and wrote unto Korihor, saying: \"Art thou convinced of the power of a God?"},{"time":743.752,"text":"64. In whom did ye desire that Alma should show forth His sign? Would ye that He should afflict others to show unto thee a sign?"},{"time":753.396,"text":"65. Now behold, He hath showed unto you a sign, And now, will ye dispute more?\""},{"time":759.798,"text":"66. And Korihor put forth his hand and wrote, saying: \"I know that I am dumb, for I cannot speak; And I know that nothing, save it were the power of God, could bring this upon me, Yea, and I always knew that there was a God."},{"time":776.008,"text":"67. \"But behold, the devil hath deceived me, For he appeared unto me in the form of an angel and said unto me, ' Go and reclaim this people, for they have all gone astray after an Unknown God ';"},{"time":788.88,"text":"68. And he saith unto me, 'There is no God, ' Yea, and he taught me that which I should say and I have taught his words; And I taught them because they were pleasing unto the carnal mind;"},{"time":800.4,"text":"69. And I taught them even until I had much success, insomuch that I verily believed that they were true; And for this cause I withstood the truth, even until I have brought this great curse upon me.\""},{"time":811.916,"text":"70. Now when he had said this, he besought that Alma should pray unto God that the curse might be taken from him;"},{"time":819.52,"text":"71. But Alma said unto him: \"If this curse should be taken from thee, thou wouldst again lead away the hearts of this people, Therefore, it shall be unto thee even as the Lord will.\""},{"time":830.36,"text":"72. And it came to pass that the curse was not taken off of Korihor, But he was cast out and went about from house to house a begging for his food."},{"time":840.0,"text":"73. Now the knowledge of what had happened unto Korihor was immediately published throughout all the land, Yea, the proclamation was sent forth by the chief judge to all the people in the land, declaring unto those who had believed in the words of Korihor that they must speedily repent lest the same judgments would come unto them."},{"time":857.831,"text":"74. And it came to pass that they were all convinced of the wickedness of Korihor, therefore they were all converted again unto the Lord; And this put an end to the iniquity after the manner of Korihor;"},{"time":869.92,"text":"75. And Korihor did go about from house to house a begging food for his support."},{"time":875.171,"text":"76. And it came to pass that as he went forth among the people - Yea, among a people which had separated themselves from the Nephites and called themselves Zoramites, being led by a man whose name was Zoram - And as he went forth amongst them, behold, he was run upon and trodden down, even until he was dead."},{"time":895.056,"text":"77. And thus we see the end of him who perverteth the ways of the Lord. And thus we see that the devil will not support his children at the last day, but doth speedily drag them down to hell."},{"time":907.687,"text":"78. Now it came to pass that after the end of Korihor, Alma having received tidings that the Zoramites were perverting the ways of the Lord and that Zoram, which was their leader, was leading the hearts of the people to bow down to dumb idols, etc., His heart again began to sicken because of the iniquity of the people;"},{"time":926.653,"text":"79. For it was the cause of great sorrow to Alma to know of the iniquity among his people, Therefore, his heart was exceeding sorrowful because of the separation of the Zoramites from the Nephites."},{"time":938.992,"text":"80. Now the Zoramites had gathered themselves together in a land which they called Antionum, Which was east of the Land of Zarahemla, Which lay nearly bordering upon the seashore, Which was south of the Land Jershon, Which also bordered upon the Wilderness South, which wilderness was full of the Lamanites."},{"time":957.04,"text":"81. Now the Nephites greatly feared that the Zoramites would enter into a correspondence with the Lamanites and that it would be the means of great loss on the part of the Nephites."},{"time":967.421,"text":"82. And now, as the preaching of the word had had a greater tendency to lead the people to do that which was just, Yea, it had had more powerful effect upon the minds of the people than the sword or anything else which had happened unto them, Therefore, Alma thought it was expedient that they should try the virtue of the word of God."},{"time":986.12,"text":"83. Therefore, he took Ammon and Aaron and Omner - and Himni he did leave in the church in Zarahemla, but the former three he took with him - and also Amulek and Zeezrom which were at Melek, And he also took two of his sons;"},{"time":1001.074,"text":"84. Now the eldest of his sons he took not with him - and his name was Helaman - but the names of those which he took with him were Shiblon and Coreanton; And these are the names of those which went with him among the Zoramites to preach unto them the word."},{"time":1015.449,"text":"85. Now the Zoramites were dissenters from the Nephites, therefore they had had the word of God preached unto them;"},{"time":1023.0,"text":"86. But they had fallen into great errors, for they would not observe to keep the commandments of God and His statutes according to the law of Moses,"},{"time":1032.744,"text":"87. Neither would they observe the performances of the church to continue in prayer and supplication to God daily, that they might not enter into temptation, Yea, in fine, they did pervert the ways of the Lord in very many instances; Therefore, for this cause Alma and his brethren went into the land to preach the word unto them."},{"time":1052.0,"text":"88. Now when they had come into the land, Behold, to their astonishment, they found that the Zoramites had built synagogues, And that they did gather themselves together on one day of the week, which day they did call the day of the Lord;"},{"time":1066.72,"text":"89. And they did worship after a manner which Alma and his brethren had never beheld, For they had a place built up in the center of their synagogue - a place of standing which was high above the head, And the top thereof would only admit one person;"},{"time":1080.32,"text":"90. Therefore, whosoever desired to worship must go forth and stand upon the top thereof, And stretch forth his hands toward the heavens and cry with a loud voice, saying: \"Holy, Holy God! We believe that Thou art God, And we believe that Thou art holy, and that Thou wast a Spirit, and that Thou art a Spirit, and that Thou wilt be a Spirit forever."},{"time":1092.05,"text":"91. \"Holy God, we believe that Thou hast separated us from our brethren; And we do not believe in the traditions of our brethren which was handed down to them by the childishness of their fathers, But we believe that Thou hast elected us to be Thy holy children;"},{"time":1119.486,"text":"92. And also, Thou hast made it known unto us that there shall be no Christ, But Thou art the same yesterday, today and forever; And Thou hast elected us that we shall be saved, whilst all around us are elected to be cast by Thy wrath down to hell, For the which holiness, O God, we thank Thee."},{"time":1138.017,"text":"93. \"And we also thank Thee that Thou hast elected us that we may not be led away after the foolish traditions of our brethren which doth bind them down to a belief of Christ, which doth lead their hearts to wander far from Thee our God;"},{"time":1152.72,"text":"94. And again, we thank Thee, O God, that we are a chosen and a holy people. Amen.\""},{"time":1159.52,"text":"95. Now it came to pass that after Alma and his brethren and his sons had heard these prayers, they were astonished beyond all measure,"},{"time":1167.32,"text":"96. For behold, every man did go forth and offer up these same prayers."},{"time":1173.114,"text":"97. Now the place was called by them \"rameumptom, \" which, being interpreted, is the \"holy stand.\""},{"time":1180.627,"text":"98. Now from this stand they did offer up, every man, the selfsame prayer unto God, Thanking their God that they were chosen of Him, And that He had not led them away after the tradition of their brethren, And that their hearts were not stolen away to believe in things to come which they knew nothing about."},{"time":1197.685,"text":"99. Now when the people had all offered up thanks after this manner, they returned to their homes, Never speaking of their God again until they had assembled themselves together again to the holy stand to offer up thanks after their manner."},{"time":1210.96,"text":"100. Now when Alma saw this, his heart was grieved, For he saw that they were a wicked and a perverse people, Yea, he saw that their hearts were set upon gold and upon silver and upon all manner of fine goods,"},{"time":1225.51,"text":"101. Yea, and he also saw that their hearts were lifted up unto great boasting, in their pride."},{"time":1232.813,"text":"102. And he lifted up his voice to heaven and cried, saying: \"O how long, O Lord, wilt Thou suffer that Thy servants shall dwell here below in the flesh to behold such gross wickedness among the children of men?"},{"time":1246.734,"text":"103. \"Behold, O God, they cry unto Thee, And yet their hearts are swallowed up in their pride."},{"time":1253.947,"text":"104. \"Behold, O God, they cry unto Thee with their mouths while they are puffed up, even to greatness, with the vain things of the world."},{"time":1264.329,"text":"105. \"Behold, O my God, their costly apparel, and their ringlets and their bracelets, and their ornaments of gold, and all their precious things which they are ornamented with;"},{"time":1275.627,"text":"106. And behold, their hearts are set upon them, And yet they cry unto Thee and say, 'We thank Thee, O God, for we are a chosen people unto Thee, ' while others shall perish."},{"time":1286.587,"text":"107. \"Yea, and they say that Thou hast made it known unto them that there shall be no Christ!"},{"time":1293.813,"text":"108. \"O Lord God, how long wilt Thou suffer that such wickedness and infidelity shall be among this people?"},{"time":1300.827,"text":"109. \"O Lord, wilt Thou give me strength that I may bear with mine infirmities? For I am infirm and such wickedness among this people doth pain my soul."},{"time":1313.2,"text":"110. \"O Lord, my heart is exceeding sorrowful; Wilt Thou comfort my soul in Christ?"},{"time":1319.44,"text":"111. \"O Lord, wilt Thou grant unto me that I may have strength that I may suffer with patience these afflictions which shall come upon me because of the iniquity of this people?"},{"time":1329.958,"text":"112. \"O Lord, wilt Thou comfort my soul and give unto me success? And also my fellow laborers which are with me - yea, Ammon and Aaron and Omner, and also Amulek and Zeezrom, and also my two sons - Yea, even all these wilt Thou comfort, O Lord? Yea, wilt Thou comfort their souls in Christ?"},{"time":1353.76,"text":"113. Wilt Thou grant unto them that they may have strength that they may bear their afflictions which shall come upon them because of the iniquities of this people?"},{"time":1362.48,"text":"114. \"O Lord, wilt Thou grant unto us that we may have success in bringing them again unto Thee in Christ?"},{"time":1369.36,"text":"115. \"Behold, O Lord, their souls are precious and many of them are our near brethren; Therefore, give unto us, O Lord, power and wisdom that we may bring these our brethren again unto Thee.\""},{"time":1383.04,"text":"116. Now it came to pass that when Alma had said these words, that he clapped his hands upon all they which were with him;"},{"time":1390.042,"text":"117. And behold, as he clapped his hands upon them, they were filled with the Holy Spirit."},{"time":1396.389,"text":"118. And after that, they did separate themselves one from another, taking no thought for themselves - what they should eat or what they should drink or what they should put on;"},{"time":1406.789,"text":"119. And the Lord provided for them, that they should hunger not, neither should they thirst, Yea, and He also gave them strength that they should suffer no manner of afflictions, save it were swallowed up in the joy of Christ."},{"time":1420.215,"text":"120. Now this was according to the prayer of Alma, And this because he prayed in faith."},{"time":1425.703,"text":"121. And it came to pass that they did go forth and began to preach the word of God unto the people, entering into their synagogues and into their houses, Yea, and even they did preach the word in their streets."},{"time":1439.24,"text":"122. And it came to pass that after much labor among them, they began to have success among the poorer class of the people; For behold, they were cast out of the synagogues because of the coarseness of their apparel,"},{"time":1452.155,"text":"123. Therefore, they were not permitted to enter into their synagogues to worship God, being esteemed as filthiness; Therefore, they were poor, yea, they were esteemed by their priests as dross, Therefore, they were poor as to things of the world, and also they were poor in heart."},{"time":1469.777,"text":"124. Now as Alma was teaching and speaking unto the people upon the Hill Onidah, there came a great multitude unto him which were those of which have been spoken which were poor in heart because of their poverty as to the things of the world;"},{"time":1483.68,"text":"125. And they came unto Alma, And the one which was the most foremost among them saith unto him: \"Behold, what shall these my brethren do? For they are despised of all men because of their poverty, yea, and more especially by our priests;"},{"time":1497.911,"text":"126. For they have cast us out of our synagogues which we have labored abundantly to build with our own hands, And they have cast us out because of this our exceeding poverty, that we have no place to worship our God; And behold, what shall we do?\""},{"time":1514.24,"text":"127. And now when Alma heard this, he turned him about, his face immediately toward him, and he beheld with great joy, For he beheld that their afflictions had truly humbled them and that they were in a preparation to hear the word;"},{"time":1527.6,"text":"128. Therefore, he did say no more to the other multitude, But he stretched forth his hand and cried unto those which he beheld, which were truly penitent, and saith unto them: \"I behold that ye are lowly in heart and, if so, blessed are ye."},{"time":1544.476,"text":"129. \"Behold, thy brother hath said, 'What shall we do, for we are cast out of our synagogues that we cannot worship our God?'"},{"time":1551.92,"text":"130. \"Behold, I say unto you, do ye suppose that ye cannot worship God save it be in your synagogues only?"},{"time":1560.24,"text":"131. And moreover, I would ask, do ye suppose that ye must not worship God only once in a week?"},{"time":1567.52,"text":"132. \"I say unto you, it is well that ye are cast out of your synagogues that ye may be humble and that ye may learn wisdom, For it is necessary that ye should learn wisdom;"},{"time":1577.663,"text":"133. For it is because that ye are cast out that ye are despised of your brethren, Because of your exceeding poverty that ye are brought to a lowliness of heart, For ye are necessarily brought to be humble."},{"time":1591.506,"text":"134. \"And now, because ye are compelled to be humble, blessed are ye, For a man sometimes, if he is compelled to be humble, seeketh repentance."},{"time":1600.194,"text":"135. \"And now surely, whosoever repenteth shall find mercy, And he that findeth mercy and endureth to the end, the same shall be saved."},{"time":1610.6,"text":"136. \"And now as I said unto you that because ye were compelled to be humble, ye were blessed, Do ye not suppose that they are more blessed who truly humble themselves because of the word?"},{"time":1622.091,"text":"137. Yea, he that truly humbleth himself and repenteth of his sins and endureth to the end, the same shall be blessed, Yea, much more blessed than they who art compelled to be humble because of their exceeding poverty; Therefore, blessed are they who humbleth themselves without being compelled to be humble,"},{"time":1640.68,"text":"138. Or rather, in other words, Blessed is he that believeth in the word of God and is baptized without stubbornness of heart, Yea, without being brought to know the word, or even compelled to know, before they will believe."},{"time":1656.142,"text":"139. \"Yea, there are many which do say, 'If thou wilt show unto us a sign from heaven, then we shall know of a surety, then we shall believe.'"},{"time":1665.819,"text":"140. \"Now I ask, is this faith? Behold, I say unto you, Nay, For if a man knoweth a thing, he hath no cause to believe, for he knoweth it."},{"time":1678.8,"text":"141. \"And now how much more cursed is he that knoweth the will of God and doeth it not, than he that only believeth, or only hath cause to believe, and falleth into transgression? Now of this thing ye must judge."},{"time":1691.778,"text":"142. \"Behold, I say unto you that it is on the one hand even as it is on the other, And it shall be unto every man according to his work."},{"time":1702.103,"text":"143. \"And now as I said concerning faith, Faith is not to have a perfect knowledge of things; Therefore, if ye have faith, ye hope for things which are not seen, which are true."},{"time":1713.291,"text":"144. \"And now behold I say unto you, and I would that ye should remember that God is merciful unto all who believe on His name; Therefore, He desireth in the first place that ye should believe, yea, even on His word."},{"time":1728.288,"text":"145. \"And now, He imparteth His word by angels unto men - yea, not only men, but women also;"},{"time":1735.84,"text":"146. Now this is not all - Little children doth have words given unto them many times which doth confound the wise and the learned."},{"time":1745.662,"text":"147. \"And now my beloved brethren, as ye have desired to know of me what ye shall do because ye are afflicted and cast out - Now I do not desire that ye should suppose that I mean to judge you only according to that which is true,"},{"time":1758.448,"text":"148. For I do not mean that ye - all of you - have been compelled to humble yourselves, For I verily believe there are some among you which would humble themselves, let them be in whatsoever circumstances he might -"},{"time":1771.29,"text":"149. \"Now as I said concerning faith - that it was not a perfect knowledge - even so it is with my words;"},{"time":1779.746,"text":"150. Ye cannot know of their surety at first, unto perfection, any more than faith is a perfect knowledge."},{"time":1787.147,"text":"151. \"But behold, if ye will awake and arouse your faculties, even to an experiment upon my words, and exercise a particle of faith, Yea, even if ye can no more than desire to believe, let this desire work in you, Even until ye believe in a manner that ye can give place for a portion of my words."},{"time":1807.28,"text":"152. \"Now, we will compare the word unto a seed."},{"time":1811.36,"text":"153. \"Now, if ye give place that a seed may be planted in your heart, Behold, if it be a true seed, or a good seed - if ye do not cast it out by your unbelief that ye will resist the Spirit of the Lord - Behold, it will begin to swell within your breasts;"},{"time":1827.56,"text":"154. And when you feel these swelling motions, ye will begin to say within yourselves: 'It must needs be that this is a good seed, or that the word is good, for it beginneth to enlarge my soul, Yea, it beginneth to enlighten my understanding, Yea, and it beginneth to be delicious to me.'"},{"time":1846.871,"text":"155. \"Now behold, would not this increase your faith? I say unto you, Yea; Nevertheless, it hath not grown up to a perfect knowledge."},{"time":1857.76,"text":"156. \"But behold, as the seed swelleth and sprouteth and beginneth to grow - And then ye must needs say that the seed is good, For behold, it swelleth and sprouteth and beginneth to grow -"},{"time":1870.147,"text":"157. And now behold, will not this strengthen your faith? Yea, it will strengthen your faith, For ye will say, 'I know that this is a good seed, For behold, it sprouteth and beginneth to grow.'"},{"time":1884.56,"text":"158. \"And now behold, are ye sure that this is a good seed? I say unto you, yea, for every seed bringeth forth unto its own likeness; Therefore, if a seed groweth, it is good, But if it groweth not, behold, it is not good, Therefore, it is cast away."},{"time":1903.671,"text":"159. \"And now, behold, because ye have tried the experiment and planted the seed and it swelleth and sprouteth and beginneth to grow, Ye must needs know that the seed is good."},{"time":1915.948,"text":"160. \"And now behold, is your knowledge perfect? Yea, your knowledge is perfect in that thing and your faith is dormant;"},{"time":1924.463,"text":"161. And this because you know, for ye know that the word hath swelled your souls, And ye also know that it hath sprouted up, that your understanding doth begin to be enlightened and your mind doth begin to expand."},{"time":1939.013,"text":"162. \"O then, is not this real? I say unto you, yea, because it is light, And whatsoever is light is good, because it is discernible; Therefore, ye must know that it is good."},{"time":1952.141,"text":"163. \"And now behold, after ye have tasted this light, is your knowledge perfect? Behold, I say unto you, Nay; Neither must ye lay aside your faith, For ye have only exercised your faith to plant the seed, that ye might try the experiment to know if the seed were good."},{"time":1971.416,"text":"164. \"And behold, as the tree beginneth to grow, ye will say: 'Let us nourish it with great care, that it may get root, that it may grow up and bring forth fruit unto us.'"},{"time":1982.491,"text":"165. \"And now behold, if ye nourish it with much care, it will get root and grow up and bring forth fruit;"},{"time":1990.28,"text":"166. But if ye neglect the tree and take no thought for its nourishment, Behold, it will not get any root; And when the heat of the sun cometh and scorcheth it, and because it hath no root, it withereth away, And ye pluck it up and cast it out."},{"time":2006.08,"text":"167. \"Now this is not because the seed was not good, Neither is it because the fruit thereof would not be desirable;"},{"time":2013.627,"text":"168. But it is because your ground is barren and ye will not nourish the tree; Therefore, ye cannot have the fruit thereof."},{"time":2022.24,"text":"169. \"And thus it is if ye will not nourish the word, looking forward with an eye of faith to the fruit thereof, Ye can never pluck of the fruit of the tree of life;"},{"time":2031.787,"text":"170. But if ye will nourish the word - Yea, nourish the tree as it beginneth to grow, by your faith with great diligence and with patience - looking forward to the fruit thereof, And it shall take root; And behold, it shall be a tree springing up unto everlasting life!"},{"time":2047.655,"text":"171. \"And because of your diligence and your faith and your patience with the word in nourishing it, that it may take root in you, Behold, by and by, ye shall pluck the fruit thereof, which is most precious, which is sweet above all that is sweet, and which is white above all that is white, yea, and pure above all that is pure,"},{"time":2068.696,"text":"172. And ye shall feast upon this fruit, even until ye are filled that ye hunger not, neither shall ye thirst;"},{"time":2076.9,"text":"173. Then my brethren, ye shall reap the rewards of your faith and your diligence and patience and longsuffering, waiting for the tree to bring forth fruit unto you.\""},{"time":2087.026,"text":"174. Now after Alma had spoken these words, they sent forth unto him desiring to know whether they should believe in one God, that they might obtain this fruit of which he had spoken, Or how they should plant the seed, or the word of which he had spoken, which he said must be planted in their hearts, Or in what manner they should begin to exercise their faith."},{"time":2100.953,"text":"175. And Alma saith unto them: \"Behold, ye have said that ye could not worship your God because ye are cast out of your synagogues."},{"time":2114.88,"text":"176. \"But behold, I say unto you, if ye say that ye cannot worship your God, ye do greatly err and ye had ought to search the scriptures, For if ye suppose that they have taught you this, ye do not understand them."},{"time":2125.469,"text":"177. \"Do ye remember to have read what Zenos, the prophet of old, hath said concerning prayer or worship?"},{"time":2136.057,"text":"178. For he saith: 'Thou art merciful, O God, For Thou hast heard my prayer, even when I was in the wilderness. 'Yea, Thou wast merciful when I prayed concerning those which were mine enemies, And Thou didst turn them to me."},{"time":2152.865,"text":"179. 'Yea, O God, and Thou wast merciful unto me when I did cry unto Thee in my field, when I did cry unto Thee in my prayer, And Thou didst hear me."},{"time":2164.588,"text":"180. 'And again, O God, when I did turn to my house, Thou didst hear me in my prayer."},{"time":2171.12,"text":"181. 'And when I did turn unto my closet, O Lord, and prayed unto Thee, Thou didst hear me. 'Yea, Thou art merciful unto Thy children when they cry unto Thee to be heard of Thee and not of men, And Thou wilt hear them."},{"time":2187.433,"text":"182. 'Yea, O God, Thou hast been merciful unto me and heard my cries in the midst of Thy congregations; Yea, and Thou also hast heard me when I have been cast out and have been despised by mine enemies;"},{"time":2201.002,"text":"183. Yea, Thou didst hear my cries and wast angry with mine enemies, And Thou didst visit them in Thine anger, with speedy destruction; And Thou didst hear me because of mine afflictions and my sincerity."},{"time":2214.0,"text":"184. 'And it is because of Thy Son that Thou hast been thus merciful unto me; Therefore, I will cry unto Thee in all mine afflictions, for in Thee is my joy, For Thou hast turned Thy judgments away from me because of Thy Son.'\""},{"time":2224.6,"text":"185. And now Alma saith unto them: \"Do ye believe those scriptures which have been written by them of old?"},{"time":2235.2,"text":"186. Behold, if ye do, ye must believe what Zenos saith, For behold, he saith, 'Thou hast turned away Thy judgments because of Thy Son.'"},{"time":2244.88,"text":"187. \"Now behold, my brethren, I would ask, If ye have read these scriptures, how can ye disbelieve on the Son of God?"},{"time":2253.007,"text":"188. For it is not written that Zenos alone spake of these things, But Zenoch also spake of these things, For behold, he saith: 'Thou art angry, O Lord, with this people, Because they will not understand of Thy mercies which Thou hast bestowed upon them, because of Thy Son.'"},{"time":2270.16,"text":"189. \"And now my brethren, ye see that a second prophet of old has testified of the Son of God, And because the people would not understand his words, they stoned him to death."},{"time":2283.76,"text":"190. \"But behold, this is not all - these are not the only ones which have spoken concerning the Son of God -"},{"time":2290.206,"text":"191. Behold, He was spoken of by Moses; Yea, and behold, a type was raised up in the wilderness that whosoever would look upon it might live, And many did look and live;"},{"time":2303.6,"text":"192. But few understood the meaning of those things, and this because of the hardness of their hearts;"},{"time":2310.4,"text":"193. But there were many which were so hardened that they would not look, therefore they perished;"},{"time":2316.4,"text":"194. Now the reason that they would not look is because they did not believe that it would heal them."},{"time":2322.32,"text":"195. \"O my brethren, if ye could be healed by merely casting about your eyes that ye might behold, would ye not behold quickly? Or would ye rather harden your hearts in unbelief and be slothful, that ye would not cast about your eyes that ye might perish?"},{"time":2338.48,"text":"196. If so, wo shall come upon you; But if not so, then cast about your eyes and begin to believe in the Son of God, that He will come to redeem His people, And that He shall suffer and die to atone for their sins,"},{"time":2350.851,"text":"197. And that He shall rise again from the dead, which shall bring to pass the resurrection, That all men shall stand before Him to be judged at the last and judgment day, according to their works."},{"time":2362.951,"text":"198. \"And now my brethren, I desire that ye should plant this word in your hearts, And as it beginneth to swell, even so nourish it by your faith;"},{"time":2373.964,"text":"199. And behold, it will become a tree, springing up in you unto everlasting life;"},{"time":2379.347,"text":"200. And then may God grant unto you that your burdens may be light through the joy of His Son; And even all this can ye do, if ye will. Amen.\""},{"time":2391.04,"text":"201. And now it came to pass that after Alma had spoken these words unto them, he sat down upon the ground, And Amulek arose and began to teach them, saying: \"My brethren, I think that it is impossible that ye should be ignorant of the things which have been spoken concerning the coming of Christ, who is taught by us to be the Son of God;"},{"time":2411.154,"text":"202. Yea, I know that these things were taught unto you bountifully before your dissension from among us, And as ye have desired of my beloved brother that he should make known unto you what ye should do because of your afflictions - And he hath spoken somewhat unto you to prepare your minds, Yea, and he hath exhorted you unto faith and to patience,"},{"time":2431.6,"text":"203. Yea, even that ye would have so much faith as even to plant the word in your hearts, that ye may try the experiment of its goodness. \"And we have beheld that the great question which is in your minds is whether the word be in the Son of God, or whether there shall be no Christ."},{"time":2449.36,"text":"204. \"And ye also beheld that my brother hath proven unto you in many instances that the word is in Christ unto salvation;"},{"time":2455.824,"text":"205. My brother hath called upon the words of Zenos that redemption cometh through the Son of God, And also upon the words of Zenoch, And also he hath appealed unto Moses to prove that these things are true."},{"time":2469.44,"text":"206. \"And now behold, I will testify unto you of myself that these things are true;"},{"time":2475.255,"text":"207. Behold, I say unto you that I do know that Christ shall come among the children of men to take upon Him the transgressions of His people, And that He shall atone for the sins of the world, For the Lord God hath spoken it."},{"time":2489.524,"text":"208. \"For it is expedient that an atonement should be made; For according to the great plans of the Eternal God, there must be an atonement made, or else all mankind must unavoidably perish -"},{"time":2501.884,"text":"209. Yea, all are hardened, Yea, all are fallen and are lost and must perish, except it be through the atonement which it is expedient should be made."},{"time":2513.68,"text":"210. \"For it is expedient that there should be a great and last sacrifice, Yea, not a sacrifice of man, neither of beast, neither of any manner of fowl, For it shall not be a human sacrifice, But it must be an infinite and an eternal sacrifice."},{"time":2529.476,"text":"211. \"Now there is not any man that can sacrifice his own blood, which will atone for the sins of another."},{"time":2537.007,"text":"212. \"Now if a man murdereth, behold, will our law, which is just, take the life of his brother? I say unto you, Nay,"},{"time":2546.88,"text":"213. But the law requireth the life of him who hath murdered; Therefore, there is nothing which is short of an infinite atonement which will suffice for the sins of the world, Therefore, it is expedient that there should be a great and last sacrifice."},{"time":2560.702,"text":"214. \"And then shall there be, or it is expedient there should be, a stop to the shedding of blood, Then shall the law of Moses be fulfilled, Yea, it shall all be fulfilled, every jot and tittle, And none shall have passed away."},{"time":2576.16,"text":"215. \"And behold, this is the whole meaning of the law, every whit a pointing to that great and last sacrifice, And that great and last sacrifice will be the Son of God, yea, infinite and eternal. \"And thus He shall bring salvation to all those who shall believe on His name,"},{"time":2595.76,"text":"216. This being the intent of this last sacrifice: To bring about the bowels of mercy, which overpowereth justice, And bringeth about means unto men that they may have faith unto repentance."},{"time":2607.6,"text":"217. \"And thus mercy can satisfy the demands of justice and encircles them in the arms of safety, While he that exerciseth no faith unto repentance is exposed to the whole law of the demands of justice; Therefore, only unto him that hath faith unto repentance is brought about the great and eternal plan of redemption."},{"time":2625.941,"text":"218. \"Therefore, may God grant unto you, my brethren, that ye might begin to exercise your faith unto repentance, That ye begin to call upon His holy name that He would have mercy upon you; Yea, cry unto Him for mercy, for He is mighty to save;"},{"time":2643.68,"text":"219. Yea, humble yourselves and continue in prayer unto Him - Cry unto Him when ye are in your fields, yea, over all your flocks; Cry unto Him in your houses, yea, over all your household, both morning, midday and evening; Yea, cry unto Him against the power of your enemies; Yea, cry unto Him against the devil which is an enemy to all righteousness;"},{"time":2668.64,"text":"220. Cry unto Him over the crops of your fields that ye may prosper in them; Cry over the flocks of your fields that they may increase."},{"time":2676.8,"text":"221. \"But this is not all - Ye must pour out your souls in your closets and your secret places and in your wilderness;"},{"time":2683.379,"text":"222. Yea, and when you do not cry unto the Lord, Let your hearts be full, drawn out in prayer unto Him continually for your welfare, and also for the welfare of those that are around you."},{"time":2696.261,"text":"223. \"And now behold, my brethren, I say unto you, do not suppose that this is all, For after ye have done all these things, If ye turn away the needy and the naked, and visit not the sick and afflicted and impart of your substance, if ye have, to those which stand in need -"},{"time":2714.514,"text":"224. I say unto you, if ye do not any of these things, Behold, your prayer is vain and availeth you nothing, And ye are as hypocrites which do deny the faith;"},{"time":2726.467,"text":"225. Therefore, if ye do not remember to be charitable, Ye are as dross which the refiners do cast out - it being of no worth - and is trodden underfoot of men."},{"time":2736.795,"text":"226. \"And now my brethren, I would that after ye have received so many witnesses - seeing that the holy scripture testifies of these things - come forth and bring fruit unto repentance!"},{"time":2748.187,"text":"227. Yea, I would that ye would come forth and harden not your hearts any longer; For behold, now is the time and the day of your salvation; And therefore, if ye will repent and harden not your hearts, Immediately shall the great plan of redemption be brought about unto you;"},{"time":2767.28,"text":"228. For behold, this life is the time for men to prepare to meet God; Yea, behold, the day of this life is the day for men to perform their labors."},{"time":2777.657,"text":"229. \"And now, as I said unto you before, as ye have had so many witnesses, Therefore, I beseech of you that ye do not procrastinate the day of your repentance until the end;"},{"time":2788.764,"text":"230. For after this day of life, which is given us to prepare for eternity, Behold, if we do not improve our time while in this life, then cometh the night of darkness wherein there can be no labor performed."},{"time":2802.232,"text":"231. \"Ye cannot say when ye are brought to that awful crisis that ' I will repent, that I will return to my God ';"},{"time":2810.931,"text":"232. Nay, ye cannot say this, For that same spirit which doth possess your bodies at the time that ye go out of this life, That same spirit will have power to possess your body in that eternal world."},{"time":2823.32,"text":"233. \"For behold, if ye have procrastinated the day of your repentance, even until death, Behold, ye have become subjected to the spirit of the devil, And he doth seal you his;"},{"time":2835.453,"text":"234. Therefore, the Spirit of the Lord hath withdrawn from you and hath no place in you, And the devil hath all power over you; And this is the final state of the wicked."},{"time":2847.04,"text":"235. \"And this I know because the Lord hath said He dwelleth not in unholy temples, But in the hearts of the righteous doth He dwell;"},{"time":2855.128,"text":"236. Yea, and He hath also said that the righteous should sit down in His kingdom to go no more out, But their garments should be made white through the blood of the Lamb."},{"time":2865.147,"text":"237. \"And now my beloved brethren, I desire that ye should remember these things, And that ye should work out your salvation with fear before God, And that ye should no more deny the coming of Christ, That ye contend no more against the Holy Ghost, But that ye receive it and take upon you the name of Christ, That ye humble yourselves even to the dust and worship God in whatsoever place ye may be in, in spirit and in truth,"},{"time":2889.478,"text":"238. And that ye live in thanksgiving daily for the many mercies and blessings which He doth bestow upon you.\"Yea, and I also exhort you, my brethren, that ye be watchful unto prayer continually, That ye may not be led away by the temptations of the devil, That he may not overpower you, That ye may not become his subjects at the last day; For behold, he rewardeth you no good thing."},{"time":2914.315,"text":"239. \"And now my beloved brethren, I would exhort you to have patience and that ye bear with all manner of afflictions, That ye do not revile against those who do cast you out because of your exceeding poverty, lest ye become sinners like unto them, But that ye have patience and bear with those afflictions, with a firm hope that ye shall one day rest from all your afflictions.\""},{"time":2935.6,"text":"240. Now it came to pass that after Amulek had made an end of these words, They withdrew themselves from the multitude and came over into the Land of Jershon;"},{"time":2945.6,"text":"241. Yea, and the rest of the brethren, after they had preached the word unto the Zoramites, also came over into the Land of Jershon."},{"time":2953.747,"text":"242. And it came to pass that after the more popular part of the Zoramites had consulted together concerning the words which had been preached unto them, They were angry because of the word, for it did destroy their craft; Therefore, they would not hearken unto the words."},{"time":2969.52,"text":"243. And they sent and gathered together throughout all the land all the people, And consulted with them concerning the words which had been spoken."},{"time":2977.68,"text":"244. Now their rulers and their priests and their teachers did not let the people know concerning their desires, Therefore, they found out privily the minds of all the people."},{"time":2987.68,"text":"245. And it came to pass that after they had found out the minds of all the people, Those which were in favor of the words which had been spoken by Alma and his brethren were cast out of the land - And they were many - And they came over also into the Land of Jershon."},{"time":3002.08,"text":"246. And it came to pass that Alma and his brethren did minister unto them."},{"time":3009.76,"text":"247. Now the people of the Zoramites were angry with the people of Ammon which were in Jershon; And the chief ruler of the Zoramites, being a very wicked man, sent over unto the people of Ammon desiring them that they should cast out of their land all those which came over from them into their land,"},{"time":3025.564,"text":"248. And he breathed out many threatenings against them."},{"time":3030.8,"text":"249. And now the people of Ammon did not fear their words, Therefore, they did not cast them out; But they did receive all the poor of the Zoramites that came over unto them,"},{"time":3041.92,"text":"250. And they did nourish them and did clothe them and did give unto them lands for their inheritance; And they did administer unto them according to their wants."},{"time":3050.16,"text":"251. Now this did stir up the Zoramites to anger against the people of Ammon, And they began to mix with the Lamanites and to stir them up also to anger against them;"},{"time":3060.4,"text":"252. And thus the Zoramites and the Lamanites began to make preparations for war against the people of Ammon, and also against the Nephites."},{"time":3068.543,"text":"253. And thus ended the seventeenth year of the reign of the judges over the people of Nephi."},{"time":3075.764,"text":"254. And the people of Ammon departed out of the Land of Jershon and came over into the Land of Melek, And gave place in the Land of Jershon for the armies of the Nephites, that they might contend with the armies of the Lamanites and the armies of the Zoramites."},{"time":3091.76,"text":"255. And thus commenced a war betwixt the Lamanites and the Nephites in the eighteenth year of the reign of the judges, And an account shall be given of their wars hereafter."},{"time":3101.36,"text":"256. And Alma and Ammon and their brethren, and also the two sons of Alma, returned to the Land of Zarahemla after having been instruments in the hands of God of bringing many of the Zoramites to repentance, And as many as were brought to repentance were driven out of their land;"},{"time":3117.6,"text":"257. But they have lands for their inheritance in the Land of Jershon, And they have taken up arms to defend themselves and their wives and their children and their lands."},{"time":3127.36,"text":"258. Now Alma, being grieved for the iniquity of his people, Yea, for the wars and the bloodsheds and the contentions which were among them, And having been to declare the word, or sent to declare the word among all the people in every city,"},{"time":3141.92,"text":"259. And seeing that the hearts of the people began to wax hard and that they began to be offended because of the strictness of the word, His heart was exceeding sorrowful;"},{"time":3150.96,"text":"260. Therefore, he caused that his sons should be gathered together, That he might give unto them, every one, his charge separately concerning the things pertaining unto righteousness."},{"time":3164.72,"text":"261. And we have an account of his commandments which he gave unto them, according to his own record."}]
};
