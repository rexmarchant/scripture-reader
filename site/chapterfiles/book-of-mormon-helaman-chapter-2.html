<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Helaman",
  chapter: "Chapter 2",
  audioSrc: "https://archive.org/download/helaman-ch-2/Helaman%20Ch%202.mp3",
  lyrics: [{"time":0.0,"text":"Helaman Chapter 2"},{"time":9.606,"text":"1. And now it came to pass in the forty and third year of the reign of the judges, There was no contention among the people of Nephi, save it were a little pride which was in the church, Which did cause some little dissensions among the people, Which affairs were settled in the ending of the forty and third year."},{"time":19.213,"text":"2. And there was no contention among the people in the forty and fourth year; Neither was there much contention in the forty and fifth year."},{"time":27.592,"text":"3. And it came to pass in the forty and sixth year, there were much contentions and many dissensions, In the which there were an exceeding great many which departed out of the Land of Zarahemla and went forth unto the Land Northward to inherit the land."},{"time":41.939,"text":"4. And they did travel to an exceeding great distance, insomuch that they came to large bodies of water and many rivers;"},{"time":52.708,"text":"5. Yea, and even they did spread forth into all parts of the land, Into whatever parts it had not been rendered desolate and without timber because of the many inhabitants which had before inherited the land."},{"time":63.478,"text":"6. And now no part of the land was desolate, save it were for timber, etc.; But because of the greatness of the destruction of the people which had before inhabited the land, It was called desolate."},{"time":76.64,"text":"7. And there being but little timber upon the face of the land; Nevertheless, the people which went forth became exceeding expert in the working of cement; Therefore, they did build houses of cement in the which they did dwell."},{"time":89.36,"text":"8. And it came to pass that they did multiply and spread, And did go forth from the Land Southward to the Land Northward, And did spread insomuch that they began to cover the face of the whole earth - from the sea south to the sea north, from the sea west to the sea east."},{"time":106.24,"text":"9. And the people which were in the Land Northward did dwell in tents and in houses of cement, And they did suffer whatsoever tree should spring up upon the face of the land, that it should grow up, That in time they might have timber to build their houses, yea, their cities and their temples and their synagogues and their sanctuaries and all manner of their buildings."},{"time":125.892,"text":"10. And it came to pass as timber was exceeding scarce in the Land Northward, They did send forth much by the way of shipping; And thus they did enable the people in the Land Northward, that they might build many cities, both of wood and of cement."},{"time":140.251,"text":"11. And it came to pass that there were many of the people of Ammon which were Lamanites by birth did also go forth into this land."},{"time":148.269,"text":"12. And now there are many records kept of the proceedings of this people - by many of this people - Which are particular and very large concerning them."},{"time":157.938,"text":"13. But behold, a hundredth part of the proceedings of this people - Yea, the account of the Lamanites and of the Nephites, And their wars and contentions and dissensions, And their preaching and their prophecies, And their shipping and their building of ships, And their building of temples and of synagogues and their sanctuaries, And their righteousness and their wickedness and their murders and their robbings and their plunderings, And all manner of abominations and whoredoms - Cannot be contained in this work."},{"time":187.173,"text":"14. But behold, there are many books and many records of every kind, And they have been kept chiefly by the Nephites; And they have been handed down from one generation to another by the Nephites, even until they have fallen into transgression, And have been murdered, plundered and hunted, And driven forth and slain and scattered upon the face of the earth, And mixed with the Lamanites until they are no more called the Nephites, becoming wicked and wild and ferocious, Yea, even becoming Lamanites."},{"time":216.023,"text":"15. And now I return again to mine account. Therefore, what I have spoken had passed after there had been great contentions and disturbances and wars and dissensions among the people of Nephi;"},{"time":224.999,"text":"16. The forty and sixth year of the reign of the judges ended."},{"time":233.975,"text":"17. And it came to pass that there was still great contentions in the land, Yea, even in the forty and seventh year, And also in the forty and eighth year."},{"time":249.413,"text":"18. Nevertheless, Helaman did fill the judgment seat with justice and equity; Yea, he did observe to keep the statutes and the judgments and the commandments of God; And he did do that which was right in the sight of God continually; And he did walk after the ways of his father, insomuch that he did prosper in the land."},{"time":264.851,"text":"19. And it came to pass that he had two sons - He gave unto the eldest the name of Nephi, and unto the youngest the name of Lehi; And they began to grow up unto the Lord."},{"time":277.015,"text":"20. And it came to pass that the wars and contentions began to cease, in a small degree, among the people of the Nephites, In the latter end of the forty and eighth year of the reign of the judges over the people of Nephi."},{"time":289.179,"text":"21. And it came to pass in the forty and ninth year of the reign of the judges, there was continual peace established in the land - All, save it were the secret combinations which Gaddianton the robber had established in the more settled parts of the land, Which at that time were not known unto those which were at the head of government; Therefore, they were not destroyed out of the land."},{"time":310.135,"text":"22. And it came to pass that in this same year, there was exceeding great prosperity in the church, Insomuch that there were thousands who did join themselves unto the church and were baptized unto repentance;"},{"time":323.36,"text":"23. And so great was the prosperity of the church, And so many the blessings which were poured out upon the people, That even the high priests and the teachers were themselves astonished beyond measure."},{"time":334.985,"text":"24. And it came to pass that the work of the Lord did prosper, unto the baptizing and the uniting to the church of God many souls, yea, even tens of thousands."},{"time":344.78,"text":"25. Thus we may see that the Lord is merciful unto all who will, in the sincerity of their hearts, call upon His holy name. Yea, thus we see that the gate of heaven is open unto all, even to those who will believe on the name of Jesus Christ, which is the Son of God."},{"time":364.8,"text":"26. Yea, we see that whosoever will lay hold upon the word of God, which is quick and powerful, Which shall divide asunder all the cunning and the snares and the wiles of the devil, And lead the man of Christ in a strait and narrow course across that everlasting gulf of misery which is prepared to engulf the wicked, And land their souls, yea, their immortal souls, at the right hand of God in the kingdom of heaven, To sit down with Abraham and Isaac and with Jacob and with all our holy fathers to go no more out."},{"time":396.4,"text":"27. And in this year there was continual rejoicing in the Land of Zarahemla, And in all the regions round about, Even in all the land which was possessed by the Nephites."},{"time":407.28,"text":"28. And it came to pass that there was peace and exceeding great joy in the remainder of the forty and ninth year. Yea, and also there was continual peace and great joy in the fiftieth year of the reign of the judges."},{"time":423.68,"text":"29. And in the fifty and first year of the reign of the judges, there was peace also, Save it were the pride which began to enter into the church - Not into the church of God, but into the hearts of the people who professed to belong to the church of God - And they were lifted up in pride, even to the persecution of many of their brethren."},{"time":440.08,"text":"30. Now this was a great evil which did cause the more humble part of the people to suffer great persecutions and to wade through much affliction."},{"time":448.6,"text":"31. Nevertheless, they did fast and pray oft, And did wax stronger and stronger in their humility, And firmer and firmer in the faith of Christ, Unto the filling their souls with joy and consolation, Yea, even to the purifying and the sanctification of their hearts, Which sanctification cometh because of their yielding their hearts unto God."},{"time":468.952,"text":"32. And it came to pass that the fifty and second year ended in peace also, Save it were the exceeding great pride which had got into the hearts of the people; And it was because of their exceeding great riches and their prosperity in the land; And it did grow upon them from day to day."},{"time":485.332,"text":"33. And it came to pass in the fifty and third year of the reign of the judges, Helaman died and his eldest son Nephi began to reign in his stead."},{"time":494.72,"text":"34. And it came to pass that he did fill the judgment seat with justice and equity; Yea, he did keep the commandments of God and did walk in the ways of his father."},{"time":508.251,"text":"35. And it came to pass in the fifty and fourth year, there were many dissensions in the church, And there was also a contention among the people, insomuch that there was much bloodshed; And the rebellious part were slain and driven out of the land, And they did go unto the king of the Lamanites."},{"time":521.781,"text":"36. And it came to pass that they did endeavor to stir up the Lamanites to war against the Nephites; But behold, the Lamanites were exceeding fraid, insomuch that they would not hearken to the words of those dissenters."},{"time":535.52,"text":"37. But it came to pass in the fifty and sixth year of the reign of the judges, there were dissenters which went up from the Nephites unto the Lamanites; And they succeeded with those others in stirring them up to anger against the Nephites; And they were all that year preparing for war."},{"time":553.765,"text":"38. And in the fifty and seventh year, they did come down against the Nephites to battle, And they did commence the work of death; Yea, insomuch that in the fifty and eighth year of the reign of the judges, They succeeded in obtaining possession of the Land of Zarahemla, yea, and also all the lands even unto the land which was near the Land Bountiful;"},{"time":572.009,"text":"39. And the Nephites and the armies of Moronihah were driven even into the Land of Bountiful; And there they did fortify against the Lamanites from the West Sea even unto the east - It being a day's journey for a Nephite on the line which they had fortified - And stationed their armies to defend their North Country."},{"time":590.715,"text":"40. And thus those dissenters of the Nephites, with the help of a numerous army of the Lamanites, had obtained all the possession of the Nephites which was in the Land Southward."},{"time":601.048,"text":"41. And all this was done in the fifty and eighth and ninth years of the reign of the judges."},{"time":608.72,"text":"42. And it came to pass in the sixtieth year of the reign of the judges, Moronihah did succeed with his armies in obtaining many parts of the land; Yea, they retained many cities which had fallen into the hands of the Lamanites."},{"time":621.99,"text":"43. And it came to pass in the sixty and first year of the reign of the judges, They succeeded in retaining even the half of all their possessions."},{"time":631.04,"text":"44. Now this great loss of the Nephites, and the great slaughter which was among them, would not have happened had it not been for their wickedness and their abomination which was among them; Yea, and it was among those also which professed to belong to the church of God."},{"time":646.24,"text":"45. And it was because of the pride of their hearts, because of their exceeding riches; Yea, it was because of their oppression to the poor - withholding their food from the hungry, withholding their clothing from the naked - And smiting their humble brethren upon the cheek, Making a mock of that which was sacred, Denying the spirit of prophecy and of revelation, Murdering, plundering, lying, stealing, committing adultery, raising up in great contentions, And dissenting away into the Land of Nephi, among the Lamanites"},{"time":677.05,"text":"46. And because of this, their great wickedness and their boastings in their own strength, they were left in their own strength; Therefore, they did not prosper, But were afflicted and smitten and driven before the Lamanites, until they had lost possession of almost all their lands."},{"time":693.78,"text":"47. But behold, Moronihah did preach many things unto the people because of their iniquity, And also Nephi and Lehi, which were the sons of Helaman, did preach many things unto the people,"},{"time":706.203,"text":"48. Yea, and did prophesy many things unto them concerning their iniquities and what should come unto them if they did not repent of their sins."},{"time":716.008,"text":"49. And it came to pass that they did repent, And inasmuch as they did repent, they did begin to prosper;"},{"time":726.484,"text":"50. For when Moronihah saw that they did repent, he did venture to lead them forth from place to place and from city to city, Even until they had retained the one half of their property and the one half of all their lands."},{"time":736.96,"text":"51. And thus ended the sixty and first year of the reign of the judges."},{"time":741.387,"text":"52. And it came to pass in the sixty and second year of the reign of the judges that Moronihah could obtain no more possessions over the Lamanites;"},{"time":750.215,"text":"53. Therefore, they did abandon their design to obtain the remainder of their lands, For so numerous were the Lamanites that it became impossible for the Nephites to obtain more power over them; Therefore, Moronihah did employ all his armies in maintaining those parts which he had taken."},{"time":767.777,"text":"54. And it came to pass because of the greatness of the number of the Lamanites, the Nephites were in great fear lest they should be overpowered and trodden down and slain and destroyed;"},{"time":779.401,"text":"55. Yea, they began to remember the prophecies of Alma and also the words of Mosiah. And they saw that they had been a stiff-necked people, And that they had set at naught the commandments of God;"},{"time":791.026,"text":"56. And that they had altered and trampled under their feet the laws of Mosiah - or that which the Lord commanded him to give unto the people."},{"time":800.453,"text":"57. And thus seeing that their laws had become corrupted and that they had become a wicked people, Insomuch that they were wicked even like unto the Lamanites,"},{"time":809.375,"text":"58. And because of their iniquity, The church had begun to dwindle; And they began to disbelieve in the spirit of prophecy and in the spirit of revelation; And the judgments of God did stare them in the face."},{"time":822.227,"text":"59. And they saw they had become weak like unto their brethren the Lamanites, And that the Spirit of the Lord did no more preserve them, Yea, it had withdrawn from them because the Spirit of the Lord doth not dwell in unholy temples;"},{"time":836.64,"text":"60. Therefore, the Lord did cease to preserve them by His miraculous and matchless power, For they had fallen into a state of unbelief and awful wickedness. And they saw that the Lamanites were more exceeding numerous than they, And except they should repent unto the Lord, their God, They must unavoidably perish."},{"time":855.05,"text":"61. For behold, they saw that the strength of the Lamanites was as great as their strength, even man for man."},{"time":863.244,"text":"62. And thus had they fallen into this great transgression; Yea, thus had they become weak, because of their transgression, in the space of not many years."},{"time":873.133,"text":"63. And it came to pass that in this same year, Behold, Nephi delivered up the judgment seat to a man whose name was Cezoram."},{"time":882.396,"text":"64. For as their laws and their governments were established by the voice of the people, And they which chose evil were more numerous than they which chose good, Therefore, they were ripening for destruction, for the laws had become corrupted."},{"time":895.0,"text":"65. Yea, and this was not all - They were a stiff - necked people, Insomuch that they could not be governed by the law nor justice, save it were to their destruction."},{"time":907.604,"text":"66. And it came to pass that Nephi had become weary because of their iniquity, And he yielded up the judgment seat and took it upon him to preach the word of God all the remainder of his days, And his brother Lehi also, all the remainder of his days; For they remembered the words which their father Helaman spake unto them."},{"time":926.013,"text":"67. And these are the words which he spake: \"Behold, my sons, I desire that ye should remember to keep the commandments of God; And I would that ye should declare unto the people these words."},{"time":939.76,"text":"68. \"Behold, I have given unto you the names of our first parents which came out of the Land of Jerusalem; And this I have done that when you remember your names, that ye may remember them; And when ye remember them, ye may remember their works; And when ye remember their works, ye may know how that it is said, and also written, that they were good."},{"time":961.14,"text":"69. \"Therefore, my sons, I would that ye should do that which is good, that it may be said of you, and also written, Even as it has been said and written of them."},{"time":971.149,"text":"70. \"And now my sons, behold, I have somewhat more to desire of you, Which desire is that ye may not do these things that ye may boast, But that ye may do these things to lay up for yourselves a treasure in heaven, Yea, which is eternal and which fadeth not away; Yea, that ye may have that precious gift of eternal life, which ye have reason to suppose hath been given to our fathers."},{"time":995.31,"text":"71. \"O remember, remember, my sons, the words which King Benjamin spake unto his people; Yea, remember that there is no other way nor means whereby man can be saved, Only through the atoning blood of Jesus Christ, which shall come; Yea, remember that He cometh to redeem the world."},{"time":1013.493,"text":"72. \"And remember also the words which Amulek spake unto Zeezrom in the City of Ammonihah; For he said unto him that the Lord surely should come to redeem His people; But that He should not come to redeem them in their sins, But to redeem them from their sins;"},{"time":1029.469,"text":"73. And He hath power given unto Him from the Father to redeem them from their sins because of repentance; Therefore, He hath sent His angels to declare the tidings of the conditions of repentance, Which bringeth unto the power of the Redeemer, unto the salvation of their souls."},{"time":1045.12,"text":"74. \"And now my sons, remember, remember that it is upon the Rock of our Redeemer, which is Christ, the Son of God, that ye must build your foundation; That when the devil shall send forth his mighty winds, yea, his shafts in the whirlwind,"},{"time":1059.625,"text":"75. Yea, when all his hail and his mighty storm shall beat upon you, It shall have no power over you to drag you down to the gulf of misery and endless wo, Because of the Rock upon which ye are built, which is a sure foundation, a foundation whereon if men buildeth, they cannot fall.\""},{"time":1077.156,"text":"76. And it came to pass that these were the words which Helaman taught to his sons; Yea, he did teach them many things which are not written, and also many things which are written."},{"time":1089.397,"text":"77. And they did remember his words; And therefore, they went forth - keeping the commandments of God - to teach the word of God among all the people of Nephi, Beginning at the City Bountiful, and from thenceforth to the City of Gid, and from the City of Gid to the City of Mulek;"},{"time":1108.48,"text":"78. And even from one city to another until they had gone forth among all the people of Nephi which were in the Land Southward; And from thence into the Land of Zarahemla, among the Lamanites."},{"time":1120.0,"text":"79. And it came to pass that they did preach with great power, Insomuch that they did confound many of those dissenters which had gone over from the Nephites, Insomuch that they came forth and did confess their sins and were baptized unto repentance, And immediately returned to the Nephites to endeavor to repair unto them the wrongs which they had done."},{"time":1139.432,"text":"80. And it came to pass that Nephi and Lehi did preach unto the Lamanites with such great power and authority - For they had power and authority given unto them that they might speak, And they also had what they should speak given unto them -"},{"time":1153.01,"text":"81. Therefore, they did speak unto the great astonishment of the Lamanites to the convincing them, Insomuch that there were eight thousand of the Lamanites which were in the Land of Zarahemla and round about baptized unto repentance, And were convinced of the wickedness of the traditions of their fathers."},{"time":1169.52,"text":"82. And it came to pass that Nephi and Lehi did proceed from thence to go to the Land of Nephi."},{"time":1175.92,"text":"83. And it came to pass that they were taken by an army of the Lamanites and cast into prison; Yea, even in that same prison in which Ammon and his brethren were cast by the servants of Limhi;"},{"time":1187.694,"text":"84. And after they had been cast into prison many days without food, Behold, they went forth into the prison to take them, that they might slay them."},{"time":1197.794,"text":"85. And it came to pass that Nephi and Lehi were encircled about as if by fire, Even insomuch that they durst not lay their hands upon them for fear, lest they should be burned."},{"time":1209.765,"text":"86. Nevertheless, Nephi and Lehi were not burned, And they were as standing in the midst of fire and were not burned;"},{"time":1217.36,"text":"87. And when they saw that they were encircled about with a pillar of fire and that it burned them not, Their hearts did take courage;"},{"time":1226.48,"text":"88. For they saw that the Lamanites durst not lay their hands upon them; Neither durst they come near unto them, but stood as if they were struck dumb with amazement."},{"time":1235.808,"text":"89. And it came to pass that Nephi and Lehi did stand forth and began to speak unto them, saying: \"Fear not! For behold, it is God that hath shown unto you this marvelous thing, In the which is shown unto you that ye cannot lay your hands on us to slay us.\""},{"time":1253.533,"text":"90. And behold, when they had said these words, the earth shook exceedingly, And the walls of the prison did shake, as if they were about to tumble to the earth; But behold, they did not fall."},{"time":1266.24,"text":"91. And behold, they that were in the prison were Lamanites and Nephites which were dissenters."},{"time":1272.329,"text":"92. And it came to pass that they were overshadowed with a cloud of darkness, And an awful, solemn fear came upon them."},{"time":1280.015,"text":"93. And it came to pass that there came a voice as if it were above the cloud of darkness, saying: \"Repent ye, repent ye! And seek no more to destroy My servants which I have sent unto you to declare good tidings!\""},{"time":1295.0,"text":"94. And it came to pass when they heard this voice and beheld that it was not a voice of thunder - Neither was it a voice of a great tumultuous noise, But behold, it was a still voice of perfect mildness, as if it had been a whisper, And it did pierce even to the very soul -"},{"time":1312.527,"text":"95. And notwithstanding the mildness of the voice, Behold, the earth shook exceedingly, And the walls of the prison trembled again as if it were about to tumble to the earth; And behold, the cloud of darkness which had overshadowed them did not disperse."},{"time":1327.229,"text":"96. And behold, the voice came again, saying: \"Repent ye, repent ye! for the kingdom of heaven is at hand; And seek no more to destroy My servants!\""},{"time":1340.32,"text":"97. And it came to pass that the earth shook again and the walls trembled; And also again the third time the voice came and did speak unto them marvelous words which cannot be uttered by man; And the walls did tremble again and the earth shook as if it were about to divide asunder."},{"time":1356.88,"text":"98. And it came to pass that the Lamanites could not flee because of the cloud of darkness which did overshadow them; Yea, and also they were immovable because of the fear which did come upon them."},{"time":1367.124,"text":"99. Now there was one among them who was a Nephite by birth who had once belonged to the church of God but had dissented from them;"},{"time":1375.591,"text":"100. And it came to pass that he turned him about, And behold, he saw through the cloud of darkness the faces of Nephi and Lehi; And behold, they did shine exceedingly, even as the face of angels;"},{"time":1388.678,"text":"101. And he beheld that they did lift their eyes to heaven; And they were in the attitude as if talking or lifting their voices to some Being which they beheld."},{"time":1397.604,"text":"102. And it came to pass that this man did cry unto the multitude that they might turn and look."},{"time":1404.249,"text":"103. And behold, there was power given unto them that they did turn and look; And they did behold the faces of Nephi and Lehi."},{"time":1413.694,"text":"104. And they said unto the man: \"Behold, what doth all these things mean? And who is it with whom these men do converse?\""},{"time":1423.68,"text":"105. Now the man's name was Aminadab; And Aminadab saith unto them: \"They do converse with the angels of God.\""},{"time":1430.703,"text":"106. And it came to pass that the Lamanites said unto him: \"What shall we do that this cloud of darkness may be removed from overshadowing us?\""},{"time":1443.832,"text":"107. And Aminadab saith unto them: \"You must repent and cry unto the voice, even until ye shall have faith in Christ, which was taught unto you by Alma and Amulek and by Zeezrom; And when ye shall do this, the cloud of darkness shall be removed from overshadowing you.\""},{"time":1456.96,"text":"108. And it came to pass that they all did begin to cry unto the voice of Him which had shook the earth; Yea, they did cry even until the cloud of darkness was dispersed."},{"time":1466.425,"text":"109. And it came to pass that when they cast their eyes about and saw that the cloud of darkness was dispersed from overshadowing them, And behold, they saw that they were encircled about, yea, every soul, by a pillar of fire;"},{"time":1481.52,"text":"110. And Nephi and Lehi were in the midst of them - Yea, they were encircled about, Yea, they were as if in the midst of a flaming fire, yet it did harm them not, Neither did it take hold upon the walls of the prison - And they were filled with that joy which is unspeakable and full of glory;"},{"time":1499.68,"text":"111. And behold, the Holy Spirit of God did come down from heaven and did enter into their hearts, And they were filled as if with fire; And they could speak forth marvelous words."},{"time":1511.52,"text":"112. And it came to pass that there came a voice unto them, yea, a pleasant voice, as if it were a whisper, saying: \"Peace, peace be unto you because of your faith in My Well-Beloved which was from the foundation of the world.\""},{"time":1524.64,"text":"113. And now when they heard this, they cast up their eyes as if to behold from whence the voice came; And behold, they saw the heavens open, And angels came down out of heaven and ministered unto them;"},{"time":1537.62,"text":"114. And there were about three hundred souls which saw and heard these things; And they were bid to go forth and marvel not, neither should they doubt."},{"time":1547.318,"text":"115. And it came to pass that they did go forth and did minister unto the people, Declaring throughout all the regions round about all the things which they had heard and seen, Insomuch that the more part of the Lamanites were convinced of them because of the greatness of the evidences which they had received;"},{"time":1564.513,"text":"116. And as many as were convinced did lay down their weapons of war, and also their hatred, and the tradition of their fathers."},{"time":1571.92,"text":"117. And it came to pass that they did yield up unto the Nephites the lands of their possession."},{"time":1577.672,"text":"118. And it came to pass that when the sixty and second year of the reign of the judges had ended, all these things had happened; And the Lamanites had become, the more part of them, a righteous people, Insomuch that their righteousness did exceed that of the Nephites because of their firmness and their steadiness in the faith."},{"time":1596.668,"text":"119. For behold, there were many of the Nephites which had become hardened and impenitent and grossly wicked, Insomuch that they did reject the word of God and all the preaching and prophesying which did come among them."},{"time":1610.08,"text":"120. Nevertheless, the people of the church did have great joy because of the conversion of the Lamanites, Yea, because of the church of God which had been established among them;"},{"time":1620.64,"text":"121. And they did fellowship one with another and did rejoice one with another and did have great joy."},{"time":1627.52,"text":"122. And it came to pass that many of the Lamanites did come down into the Land of Zarahemla, And did declare unto the people of the Nephites the manner of their conversion, And did exhort them to faith and repentance;"},{"time":1639.784,"text":"123. Yea, and many did preach with exceeding great power and authority, Unto the bringing down many of them into the depths of humility, to be the humble followers of God and of the Lamb."},{"time":1651.232,"text":"124. And it came to pass that many of the Lamanites did go into the Land Northward; And also Nephi and Lehi went into the Land Northward to preach unto the people."},{"time":1661.68,"text":"125. And thus ended the sixty and third year."},{"time":1665.52,"text":"126. And behold, there was peace in all the land, Insomuch that the Nephites did go into whatsoever part of the land they would, whether among the Nephites or the Lamanites."},{"time":1676.711,"text":"127. And it came to pass that the Lamanites did also go whithersoever they would, Whether it were among the Lamanites or among the Nephites; And thus they did have free intercourse one with another for to buy and to sell and to get gain, according to their desire."},{"time":1691.704,"text":"128. And it came to pass that they became exceeding rich, both the Lamanites and the Nephites; And they did have an exceeding plenty of gold and of silver and of all manner of precious metals, Both in the Land South and in the Land North."},{"time":1706.589,"text":"129. Now the Land South was called Lehi, And the Land North was called Mulek, which was after the son of Zedekiah; For the Lord did bring Mulek into the Land North and Lehi into the Land South."},{"time":1719.154,"text":"130. And behold, there was all manner of gold in both these lands, and of silver and of precious ore of every kind; And there were also curious workmen which did work all kinds of ore and did refine it; And thus they did become rich."},{"time":1734.64,"text":"131. They did raise grain in abundance, both in the north and in the south; And they did flourish exceedingly, both in the north and in the south;"},{"time":1743.482,"text":"132. And they did multiply and wax exceeding strong in the land; And they did raise many flocks and herds, yea, many fatlings."},{"time":1753.44,"text":"133. Behold, their women did toil and spin and did make all manner of cloth of fine-twined linen and cloth of every kind to clothe their nakedness."},{"time":1762.264,"text":"134. And thus the sixty and fourth year did pass away in peace."},{"time":1767.12,"text":"135. And in the sixty and fifth year, they did also have great joy and peace, Yea, much preaching and many prophecies concerning that which was to come; And thus passed away the sixty and fifth year."},{"time":1778.724,"text":"136. And it came to pass that in the sixty and sixth year of the reign of the judges, Behold, Cezoram was murdered by an unknown hand as he sat upon the judgment seat."},{"time":1790.32,"text":"137. And it came to pass that in the same year, that his son which had been appointed by the people in his stead was also murdered; And thus ended the sixty and sixth year."},{"time":1802.8,"text":"138. And in the commencement of the sixty and seventh year, the people began to grow exceeding wicked again;"},{"time":1810.42,"text":"139. For behold, the Lord had blessed them so long with the riches of the world, That they had not been stirred up to anger, to wars, nor to bloodsheds; Therefore, they began to set their hearts upon their riches;"},{"time":1824.24,"text":"140. Yea, they began to seek to get gain that they might be lifted up one above another; Therefore, they began to commit secret murders and to rob and to plunder, that they might get gain."},{"time":1836.4,"text":"141. And now behold, those murderers and plunderers were a band which had been formed by Kishcumen and Gaddianton."},{"time":1843.092,"text":"142. And now it had come to pass that there were many, even among the Nephites, of Gaddianton's band; But behold, they were more numerous among the more wicked part of the Lamanites;"},{"time":1856.4,"text":"143. And they were called Gaddianton's robbers and murderers; And it was they which did murder the chief judge Cezoram and his son while in the judgment seat; And behold, they were not found."},{"time":1867.52,"text":"144. And now it came to pass that when the Lamanites found that there were robbers among them, They were exceeding sorrowful; And they did use every means whatsoever was in their power to destroy them off the face of the earth."},{"time":1879.402,"text":"145. But behold, Satan did stir up the hearts of the more parts of the Nephites insomuch that they did unite with those bands of robbers, And did enter into their covenants and their oaths that they would protect and preserve one another in whatsoever difficult circumstances they should be placed, In that they should not suffer for their murders and their plunderings and their stealings."},{"time":1901.52,"text":"146. And it came to pass that they did have their signs, yea, their secret signs and their secret words; And this that they might distinguish a brother who had entered into the covenant, That whatsoever wickedness his brother should do, he should not be injured by his brother, Nor by those who did belong to his band who had taken this covenant."},{"time":1919.76,"text":"147. And thus they might murder and plunder and steal and commit whoredoms and all manner of wickedness contrary to the laws of their country, and also the laws of their God;"},{"time":1930.16,"text":"148. And whosoever of those which belonged to their band should reveal unto the world of their wickedness and their abominations should be tried - Not according to the laws of their country, But according to the laws of their wickedness which had been given by Gaddianton and Kishcumen."},{"time":1945.12,"text":"149. Now behold, it is these secret oaths and covenants which Alma commanded his son should not go forth unto the world, Lest they should be a means of bringing down the people unto destruction."},{"time":1959.68,"text":"150. Now behold, those secret oaths and covenants did not come forth unto Gaddianton from the records which were delivered unto Helaman;"},{"time":1967.74,"text":"151. But behold, they were put into the heart of Gaddianton by that same being who did entice our first parents to partake of the forbidden fruit - Yea, that same being who did plot with Cain, that if he would murder his brother Abel, it should not be known unto the world;"},{"time":1984.368,"text":"152. And he did plot with Cain and his followers from that time forth."},{"time":1988.697,"text":"153. And also it is that same being who put it into the hearts of the people to build a tower sufficiently high that they might get to heaven."},{"time":1997.234,"text":"154. And it was that same being which led on the people which came from that Tower into this land, Which spread the works of darkness and abominations over all the face of the land, until he dragged the people down to an entire destruction and to an everlasting hell."},{"time":2012.501,"text":"155. Yea, it is that same being who put it into the heart of Gaddianton to still carry on the work of darkness and of secret murder; And he hath brought it forth from the beginning of man, even down to this time."},{"time":2026.016,"text":"156. And behold, it is he which is the author of all sin; And behold, he doth carry on his works of darkness and secret murder, And doth hand down their plots and their oaths and their covenants and their plans of awful wickedness from generation to generation, According as he can get hold upon the hearts of the children of men."},{"time":2047.12,"text":"157. And now behold, he had got great hold upon the hearts of the Nephites, Yea, insomuch that they had become exceeding wicked;"},{"time":2055.741,"text":"158. Yea, the more part of them had turned out of the way of righteousness, And did trample under their feet the commandments of God, And did turn unto their own ways, And did build up unto themselves idols of their gold and of their silver."},{"time":2069.903,"text":"159. And it came to pass that all these iniquities did come unto them in the space of not many years, Insomuch that the more part of it had come unto them in the sixty and seventh year of the reign of the judges over the people of Nephi."},{"time":2083.747,"text":"160. And they did grow in their iniquities in the sixty and eighth year also, to the great sorrow and lamentation of the righteous."},{"time":2092.4,"text":"161. And thus we see that the Nephites did begin to dwindle in unbelief and grow in wickedness and abominations, While the Lamanites began to grow exceedingly in the knowledge of their God; Yea, they did begin to keep His statutes and commandments and to walk in truth and uprightness before Him."},{"time":2108.956,"text":"162. And thus we see that the Spirit of the Lord began to withdraw from the Nephites because of the wickedness and the hardness of their hearts."},{"time":2118.064,"text":"163. And thus we see that the Lord began to pour out His Spirit upon the Lamanites because of their easiness and willingness to believe in His word."},{"time":2128.24,"text":"164. And it came to pass that the Lamanites did hunt the band of robbers of Gaddianton; And they did preach the word of God among the more wicked part of them, Insomuch that this band of robbers was utterly destroyed from among the Lamanites."},{"time":2141.44,"text":"165. And it came to pass on the other hand, that the Nephites did build them up and support them, beginning at the more wicked part of them, Until they had overspread all the land of the Nephites and had seduced the more part of the righteous, Until they had come down to believe in their works and partake of their spoils and to join with them in their secret murders and combinations."},{"time":2162.24,"text":"166. And thus they did obtain the sole management of the government, Insomuch that they did trample under their feet and smite and rend and turn their backs upon the poor and the meek and humble followers of God."},{"time":2173.432,"text":"167. And thus we see that they were in an awful state and ripening for an everlasting destruction."},{"time":2179.692,"text":"168. And it came to pass that thus ended the sixty and eighth year of the reign of the judges over the people of Nephi."}]
