<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",
  chapter: "Chapter 1",
  audioSrc: "https://archive.org/download/3-nephi-ch-1/3%20Nephi%20Ch%201.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 1"},{"time":7.644,"text":"1. Now it came to pass that the ninety and first year had passed away, And it was six hundred years from the time that Lehi left Jerusalem; And it was in the year that Lachoneus was the chief judge and the governor over the land;"},{"time":15.288,"text":"2. And Nephi, the son of Helaman, had departed out of the Land of Zarahemla, giving charge unto his son Nephi, which was his eldest son, concerning the plates of brass and all the records which had been kept, And all those things which had been kept sacred from the departure of Lehi out of Jerusalem;"},{"time":34.046,"text":"3. Then he departed out of the land and whither he went no man knoweth; And his son Nephi did keep the record in his stead, yea, the record of this people."},{"time":46.08,"text":"4. And it came to pass that in the commencement of the ninety and second year, Behold, the prophecies of the prophets began to be fulfilled more fully; For there began to be greater signs and greater miracles wrought among the people."},{"time":58.364,"text":"5. But there were some which began to say that the time was past for the words to be fulfilled which were spoken by Samuel the Lamanite;"},{"time":67.351,"text":"6. And they began to rejoice over their brethren, saying: \"Behold, the time is past and the words of Samuel are not fulfilled; Therefore, your joy and your faith concerning this thing hath been vain.\""},{"time":80.48,"text":"7. And it came to pass that they did make a great uproar throughout the land; And the people which believed began to be very sorrowful, lest by any means those things which had been spoken might not come to pass;"},{"time":94.08,"text":"8. But behold, they did watch steadfastly for that day and that night and that day - which should be as one day as if there were no night - that they might know that their faith had not been vain."},{"time":104.29,"text":"9. Now it came to pass that there was a day set apart by the unbelievers that all those who believed in those traditions should be put to death, except the sign should come to pass which had been given by Samuel the prophet."},{"time":117.664,"text":"10. Now it came to pass that when Nephi, the son of Nephi, saw this wickedness of his people, his heart was exceeding sorrowful."},{"time":127.2,"text":"11. And it came to pass that he went out and bowed himself down upon the earth and cried mightily to his God in behalf of his people, yea, those which were about to be destroyed because of their faith in the tradition of their fathers."},{"time":139.549,"text":"12. And it came to pass that he cried mightily unto the Lord all that day; And behold, the voice of the Lord came unto him, saying: \"Lift up your head and be of good cheer, for behold, the time is at hand; And on this night shall the sign be given,"},{"time":156.72,"text":"13. And on the morrow come I into the world to show unto the world that I will fulfill all that I have caused to be spoken by the mouth of My holy prophets."},{"time":165.872,"text":"14. \"Behold, I come unto My own to fulfill all things which I have made known unto the children of men from the foundation of the world, And to do the will both of the Father and of the Son - of the Father because of Me, and of the Son because of My flesh."},{"time":181.172,"text":"15. \"And behold, the time is at hand, And this night shall the sign be given.\""},{"time":186.581,"text":"16. And it came to pass that the words which came unto Nephi were fulfilled according as they had been spoken."},{"time":194.678,"text":"17. For he beheld at the going down of the sun there was no darkness, And the people began to be astonished because there was no darkness when the night came."},{"time":202.775,"text":"18. And there were many which had not believed the words of the prophets fell to the earth and became as if they were dead, For they knew that the great plan of destruction which they had laid for those who had believed in the words of the prophets had been frustrated, for the sign which had been given was already at hand; And they began to know that the Son of God must shortly appear."},{"time":223.069,"text":"19. Yea, and in fine, all the people upon the face of the whole earth - from the west to the east, both in the Land North and in the Land South - were so exceedingly astonished that they fell to the earth,"},{"time":237.04,"text":"20. For they knew that the prophets had testified of these things for many years and that the sign which had been given was already at hand; And they began to fear because of their iniquity and their unbelief."},{"time":248.619,"text":"21. And it came to pass that there was no darkness in all that night, but it was as light as though it was midday."},{"time":256.225,"text":"22. And it came to pass that the sun did rise in the morning again, according to its proper order; And they knew that it was the day that the Lord should be born because of the sign which had been given."},{"time":268.564,"text":"23. And it had come to pass, yea, all things, every whit, according to the words of the prophets."},{"time":275.293,"text":"24. And it came to pass also that a new star did appear according to the word."},{"time":280.988,"text":"25. And it came to pass from this time forth there began to be lyings sent forth among the people by Satan to harden their hearts, to the intent that they might not believe in those signs and wonders which they had seen;"},{"time":295.0,"text":"26. But notwithstanding those lyings and deceivings, the more part of the people did believe and were converted unto the Lord."},{"time":302.88,"text":"27. And it came to pass that Nephi went forth among the people, and also many others, baptizing unto repentance in the which there were a great remission of sins."},{"time":313.2,"text":"28. And thus the people began again to have peace in the land; And there were no contentions, save it were a few that began to preach, endeavoring to prove by the scriptures that it was no more expedient to observe the law of Moses -"},{"time":326.207,"text":"29. Now in this thing they did err having not understood the scriptures."},{"time":330.828,"text":"30. But it came to pass that they soon became converted and were convinced of the error which they were in, For it was made known unto them that the law was not yet fulfilled and that it must be fulfilled in every whit;"},{"time":343.869,"text":"31. Yea, the word came unto them that it must be fulfilled, Yea, that one jot nor tittle should not pass away till it should all be fulfilled; Therefore, in this same year were they brought to a knowledge of their error and did confess their faults."},{"time":358.574,"text":"32. And thus the ninety and second year did pass away, bringing glad tidings unto the people because of the signs which did come to pass, according to the words of the prophecy of all the holy prophets."},{"time":370.816,"text":"33. And it came to pass that the ninety and third year did also pass away in peace, save it were for the Gaddianton robbers which did dwell upon the mountains, which did infest the land;"},{"time":382.047,"text":"34. For so strong were their holds and their secret places that the people could not overpower them, Therefore, they did commit many murders and did do much slaughter among the people."},{"time":394.4,"text":"35. And it came to pass that in the ninety and fourth year they began to increase in a great degree because there were many dissenters of the Nephites which did flee unto them, which did cause much sorrow unto those Nephites which did remain in the land."},{"time":407.32,"text":"36. And there was also a cause of much sorrow among the Lamanites; For behold, they had many children which did grow up and began to wax strong in years, That they became for themselves and were led away by some which were Zoramites, by their lyings and their flattering words, to join those Gaddianton robbers;"},{"time":427.04,"text":"37. And thus were the Lamanites afflicted also and began to decrease as to their faith and righteousness because of the wickedness of the rising generation."},{"time":435.28,"text":"38. And it came to pass that thus passed away the ninety and fifth year also, And the people began to forget those signs and wonders which they had heard, And began to be less and less astonished at a sign or a wonder from heaven,"},{"time":450.444,"text":"39. Insomuch that they began to be hard in their hearts and blind in their minds, And began to disbelieve all which they had heard and seen, Imagining up some vain thing in their hearts, that it was wrought by men and by the power of the devil to lead away and deceive the hearts of the people;"},{"time":465.608,"text":"40. And thus did Satan get possession of the hearts of the people again, Insomuch that he did blind their eyes and lead them away to believe that the doctrine of Christ was a foolish and a vain thing."},{"time":477.297,"text":"41. And it came to pass that the people began to wax strong in wickedness and abominations, And they did not believe that there should be any more signs or wonders given;"},{"time":488.56,"text":"42. And Satan did go about leading away the hearts of the people, tempting them and causing them that they should do great wickedness in the land."},{"time":499.449,"text":"43. And thus did pass away the ninety and sixth year, And also the ninety and seventh year, And also the ninety and eighth year, And also the ninety and ninth year, And also an hundred years had passed away since the days of Mosiah, which was king over the people of the Nephites;"},{"time":519.049,"text":"44. And six hundred and nine years had passed away since Lehi left Jerusalem; And nine years had passed away from the time which the sign was given, which was spoken of by the prophets that Christ should come into the world."},{"time":527.76,"text":"45. Now the Nephites began to reckon their time from this period which the sign was given, or from the coming of Christ;"},{"time":535.634,"text":"46. Therefore, nine years had passed away, And Nephi, which was the father of Nephi which had the charge of the records, did not return to the Land of Zarahemla and could nowhere be found in all the land."},{"time":547.724,"text":"47. And it came to pass that the people did still remain in wickedness, notwithstanding the much preaching and prophesying which was sent among them; And thus passed away the tenth year also; And the eleventh year also passed away in iniquity."},{"time":561.982,"text":"48. And it came to pass in the thirteenth year there began to be wars and contentions throughout all the land; For the Gaddianton robbers had become so numerous and did slay so many of the people, and did lay waste so many cities, and did spread so much death and carnage throughout the land, That it became expedient that all the people, both the Nephites and the Lamanites, should take up arms against them;"},{"time":585.92,"text":"49. Therefore, all the Lamanites which had become converted unto the Lord did unite with their brethren the Nephites, And were compelled for the safety of their lives and their women and their children to take up arms against those Gaddianton robbers,"},{"time":600.24,"text":"50. Yea, and also to maintain their rights, and their privileges of their church, and of their worship, and their freedom and their liberty."},{"time":608.987,"text":"51. And it came to pass that before this thirteenth year had passed away, The Nephites were threatened with utter destruction because of this war which had become exceeding sore."},{"time":618.83,"text":"52. And it came to pass that those Lamanites which had united with the Nephites were numbered among the Nephites; And their curse was taken from them, And their skin became white like unto the Nephites,"},{"time":631.333,"text":"53. And their young men and their daughters became exceeding fair, And they were numbered among the Nephites and were called Nephites; And thus ended the thirteenth year."},{"time":641.156,"text":"54. And it came to pass in the commencement of the fourteenth year, the war between the robbers and the people of Nephi did continue and did become exceeding sore;"},{"time":652.395,"text":"55. Nevertheless, the people of Nephi did gain some advantage of the robbers, insomuch that they did drive them back out of their lands into the mountains and into their secret places; And thus ended the fourteenth year."},{"time":665.176,"text":"56. And in the fifteenth year they did come forth again against the people of Nephi; And because of the wickedness of the people of Nephi and their many contentions and dissensions, the Gaddianton robbers did gain many advantages over them;"},{"time":678.555,"text":"57. And thus ended the fifteenth year. And thus were the people in a state of many afflictions; And the sword of destruction did hang over them, insomuch that they were about to be smitten down by it, And this because of their iniquity."}]
};
</script>
