window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",

  audioSrc: "https://archive.org/download/alma-ch-23/Alma%20Ch%2023.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 23"},{"time":9.261,"text":"1. And now it came to pass in the commencement of the twenty and fifth year of the reign of the judges over the people of Nephi, They having established peace between the people of Lehi and the people of Morionton concerning their lands, And having commenced the twenty and fifth year in peace;"},{"time":18.522,"text":"2. Nevertheless, they did not long maintain an entire peace in the land, For there began to be a contention among the people concerning the chief judge Pahoron. For behold, there were a part of the people which desired that a few particular points of the law should be altered;"},{"time":35.125,"text":"3. But behold, Pahoron would not alter, nor suffer the law to be altered; Therefore, he did not hearken to those who had sent in their voices with their petitions concerning the altering of the law;"},{"time":48.08,"text":"4. Therefore, those which were desirous that the law should be altered were angry with him and desired that he should no longer be chief judge over the land; Therefore, there arose a warm dispute concerning the matter, But not unto bloodshed."},{"time":62.452,"text":"5. And it came to pass that those who were desirous that Pahoron should be dethroned from the judgment seat were called Kingmen, For they were desirous that the law should be altered in a manner to overthrow the free government and to establish a king over the land;"},{"time":77.465,"text":"6. And those who were desirous that Pahoron should remain chief judge over the land took upon them the name of Freemen; And thus was the division among them, For the Freemen had sworn or covenanted to maintain their rights and the privileges of their religion by a free government."},{"time":93.387,"text":"7. And it came to pass that this matter of their contention was settled by the voice of the people."},{"time":99.387,"text":"8. And it came to pass that the voice of the people came in the favor of the Freemen; And Pahoron retained the judgment seat which caused much rejoicing among the brethren of Pahoron, and also among the people of liberty, Which also put the Kingmen to silence, that they durst not oppose, but were obliged to maintain the cause of freedom."},{"time":120.0,"text":"9. Now those which were in favor of kings were those of high birth, And they sought to be kings; And they were supported by those which sought power and authority over the people."},{"time":130.48,"text":"10. But behold, this was a critical time for such contentions to be among the people of Nephi; For behold, Amalickiah had again stirred up the hearts of the people of the Lamanites against the people of the Nephites; And he was gathering together soldiers from all parts of his land and arming them and preparing for war with all diligence, For he had sworn to drink the blood of Moroni."},{"time":151.58,"text":"11. But behold, we shall see that this promise which he made was rash; Nevertheless, he did prepare himself and his armies to come to battle against the Nephites."},{"time":161.92,"text":"12. Now his armies were not so great as they had hitherto been because of the many thousands which had been slain by the hand of the Nephites;"},{"time":170.688,"text":"13. But notwithstanding their great loss, Amalickiah had gathered together a wonderful, great army, Insomuch that he feared not to come down to the Land of Zarahemla."},{"time":178.544,"text":"14. Yea, even Amalickiah did himself come down at the head of the Lamanites."},{"time":186.4,"text":"15. And it was in the twenty and fifth year of the reign of the judges; And it was at the same time that they had begun to settle the affairs of their contentions concerning the chief judge Pahoron."},{"time":198.151,"text":"16. And it came to pass that when the men which were called Kingmen had heard that the Lamanites were coming down to battle against them, They were glad in their hearts and they refused to take up arms; For they were so wroth with the chief judge, and also with the people of liberty, that they would not take up arms to defend their country."},{"time":217.011,"text":"17. And it came to pass that when Moroni saw this, and also saw that the Lamanites were coming into the borders of the land, He was exceeding wroth because of the stubbornness of those people of whom he had labored with so much diligence to preserve; Yea, he was exceeding wroth; His soul was filled with anger against them."},{"time":235.049,"text":"18. And it came to pass that he sent a petition, with the voice of the people, unto the governor of the land, Desiring that he should heed it and give him, Moroni, power to compel those dissenters to defend their country or to put them to death;"},{"time":250.72,"text":"19. For it was his first care to put an end to such contentions and dissensions among the people; For behold, this had been hitherto a cause of all their destructions."},{"time":261.36,"text":"20. And it came to pass that it was granted, according to the voice of the people."},{"time":265.6,"text":"21. And it came to pass that Moroni commanded that his army should go against those Kingmen to pull down their pride and their nobility and level them with the earth, Or they should take up arms and support the cause of liberty."},{"time":279.36,"text":"22. And it came to pass that the armies did march forth against them; And they did pull down their pride and their nobility, insomuch that as they did lift their weapons of war to fight against the men of Moroni, They were hewn down and leveled to the earth."},{"time":292.88,"text":"23. And it came to pass that there were four thousand of those dissenters which were hewn down by the sword; And those of their leaders which were not slain in battle were taken and cast into prison, For there was no time for their trials at this period;"},{"time":306.8,"text":"24. And the remainder of those dissenters, rather than to be smote down to the earth by the sword, Yielded to the standard of liberty and were compelled to hoist the title of liberty upon their towers and in their cities and to take up arms in defense of their country."},{"time":323.52,"text":"25. And thus Moroni put an end to those Kingmen, that there were not any known by the appellation of Kingmen; And thus he put an end to the stubbornness and the pride of those people which professed the blood of nobility;"},{"time":335.029,"text":"26. But they were brought down to humble themselves, like unto their brethren, and to fight valiantly for their freedom from bondage."},{"time":344.08,"text":"27. Behold, it came to pass that while Moroni was thus breaking down the wars and contentions among his own people, And subjecting them to peace and civilization, And making regulations to prepare for war against the Lamanites, Behold, the Lamanites had come into the Land of Moroni, which was in the borders by the seashore."},{"time":363.671,"text":"28. And it came to pass that the Nephites were not sufficiently strong in the City of Moroni; Therefore, Amalickiah did drive them, slaying many."},{"time":372.811,"text":"29. And it came to pass that Amalickiah took possession of the city, yea, possession of all their fortifications."},{"time":380.2,"text":"30. And those which fled out of the City of Moroni came to the City of Nephihah; And also the people of the City of Lehi gathered themselves together and made preparations and were ready to receive the Lamanites to battle."},{"time":394.052,"text":"31. But it came to pass that Amalickiah would not suffer the Lamanites to go against the City of Nephihah to battle, but kept them down by the seashore, leaving men in every city to maintain and defend it."},{"time":406.0,"text":"32. And thus he went on, Taking possession of many cities - the City of Nephihah, and the City of Lehi, and the City of Morionton, and the City of Omner, and the City of Gid, and the City of Mulek - All of which were on the east borders by the seashore."},{"time":422.221,"text":"33. And thus had the Lamanites obtained, by the cunning of Amalickiah, so many cities by their numberless hosts, All of which were strongly fortified after the manner of the fortifications of Moroni, All of which afforded strongholds for the Lamanites."},{"time":436.056,"text":"34. And it came to pass that they marched to the borders of the Land Bountiful, driving the Nephites before them and slaying many."},{"time":445.299,"text":"35. But it came to pass that they were met by Teancum, who had slain Morionton and had headed his people in his flight."},{"time":453.996,"text":"36. And it came to pass that he headed Amalickiah also, as he was marching forth with his numerous army that he might take possession of the Land Bountiful, and also the Land Northward;"},{"time":465.416,"text":"37. But behold, he met with a disappointment by being repulsed by Teancum and his men, for they were great warriors; For every man of Teancum did exceed the Lamanites in their strength and in their skill of war, Insomuch that they did gain advantage over the Lamanites."},{"time":481.04,"text":"38. And it came to pass that they did harass them, Insomuch that they did slay them, even until it was dark."},{"time":489.015,"text":"39. And it came to pass that Teancum and his men did pitch their tents in the borders of the Land Bountiful; And Amalickiah did pitch his tents in the borders on the beach by the seashore. And after this manner were they driven."},{"time":506.435,"text":"40. And it came to pass that when the night had come, Teancum and his servant stole forth and went out by night and went into the camp of Amalickiah; And behold, sleep had overpowered them because of their much fatigue which was caused by the labors and heat of the day."},{"time":522.735,"text":"41. And it came to pass that Teancum stole privily into the tent of the king and put a javelin to his heart; And he did cause the death of the king immediately, that he did not awake his servants."},{"time":529.591,"text":"42. And he returned again privily to his own camp, And behold, his men were asleep; And he awoke them and told them all the things that he had done."},{"time":539.92,"text":"43. And he caused that his armies should stand in readiness, lest the Lamanites had awoke and should come upon them."},{"time":546.211,"text":"44. And thus ended the twenty and fifth year of the reign of the judges over the people of Nephi. And thus ended the days of Amalickiah."}]
};
