  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 6"},{"time":6.92,"text":"1. And now it came to pass that when Jesus had spoken these words, He looked upon the twelve whom He had chosen and saith unto them: \"Remember the words which I have spoken,"},{"time":13.84,"text":"2. For behold, ye are they which I have chosen to minister unto this people."},{"time":19.68,"text":"3. \"Therefore I say unto you, take no thought for your life, what ye shall eat or what ye shall drink, Nor yet for your body, what ye shall put on; Is not the life more than meat and the body than raiment?"},{"time":32.017,"text":"4. Behold the fowls of the air, for they sow not, neither do they reap, nor gather into barns, Yet your heavenly Father feedeth them; Are ye not much better than they?"},{"time":44.72,"text":"5. \"Which of you by taking thought can add one cubit unto his stature?"},{"time":48.96,"text":"6. And why take ye thought for raiment? Consider the lilies of the field, how they grow - they toil not, neither do they spin -"},{"time":58.708,"text":"7. And yet I say unto you that even Solomon in all his glory was not arrayed like one of these;"},{"time":66.093,"text":"8. Wherefore, if God so clothe the grass of the field, which today is, and tomorrow is cast into the oven, Even so will He clothe you, if ye are not of little faith."},{"time":76.8,"text":"9. \"Therefore, take no thought, saying, 'What shall we eat?' or 'What shall we drink?' or 'Wherewithal shall we be clothed?'"},{"time":86.504,"text":"10. For your heavenly Father knoweth that ye have need of all these things;"},{"time":92.56,"text":"11. But seek ye first the kingdom of God and His righteousness, And all these things shall be added unto you;"},{"time":99.426,"text":"12. Take, therefore, no thought for the morrow, For the morrow shall take thought for the things of itself; Sufficient is the day unto the evil thereof.\""},{"time":111.44,"text":"13. And now it came to pass that when Jesus had spoken these words, He turned again to the multitude and He did open His mouth unto them again, saying: \"Verily, verily I say unto you, judge not that ye be not judged;"},{"time":125.614,"text":"14. For with what judgment ye judge, ye shall be judged, And with what measure ye mete, it shall be measured to you again;"},{"time":134.32,"text":"15. And why beholdest thou the mote that is in thy brother's eye, But considerest not the beam that is in thine own eye?"},{"time":141.004,"text":"16. Or how wilt thou say to thy brother, 'Let me pull out the mote out of thine eye, ' and behold, a beam is in thine own eye?"},{"time":150.251,"text":"17. Thou hypocrite! First cast out the beam out of thine own eye, And then shalt thou see clearly to cast out the mote out of thy brother's eye."},{"time":160.56,"text":"18. \"Give not that which is holy unto the dogs, Neither cast ye your pearls before swine, lest they trample them under their feet and turn again and rend you."},{"time":170.8,"text":"19. \"Ask, and it shall be given unto you, Seek, and ye shall find, Knock, and it shall be opened unto you;"},{"time":177.92,"text":"20. For everyone that asketh, receiveth, And he that seeketh, findeth, And to him that knocketh, it shall be opened."},{"time":185.569,"text":"21. \"Or what man is there of you who, if his son ask bread, will he give him a stone?"},{"time":192.64,"text":"22. Or if he ask a fish, will he give him a serpent?"},{"time":196.698,"text":"23. If ye then, being evil, know how to give good gifts unto your children, How much more shall your Father which is in heaven give good things to them that ask Him!"},{"time":209.27,"text":"24. Therefore, all things whatsoever ye would that men should do to you, do ye even so to them, For this is the law and the prophets."},{"time":218.8,"text":"25. \"Enter ye in at the strait gate, For wide is the gate and broad is the way that leadeth to destruction, And many there be which go in thereat;"},{"time":227.211,"text":"26. Because strait is the gate and narrow is the way which leadeth unto life, And few there be that find it."},{"time":235.621,"text":"27. \"Beware of false prophets which come to you in sheep's clothing, but inwardly they are ravening wolves;"},{"time":242.165,"text":"28. Ye shall know them by their fruits - Do men gather grapes of thorns, or figs of thistles?"},{"time":249.346,"text":"29. Even so, every good tree bringeth forth good fruit, but a corrupt tree bringeth forth evil fruit;"},{"time":256.565,"text":"30. A good tree cannot bring forth evil fruit, neither a corrupt tree bring forth good fruit;"},{"time":263.48,"text":"31. Every tree that bringeth not forth good fruit is hewn down and cast into the fire;"},{"time":270.636,"text":"32. Wherefore, by their fruits ye shall know them."},{"time":277.379,"text":"33. \"Not everyone that saith unto Me, 'Lord, Lord, ' shall enter into the kingdom of heaven, but he that doeth the will of My Father which is in heaven;"},{"time":284.122,"text":"34. Many will say to Me in that day, 'Lord, Lord, have we not prophesied in Thy name? And in Thy name have cast out devils? And in Thy name done many wonderful works?'"},{"time":297.086,"text":"35. And then will I profess unto them, 'I never knew you; Depart from Me, ye that work iniquity.'"},{"time":307.367,"text":"36. \"Therefore, whoso heareth these sayings of Mine and doeth them, I will liken him unto a wise man which built his house upon a rock - And the rain descended and the floods came, And the winds blew and beat upon that house, And it fell not, for it was founded upon a rock;"},{"time":328.004,"text":"37. And everyone that heareth these sayings of Mine and doeth them not shall be likened unto a foolish man which built his house upon the sand - And the rain descended and the floods came, And the winds blew and beat upon that house, And it fell and great was the fall of it.\""}]
