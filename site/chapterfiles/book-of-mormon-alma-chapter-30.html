  lyrics: [{"time":0.0,"text":"Alma Chapter 30"},{"time":6.962,"text":"1. And it came to pass in the commencement of the thirty and sixth year of the reign of the judges over the people of Nephi, That Shiblon took possession of those sacred things which had been delivered unto Helaman by Alma;"},{"time":13.924,"text":"2. And he was a just man, And he did walk uprightly before God, And he did observe to do good continually, to keep the commandments of the Lord his God, and also did his brother."},{"time":26.429,"text":"3. And it came to pass that Moroni died also;"},{"time":30.8,"text":"4. And thus ended the thirty and sixth year of the reign of the judges."},{"time":35.28,"text":"5. And it came to pass that in the thirty and seventh year of the reign of the judges, There was a large company of men - even to the amount of five thousand and four hundred men, with their wives and their children - departed out of the Land of Zarahemla into the land which was northward."},{"time":52.543,"text":"6. And it came to pass that Hagoth, he being an exceeding curious man, Therefore, he went forth and built him an exceeding large ship on the borders of the Land Bountiful, by the Land Desolation, And launched it forth into the West Sea, by the Narrow Neck which led into the Land Northward."},{"time":70.969,"text":"7. And behold, there were many of the Nephites which did enter therein and did sail forth with much provisions, and also many women and children; And they took their course northward;"},{"time":82.66,"text":"8. And thus ended the thirty and seventh year."},{"time":86.067,"text":"9. And in the thirty and eighth year, this man built other ships;"},{"time":91.667,"text":"10. And the first ship did also return and many more people did enter into it; And they also took much provisions and set out again to the Land Northward."},{"time":101.36,"text":"11. And it came to pass that they were never heard of more, And we suppose that they are drowned up in the depths of the sea."},{"time":109.314,"text":"12. And it came to pass that one other ship also did sail forth, And whither she did go, we know not."},{"time":116.217,"text":"13. And it came to pass that in this year, there were many people which went forth into the Land Northward; And thus ended the thirty and eighth year."},{"time":125.297,"text":"14. And it came to pass in the thirty and ninth year of the reign of the judges, Shiblon died also; And Coreanton had gone forth to the Land Northward in a ship, to carry forth provisions unto those people which had gone forth into that land;"},{"time":141.52,"text":"15. Therefore, it became expedient for Shiblon to confer those sacred things before his death upon the son of Helaman, whose name was called Helaman, being called after the name of his father."},{"time":153.68,"text":"16. Now behold, all those engravings which were in the possession of Helaman were written and sent forth among the children of men throughout all the land, save it were those parts which had been commanded by Alma should not go forth."},{"time":167.181,"text":"17. Nevertheless, these things were to be kept sacred and handed down from one generation to another; Therefore, in this year they had been conferred upon Helaman before the death of Shiblon."},{"time":178.52,"text":"18. And it came to pass also in this year that there were some dissenters which had gone forth unto the Lamanites; And they were stirred up again to anger against the Nephites."},{"time":189.103,"text":"19. And also in this same year, they came down with a numerous army to war against the people of Moronihah, or against the army of Moronihah, In the which they were beaten and driven back again to their own lands, suffering great loss."},{"time":204.72,"text":"20. And thus ended the thirty and ninth year of the reign of the judges over the people of Nephi."},{"time":210.16,"text":"21. And thus ended the account of Alma and Helaman, his son, and also Shiblon, which was his son."}]
