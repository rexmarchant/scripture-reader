  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 11"},{"time":6.375,"text":"1. And now it came to pass that when Jesus had expounded all the scriptures in one which they had written, He commanded them that they should teach the things which He had expounded unto them."},{"time":12.749,"text":"2. And it came to pass that He commanded them that they should write the words which the Father had given unto Malachi, which He should tell unto them."},{"time":21.622,"text":"3. And it came to pass that after they were written, He expounded them;"},{"time":26.427,"text":"4. And these are the words which He did tell unto them, saying: \"Thus said the Father unto Malachi: ' Behold, I will send My messenger, And he shall prepare the way before Me, And the Lord, whom ye seek shall suddenly come to His temple, Even the Messenger of the covenant whom ye delight in - Behold, He shall come, ' saith the Lord of Hosts."},{"time":48.04,"text":"5. 'But who may abide the day of His coming? And who shall stand when He appeareth? For He is like a refiner's fire and like fuller's soap."},{"time":58.516,"text":"6. And He shall sit as a refiner and purifier of silver; And He shall purify the sons of Levi and purge them as gold and silver, That they may offer unto the Lord an offering in righteousness."},{"time":71.6,"text":"7. 'Then shall the offering of Judah and Jerusalem be pleasant unto the Lord, As in the days of old, And as in former years."},{"time":79.261,"text":"8. And I will come near to you to judgment; And I will be a swift witness against the sorcerers, And against the adulterers, And against false swearers, And against those that oppress the hireling in his wages, the widow and the fatherless, And that turn aside the stranger and fear not Me, ' saith the Lord of Hosts."},{"time":99.102,"text":"9. 'For I Am the Lord, I change not; Therefore, ye sons of Jacob are not consumed."},{"time":105.304,"text":"10. Even from the days of your fathers ye are gone away from Mine ordinances and have not kept them. Return unto Me, and I will return unto you, ' saith the Lord of Hosts. 'But ye say, \"Wherein shall we return?\""},{"time":121.525,"text":"11. 'Will a man rob God? Yet ye have robbed Me! But ye say, \"Wherein have we robbed Thee?\" In tithes and offerings."},{"time":132.0,"text":"12. Ye are cursed with a curse, for ye have robbed Me, even this whole nation."},{"time":139.12,"text":"13. 'Bring ye all the tithes into the storehouse, that there may be meat in My house, And prove Me now herewith, ' saith the Lord of Hosts, 'If I will not open you the windows of heaven And pour you out a blessing that there shall not be room enough to receive it."},{"time":154.08,"text":"14. ' And I will rebuke the devourer for your sakes - He shall not destroy the fruits of your ground, Neither shall your vine cast her fruit before the time in the field, ' saith the Lord of Hosts;"},{"time":165.76,"text":"15. 'And all nations shall call you blessed, For ye shall be a delightsome land, ' saith the Lord of Hosts."},{"time":173.44,"text":"16. 'Your words have been stout against Me, ' saith the Lord, 'Yet ye say, \"What have we spoken against Thee?\""},{"time":181.04,"text":"17. Ye have said, \"It is vain to serve God; And what doth it profit that we have kept His ordinances, And that we have walked mournfully before the Lord of Hosts?"},{"time":191.52,"text":"18. And now we call the proud happy, Yea, they that work wickedness are set up; Yea, them that tempt God are even delivered.\""},{"time":200.034,"text":"19. 'Then they that feared the Lord spake often one to another, And the Lord hearkened and heard; And a book of remembrance was written before Him for them that feared the Lord and that thought upon His name."},{"time":212.6,"text":"20. 'And they shall be Mine, ' saith the Lord of Hosts, 'In that day when I make up My jewels. And I will spare them as a man spareth his own son that serveth him."},{"time":223.66,"text":"21. Then shall ye return and discern between the righteous and the wicked - Between him that serveth God and him that serveth Him not."},{"time":233.36,"text":"22. 'For behold, the day cometh that shall burn as an oven; And all the proud, yea, and all that do wickedly, shall be stubble. And the day that cometh shall burn them up, ' saith the Lord of Hosts, 'That it shall leave them neither root nor branch."},{"time":250.48,"text":"23. 'But unto you that fear My name shall the Son of Righteousness arise with healing in His wings; And ye shall go forth and grow up as calves of the stall."},{"time":260.448,"text":"24. And ye shall tread down the wicked, For they shall be as ashes under the soles of your feet in the day that I shall do this, ' saith the Lord of Hosts."},{"time":269.452,"text":"25. 'Remember ye the law of Moses My servant, which I commanded unto him in Horeb for all Israel with the statutes and judgments."},{"time":279.12,"text":"26. Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the Lord."},{"time":285.216,"text":"27. And he shall turn the heart of the fathers to the children and the heart of the children to their fathers, Lest I come and smite the earth with a curse.'\""},{"time":294.939,"text":"28. And now it came to pass that when Jesus had told these things, He expounded them unto the multitude, And He did expound all things unto them, both great and small;"},{"time":305.64,"text":"29. And He saith: \"These scriptures which ye had not with you, the Father commanded that I should give unto you, For it was wisdom in Him that they should be given unto future generations.\""},{"time":316.89,"text":"30. And He did expound all things, even from the beginning until the time that He should come in His glory;"},{"time":324.756,"text":"31. Yea, even all things which should come upon the face of the earth, even until the elements should melt with fervent heat, And the earth should be wrapped together as a scroll, And the heaven and the earth should pass away;"},{"time":338.063,"text":"32. And even unto the great and last day when all people and all kindreds and all nations and tongues shall stand before God to be judged of their works, whether they be good or whether they be evil -"},{"time":350.088,"text":"33. If they be good, to the resurrection of everlasting life, And if they be evil, to the resurrection of damnation, Being on a parallel, the one on the one hand, and the other on the other hand - According to the mercy and the justice and the holiness which is in Christ, which was before the world began."}]
