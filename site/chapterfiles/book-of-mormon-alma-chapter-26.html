<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 26",
  audioSrc: "https://archive.org/download/alma-ch-26/Alma%20Ch%2026.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 26"},{"time":8.044,"text":"1. And now it came to pass in the commencement of the thirtieth year of the reign of the judges, in the second day on the first month, Moroni received an epistle from Helaman stating the affairs of the people in that quarter of the land."},{"time":16.088,"text":"2. And these are the words which he wrote, saying: \"My dearly beloved brother Moroni, as well in the Lord as in the tribulations of our warfare, Behold, my beloved brother, I have somewhat to tell you concerning our warfare in this part of the land."},{"time":31.493,"text":"3. \"Behold, two thousand of the sons of those men which Ammon brought down out of the Land of Nephi -"},{"time":38.766,"text":"4. Now ye have known that these were a descendant of Laman which was the eldest son of our father Lehi -"},{"time":46.16,"text":"5. Now I need not rehearse unto you concerning their traditions or their unbelief, for thou knowest concerning all these things - Therefore, it sufficeth me that I tell you that two thousand of these young men hath taken their weapons of war and would that I should be their leader; And we have come forth to defend our country."},{"time":59.671,"text":"6. \"And now ye also know concerning the covenant which their fathers made that they would not take up their weapons of war against their brethren to shed blood;"},{"time":73.182,"text":"7. But in the twenty and sixth year, when they saw our afflictions and our tribulations for them, they were about to break the covenant which they had made and take up their weapons of war in our defense;"},{"time":84.96,"text":"8. But I would not suffer them that they should break this covenant which they had made, Supposing that God would strengthen us insomuch that we should not suffer more because of the fulfilling the oath which they had taken."},{"time":98.471,"text":"9. \"But behold, here is one thing in which we may have great joy -"},{"time":103.525,"text":"10. For behold, in the twenty and sixth year, I, Helaman, did march at the head of these two thousand young men to the City of Judeah, to assist Antipus whom ye had appointed a leader over the people of that part of the land;"},{"time":117.818,"text":"11. And I did join my two thousand sons - for they are worthy to be called sons - to the army of Antipus, in the which strength Antipus did rejoice exceedingly; For behold, his army had been reduced by the Lamanites because of the numerosity of their forces, having slain a vast number of our men, for which cause we have to mourn;"},{"time":132.723,"text":"12. Nevertheless, we may console ourselves in this point - that they have died in the cause of their country and of their God, yea, and they are happy."},{"time":147.628,"text":"13. \"And the Lamanites had also retained many prisoners, all of whom are chief captains, for none other have they spared alive;"},{"time":156.353,"text":"14. And we suppose that they are now at this time in the Land of Nephi; It is so, if they are not slain."},{"time":164.32,"text":"15. \"And now these are the cities which the Lamanites have obtained possession by the shedding of the blood of so many of our valiant men - The Land of Manti, or the City of Manti, and the City of Zeezrom, and the City of Cumeni, and the City of Antiparah -"},{"time":179.92,"text":"16. And these are the cities which they possessed when I arrived at the City of Judeah. \"And I found Antipus and his men toiling with their mights to fortify the city;"},{"time":190.96,"text":"17. Yea, and they were depressed in body as well as in spirit, For they had fought valiantly by day and toiled by night to maintain their cities; And thus they had suffered great afflictions of every kind."},{"time":203.44,"text":"18. \"And now they were determined to conquer in this place, or die; Therefore, you may well suppose that this little force which I brought with me, yea, those sons of mine, gave them great hopes and much joy."},{"time":217.84,"text":"19. \"And now it came to pass that when the Lamanites saw that Antipus had received a greater strength to his army, They were compelled, by the orders of Ammaron, to not come against the City of Judeah, or against us to battle."},{"time":230.484,"text":"20. \"And thus were we favored of the Lord, For had they come upon us in this our weakness, they might have perhaps destroyed our little army; But thus were we favored -"},{"time":241.36,"text":"21. They were commanded by Ammaron to maintain those cities which they had taken.\"And thus ended the twenty and sixth year."},{"time":250.4,"text":"22. \"And in the commencement of the twenty and seventh year, We had prepared our city and ourselves for defense;"},{"time":257.76,"text":"23. Now we were desirous that the Lamanites should come upon us, For we were not desirous to make an attack upon them in their stronghold."},{"time":265.507,"text":"24. \"And it came to pass that we kept spies out round about to watch the movements of the Lamanites, That they might not pass us by night nor by day to make an attack upon our other cities which were on the northward;"},{"time":278.32,"text":"25. For we knew in those cities they were not sufficiently strong to meet them; Therefore, we were desirous - if they should pass by us - to fall upon them in their rear, And thus bring them up in the rear at the same time they were met in the front;"},{"time":293.685,"text":"26. We supposed that we could overpower them. \"But behold, we were disappointed in this our desire -"},{"time":300.96,"text":"27. They durst not pass by us with their whole army; Neither durst they with a part, lest they should not be sufficiently strong and they should fall;"},{"time":310.08,"text":"28. Neither durst they march down against the City of Zarahemla; Neither durst they cross the head of Sidon over to the City of Nephihah;"},{"time":318.44,"text":"29. And thus, with their forces, they were determined to maintain those cities which they had taken."},{"time":324.464,"text":"30. \"And now it came to pass in the second month of this year, there was brought unto us many provisions from the fathers of those my two thousand sons;"},{"time":335.44,"text":"31. And also there were sent unto us two thousand men from the Land of Zarahemla;"},{"time":341.36,"text":"32. And thus we were prepared with ten thousand men and provisions for them, And also for their wives and their children."},{"time":348.669,"text":"33. \"And the Lamanites, thus seeing our forces increase daily and provisions arrive for our support, They began to be fearful and began to sally forth, if it were possible to put an end to our receiving provisions and strength."},{"time":362.223,"text":"34. \"Now when we saw that the Lamanites began to grow uneasy on this wise, we were desirous to bring a stratagem into an effect upon them;"},{"time":372.612,"text":"35. Therefore, Antipus ordered that I should march forth with my little sons to a neighboring city, as if we were carrying provisions to a neighboring city;"},{"time":381.461,"text":"36. And we were to march near the City Antiparah, as if we were going to the city beyond, in the borders by the seashore."},{"time":389.58,"text":"37. \"And it came to pass that we did march forth as if, with our provisions, to go to that city."},{"time":396.057,"text":"38. \"And it came to pass that Antipus did march forth with a part of his army, leaving the remainder to maintain the city;"},{"time":404.64,"text":"39. But he did not march forth until I had gone forth with my little army and came near the City Antiparah;"},{"time":410.56,"text":"40. And now in the City Antiparah, were stationed the strongest army of the Lamanites, yea, the most numerous."},{"time":418.827,"text":"41. \"And it came to pass that when they had been informed by their spies, They came forth with their army and marched against us."},{"time":427.573,"text":"42. \"And it came to pass that we did flee before them, northward."},{"time":431.859,"text":"43. \"And thus we did lead away the most powerful army of the Lamanites, yea, even to a considerable distance, Insomuch that when they saw the army of Antipus pursuing them with their mights, they did not turn to the right nor to the left, But pursued their march in a straight course after us,"},{"time":449.904,"text":"44. And as we suppose, that it was their intent to slay us before Antipus should overtake them, And this that they might not be surrounded by our people."},{"time":460.16,"text":"45. \"And now Antipus, beholding our danger, did speed the march of his army;"},{"time":466.608,"text":"46. But behold, it was night, Therefore, they did not overtake us; Neither did Antipus overtake them, Therefore, we did camp for the night."},{"time":476.126,"text":"47. \"And it came to pass that before the dawn of the morning, behold, the Lamanites were pursuing us;"},{"time":482.785,"text":"48. Now we were not sufficiently strong to contend with them; Yea, I would not suffer that my little sons should fall into their hands; Therefore, we did continue our march and we took our march into the wilderness."},{"time":499.403,"text":"49. \"Now they durst not turn to the right nor to the left, lest they should be surrounded; Neither would I turn to the right or to the left, lest they should overtake me and we could not stand against them, but be slain, And they would make their escape.\"And thus we did flee all that day into the wilderness, even until it was dark."},{"time":516.02,"text":"50. \"And it came to pass that again when the light of the morning came, we saw the Lamanites upon us, And we did flee before them;"},{"time":524.98,"text":"51. But it came to pass that they did not pursue us far before they halted; And it was in the morning of the third day on the seventh month."},{"time":532.577,"text":"52. \"And now whether they were overtaken by Antipus, we knew not; But I said unto my men: 'Behold, we know not but they have halted for the purpose that we should come against them, that they might catch us in their snare; Therefore, what say ye, my sons? Will ye go against them to battle?'"},{"time":552.168,"text":"53. \"And now I say unto you, my beloved brother Moroni, that never had I seen so great courage, nay, not amongst all the Nephites;"},{"time":561.68,"text":"54. For as I had ever called them my sons - for they were all of them very young - even so they said unto me: ' Father, behold, our God is with us and He will not suffer that we shall fall, Then let us go forth;"},{"time":576.514,"text":"55. We would not slay our brethren if they would let us alone; Therefore, let us go lest they should overpower the army of Antipus.'"},{"time":585.369,"text":"56. \"Now they never had fought, yet they did not fear death; And they did think more upon the liberty of their fathers than they did upon their lives; Yea, they had been taught by their mothers that if they did not doubt, that God would deliver them;"},{"time":599.625,"text":"57. And they rehearsed unto me the words of their mothers, saying: 'We do not doubt our mothers knew.'"},{"time":606.292,"text":"58. \"And it came to pass that I did return with my two thousand against these Lamanites which had pursued us."},{"time":613.48,"text":"59. \"And now behold, the armies of Antipus had overtaken them and a terrible battle had commenced;"},{"time":620.64,"text":"60. The army of Antipus, being weary because of their long march in so short a space of time, were about to fall into the hands of the Lamanites; And had I not returned with my two thousand, they would have obtained their purpose,"},{"time":635.2,"text":"61. For Antipus had fallen by the sword, and many of his leaders because of their weariness which was occasioned by the speed of their march; Therefore, the men of Antipus, being confused because of the fall of their leaders, began to give way before the Lamanites."},{"time":650.187,"text":"62. \"And it came to pass that the Lamanites took courage and began to pursue them; And thus were the Lamanites pursuing them with great vigor when Helaman came upon their rear with his two thousand and began to slay them exceedingly, Insomuch that the whole army of the Lamanites halted and turned upon Helaman."},{"time":669.2,"text":"63. \"Now when the people of Antipus saw that the Lamanites had turned them about, They gathered together their men and came again upon the rear of the Lamanites."},{"time":678.64,"text":"64. \"And now it came to pass that we - the people of Nephi, the people of Antipus and I with my two thousand - did surround the Lamanites and did slay them, Yea, insomuch that they were compelled to deliver up their weapons of war, and also themselves as prisoners of war."},{"time":695.129,"text":"65. \"And now it came to pass that when they had surrendered themselves up unto us, Behold, I numbered those young men which had fought with me, fearing lest there were many of them slain;"},{"time":707.326,"text":"66. But behold, to my great joy, there had not one soul of them fallen to the earth! Yea, and they had fought as if with the strength of God; Yea, never were men known to have fought with such miraculous strength;"},{"time":722.32,"text":"67. And with such mighty power did they fall upon the Lamanites that they did frighten them; And for this cause did the Lamanites deliver themselves up as prisoners of war."},{"time":732.72,"text":"68. \"And as we had no place for our prisoners that we could guard them to keep them from the armies of the Lamanites, Therefore, we sent them to the Land of Zarahemla - and a part of those men which were not slain of Antipus with them -"},{"time":745.236,"text":"69. And the remainder I took and joined them to my stripling Ammonites and took our march back to the City of Judeah."},{"time":752.674,"text":"70. \"And now it came to pass that I received an epistle from Ammaron, the king, Stating that if I would deliver up those prisoners of war which we had taken, that he would deliver up the City of Antiparah."},{"time":765.56,"text":"71. \"But I sent an epistle unto the king that we were sure our forces were sufficient to take the City of Antiparah by our force; And by delivering up the prisoners for that city, we should suppose ourselves unwise, And that we would only deliver up our prisoners on exchange."},{"time":778.207,"text":"72. \"And Ammaron refused mine epistle, for he would not exchange prisoners; Therefore, we began to make preparations to go against the City of Antiparah;"},{"time":790.853,"text":"73. But the people of Antiparah did leave the city and fled to their other cities which they had possession of, to fortify them; And thus the City of Antiparah fell into our hands."},{"time":802.96,"text":"74. \"And thus ended the twenty and eighth year of the reign of the judges."},{"time":815.84,"text":"75. \"And it came to pass that in the commencement of the twenty and ninth year, We received a supply of provisions, and also an addition to our army, from the Land of Zarahemla and from the land round about, To the number of six thousand men, besides sixty of the sons of the Ammonites which had come to join their brethren, my little band of two thousand."},{"time":828.72,"text":"76. \"And now behold, we were strong; Yea, and we had also a plenty of provisions brought to us."},{"time":836.56,"text":"77. \"And it came to pass that it was our desire to wage a battle with the army which was placed to protect the City Cumeni."},{"time":843.021,"text":"78. \"And now behold, I will show unto you that we soon accomplished our desire; Yea, with our strong force, or with a part of our strong force, we did surround by night the City Cumeni a little before they were to receive a supply of provisions."},{"time":859.234,"text":"79. \"And it came to pass that we did camp round about the city for many nights; But we did sleep upon our swords and keep guards, that the Lamanites could not come upon us by night and slay us, which they attempted many times; But as many times as they attempted this, their blood was spilt."},{"time":876.701,"text":"80. \"At length their provisions did arrive, And they were about to enter the city by night;"},{"time":883.115,"text":"81. And we, instead of being Lamanites, were Nephites, therefore, we did take them and their provisions;"},{"time":890.743,"text":"82. And notwithstanding the Lamanites being cut off from their support, after this manner, they were still determined to maintain the city;"},{"time":899.76,"text":"83. Therefore, it became expedient that we should take those provisions and send them to Judeah and our prisoners to the Land of Zarahemla."},{"time":907.956,"text":"84. \"And it came to pass that not many days had passed away before the Lamanites began to lose all hopes of succor; Therefore, they yielded up the city into our hands.\"And thus we had accomplished our designs in obtaining the City Cumeni."},{"time":922.896,"text":"85. \"But it came to pass that our prisoners were so numerous that, notwithstanding the enormity of our number, We were obliged to employ all our force to keep them or put them to death."},{"time":934.876,"text":"86. \"For behold, they would break out in great numbers and would fight with stones and with clubs or whatsoever thing they could get into their hands, Insomuch that we did slay upwards of two thousand of them after they had surrendered themselves prisoners of war;"},{"time":949.44,"text":"87. Therefore, it became expedient for us that we should put an end to their lives, Or guard them, sword in hand, down to the Land of Zarahemla;"},{"time":958.36,"text":"88. And also our provisions were not any more than sufficient for our own people, Notwithstanding that which we had taken from the Lamanites."},{"time":968.16,"text":"89. \"And now in those critical circumstances, it became a very serious matter to determine concerning these prisoners of war, Nevertheless, we did resolve to send them down to the Land of Zarahemla;"},{"time":980.627,"text":"90. Therefore, we selected a part of our men and gave them charge over our prisoners to go down to the Land of Zarahemla.\"But it came to pass that on the morrow, they did return;"},{"time":994.32,"text":"91. And now behold, we did not inquire of them concerning the prisoners, For behold, the Lamanites were upon us, And they returned in season to save us from falling into their hands;"},{"time":1003.864,"text":"92. For behold, Ammaron had sent to their support a new supply of provisions, and also a numerous army of men;"},{"time":1013.408,"text":"93. And it came to pass that those men which we sent with the prisoners did arrive in season to check them as they were about to overpower us."},{"time":1022.501,"text":"94. \"But behold, my little band of two thousand and sixty fought most desperately, Yea, they were firm before the Lamanites and did administer death unto all those who opposed them;"},{"time":1033.625,"text":"95. And as the remainder of our army were about to give way before the Lamanites, Behold, these two thousand and sixty were firm and undaunted, Yea, and they did obey and observe to perform every word of command with exactness,"},{"time":1049.402,"text":"96. Yea, and even according to their faith, it was done unto them; And I did remember the words which they said unto me that their mothers had taught them."},{"time":1058.489,"text":"97. \"And now behold, it was these - my sons and those men which had been selected to convey the prisoners - to whom we owe this great victory, For it was they who did beat the Lamanites; Therefore, they were driven back to the City of Manti,"},{"time":1074.226,"text":"98. And we retained our City Cumeni and were not all destroyed by the sword; Nevertheless, we had suffered great loss."},{"time":1083.36,"text":"99. \"And it came to pass that after the Lamanites had fled, I immediately gave orders that my men which had been wounded should be taken from among the dead and caused that their wounds should be dressed."},{"time":1093.76,"text":"100. \"And it came to pass that there were two hundred out of my two thousand and sixty which had fainted because of the loss of blood;"},{"time":1102.98,"text":"101. Nevertheless, according to the goodness of God - and to our great astonishment, and also the joy of our whole army - there was not one soul of them which did perish, Yea, and neither was there one soul among them which had not received many wounds;"},{"time":1118.48,"text":"102. And now, their preservation was astonishing to our whole army, Yea, that they should be spared while there was a thousand of our brethren which were slain."},{"time":1127.874,"text":"103. \"And we do justly ascribe it to the miraculous power of God, because of their exceeding faith in that which they had been taught to believe - That there was a just God, And whosoever did not doubt, that they should be preserved by His marvelous power."},{"time":1141.651,"text":"104. \"Now this was the faith of these of which I have spoken; They are young and their minds are firm, And they do put their trust in God continually."},{"time":1151.668,"text":"105. \"And now it came to pass that after we had thus taken care of our wounded men and had buried our dead, and also the dead of the Lamanites, which were many, Behold, we did inquire of Gid concerning the prisoners which they had started to go down to the Land of Zarahemla with;"},{"time":1168.651,"text":"106. Now Gid was the chief captain over the band which was appointed to guard them down to that land."},{"time":1174.973,"text":"107. \"And now, these are the words which Gid said unto me: 'Behold, we did start to go down to the Land of Zarahemla with our prisoners;"},{"time":1185.091,"text":"108. And it came to pass that we did meet the spies of our armies which had been sent out to watch the camp of the Lamanites,"},{"time":1191.92,"text":"109. And they cried unto us, saying: \"Behold, the armies of the Lamanites are a marching toward the City of Cumeni; And behold, they will fall upon them and will destroy our people!\""},{"time":1205.2,"text":"110. 'And it came to pass that our prisoners did hear their cries, which caused them to take courage; And they did raise up in rebellion against us."},{"time":1213.72,"text":"111. 'And it came to pass because of their rebellion, we did cause that our swords should come upon them."},{"time":1220.08,"text":"112. 'And it came to pass that they did, in a body, run upon our swords, in the which the greater number of them were slain, And the remainder of them broke through and fled from us."},{"time":1231.255,"text":"113. 'And behold, when they had fled and we could not overtake them, we took our march with speed toward the City Cumeni; And behold, we did arrive in time that we might assist our brethren in preserving the city."},{"time":1244.885,"text":"114. 'And behold, we are again delivered out of the hands of our enemies;"},{"time":1250.122,"text":"115. And blessed is the name of our God! For behold, it is He that hath delivered us, yea, that hath done this great thing for us.'"},{"time":1260.324,"text":"116. \"Now it came to pass that when I, Helaman, had heard these words of Gid, I was filled with exceeding joy, Because of the goodness of God in preserving us that we might not all perish;"},{"time":1272.347,"text":"117. Yea, and I trust that the souls of them which have been slain have entered into the rest of their God."},{"time":1279.316,"text":"118. \"And behold, now it came to pass that our next object was to obtain the City of Manti; But behold, there was no way that we could lead them out of the city by our small bands,"},{"time":1290.945,"text":"119. For behold, they remembered that which we had hitherto done; Therefore, we could not decoy them away from their strongholds;"},{"time":1299.955,"text":"120. And they were so exceeding more numerous than was our army that we durst not go forth and attack them in their strongholds."},{"time":1308.889,"text":"121. \"Yea, and it became expedient that we should employ our men to the maintaining those parts of the land of the which we had retained of our possessions;"},{"time":1317.7,"text":"122. Therefore, it became expedient that we should wait, that we might receive more strength from the Land of Zarahemla, and also a new supply of provisions."},{"time":1328.64,"text":"123. \"And it came to pass that I thus did send an embassy to the great governor of our land, to acquaint him concerning the affairs of our people."},{"time":1336.282,"text":"124. \"And it came to pass that we did wait to receive provisions and strength from the Land of Zarahemla;"},{"time":1344.092,"text":"125. But behold, this did not profit us but little, For the Lamanites were also receiving great strength from day to day, and also many provisions. \"And thus were our circumstances at this period of time."},{"time":1358.32,"text":"126. \"And the Lamanites were sallying forth against us from time to time, resolving by stratagem to destroy us; Nevertheless, we could not come to battle with them, because of their retreats and their strongholds."},{"time":1369.642,"text":"127. \"And it came to pass that we did wait in these difficult circumstances for the space of many months, even until we were about to perish for the want of food."},{"time":1381.2,"text":"128. \"But it came to pass that we did receive food which was guarded to us by an army of two thousand men, to our assistance;"},{"time":1388.226,"text":"129. And this is all the assistance which we did receive, to defend ourselves and our country from falling into the hands of our enemies, yea, to contend with an enemy which was innumerable."},{"time":1400.042,"text":"130. \"And now the cause of these our embarrassments, or the cause why they did not send more strength unto us, we knew not; Therefore, we were grieved, and also filled with fear, lest by any means the judgments of God should come upon our land to our overthrow and utter destruction;"},{"time":1417.716,"text":"131. Therefore, we did pour out our souls in prayer to God that He would strengthen us and deliver us out of the hands of our enemies, Yea, and also give us strength that we might retain our cities and our lands and our possessions for the support of our people."},{"time":1434.48,"text":"132. \"Yea, and it came to pass that the Lord our God did visit us with assurances that He would deliver us, Yea, insomuch that He did speak peace to our souls and did grant unto us great faith and did cause us that we should hope for our deliverance in Him;"},{"time":1449.712,"text":"133. And we did take courage with our small force which we had received, And were fixed with a determination to conquer our enemies and to maintain our lands and our possessions and our wives and our children and the cause of our liberty."},{"time":1464.24,"text":"134. \"And thus we did go forth with all our might against the Lamanites which were in the City of Manti; And we did pitch our tents by the wilderness side, which was near to the city."},{"time":1475.36,"text":"135. \"And it came to pass on the morrow that when the Lamanites saw that we were in the borders by the wilderness, which was near the city, That they sent out their spies round about us that they might discover the number and the strength of our army."},{"time":1487.704,"text":"136. \"And it came to pass that when they saw that we were not strong, according to our numbers, And fearing that we should cut them off from their support, except they should come out to battle against us and kill us,"},{"time":1500.654,"text":"137. And also supposing that they could easily destroy us with their numerous hosts, Therefore, they began to make preparations to come out against us to battle."},{"time":1510.051,"text":"138. \"And when we saw that they were making preparations to come out against us, Behold, I caused that Gid, with a small number of men, should secrete himself in the wilderness, And also that Teomner should with a small number of men secrete themselves also in the wilderness."},{"time":1526.376,"text":"139. \"Now Gid and his men were on the right and the others on the left; And when they had thus secreted themselves, behold, I remained with the remainder of my army in that same place where we had first pitched our tents, Against the time that the Lamanites should come out to battle."},{"time":1544.08,"text":"140. \"And it came to pass that the Lamanites did come out with their numerous army against us;"},{"time":1550.16,"text":"141. And when they had come and were about to fall upon us with the sword, I caused that my men, those which were with me, should retreat into the wilderness."},{"time":1559.253,"text":"142. \"And it came to pass that the Lamanites did follow after us with great speed, For they were exceedingly desirous to overtake us that they might slay us; Therefore, they did follow us into the wilderness;"},{"time":1571.297,"text":"143. And we did pass by in the midst of Gid and Teomner insomuch that they were not discovered by the Lamanites."},{"time":1579.14,"text":"144. \"And it came to pass that when the Lamanites had passed by, or when the army had passed by, Gid and Teomner did rise up from their secret places and did cut off the spies of the Lamanites, that they should not return to the city."},{"time":1592.495,"text":"145. \"And it came to pass that when they had cut them off, They ran to the city and fell upon the guards which were left to guard the city, insomuch that they did destroy them and did take possession of the city."},{"time":1604.507,"text":"146. \"Now this was done because the Lamanites did suffer their whole army, save a few guards only, to be led away into the wilderness."},{"time":1613.463,"text":"147. \"And it came to pass that Gid and Teomner, by this means, had obtained possession of their stronghold."},{"time":1619.973,"text":"148. \"And it came to pass that we took our course after having traveled much in the wilderness toward the Land of Zarahemla;"},{"time":1628.315,"text":"149. And when the Lamanites saw that they were marching toward the Land of Zarahemla, They were exceeding fraid, lest there was a plan laid to lead them on to destruction; Therefore, they began to retreat into the wilderness again, yea, even back by the same way which they had come."},{"time":1645.258,"text":"150. \"And behold, it was night and they did pitch their tents; For the chief captains of the Lamanites supposing that the Nephites were weary because of their march, And supposing that they had driven their whole army, Therefore, they took no thought concerning the City of Manti."},{"time":1661.192,"text":"151. \"Now it came to pass that when it was night, that I caused that my men should not sleep, But that they should march forward by another way toward the Land of Manti;"},{"time":1671.4,"text":"152. And because of this our march in the nighttime, behold, on the morrow, we were beyond the Lamanites, insomuch that we did arrive before them to the City of Manti."},{"time":1683.68,"text":"153. \"And thus it came to pass that by this stratagem, we did take possession of the City of Manti without the shedding of blood."},{"time":1690.703,"text":"154. \"And it came to pass that when the armies of the Lamanites did arrive near the city and saw that we were prepared to meet them, They were astonished exceedingly and struck with great fear, insomuch that they did flee into the wilderness."},{"time":1704.617,"text":"155. \"Yea, and it came to pass that the armies of the Lamanites did flee out of all this quarter of the land;"},{"time":1712.547,"text":"156. But behold, they have carried with them many women and children out of the land;"},{"time":1723.514,"text":"157. And those cities which had been taken by the Lamanites, all of them are at this period of time in our possession; And our fathers and our women and our children are returning to their homes, All, save it be those which have been taken prisoners and carried off by the Lamanites."},{"time":1734.48,"text":"158. \"But behold, our armies are small to maintain so great a number of cities and so great possessions."},{"time":1741.581,"text":"159. \"But behold, we trust that our God who hath given us victory over those lands, Insomuch that we have obtained those cities and those lands which were our own -"},{"time":1751.848,"text":"160. \"For we do not know the cause that the government does not grant us more strength; Neither do those men which came up unto us know why we have not received greater strength;"},{"time":1763.44,"text":"161. Behold, we do not know but what ye are unsuccessful, And ye have drawn away the forces into that quarter of the land; If so, we do not desire to murmur;"},{"time":1773.76,"text":"162. And if it is not so, behold, we fear that there is some faction in the government that they do not send more men to our assistance; For we know that they are more numerous than that which they have sent;"},{"time":1786.64,"text":"163. But behold, it mattereth not - \"We trust God will deliver us notwithstanding the weakness of our armies, Yea, and deliver us out of the hands of our enemies."},{"time":1797.141,"text":"164. \"Behold, this is the twenty and ninth year, in the latter end, And we are in the possession of our lands; And the Lamanites have fled to the Land of Nephi."},{"time":1807.463,"text":"165. \"And those sons of the people of Ammon, of which I have so highly spoken, are with me in the City of Manti; And the Lord hath supported them, yea, and kept them from falling by the sword, insomuch that even one soul hath not been slain."},{"time":1824.32,"text":"166. \"But behold, they have received many wounds; Nevertheless, they stand fast in that liberty wherewith God hath made them free;"},{"time":1832.128,"text":"167. And they are strict to remember the Lord their God from day to day; Yea, they do observe to keep His statutes and His judgments and His commandments continually; And their faith is strong in the prophecies concerning that which is to come."},{"time":1847.416,"text":"168. \"And now my beloved brother Moroni, that the Lord our God who hath redeemed us and made us free may keep you continually in His presence,"},{"time":1855.36,"text":"169. Yea, and that He may favor this people, Even that ye may have success in obtaining the possession of all that which the Lamanites hath taken from us, which was for our support."},{"time":1866.56,"text":"170. \"And now behold, I close mine epistle; I am Helaman, the son of Alma.\""}]
};
