<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",
  chapter: "Chapter 4",
  audioSrc: "https://archive.org/download/3-nephi-ch-4/3%20Nephi%20Ch%204.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 4"},{"time":7.581,"text":"1. And now it came to pass that according to our record - And we know our record to be true, For behold, it was a just man which did keep the record, For he truly did many miracles in the name of Jesus;"},{"time":15.162,"text":"2. And there was not any man which could do a miracle in the name of Jesus, save he were cleansed every whit from his iniquity -"},{"time":23.057,"text":"3. And now it came to pass - if there was no mistake made by this man in the reckoning of our time - the thirty and third year had passed away; And the people began to look with great earnestness for the sign which had been given by the prophet Samuel the Lamanite,"},{"time":38.013,"text":"4. Yea, for the time that there should be darkness for the space of three days over the face of the land;"},{"time":45.44,"text":"5. And there began to be great doubtings and disputations among the people, notwithstanding so many signs had been given."},{"time":53.204,"text":"6. And it came to pass that in the thirty and fourth year, in the first month, in the fourth day of the month, There arose a great storm, such an one as never had been known in all the land;"},{"time":65.788,"text":"7. And there was also a great and terrible tempest; And there was terrible thunder, insomuch that it did shake the whole earth as if it was about to divide asunder; And there were exceeding sharp lightnings, such as never had been known in all the land."},{"time":80.168,"text":"8. And the City of Zarahemla did take fire; And the City of Moroni did sink into the depths of the sea and the inhabitants thereof were drowned;"},{"time":90.391,"text":"9. And the earth was carried up upon the City of Moronihah, that in the place of the city thereof there became a great mountain; And there was a great and terrible destruction in the Land Southward."},{"time":102.256,"text":"10. But behold, there was a more great and terrible destruction in the Land Northward; For behold, the whole face of the land was changed because of the tempests and the whirlwinds and the thunderings and the lightnings and the exceeding great quaking of the whole earth;"},{"time":117.5,"text":"11. And the highways were broken up, And the level roads were spoiled, And many smooth places became rough, And many great and notable cities were sunk, And many were burned, And many were shook till the buildings thereof had fallen to the earth, And the inhabitants thereof were slain, And the places were left desolate."},{"time":137.28,"text":"12. And there were some cities which remained, but the damage thereof was exceeding great, And there were many in them which were slain;"},{"time":144.615,"text":"13. And there were some which were carried away in the whirlwind, And whither they went, no man knoweth, save they know that they were carried away."},{"time":154.24,"text":"14. And the face of the whole earth became deformed because of the tempests and the thunderings and the lightnings and the quaking of the earth;"},{"time":162.419,"text":"15. And behold, the rocks were rent in twain, yea, they were broken up upon the face of the whole earth, Insomuch that they were found in broken fragments and in seams and in cracks upon all the face of the land."},{"time":175.337,"text":"16. And it came to pass that when the thunderings and the lightnings and the storm and the tempest and the quakings of the earth did cease - For behold, they did last for about the space of three hours, And it was said by some that the time was greater;"},{"time":190.4,"text":"17. Nevertheless, all these great and terrible things were done in about the space of three hours - And then, behold, there was darkness upon the face of the land."},{"time":201.351,"text":"18. And it came to pass that there was thick darkness upon the face of all the land, insomuch that the inhabitants thereof which had not fallen could feel the vapor of darkness;"},{"time":212.24,"text":"19. And there could be no light because of the darkness, neither candles, neither torches; Neither could there be fire kindled with their fine and exceeding dry wood, so that there could not be any light at all;"},{"time":224.775,"text":"20. And there was not any light seen, neither fire, nor glimmer, neither the sun, nor the moon, nor the stars, For so great were the mists of darkness which were upon the face of the land."},{"time":236.545,"text":"21. And it came to pass that it did last for the space of three days, that there was no light seen; And there was great mourning and howling and weeping among all the people continually;"},{"time":246.073,"text":"22. Yea, great were the groanings of the people because of the darkness and the great destruction which had come upon them."},{"time":255.6,"text":"23. And in one place they were heard to cry, saying: \"O that we had repented before this great and terrible day! And then would our brethren have been spared, And they would not have been burned in that great City Zarahemla.\""},{"time":270.64,"text":"24. And in another place they were heard to cry and mourn, saying: \"O that we had repented before this great and terrible day and had not killed and stoned the prophets and cast them out!"},{"time":282.32,"text":"25. Then would our mothers and our fair daughters and our children have been spared and not have been buried up in that great City Moronihah.\" And thus were the howlings of the people great and terrible."},{"time":293.44,"text":"26. And it came to pass that there was a voice heard among all the inhabitants of the earth upon all the face of this land, crying: \"Wo! Wo! Wo unto this people! Wo unto the inhabitants of the whole earth, except they shall repent!"},{"time":312.16,"text":"27. For the devil laugheth and his angels rejoice because of the slain of the fair sons and daughters of My people; And it is because of their iniquity and their abominations that they are fallen."},{"time":323.04,"text":"28. \"Behold, that great City Zarahemla have I burned with fire, and the inhabitants thereof."},{"time":330.4,"text":"29. \"And behold, that great City Moroni have I caused to be sunk in the depths of the sea, And the inhabitants thereof to be drowned."},{"time":339.275,"text":"30. \"And behold, that great City Moronihah have I covered with earth, And the inhabitants thereof to hide their iniquities and their abominations from before My face, That the blood of the prophets and of the saints should not come up anymore unto Me against them."},{"time":354.88,"text":"31. \"And behold, the City of Gilgal have I caused to be sunk, And the inhabitants thereof to be buried up in the depths of the earth;"},{"time":365.196,"text":"32. Yea, and the City of Onihah, and the inhabitants thereof, And the City of Mocum, and the inhabitants thereof, And the City of Jerusalem, and the inhabitants thereof - And waters have I caused to come up in the stead thereof,"},{"time":380.08,"text":"33. To hide their wickedness and their abominations from before My face, That the blood of the prophets and the saints should not come up anymore unto Me against them."},{"time":390.749,"text":"34. \"And behold, the City of Gadiandi, and the City of Gadiomnah, and the City of Jacob, and the City of Gimgimno - All these have I caused to be sunk and made hills and valleys in the places thereof,"},{"time":404.5,"text":"35. And the inhabitants thereof have I buried up in the depths of the earth to hide their wickedness and abominations from before My face, That the blood of the prophets and the saints should not come up anymore unto Me against them."},{"time":416.818,"text":"36. \"And behold, that great City Jacob-Ugath, which was inhabited by the people of King Jacob, have I caused to be burned with fire because of their sins and their wickedness, Which was above all the wickedness of the whole earth because of their secret murders and combinations;"},{"time":434.88,"text":"37. For it was they that did destroy the peace of My people and the government of the land; Therefore, I did cause them to be burned to destroy them from before My face, That the blood of the prophets and the saints should not come up unto Me anymore against them."},{"time":450.4,"text":"38. \"And behold, the City of Laman and the City of Josh and the City of Gad and the City of Kishcumen have I caused to be burned with fire, and the inhabitants thereof, Because of their wickedness in casting out the prophets and stoning them which I did send to declare unto them concerning their wickedness and their abominations;"},{"time":468.427,"text":"39. And because they did cast them all out, that there were none righteous among them, I did send down fire and destroy them, that their wickedness and abominations might be hid from before My face, That the blood of the prophets and the saints which I sent among them might not cry unto Me from the ground against them."},{"time":487.92,"text":"40. \"And many great destructions have I caused to come upon this land and upon this people because of their wickedness and their abominations."},{"time":495.42,"text":"41. \"O all ye that are spared because ye were more righteous than they! Will ye not now return unto Me and repent of your sins and be converted, that I may heal you?"},{"time":507.836,"text":"42. \"Yea, verily I say unto you, if ye will come unto Me, ye shall have eternal life;"},{"time":515.44,"text":"43. Behold, Mine arm of mercy is extended toward you, And whosoever will come, him will I receive, And blessed are they which cometh unto Me."},{"time":526.132,"text":"44. \"Behold, I Am Jesus Christ, the Son of God; I created the heavens and the earth and all things that in them is;"},{"time":533.836,"text":"45. I was with the Father from the beginning; I Am in the Father and the Father in Me, And in Me hath the Father glorified His name."},{"time":541.932,"text":"46. \"I came unto My own and My own received Me not, And the scriptures concerning My coming are fulfilled;"},{"time":549.173,"text":"47. And as many as have received Me, to them have I given to become the sons of God, And even so will I to as many as shall believe on My name.\"For behold, by Me redemption cometh, And in Me is the law of Moses fulfilled."},{"time":566.32,"text":"48. \"I Am the light and the life of the world; I Am Alpha and Omega, the beginning and the end."},{"time":578.04,"text":"49. \"And ye shall offer up unto Me no more the shedding of blood; Yea, your sacrifices and your burnt offerings shall be done away, For I will accept none of your sacrifices and your burnt offerings; And ye shall offer for a sacrifice unto Me a broken heart and a contrite spirit;"},{"time":589.76,"text":"50. And whoso cometh unto Me with a broken heart and a contrite spirit, him will I baptize with fire and with the Holy Ghost, Even as the Lamanites, because of their faith in Me at the time of their conversion, were baptized with fire and with the Holy Ghost, And they knew it not."},{"time":605.96,"text":"51. \"Behold, I have come unto the world to bring redemption unto the world - to save the world from sin; Therefore, whoso repenteth and cometh unto Me as a little child, him will I receive, For of such is the kingdom of God."},{"time":622.021,"text":"52. \"Behold, for such I have laid down My life and have taken it up again; Therefore, repent and come unto Me, ye ends of the earth, and be saved!\""},{"time":631.718,"text":"53. And now behold, it came to pass that all the people of the land did hear these sayings and did witness of it;"},{"time":640.084,"text":"54. And after these sayings there was silence in the land for the space of many hours, For so great was the astonishment of the people that they did cease from lamenting and howling for the loss of their kindreds which had been slain; Therefore, there was silence in all the land for the space of many hours."},{"time":657.76,"text":"55. And it came to pass that there came a voice again unto the people - and all the people did hear and did witness of it - saying: \"O ye people of these great cities which have fallen, which are a descendant of Jacob, yea, which are of the house of Israel, O ye people of the house of Israel, How oft have I gathered you as a hen gathereth her chickens under her wings and have nourished you."},{"time":680.853,"text":"56. \"And again - How oft would I have gathered you as a hen gathereth her chickens under her wings, Yea, O ye people of the house of Israel which have fallen,"},{"time":686.494,"text":"57. Yea, O ye people of the house of Israel, ye that dwell at Jerusalem, as ye that have fallen; Yea, how oft would I have gathered you as a hen gathereth her chickens, And ye would not."},{"time":703.389,"text":"58. \"O ye house of Israel whom I have spared, How oft will I gather you as a hen gathereth her chickens under her wings, if ye will repent and return unto Me with full purpose of heart;"},{"time":715.259,"text":"59. But if not, O house of Israel, The place of your dwellings shall become desolate until the time of the fulfilling of the covenant to your fathers.\""},{"time":723.76,"text":"60. And now it came to pass that after the people had heard these words, Behold, they began to weep and howl again because of the loss of their kindreds and friends."},{"time":735.096,"text":"61. And it came to pass that thus did the three days pass away."},{"time":739.398,"text":"62. And it was in the morning, And the darkness did pass from off the face of the land, And the earth did cease to tremble, And the rocks did cease to rend, And the dreadful groanings did cease, And all the tumultuous noises did pass away,"},{"time":754.58,"text":"63. And the earth did cleave together again that it stood; And the mourning and the weeping and the wailing of the people which were spared alive did cease,"},{"time":763.29,"text":"64. And their mourning was turned into joy, And their lamentations into the praise and the thanksgiving unto the Lord Jesus Christ their Redeemer."},{"time":773.2,"text":"65. And thus far were the scriptures fulfilled which had been spoken by the prophets;"},{"time":779.12,"text":"66. And it was the more righteous part of the people which were saved, And it was they which received the prophets and stoned them not, And it was they which had not shed the blood of the saints which were spared;"},{"time":789.166,"text":"67. And they were spared and were not sunk and buried up in the earth; And they were not drowned in the depths of the sea; And they were not burned by fire, Neither were they fallen upon and crushed to death;"},{"time":801.459,"text":"68. And they were not carried away in the whirlwind, Neither were they overpowered by the vapor of smoke and of darkness."},{"time":810.06,"text":"69. And now whoso readeth, let him understand; He that hath the scriptures, let him search them and see, And behold if all these deaths and destructions - by fire and by smoke, and by tempests and by whirlwinds, and by the opening of the earth to receive them, and all these things - Are not unto the fulfilling of the prophecies of many of the holy prophets."},{"time":831.373,"text":"70. Behold, I say unto you, Yea; Many have testified of these things at the coming of Christ and were slain because they testified of these things."},{"time":843.365,"text":"71. Yea, the prophet Zenos did testify of these things, And also Zenoch spake concerning these things, because they testified particular concerning us which are a remnant of their seed."},{"time":856.64,"text":"72. Behold, our father Jacob also testified concerning a remnant of the seed of Joseph, And behold, are not we a remnant of the seed of Joseph?"},{"time":865.68,"text":"73. And these things, which testify of us, are they not written upon the plates of brass which our father Lehi brought out of Jerusalem?"},{"time":872.931,"text":"74. And it came to pass that in the ending of the thirty and fourth year, Behold, I will show unto you that the people of Nephi which were spared, and also they which had been called Lamanites which had been spared, did have great favors shown unto them and great blessings poured out upon their heads, Insomuch that soon after the ascension of Christ into heaven, He did truly manifest Himself unto them, showing His body unto them and ministering unto them;"},{"time":898.776,"text":"75. And an account of His ministry shall be given hereafter. Therefore, for this time I make an end of my sayings."}]
};
