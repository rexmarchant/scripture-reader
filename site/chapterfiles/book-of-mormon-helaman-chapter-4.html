<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Helaman",
  chapter: "Chapter 4",
  audioSrc: "https://archive.org/download/helaman-ch-4/Helaman%20Ch%204.mp3",
  lyrics: [{"time":0.0,"text":"Helaman Chapter 4"},{"time":7.01,"text":"1. And now it came to pass in the seventy and second year of the reign of the judges that the contentions did increase, Insomuch that there were wars throughout all the land, among all the people of Nephi;"},{"time":14.02,"text":"2. And it was this secret band of robbers which did carry on this work of destruction and wickedness;"},{"time":20.131,"text":"3. And this war did last all that year; And in the seventy and third year it did also last."},{"time":27.204,"text":"4. And it came to pass that in this year, Nephi did cry unto the Lord, saying: \"O Lord, do not suffer that this people shall be destroyed by the sword; But O Lord, rather let there be a famine in the land to stir them up in remembrance of the Lord their God, And perhaps they will repent and turn unto Thee.\""},{"time":46.892,"text":"5. And so it was done according to the words of Nephi; And there was a great famine upon the land among all the people of Nephi."},{"time":56.0,"text":"6. And thus, in the seventy and fourth year the famine did continue, And the work of destruction did cease by the sword, but became sore by famine."},{"time":65.628,"text":"7. And this work of destruction did also continue in the seventy and fifth year;"},{"time":71.84,"text":"8. For the earth was smitten that it was dry and did not yield forth grain in the season of grain; And the whole earth was smitten, even among the Lamanites, as well as among the Nephites, So that they were smitten that they did perish by thousands in the more wicked parts of the land."},{"time":88.396,"text":"9. And it came to pass that the people saw that they were about to perish by famine, And they began to remember the Lord their God; And they began to remember the words of Nephi."},{"time":99.36,"text":"10. And the people began to plead with their chief judges and their leaders, that they would say unto Nephi: \"Behold, we know that thou art a man of God; And therefore, cry unto the Lord our God that He turn away from us this famine, lest all the words which thou hast spoken concerning our destruction be fulfilled.\""},{"time":118.16,"text":"11. And it came to pass that the judges did say unto Nephi according to the words which had been desired."},{"time":125.04,"text":"12. And it came to pass that when Nephi saw that the people had repented and did humble themselves in sackcloth, He cried again unto the Lord, saying: \"O Lord, behold, this people repenteth;"},{"time":138.0,"text":"13. And they have swept away the band of Gaddianton from amongst them, Insomuch that they have become extinct and they have concealed their secret plans in the earth."},{"time":147.68,"text":"14. \"Now, O Lord, because of this, their humility, wilt Thou turn away Thine anger, And let Thine anger be appeased in the destruction of those wicked men whom Thou hast already destroyed?"},{"time":160.24,"text":"15. \"O Lord, wilt Thou turn away Thine anger - yea, Thy fierce anger - And cause that this famine may cease in this land?"},{"time":169.44,"text":"16. \"O Lord, wilt Thou hearken unto me and cause that it may be done according to my words, And send forth rain upon the face of the earth, that she may bring forth her fruit and her grain in the season of grain?"},{"time":181.735,"text":"17. \"O Lord, Thou didst hearken unto my words when I said, ' Let there be a famine that the pestilence of the sword might cease '; And I know that Thou wilt, even at this time, hearken unto my words, For Thou saidst that if this people repent, ' I will spare them.'"},{"time":198.507,"text":"18. \"Yea, O Lord, And Thou seest that they have repented because of the famine and the pestilence and destruction which have come unto them."},{"time":208.155,"text":"19. \"And now, O Lord, wilt Thou turn away Thine anger and try again if they will serve Thee? And if so, O Lord, Thou canst bless them according to Thy words which Thou hast said.\""},{"time":220.896,"text":"20. And it came to pass that in the seventy and sixth year, the Lord did turn away His anger from the people and caused that rain should fall upon the earth, Insomuch that it did bring forth her fruit in the season of her fruit."},{"time":235.04,"text":"21. And it came to pass that it did bring forth her grain in the season of her grain."},{"time":239.6,"text":"22. And behold, the people did rejoice and glorify God, And the whole face of the land was filled with rejoicing; And they did no more seek to destroy Nephi, But they did esteem him as a great prophet and a man of God, having great power and authority given unto him from God;"},{"time":256.88,"text":"23. And behold, Lehi his brother was not a whit behind him as to things pertaining to righteousness."},{"time":262.96,"text":"24. And thus it did come to pass that the people of Nephi began to prosper again in the land, And began to build up their waste places, And began to multiply and spread, Even until they did cover the whole face of the land - both on the northward and on the southward, from the Sea West to the Sea East."},{"time":282.56,"text":"25. And it came to pass that the seventy and sixth year did end in peace."},{"time":287.426,"text":"26. And the seventy and seventh year began in peace; And the church did spread throughout the face of all the land; And the more part of the people - both the Nephites and the Lamanites - did belong to the church; And they did have exceeding great peace in the land; And thus ended the seventy and seventh year."},{"time":305.804,"text":"27. And also they had peace in the seventy and eighth year, save it were a few contentions concerning the points of doctrine which had been laid down by the prophets."},{"time":316.0,"text":"28. And in the seventy and ninth year, there began to be much strife."},{"time":322.24,"text":"29. But it came to pass that Nephi and Lehi, and many of their brethren which knew concerning the true points of doctrine, having many revelations daily, Therefore, they did preach unto the people insomuch that they did put an end to their strife in that same year."},{"time":336.989,"text":"30. And it came to pass that in the eightieth year of the reign of the judges over the people of Nephi, There were a certain number of the dissenters from the people of Nephi which had some years before gone over unto the Lamanites and took upon themselves the name of Lamanites,"},{"time":352.21,"text":"31. And also a certain number which were real descendants of the Lamanites being stirred up to anger by them, or by those dissenters, Therefore, they commenced a war with their brethren;"},{"time":363.826,"text":"32. And they did commit murder and plunder; And then they would retreat back into the mountains and into the wilderness and secret places, Hiding themselves that they could not be discovered, Receiving daily an addition to their numbers, inasmuch as there were dissenters that went forth unto them."},{"time":380.528,"text":"33. And thus in time, yea, even in the space of not many years they became an exceeding great band of robbers; And they did search out all the secret plans of Gaddianton; And thus they became robbers of Gaddianton."},{"time":394.76,"text":"34. Now behold, these robbers did make great havoc, yea, even great destruction among the people of Nephi, and also among the people of the Lamanites."},{"time":406.48,"text":"35. And it came to pass that it was expedient that there should be a stop put to this work of destruction; Therefore, they sent an army of strong men into the wilderness and upon the mountains to search out this band of robbers and to destroy them;"},{"time":420.12,"text":"36. But behold, it came to pass that in that same year, they were driven back even into their own lands."},{"time":427.176,"text":"37. And thus ended the eightieth year of the reign of the judges over the people of Nephi."},{"time":433.048,"text":"38. And it came to pass in the commencement of the eighty and first year, they did go forth again against this band of robbers and did destroy many;"},{"time":443.022,"text":"39. And they were also visited with much destruction; And they were again obliged to return out of the wilderness and out of the mountains unto their own lands because of the exceeding greatness of the numbers of those robbers which infested the mountains and the wilderness."},{"time":457.375,"text":"40. And it came to pass that thus ended this year; And the robbers did still increase and wax strong, insomuch that they did defy the whole armies of the Nephites, and also of the Lamanites; And they did cause great fear to come unto the people upon all the face of the land;"},{"time":474.4,"text":"41. Yea, for they did visit many parts of the land and did do great destruction unto them - Yea, did kill many and did carry away others captive into the wilderness, yea, and more especially their women and their children;"},{"time":488.4,"text":"42. And now this great evil which came unto the people because of their iniquity did stir them up again in remembrance of the Lord their God."},{"time":496.825,"text":"43. And thus ended the eighty and first year of the reign of the judges."},{"time":501.061,"text":"44. And in the eighty and second year, they began again to forget the Lord their God."},{"time":509.034,"text":"45. And in the eighty and third year, they began to wax strong in iniquity."},{"time":516.16,"text":"46. And in the eighty and fourth year, they did not mend their ways."},{"time":519.549,"text":"47. And it came to pass in the eighty and fifth year, they did wax stronger and stronger in their pride and in their wickedness; And thus they were ripening again for destruction; And thus ended the eighty and fifth year."},{"time":533.68,"text":"48. And thus we can behold how false, and also the unsteadiness of, the hearts of the children of men. Yea, we can see that the Lord in His great infinite goodness doth bless and prosper those who put their trust in Him."},{"time":547.669,"text":"49. Yea, and we may see at the very time when He doth prosper His people - Yea, in the increase of their fields, their flocks and their herds, And in gold and in silver and in all manner of precious things of every kind, and art;"},{"time":563.515,"text":"50. Sparing their lives and delivering them out of the hands of their enemies; Softening the hearts of their enemies that they should not declare wars against them; Yea, and in fine, doing all things for the welfare and happiness of His people -"},{"time":577.824,"text":"51. Yea, then is the time that they do harden their hearts, and do forget the Lord their God, and do trample under their feet the Holy One; Yea, and this because of their ease and their exceeding great prosperity."},{"time":592.72,"text":"52. And thus we see that except the Lord doth chasten His people with many afflictions, Yea, except He doth visit them with death and with terror and with famine and with all manner of pestilences, They will not remember Him."},{"time":605.75,"text":"53. O how foolish and how vain and how evil and devilish! And how quick to do iniquity! And how slow to do good are the children of men!"},{"time":617.84,"text":"54. Yea, how quick to hearken unto the words of the evil one and to set their hearts upon the vain things of the world! Yea, how quick to be lifted up in pride! Yea, how quick to boast and do all manner of that which is iniquity!"},{"time":633.575,"text":"55. And how slow are they to remember the Lord their God and to give ear unto His counsels! Yea, how slow to walk in wisdom's paths!"},{"time":644.209,"text":"56. Behold, they do not desire that the Lord their God who hath created them should rule and reign over them; Notwithstanding His great goodness and His mercy toward them, they do set at naught His counsels, And they will not that He should be their guide."},{"time":659.541,"text":"57. O how great is the nothingness of the children of men! Yea, even they are less than the dust of the earth;"},{"time":667.608,"text":"58. For behold, the dust of the earth moveth hither and thither, to the dividing asunder at the command of our great and Everlasting God."},{"time":676.56,"text":"59. Yea, behold, at His voice doth the hills and the mountains tremble and quake; And by the power of His voice they are broken up and become smooth, yea, even like unto a valley;"},{"time":688.52,"text":"60. Yea, by the power of His voice doth the whole earth shake; Yea, by the power of His voice doth the foundations rock, even to the very center."},{"time":698.858,"text":"61. Yea, and if He saith unto the earth, \"Move!\" - And it is moved. Yea, if He say unto the earth, \"Thou shalt go back, that it lengthen out the day for many hours\" - And it is done."},{"time":713.6,"text":"62. And thus according to His word the earth goeth back, And it appeareth unto man that the sun standeth still; Yea, and behold, this is so, for sure it is the earth that moveth and not the sun."},{"time":727.04,"text":"63. And behold, also if He saith unto the waters of the great deep, \"Be thou dried up!\" - And it is done."},{"time":735.749,"text":"64. Behold, if He saith unto this mountain, \"Be thou raised up and come over and fall upon that city, that it be buried up\" - And behold, it is done."},{"time":744.457,"text":"65. And behold, if a man hideth up a treasure in the earth, And the Lord shall say, \"Let it be accursed because of the iniquity of him that hath hid it up\" - Behold, it shall be accursed."},{"time":756.747,"text":"66. And if the Lord shall say, \"Be thou accursed! that no man shall find thee from this time henceforth and forever\" - And behold, no man getteth it henceforth and forever."},{"time":768.72,"text":"67. And behold, if the Lord shalt say unto a man, \"Because of thine iniquities, thou shalt be accursed forever!\" - And it shall be done."},{"time":778.775,"text":"68. And if the Lord shall say, \"Because of thine iniquities, thou shalt be cut off from My presence!\" - And He will cause that it shall be so."},{"time":788.56,"text":"69. And wo unto whom He shall say this! for it shall be unto him that will do iniquity and he cannot be saved; Therefore, for this cause - that men might be saved - hath repentance been declared."},{"time":802.56,"text":"70. Therefore, blessed are they who will repent and hearken unto the voice of the Lord their God, For these are they that shall be saved;"},{"time":810.341,"text":"71. And may God grant in His great fullness that men might be brought unto repentance and good works, That they might be restored unto grace for grace according to their works."},{"time":820.337,"text":"72. And I would that all men might be saved; But we read that in that great and last day there are some which shall be cast out, Yea, which shall be cast off from the presence of the Lord,"},{"time":832.4,"text":"73. Yea, which shall be consigned to a state of endless misery, fulfilling the words which saith: \"They that have done good shall have everlasting life; And they that have done evil shall have everlasting damnation.\" And thus it is. Amen."}]
};
