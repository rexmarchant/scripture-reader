  lyrics: [{"time":0.0,"text":"Alma Chapter 18"},{"time":9.88,"text":"1. My son, give ear to my words, For I say unto you, even as I said unto Helaman, that inasmuch as ye shall keep the commandments of God, ye shall prosper in the land, And inasmuch as ye will not keep the commandments of God, ye shall be cut off from His presence."},{"time":19.76,"text":"2. And now my son, I trust that I shall have great joy in you because of your steadiness and your faithfulness unto God; For as you have commenced in your youth to look to the Lord your God, Even so I hope that you will continue in keeping His commandments; For blessed is he that endureth to the end."},{"time":36.457,"text":"3. I say unto you my son, that I have had great joy in thee already because of thy faithfulness and thy diligence and thy patience and thy longsuffering among the people of the Zoramites;"},{"time":47.112,"text":"4. For I knew that thou wast in bonds, Yea, and I also knew that thou wast stoned for the word's sake; And thou didst bear all these things with patience because the Lord was with thee, And now thou knowest that the Lord did deliver thee."},{"time":63.68,"text":"5. And now my son Shiblon, I would that ye should remember that as much as ye shall put your trust in God, Even so much ye shall be delivered out of your trials, and your troubles, and your afflictions, And ye shall be lifted up at the last day."},{"time":78.139,"text":"6. Now my son, I would not that ye should think that I know these things of myself, But it is the Spirit of God which is in me which maketh these things known unto me, For if I had not been born of God, I should not have known these things;"},{"time":93.76,"text":"7. But behold, the Lord in His great mercy sent His angel to declare unto me that I must stop the work of destruction among His people;"},{"time":102.24,"text":"8. Yea, and I have seen an angel face to face, And he spake with me, And his voice was as thunder, And it shook the whole earth."},{"time":111.84,"text":"9. And it came to pass that I was three days and three nights in the most bitter pain and anguish of soul, And never, until I did cry out unto the Lord Jesus Christ for mercy, did I receive a remission of my sins;"},{"time":124.636,"text":"10. But behold, I did cry unto Him, And I did find peace to my soul."},{"time":131.52,"text":"11. And now my son, I have told you this that ye might learn wisdom, That ye may learn of me that there is no other way nor means whereby man can be saved - Only in and through Christ -"},{"time":144.08,"text":"12. Behold, He is the life and the light of the world; Behold, He is the word of truth and righteousness."},{"time":151.84,"text":"13. And now, as ye have begun to teach the word, even so I would that ye should continue to teach, And I would that ye should be diligent and temperate in all things -"},{"time":162.24,"text":"14. See that ye are not lifted up unto pride, Yea, see that ye do not boast in your own wisdom nor of your much strength, Use boldness, but not overbearance,"},{"time":172.28,"text":"15. And also see that ye bridle all your passions, That ye may be filled with love, See that ye refrain from idleness. Do not pray as the Zoramites do, For ye have seen that they pray to be heard of men and to be praised for their wisdom -"},{"time":188.876,"text":"16. Do not say, \"O God, I thank Thee that we are better than our brethren, \" But rather say, \"O Lord, forgive my unworthiness and remember my brethren in mercy\" - Yea, acknowledge your unworthiness before God at all times."},{"time":204.341,"text":"17. And may the Lord bless your soul, And receive you at the last day into His kingdom to sit down in peace."},{"time":211.28,"text":"18. Now go, my son, and teach the word unto this people; Be sober, my son. Farewell."}]
};
