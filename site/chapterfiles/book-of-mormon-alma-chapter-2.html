  lyrics: [{"time":0.0,"text":"Alma Chapter 2"},{"time":5.699,"text":"1. Now it came to pass in the sixth year of the reign of the judges over the people of Nephi, there were no contentions nor wars in the Land of Zarahemla."},{"time":11.398,"text":"2. And the people being afflicted, yea, greatly afflicted for the loss of their brethren, And also for the loss of their flocks and herds, And also for the loss of their fields of grain which were trodden underfoot and destroyed by the Lamanites -"},{"time":25.547,"text":"3. And so great were their afflictions that every soul had cause to mourn; And they believed that it was the judgments of God sent upon them because of their wickedness and their abominations - Therefore, they were awakened to a remembrance of their duty,"},{"time":40.48,"text":"4. And they began to establish the church more fully; Yea, and many were baptized in the waters of Sidon and were joined to the church of God,"},{"time":51.148,"text":"5. Yea, they were baptized by the hand of Alma who had been consecrated the high priest over the people of the church by the hand of his father Alma."},{"time":59.744,"text":"6. And it came to pass in the seventh year of the reign of the judges there were about three thousand five hundred souls that united themselves to the church of God and were baptized;"},{"time":71.427,"text":"7. And thus ended the seventh year of the reign of the judges over the people of Nephi; And there was continual peace in all that time."},{"time":79.474,"text":"8. And it came to pass in the eighth year of the reign of the judges that the people of the church began to wax proud, Because of their exceeding riches, and their fine silks and their fine-twined linen,"},{"time":91.342,"text":"9. And because of their many flocks and herds, and their gold and their silver, and all manner of precious things which they had obtained by their industry;"},{"time":101.416,"text":"10. And in all these things were they lifted up in the pride of their eyes, for they began to wear very costly apparel."},{"time":109.296,"text":"11. Now this was the cause of much affliction to Alma, yea, and to many of the people which Alma had consecrated to be teachers and priests and elders over the church;"},{"time":119.713,"text":"12. Yea, many of them were sorely grieved for the wickedness which they saw had begun to be among their people,"},{"time":127.253,"text":"13. For they saw and beheld with great sorrow that the people of the church began to be lifted up in the pride of their eyes and to set their hearts upon riches and upon the vain things of the world,"},{"time":138.693,"text":"14. That they began to be scornful, one toward another, And they began to persecute those that did not believe, according to their own will and pleasure."},{"time":147.416,"text":"15. And thus in this eighth year of the reign of the judges there began to be great contentions among the people of the church;"},{"time":156.988,"text":"16. Yea, there were envyings and strifes and malice and persecutions and pride, even to exceed the pride of those who did not belong to the church of God."},{"time":166.56,"text":"17. And thus ended the eighth year of the reign of the judges; And the wickedness of the church was a great stumbling block to those who did not belong to the church; And thus the church began to fail in its progress."},{"time":178.206,"text":"18. And it came to pass in the commencement of the ninth year, Alma seeing the wickedness of the church, And seeing also that the example of the church began to lead those who were unbelievers on from one piece of iniquity to another, thus bringing on the destruction of the people,"},{"time":194.04,"text":"19. Yea, seeing great inequality among the people - Some lifting themselves up with their pride, despising others, Turning their backs upon the needy and the naked, and those which were hungry, and those which were athirst, and those which were sick and afflicted -"},{"time":210.438,"text":"20. Now this was a great cause for lamentations among the people; While others were abasing themselves, succoring those who stood in need of their succor, Such as imparting their substance to the poor and the needy, feeding the hungry, And suffering all manner of afflictions for Christ's sake, which should come according to the spirit of prophecy, looking forward to that day; Thus retaining a remission of their sins,"},{"time":234.8,"text":"21. Being filled with great joy because of the resurrection of the dead according to the will and power and deliverance of Jesus Christ from the bands of death -"},{"time":244.32,"text":"22. And now it came to pass that Alma, having seen the afflictions of the humble followers of God and the persecutions which were heaped upon them by the remainder of his people, and seeing all their inequality, He began to be very sorrowful; Nevertheless, the Spirit of the Lord did not fail him."},{"time":260.504,"text":"23. And he selected a wise man which was among the elders of the church and gave him power, according to the voice of the people, That he might have power to enact laws, according to the laws which had been given, And to put them in force, according to the wickedness and the crimes of the people."},{"time":277.592,"text":"24. Now this man's name was Nephihah, And he was appointed chief judge; And he sat in the judgment seat to judge and to govern the people."},{"time":286.764,"text":"25. Now Alma did not grant unto him the office of being high priest over the church, but he retained the office of high priest unto himself, But he delivered the judgment seat unto Nephihah;"},{"time":297.644,"text":"26. And this he did that he himself might go forth among his people, or among the people of Nephi, That he might preach the word of God unto them to stir them up in remembrance of their duty,"},{"time":309.344,"text":"27. And that he might pull down by the word of God all the pride and craftiness and all the contentions which were among his people, Seeing no way that he might reclaim them, save it were in bearing down in pure testimony against them."},{"time":323.958,"text":"28. And thus in the commencement of the ninth year of the reign of the judges over the people of Nephi, Alma delivered up the judgment seat to Nephihah and confined himself wholly to the high priesthood of the holy order of God, to the testimony of the word according to the spirit of revelation and prophecy."}]
};
