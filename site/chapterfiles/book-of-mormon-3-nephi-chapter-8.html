<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",
  chapter: "Chapter 8",
  audioSrc: "https://archive.org/download/3-nephi-ch-8/3%20Nephi%20Ch%208.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 8"},{"time":7.48,"text":"1. Behold, now it came to pass that when Jesus had spoken these words, He looked round about again on the multitude, And He saith unto them: \"Behold, My time is at hand;"},{"time":14.96,"text":"2. I perceive that ye are weak, that ye cannot understand all My words which I am commanded of the Father to speak unto you at this time;"},{"time":23.583,"text":"3. Therefore, go ye unto your homes and ponder upon the things which I have said, And ask of the Father in My name, that ye may understand and prepare your minds for the morrow; And I come unto you again;"},{"time":36.105,"text":"4. But now I go unto the Father, and also to show Myself unto the lost tribes of Israel, For they are not lost unto the Father, for He knoweth whither He hath taken them.\""},{"time":47.156,"text":"5. And it came to pass that when Jesus had thus spoken, He cast His eyes round about again on the multitude, And behold, they were in tears and did look steadfastly upon Him as if they would ask Him to tarry a little longer with them;"},{"time":61.6,"text":"6. And He saith unto them: \"Behold, My bowels are filled with compassion toward you - Have ye any that are sick among you? Bring them hither."},{"time":71.6,"text":"7. \"Have ye any that are lame or blind or halt or maimed or leprous? Or that are withered? Or that are deaf? Or that are afflicted in any manner? Bring them hither and I will heal them, for I have compassion upon you."},{"time":87.88,"text":"8. \"My bowels are filled with mercy, For I perceive that ye desire that I should show unto you what I have done unto your brethren at Jerusalem, For I see that your faith is sufficient that I should heal you.\""},{"time":99.36,"text":"9. And it came to pass that when He had thus spoken, all the multitude with one accord did go forth with their sick and their afflicted and their lame and with their blind and with their dumb and with all they that were afflicted in any manner; And He did heal them every one as they were brought forth unto Him;"},{"time":116.96,"text":"10. And they did all - both they which had been healed and they which were whole - bow down at His feet and did worship Him;"},{"time":124.64,"text":"11. And as many as could come, for the multitude, did kiss His feet, insomuch that they did bathe His feet with their tears."},{"time":133.36,"text":"12. And it came to pass that He commanded that their little children should be brought,"},{"time":137.52,"text":"13. So they brought their little children and sat them down upon the ground round about Him, And Jesus stood in the midst and the multitude gave way till they had all been brought unto Him."},{"time":149.52,"text":"14. And it came to pass that when they had all been brought and Jesus stood in the midst, He commanded the multitude that they should kneel down upon the ground."},{"time":158.96,"text":"15. And it came to pass that when they had knelt upon the ground, Jesus groaned within Himself and saith: \"Father, I am troubled because of the wickedness of the people of the house of Israel.\""},{"time":169.693,"text":"16. And when He had said these words, He Himself also knelt upon the earth, And behold, He prayed unto the Father, And the things which He prayed cannot be written, And the multitude did bear record which heard Him."},{"time":183.92,"text":"17. And after this manner do they bear record: \"The eye hath never seen, neither hath the ear heard before, so great and marvelous things as we saw and heard Jesus speak unto the Father!"},{"time":195.92,"text":"18. And no tongue can speak, neither can there be written by any man, Neither can the hearts of men conceive so great and marvelous things as we both saw and heard Jesus speak!"},{"time":206.632,"text":"19. And no one can conceive of the joy which filled our souls at the time we heard Him pray for us unto the Father!\""},{"time":214.567,"text":"20. And it came to pass that when Jesus had made an end of praying unto the Father, He arose; But so great was the joy of the multitude that they were overcome."},{"time":225.36,"text":"21. And it came to pass that Jesus spake unto them and bade them arise,"},{"time":230.568,"text":"22. And they arose from the earth; And He saith unto them: \"Blessed are ye because of your faith! And now behold, My joy is full.\""},{"time":239.92,"text":"23. And when He had said these words, He wept and the multitude bear record of it; And He took their little children, one by one, and blessed them and prayed unto the Father for them."},{"time":251.187,"text":"24. And when He had done this, He wept again; And He spake unto the multitude and saith unto them: \"Behold your little ones!\""},{"time":259.253,"text":"25. And as they looked to behold, they cast their eyes toward heaven, And they saw the heavens open, And they saw angels descending out of heaven, as it were, in the midst of fire; And they came down and encircled those little ones about,"},{"time":276.734,"text":"26. And they were encircled about with fire, And the angels did minister unto them. And the multitude did see and hear and bear record; And they know that their record is true, for they - all of them - did see and hear, every man for himself;"},{"time":292.86,"text":"27. And they were in number about two thousand and five hundred souls; And they did consist of men, women and children."},{"time":301.36,"text":"28. And it came to pass that Jesus commanded His disciples that they should bring forth some bread and wine unto Him;"},{"time":309.307,"text":"29. And while they were gone for bread and wine, He commanded the multitude that they should sit themselves down upon the earth;"},{"time":317.68,"text":"30. And when the disciples had come with bread and wine, He took of the bread and brake and blessed it; And He gave unto the disciples and commanded that they should eat;"},{"time":327.103,"text":"31. And when they had eaten and were filled, He commanded that they should give unto the multitude."},{"time":333.655,"text":"32. And when the multitude had eaten and were filled, He saith unto the disciples: \"Behold, there shall one be ordained among you, And to him will I give power that he shall break bread and bless it and give it unto the people of My church, unto all they which shall believe and be baptized in My name;"},{"time":352.025,"text":"33. And this shall ye always observe to do, even as I have done, even as I have broken bread and blessed it and gave it unto you;"},{"time":360.05,"text":"34. And this shall ye do in remembrance of My body which I have shown unto you;"},{"time":366.206,"text":"35. And it shall be a testimony unto the Father that ye do always remember Me;"},{"time":372.008,"text":"36. And if ye do always remember Me, ye shall have My Spirit to be with you.\""},{"time":377.497,"text":"37. And it came to pass that when He had said these words, He commanded His disciples that they should take of the wine of the cup and drink of it, And that they should also give unto the multitude that they might drink of it."},{"time":390.24,"text":"38. And it came to pass that they did so and did drink of it and were filled; And they gave unto the multitude and they did drink and they were filled."},{"time":399.04,"text":"39. And when the disciples had done this, Jesus saith unto them: \"Blessed are ye for this thing which ye have done, for this is fulfilling My commandments, And this doth witness unto the Father that ye are willing to do that which I have commanded you;"},{"time":414.0,"text":"40. And this shall ye always do unto those who repent and are baptized in My name; And ye shall do it in remembrance of My blood which I have shed for you, that ye may witness unto the Father that ye do always remember Me;"},{"time":427.28,"text":"41. And if ye do always remember Me, ye shall have My Spirit to be with you."},{"time":433.2,"text":"42. \"And I give unto you a commandment that ye shall do these things,"},{"time":438.32,"text":"43. And if ye shall always do these things, blessed are ye, for ye are built upon My Rock;"},{"time":445.36,"text":"44. But whoso among you shall do more or less than these are not built upon My Rock, but are built upon a sandy foundation;"},{"time":453.28,"text":"45. And when the rain descends and the floods come and the winds blow and beat upon them, they shall fall, And the gates of hell are already open to receive them."},{"time":463.68,"text":"46. \"Therefore, blessed are ye if ye shall keep My commandments which the Father hath commanded Me that I should give unto you;"},{"time":471.448,"text":"47. Verily, verily I say unto you, ye must watch and pray always, lest ye be tempted by the devil and ye are led away captive by him;"},{"time":481.36,"text":"48. And as I have prayed among you, even so shall ye pray in My church among My people which do repent and are baptized in My name;"},{"time":490.0,"text":"49. Behold, I Am the light - I have set an example before you.\""},{"time":495.52,"text":"50. And it came to pass that when Jesus had spake these words unto His disciples, He turned again unto the multitude and saith unto them: \"Behold, verily, verily I say unto you, ye must watch and pray always, lest ye enter into temptation;"},{"time":511.6,"text":"51. For Satan desireth to have you, that he may sift you as wheat; Therefore, ye must always pray unto the Father in My name; And whatsoever ye shall ask the Father in My name, which is right, believing that ye shall receive - And behold, it shall be given unto you;"},{"time":527.92,"text":"52. Pray in your families unto the Father, always in My name, that your wives and your children may be blessed."},{"time":535.92,"text":"53. \"And behold, ye shall meet together oft, And ye shall not forbid any man from coming unto you when ye shall meet together, But suffer them that they may come unto you and forbid them not;"},{"time":549.12,"text":"54. But ye shall pray for them and shall not cast them out; And if it so be that they come unto you oft, ye shall pray for them unto the Father in My name. \"Therefore, hold up your light that it may shine unto the world;"},{"time":562.278,"text":"55. Behold, I Am the light which ye shall hold up. \"That which ye have seen Me do -"},{"time":569.92,"text":"56. Behold, ye have seen I have prayed unto the Father, And ye all have witnessed and ye see that I have commanded that none of you should go away, But rather have commanded that ye should come unto Me that ye might feel and see -"},{"time":582.543,"text":"57. Even so shall ye do unto the world; And whosoever breaketh this commandment, suffereth himself to be led into temptation.\""},{"time":590.28,"text":"58. And now it came to pass that when Jesus had spoken these words, He turned His eyes again upon the disciples whom He had chosen and saith unto them:"},{"time":600.516,"text":"59. \"Behold, verily, verily I say unto you, I give unto you another commandment, And then I must go unto My Father, that I must fulfill other commandments which He hath given Me."},{"time":613.2,"text":"60. \"And now behold, this is the commandment which I give unto you - That ye shall not suffer anyone knowingly to partake of My flesh and blood unworthily when ye shall minister it, For whoso eateth and drinketh My flesh and blood unworthily eateth and drinketh damnation to his soul."},{"time":630.64,"text":"61. \"Therefore, if ye know that a man is unworthy to eat and drink of My flesh and blood, ye shall forbid him; Nevertheless, ye shall not cast him out from among you, But ye shall minister unto him and shall pray for him unto the Father in My name;"},{"time":645.76,"text":"62. And if it so be that he repenteth and is baptized in My name, then shall ye receive him and shall minister unto him of My flesh and blood;"},{"time":654.691,"text":"63. But if he repenteth not, he shall not be numbered among My people, that he may not destroy My people, For behold, I know My sheep and they are numbered;"},{"time":664.965,"text":"64. Nevertheless, ye shall not cast him out of your synagogues or your places of worship, For unto such shall ye continue to minister;"},{"time":673.387,"text":"65. For ye know not but what they will return and repent and come unto Me with full purpose of heart and I shall heal them, And ye shall be the means of bringing salvation unto them."},{"time":684.88,"text":"66. \"Therefore, keep these sayings which I have commanded you, that ye come not under condemnation, For wo unto him whom the Father condemneth!"},{"time":694.8,"text":"67. \"And I give you these commandments because of the disputations which hath been among you beforetimes,"},{"time":700.14,"text":"68. And blessed are ye if ye have no disputations among you."},{"time":705.2,"text":"69. \"And now I go unto the Father, because it is expedient that I should go unto the Father for your sakes.\""},{"time":712.99,"text":"70. And it came to pass that when Jesus had made an end of these sayings, He touched with His hand the disciples whom He had chosen - one by one, even until He had touched them all - and spake unto them as He touched them;"},{"time":727.12,"text":"71. And the multitude heard not the words which He spake, Therefore, they did not bear record; But the disciples bear record that He gave them power to give the Holy Ghost,"},{"time":738.32,"text":"72. And I will show unto you hereafter that this record is true."},{"time":742.72,"text":"73. And it came to pass that when Jesus had touched them all, there came a cloud and overshadowed the multitude, that they could not see Jesus;"},{"time":751.772,"text":"74. And while they were overshadowed, He departed from them and ascended into heaven;"},{"time":757.431,"text":"75. And the disciples saw and did bear record that He ascended again into heaven."}]
};
</script>
