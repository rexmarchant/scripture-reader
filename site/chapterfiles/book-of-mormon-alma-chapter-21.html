<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 21",
  audioSrc: "https://archive.org/download/alma-ch-21/Alma%20Ch%2021.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 21"},{"time":6.56,"text":"1. Behold, now it came to pass that the people of Nephi were exceedingly rejoiced because the Lord had again delivered them out of the hands of their enemies;"},{"time":13.12,"text":"2. Therefore, they gave thanks unto the Lord their God, Yea, and they did fast much and pray much, And they did worship God with exceeding great joy."},{"time":23.921,"text":"3. And it came to pass in the nineteenth year of the reign of the judges over the people of Nephi - that Alma came unto his son Helaman and saith unto him: \"Believest thou the words which I spake unto thee concerning those records which have been kept?\""},{"time":36.771,"text":"4. And Helaman saith unto him: \"Yea, I believe.\""},{"time":45.01,"text":"5. And Alma saith again: \"Believest thou in Jesus Christ, which shall come?\" And he saith: \"Yea, I believe all the words which thou hast spoken.\""},{"time":56.921,"text":"6. And Alma saith unto him again: \"Will ye keep my commandments?\" And he saith: \"Yea, I will keep thy commandments with all my heart.\""},{"time":66.612,"text":"7. Then Alma saith unto him: \"Blessed art thou, and the Lord shall prosper thee in this land."},{"time":70.582,"text":"8. \"But behold, I have somewhat to prophesy unto thee, But what I prophesy unto thee, ye shall not make known, Yea, what I prophesy unto thee shall not be made known, even until the prophecy is fulfilled; Therefore, write the words which I shall say.\""},{"time":88.32,"text":"9. And these are the words: \"Behold, I perceive that this very people, the Nephites, according to the spirit of revelation which is in me, In four hundred years from the time that Jesus Christ shall manifest Himself unto them, shall dwindle in unbelief."},{"time":103.864,"text":"10. \"Yea, and then shall they see wars and pestilences, yea, famines and bloodshed, even until the people of Nephi shall become extinct;"},{"time":115.44,"text":"11. Yea, and this because they shall dwindle in unbelief and fall into the works of darkness and lasciviousness and all manner of iniquities."},{"time":123.305,"text":"12. \"Yea, I say unto you that because they shall sin against so great light and knowledge, Yea, I say unto you that from that day, even the fourth generation shall not all pass away before this great iniquity shall come."},{"time":138.4,"text":"13. \"And when that great day cometh, behold, the time very soon cometh that those which are now - Or the seed of those which are now numbered among the people of the Nephites - shall no more be numbered among the people of Nephi;"},{"time":151.95,"text":"14. But whosoever remaineth and is not destroyed in that great and dreadful day shall be numbered among the Lamanites and shall become like unto them - All, save it be a few which shall be called the disciples of the Lord,"},{"time":165.04,"text":"15. And them shall the Lamanites pursue, even until they shall become extinct; And now, because of iniquity, this prophecy shall be fulfilled.\""},{"time":174.8,"text":"16. And now it came to pass that after Alma had said these things to Helaman, he blessed him, and also his other sons, And he also blessed the earth for the righteous' sake."},{"time":186.24,"text":"17. And he said: \"Thus saith the Lord God: 'Cursed shall be the land, yea, this land, unto every nation, kindred, tongue and people, unto destruction, which do wickedly, when they are fully ripe.'"},{"time":201.92,"text":"18. \"And as I have said, so shall it be; For this is the cursing and the blessing of God upon the land, For the Lord cannot look upon sin with the least degree of allowance.\""},{"time":212.96,"text":"19. And now when Alma had said these words, he blessed the church, Yea, all those which should stand fast in the faith from that time henceforth."},{"time":222.864,"text":"20. And when Alma had done this, he departed out of the Land of Zarahemla as if to go into the Land of Melek. And it came to pass that he was never heard of more; As to his death or burial, we know not of."},{"time":237.44,"text":"21. Behold, this we know - that he was a righteous man, And the saying went abroad in the church that he was taken up by the Spirit, Or buried by the hand of the Lord, even as Moses."},{"time":249.76,"text":"22. But behold, the scripture saith the Lord took Moses unto Himself, And we suppose that He hath also received Alma in the spirit unto Himself, Therefore, for this cause we know nothing concerning his death and burial."},{"time":262.32,"text":"23. And now it came to pass in the commencement of the nineteenth year of the reign of the judges over the people of Nephi that Helaman went forth among the people to declare the word unto them;"},{"time":273.49,"text":"24. For behold, because of their wars with the Lamanites, and the many little dissensions and disturbances which had been among the people, It became expedient that the word of God should be declared among them, Yea, and that a regulation should be made throughout the church;"},{"time":291.2,"text":"25. Therefore, Helaman and his brethren went forth to establish the church again in all the land, Yea, in every city throughout all the land which was possessed by the people of Nephi."},{"time":303.2,"text":"26. And it came to pass that they did appoint priests and teachers throughout all the land, over all the churches."},{"time":309.564,"text":"27. And now it came to pass that after Helaman and his brethren had appointed priests and teachers over the churches, that there arose a dissension among them, And they would not give heed to the words of Helaman and his brethren,"},{"time":323.76,"text":"28. But they grew proud, being lifted up in their hearts because of their exceeding great riches; Therefore, they grew rich in their own eyes and would not give heed to their words to walk uprightly before God."},{"time":335.804,"text":"29. And it came to pass that as many as would not hearken to the words of Helaman and his brethren were gathered together against their brethren;"},{"time":345.6,"text":"30. And now behold, they were exceeding wroth, insomuch that they were determined to slay them."},{"time":352.64,"text":"31. Now the leader of those which were wroth against their brethren was a large and a strong man, And his name was Amalickiah;"},{"time":363.429,"text":"32. And Amalickiah was desirous to be a king, And those people which were wroth were also desirous that he should be their king; And they were - the greater part of them - the lower judges of the land, And they were seeking for power;"},{"time":374.219,"text":"33. And they had been led by the flatteries of Amalickiah, that if they would support him and establish him to be their king, that he would make them rulers over the people."},{"time":384.48,"text":"34. Thus they were led away by Amalickiah to dissensions, notwithstanding the preaching of Helaman and his brethren, Yea, notwithstanding their exceeding great care over the church, for they were high priests over the church;"},{"time":398.244,"text":"35. And there were many in the church which believed in the flattering words of Amalickiah, Therefore they dissented, even from the church."},{"time":406.54,"text":"36. And thus were the affairs of the people of Nephi exceeding precarious and dangerous, Notwithstanding their great victory which they had had over the Lamanites, And their great rejoicings which they had had because of their delivery by the hands of the Lord."},{"time":422.24,"text":"37. Thus we see how quick the children of men doth forget the Lord their God, Yea, how quick to do iniquity and to be led away by the evil one. Yea, and we also see the great wickedness one very wicked man can cause to take place among the children of men."},{"time":440.13,"text":"38. Yea, we see that Amalickiah, because he was a man of cunning devices and a man of many flattering words, That he led away the hearts of many people to do wickedly,"},{"time":450.464,"text":"39. Yea, and to seek to destroy the church of God and to destroy the foundation of liberty which God had granted unto them, Or which blessing God had sent upon the face of the land for the righteous' sake."},{"time":462.856,"text":"40. And now it came to pass that when Moroni, which was the chief commander of the armies of the Nephites, had heard of these dissensions, he was angry with Amalickiah."},{"time":472.42,"text":"41. And it came to pass that he rent his coat, And he took a piece thereof and wrote upon it - \"In memory of our God, our religion and freedom and our peace, our wives and our children\" - And he fastened it upon the end of a pole thereof;"},{"time":488.32,"text":"42. And he fastened on his headplate and his breastplate and his shields and girded on his armor about his loins, And he took the pole which had on the end thereof his rent coat and he called it the title of liberty."},{"time":500.004,"text":"43. And he bowed himself to the earth, And he prayed mightily unto his God for the blessings of liberty to rest upon his brethren, so long as there should a band of Christians remain to possess the land -"},{"time":511.515,"text":"44. For thus were all the true believers of Christ which belonged to the church of God called by those who did not belong to the church, And those who did belong to the church were faithful,"},{"time":522.76,"text":"45. Yea, all those who were true believers in Christ took upon them gladly the name of Christ, or Christians, as they were called, because of their belief in Christ, which should come - And therefore, at this time, Moroni prayed that the cause of the Christians and the freedom of the land might be favored."},{"time":542.032,"text":"46. And it came to pass that when he had poured out his soul to God, He gave all the land which was south of the Land Desolation, Yea, and in fine all the land, both on the north and on the south, a chosen land and the land of liberty."},{"time":555.155,"text":"47. And he saith: \"Surely God shall not suffer that we who are despised because we take upon us the name of Christ shall be trodden down and destroyed, until we bring it upon us by our own trangressions.\""},{"time":568.278,"text":"48. And when Moroni had said these words, he went forth among the people, waving the rent of his garment in the air that all might see the writing which he had written upon the rent, And crying with a loud voice, saying:"},{"time":583.155,"text":"49. \"Behold, whosoever will maintain this title upon the land, Let them come forth in the strength of the Lord and enter into a covenant that they will maintain their rights and their religion, that the Lord God may bless them.\""},{"time":596.392,"text":"50. And it came to pass that when Moroni had proclaimed these words, Behold, the people came running together with their armors girded about their loins, rending their garments in token, or as a covenant, that they would not forsake the Lord their God -"},{"time":612.29,"text":"51. Or, in other words, if they should trangress the commandments of God, Or fall into transgression and be ashamed to take upon them the name of Christ, The Lord should rend them even as they had rent their garments."},{"time":625.84,"text":"52. Now this was the covenant which they made, And they cast their garments at the feet of Moroni, saying: \"We covenant with our God that we shall be destroyed, even as our brethren in the Land Northward, if we shall fall into transgression;"},{"time":638.991,"text":"53. Yea, He may cast us at the feet of our enemies, even as we have cast our garments at thy feet, to be trodden underfoot, if we should fall into trangression.\""},{"time":650.896,"text":"54. Moroni saith unto them: \"Behold, we are a remnant of the seed of Jacob, Yea, we are a remnant of the seed of Joseph whose coat was rent by his brethren into many pieces;"},{"time":662.8,"text":"55. Yea, and now behold, let us remember to keep the commandments of God, Or our garments shall be rent by our brethren and we be cast into prison or be sold or be slain; Yea, let us preserve our liberty, as a remnant of Joseph;"},{"time":678.329,"text":"56. Yea, let us remember the words of Jacob before his death, For behold, he saw that a part of the remnant of the coat of Joseph was preserved and had not decayed."},{"time":689.053,"text":"57. \"And he saith: 'Even as this remnant of garment of my son hath been preserved, So shall a remnant of the seed of my son be preserved by the hand of God and be taken unto Himself, While the remainder of the seed of Joseph shall perish, even as the remnant of his garment."},{"time":704.969,"text":"58. 'Now behold, this giveth my soul sorrow; Nevertheless, my soul hath joy in my son because that part of his seed which shall be taken unto God.'"},{"time":717.154,"text":"59. \"Now behold, this was the language of Jacob;"},{"time":720.32,"text":"60. And now, who knoweth but what the remnant of the seed of Joseph which shall perish as his garment are those which have dissented from us, Yea, and even it shall be us, if we do not stand fast in the faith of Christ.\""},{"time":733.218,"text":"61. And now it came to pass that when Moroni had said these words, he went forth, and also sent forth in all the parts of the land where there were dissensions, And gathered together all the people which were desirous to maintain their liberty to stand against Amalickiah and those which had dissented, which were called Amalickiahites."},{"time":753.44,"text":"62. And it came to pass that when Amalickiah saw that the people of Moroni were more numerous than the Amalickiahites, And he also saw that his people were doubtful concerning the justice of the cause in which they had undertaken, Therefore, fearing that he should not gain the point, he took those of his people which would and departed into the Land of Nephi."},{"time":774.64,"text":"63. Now Moroni thought it was not expedient that the Lamanites should have any more strength; Therefore, he thought to cut off the people of Amalickiah, or to take them and bring them back and put Amalickiah to death;"},{"time":786.187,"text":"64. Yea, for he knew that they would stir up the Lamanites to anger against them and cause them to come down to battle against them, And this he knew that Amalickiah would do, that he might obtain his purposes;"},{"time":799.366,"text":"65. Therefore, Moroni thought it was expedient that he should take his armies which had gathered themselves together and armed themselves and entered into a covenant to keep the peace."},{"time":809.34,"text":"66. And it came to pass that he took his army and marched out with his tents into the wilderness to cut off the course of Amalickiah in the wilderness."},{"time":818.96,"text":"67. And it came to pass that he did according to his desires, And marched forth into the wilderness and headed the armies of Amalickiah."},{"time":828.42,"text":"68. And it came to pass that Amalickiah fled with a small number of his men, And the remainder were delivered up into the hands of Moroni and were taken back into the Land of Zarahemla."},{"time":837.88,"text":"69. Now Moroni being a man which was appointed by the chief judges and the voice of the people, Therefore, he had power to do according to his will with the armies of the Nephites, to establish and to exercise authority over them."},{"time":852.56,"text":"70. And it came to pass that whomsoever of the Amalickiahites that would not enter into a covenant to support the cause of freedom that they might maintain a free government, he caused to be put to death; And there was but few which denied the covenant of freedom."},{"time":866.88,"text":"71. And it came to pass also that he caused the title of liberty to be hoisted upon every tower which was in all the land which was possessed by the Nephites. And thus Moroni planted the standard of liberty among the Nephites,"},{"time":880.21,"text":"72. And they began to have peace again in the land. And thus they did maintain peace in the land, until nearly the end of the nineteenth year of the reign of the judges;"},{"time":891.816,"text":"73. And Helaman and the high priests did also maintain order in the church, Yea, even for the space of four years did they have much peace and rejoicing in the church."},{"time":903.92,"text":"74. And it came to pass that there were many who died, firmly believing that their souls were redeemed by the Lord Jesus Christ; Thus they went out of the world rejoicing."},{"time":913.573,"text":"75. And there were some who died with fevers, which at some seasons of the year was very frequent in the land -"},{"time":921.04,"text":"76. But not so much so with fevers, because of the excellent qualities of the many plants and roots which God had prepared to remove the cause of diseases to which man was susceptible by the nature of the climate -"},{"time":933.44,"text":"77. But there were many who died with old age. And those who died in the faith of Christ are happy in Him, as we must needs suppose."},{"time":942.752,"text":"78. Now I will return in our record to Amalickiah and those which had fled with him into the wilderness. For behold, he had taken those which went with him and went up into the Land of Nephi, among the Lamanites, And did stir up the Lamanites to anger against the people of Nephi, Insomuch that the king of the Lamanites sent a proclamation throughout all his land, among all his people, that they should gather themselves together again to go to battle against the Nephites."},{"time":971.609,"text":"79. And it came to pass that when the proclamation had gone forth among them, they were exceeding fraid - Yea, they feared to displease the king, And they also feared to go to battle against the Nephites, lest they should lose their lives."},{"time":986.68,"text":"80. And it came to pass that they would not, or the more part of them would not obey the commandment of the king."},{"time":994.192,"text":"81. And now it came to pass that the king was wroth because of their disobedience; Therefore, he gave Amalickiah the command of that part of his army which was obedient unto his commands, And commanded him that he should go forth and compel them to arms."},{"time":1009.342,"text":"82. Now behold, this was the desire of Amalickiah; For he being a very subtle man to do evil, Therefore, he laid the plan in his heart to dethrone the king of the Lamanites."},{"time":1020.329,"text":"83. And now he had got the command of those parts of the Lamanites which were in favor of the king, And he sought to gain favor of those which were not obedient."},{"time":1031.28,"text":"84. Therefore, he went forward to the place which was called Oneidah - for thither had all the Lamanites fled - For they discovered the army coming and they supposed that they were coming to destroy them, Therefore, they fled to Oneidah to the place of arms."},{"time":1044.92,"text":"85. And they had appointed a man to be a king and a leader over them, Being fixed in their minds with a determined resolution that they would not be subjected to go against the Nephites."},{"time":1055.816,"text":"86. And it came to pass that they had gathered themselves together upon the top of the mount, which was called Antipas, in preparation to battle."},{"time":1068.788,"text":"87. Now it was not Amalickiah's intention to give them battle, according to the commandments of the king, But behold, it was his intention to gain favor with the armies of the Lamanites, that he might place himself at their head and dethrone the king and take possession of the kingdom."},{"time":1081.76,"text":"88. And behold, it came to pass that he caused his army to pitch their tents in the valley which was near the Mount Antipas."},{"time":1088.8,"text":"89. And it came to pass that when it was night, he sent a secret embassy into the Mount Antipas, Desiring that the leader of those which were upon the mount, whose name was Lehonti, that he should come down to the foot of the mount, for he desired to speak with him."},{"time":1104.042,"text":"90. And it came to pass that when Lehonti received the message, he durst not go down to the foot of the mount."},{"time":1111.684,"text":"91. And it came to pass that Amalickiah sent again the second time, desiring him to come down. And it came to pass that Lehonti would not; And he sent again the third time."},{"time":1121.877,"text":"92. And it came to pass that when Amalickiah found that he could not get Lehonti to come down off from the mount, he went up into the mount, nearly to Lehonti's camp; And he sent again the fourth time his message unto Lehonti, desiring that he would come down and that he would bring his guards with him."},{"time":1144.273,"text":"93. And it came to pass that when Lehonti had come down with his guards to Amalickiah, That Amalickiah desired him to come down with his army in the nighttime and surround those men in their camps over whom the king had given him command, And that he would deliver them up into Lehonti's hands if he would make him, Amalickiah, a second leader over the whole army."},{"time":1162.982,"text":"94. And it came to pass that Lehonti came down with his men and surrounded the men of Amalickiah, So that before they awoke at the dawn of the day, they were surrounded by the armies of Lehonti."},{"time":1175.756,"text":"95. And it came to pass that when they saw that they were surrounded, They pled with Amalickiah that he would suffer them to fall in with their brethren, that they might not be destroyed."},{"time":1186.787,"text":"96. Now this was the very thing which Amalickiah desired. And it came to pass that he delivered his men, contrary to the commands of the king;"},{"time":1195.303,"text":"97. Now this was the thing that Amalickiah desired, that he might accomplish his designs in dethroning the king."},{"time":1199.058,"text":"98. Now it was the custom among the Lamanites, if their chief leader was killed, to appoint the second leader to be their chief leader."},{"time":1208.231,"text":"99. And it came to pass that Amalickiah caused that one of his servants should administer poison by degrees to Lehonti, that he died;"},{"time":1217.52,"text":"100. Now when Lehonti was dead, the Lamanites appointed Amalickiah to be their leader and their chief commander."},{"time":1226.295,"text":"101. And it came to pass that Amalickiah marched with his armies - for he had gained his desires - to the Land of Nephi, to the City of Nephi, which was the chief city;"},{"time":1235.07,"text":"102. And the king came out to meet him with his guards, For he supposed that Amalickiah had fulfilled his commands and that Amalickiah had gathered together so great an army for to go against the Nephites to battle."},{"time":1248.08,"text":"103. But behold, as the king came out to meet him, Amalickiah caused that his servants should go forth to meet the king;"},{"time":1255.813,"text":"104. And they went forth and bowed themselves before the king, as if to reverence him because of his greatness."},{"time":1262.408,"text":"105. And it came to pass that the king put forth his hand to raise them, As was the custom with the Lamanites and a token of peace, which custom they had taken from the Nephites."},{"time":1272.944,"text":"106. And it came to pass that when he had raised the first from the ground, Behold, he stabbed the king to the heart and he fell to the earth."},{"time":1282.42,"text":"107. Now the servants of the king fled, And the servants of Amalickiah raised a cry, saying: \"Behold, the servants of the king have stabbed him to the heart! And he has fallen and they have fled; Behold, come and see.\""},{"time":1297.92,"text":"108. And it came to pass that Amalickiah commanded that his armies should march forth and see what had happened to the king,"},{"time":1304.24,"text":"109. And when they had come to the spot and found the king lying in his gore, Amalickiah pretended to be wroth and said: \"Whosoever loved the king, let him go forth and pursue his servants that they may be slain.\""},{"time":1317.596,"text":"110. And it came to pass that when all they which loved the king, when they heard these words, came forth and pursued after the servants of the king."},{"time":1327.92,"text":"111. Now when the servants of the king saw an army pursuing after them, They were frightened again, and fled into the wilderness, and came over into the Land of Zarahemla, and joined the people of Ammon;"},{"time":1338.997,"text":"112. And the army which pursued after them returned, having pursued after them in vain, And thus Amalickiah, by his fraud, gained the hearts of the people."},{"time":1349.364,"text":"113. And it came to pass on the morrow, he entered the City Nephi with his armies and took possession of the city."},{"time":1357.208,"text":"114. And now it came to pass that the queen, when she had heard that the king was slain - For Amalickiah had sent an embassy to the queen, informing her that the king had been slain by his servants, that he had pursued them with his army, but it was in vain, and they had made their escape -"},{"time":1374.792,"text":"115. Therefore, when the queen had received this message, she sent unto Amalickiah desiring him that he would spare the people of the city, And she also desired him that he should come in unto her, And she also desired him that he should bring witnesses with him to testify concerning the death of the king."},{"time":1392.56,"text":"116. And it came to pass that Amalickiah took the same servant that slew the king, and also they which were with him, And went in unto the queen, unto the place where she sat,"},{"time":1403.36,"text":"117. And they all testified unto her that the king was slain by his own servants, And they said also, \"They have fled; Does not this testify against them?\""},{"time":1413.525,"text":"118. And thus they satisfied the queen concerning the death of the king."},{"time":1420.406,"text":"119. And it came to pass that Amalickiah sought the favor of the queen and took her unto him to wife. And thus by his fraud and by the assistance of his cunning servants, he obtained the kingdom,"},{"time":1436.604,"text":"120. Yea, he was acknowledged king throughout all the land, among all the people of the Lamanites, Which were composed of the Lamanites and the Lemuelites and the Ishmaelites and all the dissenters of the Nephites, from the reign of Nephi down to the present time."},{"time":1445.92,"text":"121. Now these dissenters having the same instruction and the same information of the Nephites, Yea, having been instructed in the same knowledge of the Lord, Nevertheless, it is strange to relate, not long after their dissensions, They became more hardened and impenitent and more wild, wicked and ferocious than the Lamanites -"},{"time":1466.293,"text":"122. Drinking in with the traditions of the Lamanites, Giving way to indolence and all manner of lasciviousness, Yea, entirely forgetting the Lord their God."},{"time":1476.383,"text":"123. And now it came to pass that as soon as Amalickiah had obtained the kingdom, he began to inspire the hearts of the Lamanites against the people of Nephi, Yea, he did appoint men to speak unto the Lamanites from their towers against the Nephites."},{"time":1492.042,"text":"124. And thus he did inspire their hearts against the Nephites insomuch, that in the latter end of the nineteenth year of the reign of the judges - He having accomplished his designs thus far, Yea, having been made king over the Lamanites - He sought also to reign over all the land,"},{"time":1514.391,"text":"125. Yea, and all the people which were in the land, the Nephites as well as the Lamanites. Therefore, he had accomplished his design, For he had hardened the hearts of the Lamanites, and blinded their minds, and stirred them up to anger, Insomuch that he had gathered together a numerous host to go to battle against the Nephites; For he was determined because of the greatness of the number of his people to overpower the Nephites and to bring them into bondage."},{"time":1536.74,"text":"126. And thus he did appoint chief captains of the Zoramites, They being the most acquainted with the strength of the Nephites and their places of resort and the weakest parts of their cities; Therefore, he appointed them to be chief captains over his armies."},{"time":1552.0,"text":"127. And it came to pass that they took their camp and moved forth toward the Land of Zarahemla in the wilderness."},{"time":1561.71,"text":"128. Now it came to pass that while Amalickiah had thus been obtaining power by fraud and deceit, Moroni, on the other hand, had been a preparing the minds of the people to be faithful unto the Lord their God."},{"time":1571.42,"text":"129. Yea, he had been strengthening the armies of the Nephites and erecting small forts, or places of resort, Throwing up banks of earth round about to encircle his armies, and also building walls of stone to encircle them about, Round about their cities and the borders of their lands, yea, all round about the land,"},{"time":1591.176,"text":"130. And in their weakest fortifications, he did place the greater number of men; And thus he did fortify and strengthen the land which was possessed by the Nephites."},{"time":1601.0,"text":"131. And thus he was preparing to support their liberty, their lands, their wives and their children and their peace, And that they might live unto the Lord their God, And that they might maintain that which was called by their enemies the cause of Christians."},{"time":1616.951,"text":"132. And Moroni was a strong and a mighty man - He was a man of a perfect understanding, Yea, a man that did not delight in bloodshed, A man whose soul did joy in the liberty and the freedom of his country and his brethren from bondage and slavery,"},{"time":1631.64,"text":"133. Yea, a man whose heart did swell with thanksgiving to his God for the many privileges and blessings which He bestowed upon His people, A man who did labor exceedingly for the welfare and safety of his people,"},{"time":1644.9,"text":"134. Yea, and he was a man who was firm in the faith of Christ - And he had sworn with an oath to defend his people, his rights and his country and his religion, even to the loss of his blood."},{"time":1657.548,"text":"135. Now the Nephites were taught to defend themselves against their enemies, even to the shedding of blood if it were necessary;"},{"time":1665.454,"text":"136. Yea, and they were also taught never to give an offense, Yea, and never to raise the sword, except it were against an enemy, except it were to preserve their lives."},{"time":1676.838,"text":"137. And this was their faith - That by so doing, God would prosper them in the land, Or in other words, if they were faithful in keeping the commandments of God, that He would prosper them in the land, Yea, warn them to flee or to prepare for war, according to their danger,"},{"time":1693.591,"text":"138. And also that God would make it known unto them whither they should go to defend themselves against their enemies, And by so doing the Lord would deliver them. And this was the faith of Moroni,"},{"time":1706.52,"text":"139. And his heart did glory in it - Not in the shedding of blood, but in doing good - in preserving his people, yea, in keeping the commandments of God, yea, and resisting iniquity."},{"time":1719.099,"text":"140. Yea, verily, verily I say unto you, if all men had been and were and ever would be like unto Moroni, Behold, the very powers of hell would have been shaken forever, Yea, the devil would never have any power over the hearts of the children of men;"},{"time":1738.095,"text":"141. Behold, he was a man like unto Ammon, the son of Mosiah, Yea, and even the other sons of Mosiah, Yea, and also Alma and his sons, for they were all men of God."},{"time":1750.989,"text":"142. Now behold, Helaman and his brethren were no less serviceable unto the people than was Moroni, For they did preach the word of God, And they did baptize unto repentance all men whosoever would hearken unto their words."},{"time":1765.12,"text":"143. And thus they went forth; And the people did humble themselves because of their words, insomuch that they were highly favored of the Lord. And thus they were free from wars and contentions among themselves, yea, even for the space of four years."},{"time":1781.205,"text":"144. But, as I have said, in the latter end of the nineteenth year, notwithstanding their peace amongst themselves, They were compelled reluctantly to contend with their brethren the Lamanites;"},{"time":1792.96,"text":"145. Yea, and in fine, their wars never did cease for the space of many years with the Lamanites, notwithstanding their much reluctance."},{"time":1802.187,"text":"146. Now they were sorry to take up arms against the Lamanites because they did not delight in the shedding of blood; Yea, and this was not all - They were sorry to be the means of sending so many of their brethren out of this world into an eternal world unprepared to meet their God;"},{"time":1819.28,"text":"147. Nevertheless, they could not suffer to lay down their lives, that their wives and their children should be massacred by the barbarous cruelty of those who were once their brethren, Yea, and had dissented from their church, And had left them and had gone to destroy them by joining the Lamanites;"},{"time":1835.995,"text":"148. Yea, they could not bear that their brethren should rejoice over the blood of the Nephites so long as there were any who should keep the commandments of God, For the promises of the Lord were if they should keep His commandments, they should prosper in the land."},{"time":1850.12,"text":"149. And now it came to pass in the eleventh month of the nineteenth year, on the tenth day of the month, The armies of the Lamanites were seen approaching toward the Land of Ammonihah;"},{"time":1861.708,"text":"150. And behold, the city had been rebuilt; And Moroni had stationed an army by the borders of the city, And they had cast up dirt round about to shield them from the arrows and the stones of the Lamanites, For behold, they fought with stones and with arrows."},{"time":1878.96,"text":"151. Behold, I said that the City of Ammonihah had been rebuilt - I say unto you, yea, that it was in part rebuilt - And because the Lamanites had destroyed it once because of the iniquity of the people, they supposed that it would again become an easy prey for them."},{"time":1895.253,"text":"152. But behold, how great was their disappointment, For behold, the Nephites had dug up a ridge of earth round about them which was so high that the Lamanites could not cast their stones and their arrows at them that they might take effect, Neither could they come upon them, save it was by their place of entrance."},{"time":1912.8,"text":"153. Now at this time the chief captains of the Lamanites were astonished exceedingly because of the wisdom of the Nephites in preparing their places of security."},{"time":1921.787,"text":"154. Now the leaders of the Lamanites had supposed, because of the greatness of their numbers, Yea, they supposed that they should be privileged to come upon them as they had hitherto done;"},{"time":1933.158,"text":"155. Yea, and they had also prepared themselves with shields and with breastplates, And they had also prepared themselves with garments of skins, yea, very thick garments to cover their nakedness;"},{"time":1945.733,"text":"156. And being thus prepared, they supposed that they should easily overpower and subject their brethren to the yoke of bondage, or slay and massacre them, according to their pleasure;"},{"time":1957.168,"text":"157. But behold, to their uttermost astonishment, they were prepared for them in a manner which never had been known among all the children of Lehi."},{"time":1966.16,"text":"158. Now they were prepared for the Lamanites, to battle after the manner of the instructions of Moroni."},{"time":1973.04,"text":"159. And it came to pass that the Lamanites, or the Amalickiahites, were exceedingly astonished at their manner of preparation for war."},{"time":1984.076,"text":"160. Now if King Amalickiah had come down out of the Land of Nephi at the head of his army, Perhaps he would have caused the Lamanites to have attacked the Nephites at the City of Ammonihah, For behold, he did care not for the blood of his people."},{"time":1997.971,"text":"161. But behold, Amalickiah did not come down himself to battle;"},{"time":2000.83,"text":"162. And behold, his chief captains durst not attack the Nephites at the City of Ammonihah, For Moroni had altered the management of affairs among the Nephites insomuch that the Lamanites were disappointed in their places of retreat, And they could not come upon them,"},{"time":2016.682,"text":"163. Therefore, they retreated into the wilderness and took their camp and marched toward the Land of Noah, supposing that to be the next best place for them to come against the Nephites,"},{"time":2026.755,"text":"164. For they knew not that Moroni had fortified or had built forts of security for every city in all the land round about;"},{"time":2035.86,"text":"165. Therefore, they marched forward to the Land of Noah with a firm determination, Yea, their chief captains came forward and took an oath that they would destroy the people of that city."},{"time":2047.713,"text":"166. But behold, to their astonishment, the City of Noah - which had hitherto been a weak place - had now, by the means of Moroni, become strong, yea, even to exceed the strength of the City Ammonihah."},{"time":2061.689,"text":"167. And now behold, this was wisdom in Moroni, For he had supposed that they would be frightened at the City Ammonihah, And as the City of Noah had hitherto been the weakest part of the land, Therefore, they would march thither to battle; And thus it was according to his desires."},{"time":2078.433,"text":"168. And behold, Moroni had appointed Lehi to be chief captain over the men of that city, And it was that same Lehi which fought with the Lamanites in the valley on the east of the River Sidon."},{"time":2090.131,"text":"169. And now behold, it came to pass that when the Lamanites had found that Lehi commanded the city, They were again disappointed, for they feared Lehi exceedingly; Nevertheless, their chief captains had sworn with an oath to attack the city, Therefore, they brought up their armies."},{"time":2107.104,"text":"170. Now behold, the Lamanites could not get into their forts of security by any other way, save by the entrance, Because of the highness of the bank which had been thrown up and the depth of the ditch which had been dug round about, save it were by the entrance."},{"time":2122.127,"text":"171. And thus were the Nephites prepared to destroy all such as should attempt to climb up to enter the fort by any other way, by casting over stones and arrows at them;"},{"time":2133.44,"text":"172. Thus they were prepared - yea, a body of their most strong men with their swords and their slings - to smite down all who should attempt to come into their place of security by the place of entrance; And thus were they prepared to defend themselves against the Lamanites."},{"time":2149.92,"text":"173. And it came to pass that the captains of the Lamanites brought up their armies before the place of entrance, And began to contend with the Nephites, to get into their place of security;"},{"time":2161.04,"text":"174. But behold, they were driven back, from time to time, insomuch that they were slain with an immense slaughter."},{"time":2167.605,"text":"175. Now when they found that they could not obtain power over the Nephites by the pass, They began to dig down their banks of earth that they might obtain a pass to their armies, that they might have an equal chance to fight;"},{"time":2181.44,"text":"176. But behold, in these attempts, they were swept off by the stones and the arrows which were thrown at them, And instead of filling up their ditches by pulling down the banks of earth, they were filled up in a measure with their dead and wounded bodies."},{"time":2196.0,"text":"177. Thus the Nephites had all power over their enemies. And thus the Lamanites did attempt to destroy the Nephites, until their chief captains were all slain;"},{"time":2205.864,"text":"178. Yea, and more than a thousand of the Lamanites were slain, While on the other hand there was not a single soul of the Nephites which were slain -"},{"time":2215.727,"text":"179. There were about fifty which were wounded, which had been exposed to the arrows of the Lamanites through the pass, But they were shielded by their shields and their breastplates and their headplates, insomuch that their wounds were upon their legs, many of which were very severe."},{"time":2231.484,"text":"180. And it came to pass that when the Lamanites saw that their chief captains were all slain, they fled into the wilderness."},{"time":2239.244,"text":"181. And it came to pass that they returned to the Land of Nephi to inform their king, Amalickiah, who was a Nephite by birth, concerning their great loss."},{"time":2250.8,"text":"182. And it came to pass that he was exceeding angry with his people because he had not obtained his desire over the Nephites - He had not subjected them to the yoke of bondage;"},{"time":2262.463,"text":"183. Yea, he was exceeding wroth, And he did curse God and also Moroni, And swearing with an oath that he would drink his blood; And this because Moroni had kept the commandments of God in preparing for the safety of his people."},{"time":2274.126,"text":"184. And it came to pass that on the other hand, the people of Nephi did thank the Lord their God because of His miraculous power in delivering them from the hands of their enemies."},{"time":2286.0,"text":"185. And thus ended the nineteenth year of the reign of the judges over the people of Nephi; Yea, and there was continual peace among them and exceeding great prosperity in the church because of their heed and diligence which they gave unto the word of God, Which was declared unto them by Helaman and Shiblon and Coreanton and Ammon and his brethren, etc.,"},{"time":2303.1,"text":"186. Yea, and by all those which had been ordained by the holy order of God, Being baptized unto repentance and sent forth to preach among the people, etc."}]
};
