window.CHAPTER_DATA = {

  audioSrc: "https://archive.org/download/3-nephi-ch-7/3%20Nephi%20Ch%207.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 7"},{"time":6.917,"text":"1. And now it came to pass that when Jesus had ended these sayings, He cast His eyes round about on the multitude and saith unto them: \"Behold, ye have heard the things which I have taught before I ascended to My Father;"},{"time":17.198,"text":"2. Therefore, whoso remembereth these sayings of Mine and doeth them, him will I raise up at the last day.\""},{"time":29.334,"text":"3. And it came to pass that when Jesus had said these words, He perceived that there were some among them which marveled and wondered what He would concerning the law of Moses, For they understood not the saying that old things had passed away and that all things had become new;"},{"time":38.105,"text":"4. And He saith unto them: \"Marvel not that I said unto you that old things had passed away and that all things had become new -"},{"time":47.048,"text":"5. \"Behold, I say unto you that the law is fulfilled that was given unto Moses;"},{"time":52.74,"text":"6. Behold, I Am He that gave the law, And I Am He which covenanted with My people Israel; Therefore, the law in Me is fulfilled, For I have come to fulfill the law, Therefore, it hath an end."},{"time":66.859,"text":"7. \"Behold, I do not destroy the prophets, For as many as have not been fulfilled in Me, verily I say unto you, shall all be fulfilled;"},{"time":77.183,"text":"8. And because I said unto you that old things hath passed away, I do not destroy that which hath been spoken concerning things which are to come;"},{"time":85.945,"text":"9. For behold, the covenants which I have made with My people is not all fulfilled, But the law which was given unto Moses hath an end in Me."},{"time":95.627,"text":"10. \"Behold, I Am the law and the light; Look unto Me and endure to the end and ye shall live, For unto him that endureth to the end will I give eternal life."},{"time":106.355,"text":"11. \"Behold, I have given unto you the commandments, Therefore, keep My commandments -"},{"time":111.804,"text":"12. And this is the law and the prophets, for they truly testify of Me.\""},{"time":118.02,"text":"13. And now it came to pass that when Jesus had spoken these words, He said unto those twelve whom He had chosen: \"Ye are My disciples and ye are a light unto this people, which are a remnant of the house of Joseph;"},{"time":131.36,"text":"14. And behold, this is the land of your inheritance and the Father hath given it unto you;"},{"time":137.344,"text":"15. And not at any time hath the Father given Me commandment that I should tell it unto your brethren at Jerusalem, Neither at any time hath the Father given Me commandment that I should tell unto them concerning the other tribes of the house of Israel which the Father hath led away out of the land."},{"time":153.554,"text":"16. \"This much did the Father command Me that I should tell unto them - That other sheep I have which are not of this fold; Them also I must bring, And they shall hear My voice, And there shall be one fold and one Shepherd."},{"time":167.28,"text":"17. \"And now because of stiff-neckedness and unbelief, they understood not My word, Therefore, I was commanded to say no more of the Father concerning this thing unto them;"},{"time":179.12,"text":"18. But verily I say unto you that the Father hath commanded Me, and I tell it unto you, that ye were separated from among them because of their iniquity; Therefore, it is because of their iniquity that they know not of you."},{"time":191.992,"text":"19. \"And verily I say unto you again, that the other tribes hath the Father separated from them, And it is because of their iniquity that they know not of them."},{"time":200.952,"text":"20. \"And verily I say unto you that ye are they of which I said: ' Other sheep I have which are not of this fold; Them also I must bring, And they shall hear My voice, And there shall be one fold and one Shepherd '-"},{"time":214.033,"text":"21. And they understood Me not; For they supposed it had been the Gentiles, For they understood not that the Gentiles should be converted through their preaching;"},{"time":222.935,"text":"22. And they understood Me not, that I said they shall hear My voice; And they understood Me not, that the Gentiles should not at any time hear My voice, That I should not manifest Myself unto them, save it were by the Holy Ghost."},{"time":237.84,"text":"23. \"But behold, ye have both heard My voice and seen Me, And ye are My sheep, And ye are numbered among them which the Father hath given Me;"},{"time":246.737,"text":"24. And verily, verily I say unto you that I have other sheep which are not of this land, Neither of the Land of Jerusalem, Neither in any parts of that land round about whither I have been to minister;"},{"time":258.968,"text":"25. For they of which I speak are they which have not as yet heard My voice, Neither have I at any time manifested Myself unto them,"},{"time":268.16,"text":"26. But I have received a commandment of the Father that I should go unto them, And that they shall hear My voice and shall be numbered among My sheep, that there may be one fold and one Shepherd; Therefore, I go to show Myself unto them."},{"time":280.825,"text":"27. \"And I command you that ye shall write these things after that I am gone, That if it so be that My people at Jerusalem - they which have seen Me and been with Me in My ministry - Do not ask the Father in My name that they may receive a knowledge of you by the Holy Ghost, and also of the other tribes which they know not of,"},{"time":299.52,"text":"28. That these sayings which ye shall write shall be kept and shalt be manifested unto the Gentiles, That through the fullness of the Gentiles, the remnant of their seed - which shall be scattered forth upon the face of the earth because of their unbelief - may be brought in, or may be brought to a knowledge of Me, their Redeemer;"},{"time":316.824,"text":"29. And then will I gather them in from the four quarters of the earth; And then will I fulfill the covenant which the Father hath made unto all the people of the house of Israel."},{"time":326.968,"text":"30. \"And blessed are the Gentiles because of their belief in Me, in and of the Holy Ghost, which witness unto them of Me and of the Father;"},{"time":336.862,"text":"31. 'Behold, because of their belief in Me, ' saith the Father, 'and because of the unbelief of you, O house of Israel, In the latter day shall the truth come unto the Gentiles, that the fullness of these things shall be made known unto them."},{"time":353.453,"text":"32. 'But wo, ' saith the Father, 'unto the unbelieving of the Gentiles! ' For notwithstanding that they have come forth upon the face of this land and have scattered My people which are of the house of Israel, And My people which are of the house of Israel have been cast out from among them and have been trodden under feet by them,"},{"time":370.044,"text":"33. And because of the mercies of the Father unto the Gentiles, and also the judgments of the Father upon My people which are of the house of Israel - Verily, verily I say unto you that after all this - And I have caused My people which are of the house of Israel to be smitten, and to be afflicted, and to be slain, and to be cast out from among them, and to become hated by them, and to become a hiss and a byword among them -"},{"time":395.236,"text":"34. \"And thus commandeth the Father that I should say unto you: ' At that day when the Gentiles shall sin against My gospel, And shall reject the fullness of My gospel, And shall be lifted up in the pride of their hearts above all nations and above all the people of the whole earth, And shall be filled with all manner of lyings, and of deceits, and of mischiefs, and all manner of hypocrisy and murders, and priestcrafts and whoredoms, and of secret abominations -"},{"time":420.428,"text":"35. And if they shall do all these things, And shall reject the fullness of My gospel, Behold, ' saith the Father, 'I will bring the fullness of My gospel from among them;"},{"time":432.099,"text":"36. And then will I remember My covenant which I have made unto My people, O house of Israel, And I will bring My gospel unto them;"},{"time":441.2,"text":"37. And I will show unto thee, O house of Israel, that the Gentiles shall not have power over you, But I will remember My covenant unto you, O house of Israel, And ye shall come unto the knowledge of the fullness of My gospel."},{"time":455.76,"text":"38. 'But if the Gentiles will repent and return unto Me, ' saith the Father, 'Behold, they shall be numbered among My people, O house of Israel;"},{"time":464.348,"text":"39. And I will not suffer My people which are of the house of Israel to go through among them and tread them down, ' saith the Father;"},{"time":472.939,"text":"40. ' But if they will not return unto Me and hearken unto My voice, I will suffer them - yea, I will suffer My people, O house of Israel - that they shall go through among them and shall tread them down,"},{"time":485.549,"text":"41. And they shall be as salt that has lost its savor, which is thenceforth good for nothing but to be cast out and to be trodden underfoot of My people, O house of Israel.'"},{"time":496.088,"text":"42. \"Verily, verily I say unto you, thus hath the Father commanded Me that I should give unto this people this land for their inheritance;"},{"time":505.099,"text":"43. And when the words of the prophet Isaiah shall be fulfilled which saith: 'Thy watchmen shall lift up the voice, With the voice together shall they sing; For they shall see eye to eye when the Lord shall bring again Zion."},{"time":518.88,"text":"44. Break forth into joy! Sing together, ye waste places of Jerusalem! For the Lord hath comforted His people, He hath redeemed Jerusalem."},{"time":528.543,"text":"45. The Lord hath made bare His holy arm in the eyes of all the nations; And all the ends of the earth shall see the salvation of God! '\""}]
};
