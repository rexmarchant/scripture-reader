<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",
  chapter: "Chapter 5",
  audioSrc: "https://archive.org/download/3-nephi-ch-5/3%20Nephi%20Ch%205.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 5"},{"time":6.28,"text":"1. And now it came to pass that there were a great multitude gathered together of the people of Nephi, round about the temple which was in the Land Bountiful;"},{"time":12.56,"text":"2. And they were marveling and wondering one with another and were showing one to another the great and marvelous change which had taken place;"},{"time":20.405,"text":"3. And they were also conversing about this Jesus Christ of which the sign had been given concerning His death."},{"time":27.44,"text":"4. And it came to pass that while they were thus conversing one with another, They heard a voice as if it came out of heaven; And they cast their eyes round about, for they understood not the voice which they heard;"},{"time":40.24,"text":"5. And it was not a harsh voice, neither was it a loud voice, Nevertheless, and notwithstanding it being a small voice, it did pierce them that did hear to the center, Insomuch that there was no part of their frame that it did not cause to quake; Yea, it did pierce them to the very soul and did cause their hearts to burn."},{"time":59.006,"text":"6. And it came to pass that again they heard the voice and they understood it not; And again the third time they did hear the voice and did open their ears to hear it;"},{"time":68.951,"text":"7. And their eyes were toward the sound thereof; And they did look steadfastly toward heaven from whence the sound came. And behold, the third time they did understand the voice which they heard,"},{"time":81.751,"text":"8. And it saith unto them: \"Behold My beloved Son in whom I am well pleased, in whom I have glorified My name - Hear ye Him!\""},{"time":91.413,"text":"9. And it came to pass as they understood, they cast their eyes up again toward heaven; And behold, they saw a Man descending out of heaven;"},{"time":101.28,"text":"10. And He was clothed in a white robe, And He came down and stood in the midst of them; And the eyes of the whole multitude were turned upon Him, And they durst not open their mouths, even one to another; And they wist not what it meant, for they thought it was an angel that had appeared unto them."},{"time":117.423,"text":"11. And it came to pass that He stretched forth His hand and spake unto the people, saying: \"Behold, I Am Jesus Christ of which the prophets testified that should come into the world;"},{"time":128.659,"text":"12. And behold, I Am the light and the life of the world; And I have drunk out of that bitter cup which the Father hath given Me, And have glorified the Father in taking upon Me the sins of the world, in the which I have suffered the will of the Father in all things from the beginning.\""},{"time":146.32,"text":"13. And it came to pass that when Jesus had spake these words, the whole multitude fell to the earth, For they remembered that it had been prophesied among them that Christ should show Himself unto them after His ascension into heaven."},{"time":158.827,"text":"14. And it came to pass that the Lord spake unto them, saying: \"Arise and come forth unto Me, That ye may thrust your hands into My side, And also that ye may feel the prints of the nails in My hands and in My feet, That ye may know that I Am the God of Israel and the God of the whole earth and have been slain for the sins of the world.\""},{"time":178.584,"text":"15. And it came to pass that the multitude went forth and did thrust their hands into His side and did feel the prints of the nails in His hands and in His feet;"},{"time":189.524,"text":"16. And this they did do, going forth one by one, Until they had all gone forth, and did see with their eyes, and did feel with their hands, and did know of a surety, and did bear record, That it was He of whom it was written by the prophets that should come."},{"time":205.541,"text":"17. And it came to pass that when they had all gone forth and had witnessed for themselves, they did cry out with one accord, saying: \"Hosanna! Blessed be the name of the Most High God!\" And they did fall down at the feet of Jesus and did worship Him."},{"time":221.973,"text":"18. And it came to pass that He spake unto Nephi - for Nephi was among the multitude - and commanded him that he should come forth;"},{"time":231.36,"text":"19. And Nephi arose and went forth and bowed himself before the Lord and he did kiss His feet;"},{"time":238.2,"text":"20. And the Lord commanded him that he should arise, And he arose and stood before Him."},{"time":243.736,"text":"21. And the Lord said unto him: \"I give unto you power that ye shall baptize this people when I am again ascended into heaven.\""},{"time":252.245,"text":"22. And again the Lord called others and said unto them likewise; And He gave unto them power to baptize."},{"time":259.529,"text":"23. And He saith unto them: \"On this wise shall ye baptize - and there shall be no disputations among you -"},{"time":267.217,"text":"24. Verily I say unto you, that whosoever repenteth of his sins through your words and desireth to be baptized in My name, On this wise shall ye baptize them: Behold, ye shall go down and stand in the water and in My name shall ye baptize them."},{"time":283.373,"text":"25. \"And now behold, these are the words which ye shall say, calling them by name, saying, 'Having authority given me of Jesus Christ, I baptize you in the name of the Father and of the Son and of the Holy Ghost. Amen.'"},{"time":298.864,"text":"26. \"And then shall ye immerse them in the water and come forth again out of the water."},{"time":305.32,"text":"27. \"And after this manner shall ye baptize in My name.\"For behold, verily I say unto you that the Father and the Son and the Holy Ghost are one; And I Am in the Father and the Father in Me and the Father and I are one;"},{"time":319.04,"text":"28. And according as I have commanded you, thus shall ye baptize;"},{"time":325.44,"text":"29. And there shall be no disputations among you as there hath hitherto been, Neither shall there be disputations among you concerning the points of My doctrine as there hath hitherto been;"},{"time":336.207,"text":"30. For verily, verily I say unto you, he that hath the spirit of contention is not of Me, but is of the devil which is the father of contention, And he stirreth up the hearts of men to contend with anger one with another."},{"time":349.076,"text":"31. \"Behold, this is not My doctrine - to stir up the hearts of men to anger against one another; But this is My doctrine - that such things should be done away."},{"time":360.7,"text":"32. \"Behold, verily, verily I say unto you, I will declare unto you My doctrine; And this is My doctrine and it is the doctrine which the Father hath given unto Me -"},{"time":371.66,"text":"33. And I bear record of the Father, And the Father beareth record of Me, And the Holy Ghost beareth record of the Father and Me - And I bear record that the Father commandeth all men everywhere to repent and believe in Me;"},{"time":386.16,"text":"34. And whoso believeth in Me and is baptized, the same shall be saved, And they are they which shall inherit the kingdom of God;"},{"time":394.64,"text":"35. And whoso believeth not in Me and is not baptized shall be damned!"},{"time":399.44,"text":"36. \"Verily, verily I say unto you that this is My doctrine, And I bear record of it from the Father; And whoso believeth in Me, believeth in the Father also;"},{"time":411.36,"text":"37. And unto him will the Father bear record of Me, For He will visit him with fire and with the Holy Ghost;"},{"time":417.567,"text":"38. And thus will the Father bear record of Me; And the Holy Ghost will bear record unto him of the Father and Me, For the Father and I and the Holy Ghost are one."},{"time":429.76,"text":"39. \"And again I say unto you, Ye must repent, and become as a little child, and be baptized in My name, Or ye can in no wise receive these things!"},{"time":440.524,"text":"40. \"And again I say unto you, Ye must repent, and be baptized in My name, and become as a little child, Or ye can in nowise inherit the kingdom of God!"},{"time":451.068,"text":"41. \"Verily, verily I say unto you that this is My doctrine; And whoso buildeth upon this, buildeth upon My rock, And the gates of hell shall not prevail against them."},{"time":463.44,"text":"42. \"And whoso shall declare more or less than this and establish it for My doctrine, The same cometh of evil and is not built upon My rock; But he buildeth upon a sandy foundation, And the gates of hell standeth open to receive such when the floods come and the winds beat upon them;"},{"time":478.791,"text":"43. Therefore, go forth unto this people and declare the words which I have spoken unto the ends of the earth.\""},{"time":486.305,"text":"44. And it came to pass that when Jesus had spake these words unto Nephi and to those which had been called - now the number of them which had been called and received power and authority to baptize were twelve -"},{"time":498.49,"text":"45. And behold, He stretched forth His hand unto the multitude and cried unto them, saying: \"Blessed are ye if ye shall give heed unto the words of these twelve which I have chosen from among you to minister unto you and to be your servants;"},{"time":513.737,"text":"46. And unto them I have given power that they may baptize you with water; And after that ye are baptized with water, Behold, I will baptize you with fire and with the Holy Ghost."},{"time":525.724,"text":"47. \"Therefore, blessed are ye if ye shall believe in Me and be baptized after that ye have seen Me and know that I Am."},{"time":534.341,"text":"48. \"And again, more blessed are they which shall believe in your words because that ye shall testify that ye have seen Me and that ye know that I Am;"},{"time":543.348,"text":"49. Yea, blessed are they which shall believe in your words and come down into the depths of humility and be baptized, For they shall be visited with fire and with the Holy Ghost and shall receive a remission of their sins."},{"time":557.493,"text":"50. \"Yea, blessed are the poor in spirit which cometh unto Me, for theirs is the kingdom of heaven."},{"time":564.64,"text":"51. \"And again, blessed are all they that mourn, for they shall be comforted."},{"time":569.698,"text":"52. \"And blessed are the meek, for they shall inherit the earth."},{"time":573.901,"text":"53. \"And blessed are all they which do hunger and thirst after righteousness, for they shall be filled with the Holy Ghost."},{"time":582.507,"text":"54. \"And blessed are the merciful, for they shall obtain mercy."},{"time":587.52,"text":"55. \"And blessed are all the pure in heart, for they shall see God."},{"time":592.884,"text":"56. \"And blessed are all the peacemakers, for they shall be called the children of God."},{"time":598.536,"text":"57. \"And blessed are all they which are persecuted for My name's sake, for theirs is the kingdom of heaven."},{"time":605.564,"text":"58. \"And blessed are ye when men shall revile you and persecute you and shall say all manner of evil against you falsely for My sake,"},{"time":614.88,"text":"59. for ye shall have great joy and be exceeding glad, for great shall be your reward in heaven; For so persecuted they the prophets which were before you."},{"time":625.36,"text":"60. \"Verily, verily I say unto you, and I give unto you to be the salt of the earth, But if the salt shall lose its savor, wherewith shall the earth be salted? The salt shall be thenceforth good for nothing, but to be cast out and to be trodden underfoot of men."},{"time":642.4,"text":"61. \"Verily, verily I say unto you, I give unto you to be the light of this people; A city that is set on a hill cannot be hid;"},{"time":651.086,"text":"62. Behold, do men light a candle and put it under a bushel? Nay, but on a candlestick and it giveth light to all that are in the house;"},{"time":660.56,"text":"63. Therefore, let your light so shine before this people, that they may see your good works and glorify your Father which is in heaven."},{"time":667.84,"text":"64. \"Think not that I am come to destroy the law or the prophets; I am not come to destroy, but to fulfill;"},{"time":675.63,"text":"65. For verily I say unto you, one jot nor one tittle hath not passed away from the law, but in Me it hath all been fulfilled."},{"time":684.4,"text":"66. \"And behold, I have given unto you the law and the commandments of My Father, that ye shall believe in Me, And that ye shall repent of your sins and come unto Me with a broken heart and a contrite spirit;"},{"time":698.748,"text":"67. Behold, ye have the commandments before you and the law is fulfilled, Therefore, come unto Me and be ye saved;"},{"time":707.129,"text":"68. For verily I say unto you, that except ye shall keep My commandments which I have commanded you at this time, Ye shall in no case enter into the kingdom of heaven."},{"time":717.417,"text":"69. \"Ye have heard that it hath been said by them of old time - and it is also written before you - that, ' Thou shalt not kill and whosoever shall kill shall be in danger of the judgment of God ';"},{"time":730.144,"text":"70. But I say unto you, that whosoever is angry with his brother shall be in danger of His judgment; And whosoever shall say to his brother, 'Raca! ' shall be in danger of the council; And whosoever shall say, 'Thou fool! ' shall be in danger of hell fire;"},{"time":749.049,"text":"71. Therefore, if ye shall come unto Me, or shall desire to come unto Me, and rememberest that thy brother hath aught against thee,"},{"time":757.297,"text":"72. Go thy way unto thy brother and first be reconciled to thy brother and then come unto Me with full purpose of heart and I will receive you."},{"time":767.31,"text":"73. \"Agree with thine adversary quickly while thou art in the way with him, lest at any time he shall get thee and thou shalt be cast into prison;"},{"time":776.56,"text":"74. Verily I say unto thee, thou shalt by no means come out thence until thou hast paid the uttermost senine;"},{"time":783.065,"text":"75. And while ye are in prison, can ye pay even one senine? Verily, verily I say unto you, Nay."},{"time":792.692,"text":"76. \"Behold, it is written by them of old time that, ' Thou shalt not commit adultery ';"},{"time":801.2,"text":"77. But I say unto you that whosoever looketh on a woman to lust after her hath committed adultery already in his heart."},{"time":807.858,"text":"78. \"Behold, I give unto you a commandment that ye suffer none of these things to enter into your heart, For it is better that ye should deny yourselves of these things, wherein ye will take up your cross, than that ye should be cast into hell."},{"time":823.318,"text":"79. \"It hath been written that, ' Whosoever shall put away his wife, let him give her a writing of divorcement ';"},{"time":831.68,"text":"80. Verily, verily I say unto you that whosoever shall put away his wife, saving for the cause of fornication, causeth her to commit adultery, And whoso shall marry her who is divorced committeth adultery."},{"time":843.73,"text":"81. \"And again, it is written, ' Thou shalt not forswear thyself but shalt perform unto the Lord thine oaths ';"},{"time":852.381,"text":"82. But verily I say unto you, swear not at all - neither by heaven, for it is God's throne, nor by the earth, for it is His footstool, Neither shalt thou swear by thy head, because thou canst not make one hair black or white;"},{"time":869.826,"text":"83. But let your communication be, ' Yea, yea '; ' Nay, nay '; For whatsoever cometh of more than these are evil."},{"time":879.68,"text":"84. \"And behold, it is written, ' An eye for an eye and a tooth for a tooth ';"},{"time":886.4,"text":"85. But I say unto you that ye shall not resist evil, But whosoever shall smite thee on thy right cheek, turn to him the other also;"},{"time":894.011,"text":"86. And if any man will sue thee at the law and take away thy coat, let him have thy cloak also;"},{"time":901.743,"text":"87. And whosoever shall compel thee to go a mile, go with him twain;"},{"time":907.6,"text":"88. Give to him that asketh thee, And to him that would borrow of thee, turn thou not away."},{"time":914.24,"text":"89. \"And behold, it is written also that, ' Thou shalt love thy neighbor and hate thine enemy ';"},{"time":922.0,"text":"90. But behold, I say unto you, love your enemies, bless them that curse you, do good to them that hate you; And pray for them which despitefully use you and persecute you,"},{"time":934.24,"text":"91. that ye may be the children of your Father which is in heaven, For He maketh His sun to rise on the evil and on the good. \"Therefore, those things which were of old time, which were under the law in Me, are all fulfilled;"},{"time":948.428,"text":"92. Old things are done away and all things have become new, Therefore, I would that ye should be perfect even as I or your Father which is in heaven is perfect."},{"time":959.6,"text":"93. \"Verily, verily I say that I would that ye should do alms unto the poor; But take heed that ye do not your alms before men to be seen of them, Otherwise ye have no reward of your Father which is in heaven;"},{"time":971.406,"text":"94. Therefore, when ye shall do your alms, do not sound a trumpet before you as will hypocrites do in the synagogues and in the streets, that they may have glory of men; Verily I say unto you, they have their reward;"},{"time":985.335,"text":"95. But when thou doest alms, let not thy left hand know what thy right hand doeth,"},{"time":991.502,"text":"96. that thine alms may be in secret; And thy Father which seeth in secret, Himself shall reward thee openly."},{"time":999.52,"text":"97. \"And when thou prayest, thou shalt not do as the hypocrites, For they love to pray standing in the synagogues and in the corners of the streets, that they may be seen of men; Verily I say unto you, they have their reward;"},{"time":1014.36,"text":"98. But thou, when thou prayest, enter into thy closet, And when thou hast shut thy door, pray to thy Father which is in secret, And thy Father, which seeth in secret, shall reward thee openly;"},{"time":1027.271,"text":"99. But when ye pray, use not vain repetitions as the heathen, For they think that they shall be heard for their much speaking;"},{"time":1035.867,"text":"100. Be not ye therefore like unto them, for your Father knoweth what things ye have need of before ye ask Him."},{"time":1043.28,"text":"101. \"After this manner, therefore, pray ye:"},{"time":1046.55,"text":"102. 'Our Father which art in heaven, Hallowed be Thy name."},{"time":1052.0,"text":"103. Thy will be done in earth, as it is in heaven."},{"time":1056.651,"text":"104. And forgive us our debts, as we forgive our debtors."},{"time":1060.88,"text":"105. And lead us not into temptation, But deliver us from evil."},{"time":1065.6,"text":"106. For Thine is the kingdom and the power and the glory forever! Amen.'"},{"time":1072.0,"text":"107. \"For if ye forgive men their trespasses, your heavenly Father will also forgive you, But if ye forgive not men their trespasses, neither will your Father forgive your trespasses."},{"time":1083.36,"text":"108. \"Moreover, when ye fast, be not as the hypocrites, of a sad countenance, For they disfigure their faces that they may appear unto men to fast; Verily I say unto you, they have their reward;"},{"time":1095.88,"text":"109. But thou, when thou fasteth, anoint thy head and wash thy face, That thou appear not unto men to fast, but unto thy Father, which is in secret, And thy Father, which seeth in secret, shall reward thee openly."},{"time":1112.0,"text":"110. \"Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt and thieves break through and steal,"},{"time":1119.16,"text":"111. But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt and where thieves do not break through nor steal;"},{"time":1128.72,"text":"112. For where your treasure is there will your heart be also."},{"time":1132.96,"text":"113. \"The light of the body is the eye; If therefore thine eye be single, thy whole body shall be full of light;"},{"time":1141.069,"text":"114. But if thine eye be evil, thy whole body shall be full of darkness; If therefore the light that is in thee be darkness, how great is that darkness!"},{"time":1149.178,"text":"115. \"No man can serve two masters, Or either he will hate the one and love the other, Or else he will hold to the one and despise the other; Ye cannot serve God and mammon.\""}]
};
