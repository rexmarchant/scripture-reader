<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 13",
  audioSrc: "https://archive.org/download/alma-ch-13/Alma%20Ch%2013.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 13"},{"time":9.612,"text":"1. Now when Ammon and his brethren separated themselves in the borders of the land of the Lamanites, Behold, Aaron took his journey toward the land which was called by the Lamanites, Jerusalem, calling it after the land of their fathers' nativity; And it was away joining the borders of Mormon;"},{"time":19.224,"text":"2. Now the Lamanites and the Amalekites and the people of Amulon had built a great city which was called Jerusalem."},{"time":27.403,"text":"3. Now the Lamanites of themselves were sufficiently hardened, but the Amalekites and the Amulonites were still harder; Therefore, they did cause the Lamanites that they should harden their hearts, that they should wax stronger in wickedness and their abominations."},{"time":41.636,"text":"4. And it came to pass that Aaron came to the City of Jerusalem and firstly began to preach to the Amalekites;"},{"time":49.524,"text":"5. And he began to preach to them in their synagogues, for they had built synagogues after the order of the Nehors, for many of the Amalekites and the Amulonites were after the order of the Nehors."},{"time":62.075,"text":"6. Therefore, as Aaron entered into one of their synagogues to preach unto the people, and as he was speaking unto them, Behold, there arose an Amalekite and began to contend with him, saying:"},{"time":74.74,"text":"7. \"What is that, that thou hast testified? Hast thou seen an angel? Why do not angels appear unto us? Behold, are not this people as good as thy people? Thou also sayest except we repent, we shall perish;"},{"time":92.52,"text":"8. How knowest thou the thought and intent of our heart? How knowest thou that we have cause to repent? How knowest thou that we are not a righteous people?"},{"time":103.6,"text":"9. Behold, we have built sanctuaries and we do assemble ourselves together to worship God; We do believe that God will save all men.\""},{"time":113.693,"text":"10. Now Aaron said unto him: \"Believest thou that the Son of God shall come to redeem mankind from their sins?\""},{"time":118.51,"text":"11. And the man saith unto him: \"We do not believe that thou knowest any such thing; We do not believe in these foolish traditions;"},{"time":123.328,"text":"12. We do not believe that thou knowest of things to come; Neither do we believe that thy fathers and also that our fathers did know concerning the things which they spake, of that which is to come.\""},{"time":142.32,"text":"13. Now Aaron began to open the scripture unto them concerning the coming of Christ, and also concerning the resurrection of the dead, And that there could be no redemption for mankind save it were through the death and sufferings of Christ and the atonement of His blood."},{"time":156.88,"text":"14. And it came to pass that as he began to expound these things unto them, they were angry with him and began to mock him, And they would not hear the words which he spake;"},{"time":167.52,"text":"15. Therefore, when he saw that they would not hear his words, he departed out of the synagogue and came over to a village which was called Ani-Anti; And there he found Muloki a preaching the word unto them, and also Ammah and his brethren, And they contended with many about the word."},{"time":184.72,"text":"16. And it came to pass that they saw that the people would harden their hearts, Therefore, they departed and came over into the Land of Middoni;"},{"time":192.64,"text":"17. And they did preach the word unto many and few believed on the words which they taught."},{"time":199.76,"text":"18. Nevertheless, Aaron and a certain number of his brethren were taken and cast into prison, And the remainder of them fled out of the Land of Middoni unto the regions round about;"},{"time":210.88,"text":"19. And those which were cast into prison suffered many things; And they were delivered by the hand of Lamoni and Ammon, And they were fed and clothed,"},{"time":219.549,"text":"20. And they went forth again to declare the word; And thus they were delivered for the first time out of prison; And thus they had suffered."},{"time":228.72,"text":"21. And they went forth whithersoever they were led by the Spirit of the Lord, preaching the word of God in every synagogue of the Amalekites, or in every assembly of the Lamanites where they could be admitted."},{"time":239.44,"text":"22. And it came to pass that the Lord began to bless them insomuch that they brought many to the knowledge of the truth, Yea, they did convince many of their sins and of the tradition of their fathers which were not correct."},{"time":252.429,"text":"23. And it came to pass that Ammon and Lamoni returned from the Land of Middoni to the Land of Ishmael, which was the land of their inheritance;"},{"time":260.41,"text":"24. And King Lamoni would not suffer that Ammon should serve him or be his servant; But he caused that there should be synagogues built in the Land of Ishmael, And he caused that his people, or the people which were under his reign, should assemble themselves together;"},{"time":276.114,"text":"25. And he did rejoice over them and he did teach them many things."},{"time":281.752,"text":"26. And he did also declare unto them that they were a people which were under him and that they were a free people, that they were free from the oppressions of the king, his father, For that his father had granted unto him that he might reign over the people which were in the Land of Ishmael and in all the land round about."},{"time":298.851,"text":"27. And he also declared unto them that they might have the liberty of worshipping the Lord their God according to their desires in whatsoever place they were in, if it were in the land which was under the reign of King Lamoni;"},{"time":311.832,"text":"28. And Ammon did preach unto the people of King Lamoni. And it came to pass that he did teach them all things concerning things pertaining to righteousness;"},{"time":321.36,"text":"29. And he did exhort them daily, with all diligence; And they gave heed unto his word and they were zealous for keeping the commandments of God."},{"time":331.6,"text":"30. Now as Ammon was thus teaching the people of Lamoni continually, we will return to the account of Aaron and his other brethren -"},{"time":338.964,"text":"31. For after he departed from the Land of Middoni, he was led by the Spirit to the Land of Nephi, even to the house of the king which was over all the land, save it were the Land of Ishmael; And he was the father of Lamoni."},{"time":353.92,"text":"32. And it came to pass that he went in unto him, into the king's palace with his brethren, and bowed himself before the king and said unto him: \"Behold, O king, we are the brethren of Ammon whom thou hast delivered out of prison; And now, O king, if thou wilt spare our lives, we will be thy servants.\""},{"time":369.68,"text":"33. And the king saith unto them: \"Arise, for I will grant unto you your lives, And I will not suffer that ye shall be my servants, but I will insist that ye shall administer unto me;"},{"time":385.44,"text":"34. For I have been somewhat troubled in mind because of the generosity and the greatness of the words of thy brother Ammon, And I desire to know the cause why he has not come up out of Middoni with thee.\""},{"time":393.751,"text":"35. And Aaron saith unto the king: \"Behold, the Spirit of the Lord hath called him another way; He hath gone to the Land of Ishmael to teach the people of Lamoni.\""},{"time":409.659,"text":"36. Now the king saith unto them: \"What is this that ye have said concerning the Spirit of the Lord? Behold, this is the thing which doth trouble me;"},{"time":417.256,"text":"37. And also, what is this that Ammon said, ' If ye will repent, ye shall be saved, And if ye will not repent, ye shall be cast off at the last day '?\""},{"time":427.01,"text":"38. And Aaron answered him and said unto him: \"Believest thou that there is a God?\""},{"time":438.09,"text":"39. And the king saith: \"I know that the Amalekites say that there is a God, And I have granted unto them that they should build sanctuaries, that they might assemble themselves together to worship Him; And if now thou sayest there is a God, behold, I will believe.\""},{"time":449.171,"text":"40. And now when Aaron heard this, his heart began to rejoice and he saith: \"Behold, assuredly as thou livest, O king, there is a God.\""},{"time":458.785,"text":"41. And the king saith: \"Is God that Great Spirit that brought our fathers out of the Land of Jerusalem?\""},{"time":468.4,"text":"42. And Aaron said unto him: \"Yea, He is that Great Spirit; And He created all things, both in heaven and in earth; Believest thou this?\""},{"time":478.817,"text":"43. And he saith: \"Yea, I believe that the Great Spirit created all things, And I desire that ye should tell me concerning all these things, And I will believe thy words.\""},{"time":489.234,"text":"44. And it came to pass that when Aaron saw that the king would believe his words, he began from the creation of Adam, reading the scriptures unto the king - How God created man after His own image, And that God gave him commandments, And that because of transgression, man had fallen."},{"time":506.925,"text":"45. And Aaron did expound unto him the scriptures from the creation of Adam, Laying the fall of man before him, and their carnal state, And also the plan of redemption which was prepared from the foundation of the world through Christ for all whosoever would believe on His name;"},{"time":523.013,"text":"46. And since man had fallen, he could not merit anything of himself; But the sufferings and death of Christ atoneth for their sins through faith and repentance, etc.,"},{"time":534.8,"text":"47. And that He breaketh the bands of death, that the grave shall have no victory, And that the sting of death should be swallowed up in the hopes of glory; And Aaron did expound all these things unto the king."},{"time":546.535,"text":"48. And it came to pass that after Aaron had expounded these things unto him, the king saith: \"What shall I do that I may have this eternal life of which thou hast spoken?"},{"time":557.097,"text":"49. Yea, what shall I do that I may be born of God, having this wicked spirit rooted out of my breast, And receive His Spirit, that I may be filled with joy, that I may not be cast off at the last day?\""},{"time":563.57,"text":"50. Behold, saith he: \"I will give up all that I possess; Yea, I will forsake my kingdom that I may receive this great joy.\""},{"time":584.501,"text":"51. But Aaron saith unto him: \"If thou desirest this thing, if thou will bow down before God, Yea, if thou repent of all thy sins and will bow down before God and call on His name in faith, believing that ye shall receive, Then shalt thou receive the hope which thou desirest.\""},{"time":598.96,"text":"52. And it came to pass that when Aaron had said these words, the king did bow down before the Lord upon his knees, Yea, even he did prostrate himself upon the earth and cried mightily, saying: \"O God, Aaron hath told me that there is a God;"},{"time":613.812,"text":"53. And if there is a God and if Thou art God, wilt Thou make Thyself known unto me? And I will give away all my sins to know Thee and that I may be raised from the dead and be saved at the last day!\""},{"time":628.076,"text":"54. And now when the king had said these words, he was struck as if he were dead."},{"time":633.81,"text":"55. And it came to pass that his servants ran and told the queen all that had happened unto the king"},{"time":640.007,"text":"56. and she came in unto the king; And when she saw him lay as if he were dead, and also Aaron and his brethren standing as though they had been the cause of his fall, She was angry with them and commanded that her servants, or the servants of the king, should take them and slay them."},{"time":656.773,"text":"57. Now the servants had seen the cause of the king's fall, Therefore, they durst not lay their hands on Aaron and his brethren"},{"time":665.76,"text":"58. and they pled with the queen, saying: \"Why commandest thou that we should slay these men when behold, one of them is mightier than us all? Therefore, we shall fall before them.\""},{"time":677.36,"text":"59. Now when the queen saw the fear of the servants, she also began to fear exceedingly, lest there should some evil come upon her,"},{"time":687.04,"text":"60. And she commanded her servants that they should go and call the people, that they might slay Aaron and his brethren."},{"time":693.878,"text":"61. Now when Aaron saw the determination of the queen - and he also, knowing the hardness of the hearts of the people, feared lest that a multitude should assemble themselves together and there should be a great contention and a disturbance among them -"},{"time":709.28,"text":"62. Therefore, he put forth his hand and raised the king from the earth and said unto him, \"Stand!\" And he stood upon his feet, receiving his strength;"},{"time":719.078,"text":"63. Now this was done in the presence of the queen and many of his servants, And when they saw it, they greatly marveled and began to fear;"},{"time":729.12,"text":"64. And the king stood forth and began to minister unto them, And he did minister unto them insomuch that his whole household were converted unto the Lord."},{"time":738.48,"text":"65. Now there was a multitude gathered together because of the commandment of the queen; And there began to be great murmurings among them because of Aaron and his brethren,"},{"time":748.551,"text":"66. But the king stood forth among them and administered unto them. And it came to pass that they were pacified toward Aaron and his brethren which were with him."},{"time":756.794,"text":"67. And it came to pass that when the king saw that the people were pacified, he caused that Aaron and his brethren should stand forth in the midst of the multitude and that they should preach the word unto them."},{"time":777.559,"text":"68. And it came to pass that the king sent a proclamation throughout all the land, amongst all his people which were in all his land, which were in all the regions round about, Which was bordering even to the sea on the east and on the west and which was divided from the Land of Zarahemla by a narrow strip of wilderness,"},{"time":790.08,"text":"69. Which ran from the Sea East even to the Sea West and round about on the borders of the seashore and the borders of the wilderness which was on the north by the Land of Zarahemla, Through the borders of Manti, by the head of the River Sidon, running from the east toward the west; And thus were the Lamanites and the Nephites divided."},{"time":808.622,"text":"70. Now the more idle part of the Lamanites lived in the wilderness and dwelt in tents; And they were spread through the wilderness on the west in the Land of Nephi,"},{"time":819.44,"text":"71. Yea, and also on the west of the Land of Zarahemla, in the borders by the seashore, And on the west in the Land of Nephi in the place of their fathers' first inheritance, and thus bordering along by the seashore;"},{"time":831.995,"text":"72. And also there were many Lamanites on the east by the seashore whither the Nephites had driven them; And thus the Nephites were nearly surrounded by the Lamanites."},{"time":841.824,"text":"73. Nevertheless, the Nephites had taken possession of all the northern parts of the land bordering on the wilderness at the head of the River Sidon, from the east to the west, round about on the wilderness sides on the north, Even until they came to the land which they called Bountiful;"},{"time":857.85,"text":"74. And it bordered upon the land which they called Desolation, It being so far northward that it came into the land which had been peopled and had been destroyed - of whose bones we have spoken - which was discovered by the people of Zarahemla, It being the place of their first landing; And they came from there up into the South Wilderness;"},{"time":877.798,"text":"75. Thus the land on the northward was called Desolation, And the land on the southward was called Bountiful, It being the wilderness which was filled with all manner of wild animals of every kind, a part of which had come from the Land Northward for food."},{"time":892.061,"text":"76. And now it was only the distance of a day and a half's journey for a Nephite on the line Bountiful and the Land Desolation, from the east to the West Sea;"},{"time":903.507,"text":"77. And thus the Land of Nephi and the Land of Zarahemla were nearly surrounded by water, there being a small neck of land between the Land Northward and the Land Southward."},{"time":914.213,"text":"78. And it came to pass that the Nephites had inhabited the Land Bountiful, even from the east unto the West Sea;"},{"time":922.458,"text":"79. And thus the Nephites in their wisdom, with their guards and their armies, had hemmed in the Lamanites on the south, That thereby they should have no more possession on the north, that they might not overrun the Land Northward;"},{"time":934.709,"text":"80. Therefore, the Lamanites could have no more possessions, only in the Land of Nephi and the wilderness round about."},{"time":942.861,"text":"81. Now this was wisdom in the Nephites; As the Lamanites were an enemy to them, they would not suffer their afflictions on every hand, And also that they might have a country whither they might flee according to their desires."},{"time":957.049,"text":"82. And now I, after having said this, return again to the account of Ammon and Aaron, Omner and Himni and their brethren."}]
};
