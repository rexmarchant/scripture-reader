<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 14",
  audioSrc: "https://archive.org/download/alma-ch-14/Alma%20Ch%2014.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 14"},{"time":10.48,"text":"1. Behold, now it came to pass that the king of the Lamanites sent a proclamation among all his people that they should not lay their hands on Ammon or Aaron or Omner or Himni, Nor neither of their brethren which should go forth preaching the word of God in whatsoever place they should be, in any part of their land."},{"time":20.96,"text":"2. Yea, he sent a decree among them that they should not lay their hands on them to bind them or to cast them into prison, Neither should they spit upon them, nor smite them, nor cast them out of their synagogues, nor scourge them,"},{"time":35.84,"text":"3. Neither should they cast stones at them; But that they should have free access to their houses, and also their temples and their sanctuaries,"},{"time":43.68,"text":"4. And thus they might go forth and preach the word according to their desires. For the king had been converted unto the Lord and all his household;"},{"time":54.4,"text":"5. Therefore, he sent this proclamation throughout the land unto his people that the word of God might have no obstruction, But that it might go forth throughout all the land that his people might be convinced concerning the wicked traditions of their fathers,"},{"time":67.69,"text":"6. And that they might be convinced that they were all brethren, And that they had not ought to murder, nor to plunder, nor to steal, nor to commit adultery, nor to commit any manner of wickedness."},{"time":80.4,"text":"7. And now it came to pass that when the king had sent forth this proclamation, that Aaron and his brethren went forth from city to city and from one house of worship to another,"},{"time":91.04,"text":"8. Establishing churches and consecrating priests and teachers throughout the land among the Lamanites, to preach and to teach the word of God among them. And thus they began to have great success,"},{"time":102.96,"text":"9. And thousands were brought to the knowledge of the Lord, Yea, thousands were brought to believe in the traditions of the Nephites; And they were taught the records and the prophecies which were handed down, even to the present time."},{"time":119.694,"text":"10. And as sure as the Lord liveth, so sure as many as believed - or as many as were brought to the knowledge of the truth through the preaching of Ammon and his brethren, according to the spirit of revelation and of prophecy and the power of God working miracles in them -"},{"time":135.402,"text":"11. Yea, I say unto you, as the Lord liveth, as many of the Lamanites as believed in their preaching and were converted unto the Lord never did fall away, for they became a righteous people;"},{"time":146.8,"text":"12. They did lay down the weapons of their rebellion that they did not fight against God anymore, neither against any of their brethren."},{"time":155.68,"text":"13. Now these are they which were converted unto the Lord - The people of the Lamanites which were in the Land of Ishmael, And also of the people of the Lamanites which were in the Land of Middoni, And also of the people of the Lamanites which were in the City of Nephi, And also of the people of the Lamanites which were in the Land of Shilom, And which were in the Land of Shemlon, And in the City of Lemuel, And in the City of Shimnilon -"},{"time":179.44,"text":"14. And these are the names of the cities of the Lamanites which were converted unto the Lord; And these are they that laid down the weapons of their rebellion, yea, all their weapons of war; And they were all Lamanites."},{"time":192.58,"text":"15. And the Amalekites were not converted, save only one, neither were any of the Amulonites, But they did harden their hearts, and also the hearts of the Lamanites in that part of the land whithersoever they dwelt, yea, and all their villages and all their cities;"},{"time":208.52,"text":"16. Therefore, we have named all the cities of the Lamanites in which they did repent and come to the knowledge of the truth and were converted."},{"time":218.16,"text":"17. And now it came to pass that the king and those people which were converted were desirous that they might have a name, that thereby they might be distinguished from their brethren,"},{"time":228.48,"text":"18. Therefore, the king consulted with Aaron and many of their priests concerning the name that they should take upon them, that they might be distinguished;"},{"time":237.115,"text":"19. And it came to pass that they called their name Anti-Nephi-Lehis; And they were called by this name and were no more called Lamanites."},{"time":246.0,"text":"20. And they began to be a very industrious people, Yea, and they were friendly with the Nephites, Therefore, they did open a correspondence with them and the curse of God did no more follow them."},{"time":258.24,"text":"21. And it came to pass that the Amalekites and the Amulonites and the Lamanites - Which were in the Land of Amulon, and also in the Land of Helam, and which were in the Land of Jerusalem and, in fine, in all the land round about, Which had not been converted and had not taken upon them the name of Anti - Nephi - Lehi - Were stirred up by the Amalekites and by the Amulonites to anger against their brethren;"},{"time":283.24,"text":"22. And their hatred became exceeding sore against them, Even insomuch that they began to rebel against their king, insomuch that they would not that he should be their king; Therefore, they took up arms against the people of Anti-Nephi-Lehi."},{"time":296.88,"text":"23. Now the king conferred the kingdom upon his son and he called his name Anti-Nephi-Lehi;"},{"time":305.04,"text":"24. And the king died in that selfsame year that the Lamanites began to make preparations for war against the people of God."},{"time":315.236,"text":"25. Now when Ammon and his brethren and all those which had come up with him saw the preparations of the Lamanites to destroy their brethren, they came forth to the Land of Midian, And there Ammon met all his brethren;"},{"time":325.432,"text":"26. And from thence they came to the Land of Ishmael, that they might hold a council with Lamoni, and also with his brother Anti-Nephi-Lehi, what they should do to defend themselves against the Lamanites."},{"time":338.32,"text":"27. Now there was not one soul among all the people which had been converted unto the Lord that would take up arms against their brethren,"},{"time":346.96,"text":"28. Nay, they would not even make any preparations for war; Yea, and also their king commanded them that they should not."},{"time":359.16,"text":"29. Now these are the words which he said unto the people concerning the matter: \"I thank my God, my beloved people, that our great God has in goodness sent these our brethren, the Nephites, unto us to preach unto us and to convince us of the traditions of our wicked fathers."},{"time":371.36,"text":"30. \"And behold, I thank my great God that He has given us a portion of His Spirit to soften our hearts, that we have opened a correspondence with these brethren, the Nephites."},{"time":382.72,"text":"31. \"And behold, I also thank my God that by opening this correspondence, We have been convinced of our sins and of the many murders which we have committed."},{"time":393.04,"text":"32. \"And I also thank my God, yea, my great God, that He hath granted unto us that we might repent of these things, And also that He hath forgiven us of these our many sins and murders which we have committed, And took away the guilt from our hearts through the merits of His Son."},{"time":411.12,"text":"33. \"And now behold, my brethren, since it has been all that we could do - as we were the most lost of all mankind - to repent of all our sins and the many murders which we have committed and to get God to take them away from our hearts - For it was all we could do to repent sufficiently before God that He would take away our stain -"},{"time":430.6,"text":"34. Now, my best beloved brethren, since God hath taken away our stains and our swords have become bright, then let us stain our swords no more with the blood of our brethren."},{"time":441.68,"text":"35. \"Behold, I say unto you, Nay; Let us retain our swords, that they be not stained with the blood of our brethren,"},{"time":449.667,"text":"36. For perhaps if we should stain our swords again, They can no more be washed bright through the blood of the Son of our great God which shall be shed for the atonement of our sins."},{"time":459.619,"text":"37. \"And the great God has had mercy on us and made these things known unto us, that we might not perish;"},{"time":466.828,"text":"38. Yea, and He hath made these things known unto us beforehand because He loveth our souls, as well as He loveth our children; Therefore, in His mercy He doth visit us by His angels, that the plan of salvation might be made known unto us, as well as unto future generations; O how merciful is our God!"},{"time":486.655,"text":"39. \"And now behold, since it has been as much as we could do to get our stains taken away from us and our swords are made bright,"},{"time":495.384,"text":"40. Let us hide them away, that they may be kept bright as a testimony to our God at the last day - or at the day that we shall be brought to stand before Him to be judged - that we have not stained our swords in the blood of our brethren since He imparted His word unto us and has made us clean thereby."},{"time":513.476,"text":"41. \"And now my brethren, if our brethren seek to destroy us, behold, we will hide away our swords, Yea, even we will bury them deep in the earth, that they may be kept bright as a testimony that we have never used them, at the last day; And if our brethren destroy us, behold, we shall go to our God and shall be saved.\""},{"time":534.32,"text":"42. And now it came to pass that when the king had made an end of these sayings and all the people were assembled together, They took their swords and all the weapons which were used for the shedding of man's blood and they did bury them up deep in the earth;"},{"time":548.331,"text":"43. And this they did, it being in their view a testimony to God, and also to men, that they never would use weapons again for the shedding of man's blood;"},{"time":557.426,"text":"44. And this they did, vouching and covenanting with God that rather than to shed the blood of their brethren, they would give up their own lives,"},{"time":566.907,"text":"45. And rather than to take away from a brother, they would give unto him, And rather than to spend their days in idleness, they would labor abundantly with their hands."},{"time":576.615,"text":"46. And thus we see that when these Lamanites were brought to believe and to know the truth, that they were firm and would suffer even unto death rather than to commit sin;"},{"time":586.627,"text":"47. And thus we see that they buried the weapons of peace, or they buried the weapons of war for peace."},{"time":593.83,"text":"48. And it came to pass that their brethren, the Lamanites, made preparations for war and came up to the Land of Nephi for the purpose of dethroning the king and to place another in his stead, and also of destroying the people of Anti-Nephi-Lehi out of the land."},{"time":608.912,"text":"49. And it came to pass that when the people saw that they were coming against them, they went out to meet them and prostrated themselves before them to the earth and began to call on the name of the Lord;"},{"time":620.88,"text":"50. And thus they were in this attitude when the Lamanites began to fall upon them and began to slay them with the sword; And thus without meeting any resistance, they did slay a thousand and five of them; And we know that they are blessed, for they have gone to dwell with their God."},{"time":637.045,"text":"51. Now when the Lamanites saw that their brethren would not flee from the sword, neither would they turn aside to the right hand or to the left, But that they would lay down and perish and praised God, even in the very act of perishing under the sword - Now when the Lamanites saw this, they did forbear from slaying them;"},{"time":655.76,"text":"52. And there were many whose hearts had swollen in them for those of their brethren who had fallen under the sword, for they repented of the things which they had done."},{"time":664.425,"text":"53. And it came to pass that they threw down their weapons of war and they would not take them again, for they were stung for the murders which they had committed; And they came down, even as their brethren, relying upon the mercies of those whose arms were lifted to slay them."},{"time":679.898,"text":"54. And it came to pass that the people of God were joined that day by more than the number which had been slain; And those which had been slain were righteous people, therefore we have no reason to doubt but what they are saved;"},{"time":692.177,"text":"55. And there was not a wicked man slain among them, but there were more than a thousand brought to the knowledge of the truth; Thus we see that the Lord worketh in many ways to the salvation of His people."},{"time":703.864,"text":"56. Now the greatest number of those of the Lamanites which slew so many of their brethren were Amalekites and Amulonites, the greatest number of whom were after the order of the Nehors;"},{"time":715.04,"text":"57. Now among those which joined the people of the Lord there were none which were Amalekites or Amulonites or which were after the order of Nehor, but they were actual descendants of Laman and Lemuel."},{"time":726.099,"text":"58. And thus we can plainly discern that after a people have been once enlightened by the Spirit of God and hath had great knowledge of things pertaining to righteousness and then have fallen away into sin and transgression, They become more hardened; And thus their state becometh worse than as though they had never known these things."},{"time":745.92,"text":"59. And behold, now it came to pass that those Lamanites were more angry because they had slain their brethren, Therefore, they swore vengeance upon the Nephites;"},{"time":755.195,"text":"60. And they did no more attempt to slay the people of Anti-Nephi-Lehi at that time, But they took their armies and went over into the borders of the Land of Zarahemla and fell upon the people which were in the Land of Ammonihah and destroyed them;"},{"time":769.895,"text":"61. And after that, they had many battles with the Nephites in the which they were driven and slain."},{"time":776.44,"text":"62. And among the Lamanites which were slain were almost all the seed of Amulon and his brethren, which were the priests of Noah, And they were slain by the hands of the Nephites;"},{"time":786.76,"text":"63. And the remainder, having fled into the East Wilderness and having usurped the power and authority over the Lamanites, caused that many of the Lamanites should perish by fire because of their belief."},{"time":799.54,"text":"64. For many of them, after having suffered too much loss and so many afflictions, they began to be stirred up in remembrance of the words which Aaron and his brethren had preached to them in their land;"},{"time":812.286,"text":"65. Therefore, they began to disbelieve the traditions of their fathers and to believe in the Lord and that He gave great power unto the Nephites, And thus there were many of them converted in the wilderness."},{"time":824.031,"text":"66. And it came to pass that those rulers which were the remnant of the children of Amulon caused that they should be put to death, yea, all those that believed in these things;"},{"time":834.52,"text":"67. Now this martyrdom caused that many of their brethren should be stirred up to anger and there began to be contention in the wilderness; And the Lamanites began to hunt the seed of Amulon and his brethren and began to slay them; And they fled into the East Wilderness,"},{"time":850.724,"text":"68. And behold, they are hunted at this day by the Lamanites. Thus the words of Abinadi were brought to pass which he said concerning the seed of the priests which caused that he should suffer death by fire;"},{"time":863.896,"text":"69. For he said unto them, \"What ye shall do unto me shall be a type of things to come.\""},{"time":870.4,"text":"70. And now Abinadi was the first that suffered death by fire because of his belief in God; Now this is what he meant, that many should suffer death by fire according as he had suffered;"},{"time":881.072,"text":"71. And he said unto the priests of Noah that their seed should cause many to be put to death in the like manner as he was, And that they should be scattered abroad and slain, even as a sheep having no shepherd is driven and slain by wild beasts;"},{"time":896.226,"text":"72. And now behold, these words were verified, for they were driven by the Lamanites and they were hunted and they were smitten."},{"time":902.969,"text":"73. And it came to pass that when the Lamanites saw that they could not overpower the Nephites, they returned again to their own land; And many of them came over to dwell in the Land of Ishmael and the Land of Nephi and did join themselves to the people of God, which were the people of Anti-Nephi-Lehi,"},{"time":920.32,"text":"74. And they did also bury their weapons of war according as their brethren had; And they began to be a righteous people, And they did walk in the ways of the Lord and did observe to keep His commandments and His statutes, Yea, and they did keep the law of Moses, for it was expedient that they should keep the law of Moses as yet, for it was not all fulfilled."},{"time":943.84,"text":"75. But notwithstanding the law of Moses, they did look forward to the coming of Christ, considering that the law of Moses was a type of His coming, And believing that they must keep those outward performances until the time that He should be revealed unto them."},{"time":958.56,"text":"76. Now they did not suppose that salvation came by the law of Moses, but the law of Moses did serve to strengthen their faith in Christ;"},{"time":967.03,"text":"77. And thus they did retain a hope, through faith, unto eternal salvation, relying upon the spirit of prophecy which spake of those things to come."},{"time":980.75,"text":"78. And now behold, Ammon and Aaron and Omner and Himni and their brethren did rejoice exceedingly for the success which they had had among the Lamanites, seeing that the Lord had granted unto them according to their prayers, And that He had also verified His word unto them in every particular."},{"time":994.47,"text":"79. And now these are the words of Ammon to his brethren, which saith thus: \"My brothers and my brethren, behold I say unto you, how great reason have we to rejoice, For could we have supposed when we started from the Land of Zarahemla that God would have granted unto us such great blessings?"},{"time":1012.616,"text":"80. \"And now I ask, what great blessings hath He bestowed upon us? Can ye tell?"},{"time":1019.85,"text":"81. Behold, I answer for you - For our brethren, the Lamanites, were in darkness, yea, even in the darkest abyss, But behold how many of them are brought to behold the marvelous light of God!"},{"time":1032.997,"text":"82. And this is the blessing which hath been bestowed upon us - that we have been made instruments in the hands of God to bring about this great work."},{"time":1042.88,"text":"83. \"Behold, thousands of them do rejoice and have been brought into the fold of God;"},{"time":1049.213,"text":"84. Behold, the field was ripe, And blessed are ye, for ye did thrust in the sickle and did reap with your mights, Yea, all the day long did ye labor."},{"time":1059.246,"text":"85. \"And behold the number of your sheaves, And they shall be gathered into the garners, that they are not wasted, Yea, they shall not be beaten down by the storm at the last day,"},{"time":1070.207,"text":"86. Yea, neither shall they be harrowed up by the whirlwinds; But when the storm cometh, they shall be gathered together in their place, that the storm cannot penetrate to them; Yea, neither shall they be driven with fierce winds whithersoever the enemy listeth to carry them;"},{"time":1087.92,"text":"87. But behold, they are in the hands of the Lord of the harvest and they are His and He will raise them up at the last day."},{"time":1095.813,"text":"88. \"Blessed be the name of our God! Let us sing to His praise, Yea, let us give thanks to His holy name, For He doth work righteousness forever."},{"time":1106.16,"text":"89. \"For if we had not come up out of the Land of Zarahemla, these, our dearly beloved brethren which have so dearly beloved us, would still have been racked with hatred against us, Yea, and they would also have been strangers to God.\""},{"time":1119.032,"text":"90. And it came to pass that when Ammon had said these words, his brother Aaron rebuked him, saying: \"Ammon, I fear that thy joy doth carry thee away unto boasting!\""},{"time":1132.516,"text":"91. But Ammon saith unto him: \"I do not boast in my own strength or in my own wisdom, But behold, my joy is full! Yea, my heart is brim with joy and I will rejoice in my God!"},{"time":1146.0,"text":"92. Yea, I know that I am nothing; As to my strength, I am weak; Therefore, I will not boast of myself, but I will boast of my God, For in His strength I can do all things.\"Yea, behold how many mighty miracles we have wrought in this land, for which we will praise His name forever!"},{"time":1165.093,"text":"93. \"Behold how many thousands of our brethren hath He loosed from the pains of hell and they are brought to sing redeeming love! And this because of the power of His word which is in us, Therefore, have we not great reason to rejoice?"},{"time":1180.978,"text":"94. \"Yea, we have reason to praise Him forever! For He is the Most High God and has loosed our brethren from the chains of hell;"},{"time":1190.8,"text":"95. Yea, they were encircled about with everlasting darkness and destruction, But behold, He hath brought them into His everlasting light, yea, into everlasting salvation, And they are encircled about with the matchless bounty of His love."},{"time":1206.16,"text":"96. \"Yea, and we have been instruments in His hands of doing this great and marvelous work, Therefore, let us glory - yea, we will glory in the Lord! Yea, we will rejoice, for our joy is full! Yea, we will praise our God forever!"},{"time":1224.39,"text":"97. \"Behold, who can glory too much in the Lord? Yea, who can say too much of His great power and of His mercy and of His longsuffering toward the children of men? Behold I say unto you, I cannot say the smallest part which I feel."},{"time":1242.72,"text":"98. \"Who could have supposed that our God would have been so merciful as to have snatched us from our awful sinful and polluted state?"},{"time":1250.52,"text":"99. Behold, we went forth, even in wrath, with mighty threatenings, to destroy His church; O then, why did He not consign us to an awful destruction? Yea, why did He not let the sword of His justice fall upon us and doom us to eternal despair?"},{"time":1267.551,"text":"100. O my soul almost, as it were, fleeth at the thought!"},{"time":1273.173,"text":"101. Behold, He did not exercise His justice upon us, But in His great mercy hath brought us over that everlasting gulf of death and misery, even to the salvation of our souls."},{"time":1285.647,"text":"102. \"And now behold, my brethren, what natural man is there that knoweth these things? I say unto you, there is none that knoweth these things, save it be the penitent -"},{"time":1298.56,"text":"103. Yea, he that repenteth, and exerciseth faith, and bringeth forth good works, and prayeth continually without ceasing, Unto such it is given to know the mysteries of God; Yea, unto such it shall be given to reveal things which never have been revealed;"},{"time":1315.76,"text":"104. Yea, and it shall be given unto such to bring thousands of souls to repentance, Even as it hath been given unto us to bring these our brethren to repentance."},{"time":1326.528,"text":"105. \"Now do ye remember, my brethren, that we said unto our brethren in the Land of Zarahemla, 'We go up to the Land of Nephi to preach unto our brethren, the Lamanites, ' And they laughed us to scorn?"},{"time":1337.296,"text":"106. For they said unto us: 'Do ye suppose that ye can bring the Lamanites to the knowledge of the truth?"},{"time":1351.071,"text":"107. Do ye suppose that ye can convince the Lamanites of the incorrectness of the traditions of their fathers, as stiff-necked a people as they are? Whose hearts delighteth in the shedding of blood? Whose days have been spent in the grossest iniquity? Whose ways have been the ways of a transgressor from the beginning?'"},{"time":1364.846,"text":"108. \"Now my brethren, ye remember that this was their language;"},{"time":1370.56,"text":"109. And moreover, they did say: 'Let us take up arms against them, that we destroy them and their iniquity out of the land, lest they overrun us and destroy us.'"},{"time":1381.605,"text":"110. \"But behold, my beloved brethren, we came into the wilderness, not with the intent to destroy our brethren, but with the intent that perhaps we might save some few of their souls."},{"time":1392.291,"text":"111. \"Now when our hearts were depressed and we were about to turn back, behold, the Lord comforted us and said: 'Go amongst thy brethren the Lamanites and bear with patience thine afflictions, And I will give unto thee success.'"},{"time":1406.87,"text":"112. \"And now behold, we have come and been forth amongst them, And we have been patient in our sufferings, And we have suffered every privation; Yea, we have traveled from house to house, relying upon the mercies of the world - not upon the mercies of the world alone, but upon the mercies of God;"},{"time":1424.13,"text":"113. And we have entered into their houses and taught them, And we have taught them in their streets, Yea, and we have taught them upon their hills, And we have also entered into their temples and their synagogues and taught them;"},{"time":1438.08,"text":"114. And we have been cast out and mocked and spit upon and smote upon our cheeks, And we have been stoned and taken and bound with strong cords and cast into prison, And through the power and wisdom of God, we have been delivered again;"},{"time":1451.52,"text":"115. And we have suffered all manner of afflictions; And all this that perhaps we might be the means of saving some soul, And we supposed that our joy would be full if perhaps we could be the means of saving some."},{"time":1464.598,"text":"116. \"Now behold, we can look forth and see the fruits of our labors; And are they few?"},{"time":1471.024,"text":"117. I say unto you, nay, they are many; Yea, and we can witness of their sincerity because of their love toward their brethren and also toward us."},{"time":1482.16,"text":"118. \"For behold, they had rather sacrifice their lives than even to take the life of their enemy; And they have buried their weapons of war deep in the earth because of their love toward their brethren."},{"time":1492.124,"text":"119. \"And now behold I say unto you, has there been so great love in all the land?"},{"time":1499.68,"text":"120. Behold I say unto you, nay, there has not, even among the Nephites;"},{"time":1506.405,"text":"121. For behold, they would take up arms against their brethren, they would not suffer themselves to be slain;"},{"time":1513.44,"text":"122. But behold how many of these have laid down their lives; And we know that they have gone to their God because of their love and of their hatred to sin."},{"time":1522.542,"text":"123. \"Now have we not reason to rejoice? Yea, I say unto you, there never were men that had so great reason to rejoice as we since the world began;"},{"time":1532.114,"text":"124. Yea, and my joy is carried away, even unto boasting in my God, For He has all power, all wisdom and all understanding; He comprehendeth all things; And He is a merciful Being, even unto salvation, to those who will repent and believe on His name."},{"time":1551.52,"text":"125. \"Now if this is boasting, even so will I boast, For this is my life and my light, my joy and my salvation and my redemption from everlasting wo."},{"time":1562.0,"text":"126. \"Yea, blessed is the name of my God who hath been mindful of this people which are a branch of the tree of Israel and hath been lost from its body in a strange land! Yea, I say blessed be the name of my God who hath been mindful of us wanderers in a strange land!"},{"time":1579.008,"text":"127. \"Now my brethren, we see that God is mindful of every people in whatsoever land they may be in; Yea, He numbereth His people and His bowels of mercy are over all the earth;"},{"time":1590.32,"text":"128. Now this is my joy and my great thanksgiving! Yea, and I will give thanks unto my God forever. Amen.\""}]
};
</script>
