<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 20",
  audioSrc: "https://archive.org/download/alma-ch-20/Alma%20Ch%2020.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 20"},{"time":7.04,"text":"1. And now it came to pass that the sons of Alma did go forth among the people to declare the word unto them; And Alma also, himself, could not rest and he also went forth."},{"time":14.08,"text":"2. Now, we shall say no more concerning their preaching, except that they preached the word and the truth according to the spirit of prophecy and revelation, And they preached after the holy order of God by which they were called."},{"time":27.136,"text":"3. And now, I return to an account of the wars between the Nephites and the Lamanites in the eighteenth year of the reign of the judges."},{"time":36.4,"text":"4. For behold, it came to pass that the Zoramites became Lamanites; Therefore, in the commencement of the eighteenth year, the people of the Nephites saw that the Lamanites were coming upon them, Therefore, they made preparations for war, Yea, they gathered together their armies in the Land of Jershon."},{"time":54.347,"text":"5. And it came to pass that the Lamanites came with their thousands, And they came into the Land of Antionum, which was the land of the Zoramites; And a man by the name of Zerahemnah was their leader."},{"time":67.696,"text":"6. And now, as the Amalekites were of a more wicked and a murderous disposition than the Lamanites were, in and of themselves, Therefore, Zerahemnah appointed chief captains over the Lamanites, And they were all the Amalekites and the Zoramites."},{"time":82.532,"text":"7. Now this he did that he might preserve their hatred toward the Nephites, that he might bring them into subjection to the accomplishment of his designs,"},{"time":93.312,"text":"8. For behold, his designs were to stir up the Lamanites to anger against the Nephites; And this he did that he might usurp great power over them, And also that he might gain power over the Nephites by bringing them into bondage, etc."},{"time":106.88,"text":"9. And now the design of the Nephites was to support their lands and their houses and their wives and their children, That they might preserve them from the hands of their enemies, And also that they might preserve their rights and their privileges,"},{"time":118.526,"text":"10. yea, and also their liberty, That they might worship God according to their desires; For they knew that if they should fall into the hands of the Lamanites, That whosoever should worship God in spirit and in truth, the true and the living God, the Lamanites would destroy."},{"time":137.177,"text":"11. Yea, and they also knew the extreme hatred of the Lamanites toward their brethren which were the people of Anti-Nephi-Lehi, which were called the people of Ammon;"},{"time":152.368,"text":"12. And they would not take up arms - Yea, they had entered into a covenant and they would not break it - Therefore, if they should fall into the hands of the Lamanites, they would be destroyed."},{"time":160.555,"text":"13. And the Nephites would not suffer that they should be destroyed, Therefore, they gave them lands for their inheritance;"},{"time":168.057,"text":"14. And the people of Ammon did give unto the Nephites a large portion of their substance to support their armies;"},{"time":176.32,"text":"15. And thus the Nephites were compelled, alone, to withstand against the Lamanites which were a compound of Laman and Lemuel and the sons of Ishmael, And all those which had dissented from the Nephites, which were Amalekites and Zoramites, And the descendants of the priests of Noah;"},{"time":193.52,"text":"16. Now those descendants were as numerous, nearly, as were the Nephites; And thus the Nephites were obliged to contend with their brethren, even unto bloodshed."},{"time":202.8,"text":"17. And it came to pass as the armies of the Lamanites had gathered together in the Land of Antionum, Behold, the armies of the Nephites were prepared to meet them in the Land of Jershon."},{"time":214.72,"text":"18. Now the leader of the Nephites - or the man which had been appointed to be the chief captain over the Nephites - Now the chief captain took the command of all the armies of the Nephites - and his name was Moroni,"},{"time":227.865,"text":"19. and Moroni took all the command - and the governments of their wars; And he was only twenty and five years old when he was appointed chief commander over the armies of the Nephites."},{"time":238.168,"text":"20. And it came to pass that he met the Lamanites in the borders of Jershon; And his people were armed with swords and with scimitars and all manner of weapons of war."},{"time":248.204,"text":"21. And it came to pass that when the armies of the Lamanites saw that the people of Nephi - Or that Moroni had prepared his people with breastplates and with armshields, yea, and also shields to defend their heads, And also they were dressed with thick clothing -"},{"time":265.213,"text":"22. Now the army of Zerahemnah was not prepared with any such thing;"},{"time":275.767,"text":"23. They had only their swords and their scimitars, their bows and their arrows, their stones and their slings; But they were naked, save it were a skin which was girded about their loins, Yea, all were naked, save it were the Zoramites and the Amalekites;"},{"time":286.32,"text":"24. But they were not armed with breastplates nor shields, Therefore, they were exceeding fraid of the armies of the Nephites, because of their armor, Notwithstanding their number being so much greater than the Nephites."},{"time":298.204,"text":"25. Behold, now it came to pass that they durst not come against the Nephites in the borders of Jershon; Therefore, they departed out of the Land of Antionum into the wilderness and took their journey round about in the wilderness, away by the head of the River Sidon, that they might come into the Land of Manti and take possession of the land, For they did not suppose that the armies of Moroni would know whither they had gone."},{"time":322.168,"text":"26. But it came to pass as soon as they had departed into the wilderness, Moroni sent spies into the wilderness to watch their camp, And Moroni, also knowing of the prophecies of Alma, sent certain men unto him, desiring him that he should inquire of the Lord whither the armies of the Nephites should go to defend themselves against the Lamanites."},{"time":342.368,"text":"27. And it came to pass that the word of the Lord came unto Alma, And Alma informed the messengers of Moroni that the armies of the Lamanites were marching round about in the wilderness, That they might come over into the Land of Manti, That they might commence an attack upon the more weak part of the people;"},{"time":360.773,"text":"28. And those messengers went and delivered the message unto Moroni."},{"time":365.84,"text":"29. Now Moroni leaving a part of his army in the Land of Jershon, lest by any means a part of the Lamanites should come into that land and take possession of the city, And Moroni took the remainder part of his army and marched over into the Land of Manti;"},{"time":380.208,"text":"30. And he caused that all the people in that quarter of the land should gather themselves together to battle against the Lamanites to defend their lands and their country, their rights and their liberties; Therefore they were prepared against the time of the coming of the Lamanites."},{"time":395.112,"text":"31. And it came to pass that Moroni caused that his army should be secreted in the valley which was near the bank of the River Sidon, which was on the west of the River Sidon in the wilderness;"},{"time":406.169,"text":"32. And Moroni placed spies round about that he might know when the camp of the Lamanites should come."},{"time":412.935,"text":"33. And now as Moroni knew the intention of the Lamanites - That it was their intention to destroy their brethren, or to subject them and bring them into bondage, That they might establish a kingdom unto themselves over all the land -"},{"time":426.24,"text":"34. And he also knowing that it was the only desire of the Nephites to preserve their lands and their liberty and their church, Therefore, he thought it no sin that he should defend them by stratagem, Therefore, he found, by his spies, which course the Lamanites were to take."},{"time":443.12,"text":"35. Therefore, he divided his army and brought a part over into the valley and concealed them on the east and on the south of the Hill Riplah, And the remainder he concealed in the west valley, on the west of the River Sidon, and so down into the borders of the Land Manti;"},{"time":459.44,"text":"36. And thus having placed his army according to his desire, he was prepared to meet them."},{"time":465.76,"text":"37. And it came to pass that the Lamanites came up on the north of the hill where a part of the army of Moroni was concealed."},{"time":471.798,"text":"38. And it came to pass that as the Lamanites had passed the Hill Riplah and came into the valley and began to cross the River Sidon, The army, which was concealed on the south of the hill, who was led by a man whose name was Lehi, And he led his army forth and encircled the Lamanites about on the east in their rear."},{"time":491.12,"text":"39. And it came to pass that the Lamanites, when they saw the Nephites coming upon them in their rear, turned them about and began to contend with the army of Lehi; And the work of death commenced on both sides,"},{"time":503.488,"text":"40. But it was more dreadful on the part of the Lamanites, For their nakedness was exposed to the heavy blows of the Nephites with their swords and their scimitars which brought death almost at every stroke, While on the other hand, there was now and then a man fell among the Nephites by their wounds and the loss of blood,"},{"time":526.661,"text":"41. They being shielded from the more vital parts of the body - or the more vital parts of the body being shielded from the strokes of the Lamanites by their breastplates and their armshields and their headplates; And thus the Nephites did carry on the work of death among the Lamanites."},{"time":536.72,"text":"42. And it came to pass that the Lamanites became frightened because of the great destruction among them, even until they began to flee toward the River Sidon;"},{"time":545.308,"text":"43. And they were pursued by Lehi and his men, And they were driven by Lehi into the waters of Sidon, And they crossed the waters of Sidon;"},{"time":553.911,"text":"44. And Lehi retained his armies upon the bank of the River Sidon, that they should not cross."},{"time":560.24,"text":"45. And it came to pass that Moroni and his army met the army of the Lamanites in the valley on the other side of the River Sidon. And it came to pass that Moroni and his army began to fall upon them and to slay them."},{"time":569.18,"text":"46. And it came to pass that the Lamanites did flee again before them, toward the Land of Manti, And they were met again by the armies of Moroni."},{"time":585.133,"text":"47. Now in this case the Lamanites did fight exceedingly, Yea, never had the Lamanites been known to have fought with such exceeding great strength and courage - No, not even from the beginning;"},{"time":596.734,"text":"48. And they were inspired by the Zoramites and the Amalekites, which were their chief captains and leaders, And by Zerahemnah who was their chief captain, or their chief leader and commander;"},{"time":608.093,"text":"49. Yea, they did fight like dragons and many of the Nephites were slain by their hands - Yea, for they did smite in two many of their headplates, And they did pierce many of their breastplates, And they did smite off many of their arms; And thus the Lamanites did smite in their fierce anger."},{"time":626.48,"text":"50. Nevertheless, the Nephites were inspired by a better cause, For they were not fighting for monarchy nor power, But they were fighting for their homes and their liberties, their wives and their children and their all, yea, for their rights of worship and their church;"},{"time":641.12,"text":"51. And they were doing that which they felt it was the duty which they owed to their God, For the Lord had said unto them, and also unto their fathers that, \"Inasmuch as ye are not guilty of the first offense, neither the second, Ye shall not suffer yourselves to be slain by the hands of your enemies.\""},{"time":659.219,"text":"52. And again, the Lord hath said that, \"Ye shall defend your families even unto bloodshed, \" Therefore, for this cause were the Nephites contending with the Lamanites - To defend themselves and their families and their lands, their country and their rights and their religion."},{"time":674.493,"text":"53. And it came to pass that when the men of Moroni saw the fierceness and the anger of the Lamanites, they were about to shrink and flee from them;"},{"time":684.16,"text":"54. And Moroni, perceiving their intent, sent forth and inspired their hearts with these thoughts - yea, the thoughts of their lands, their liberty, yea, their freedom from bondage."},{"time":697.28,"text":"55. And it came to pass that they turned upon the Lamanites, And they cried with one voice unto the Lord their God for their liberty and their freedom from bondage;"},{"time":706.395,"text":"56. And they began to stand against the Lamanites with power; And in the selfsame hour that they cried unto the Lord for their freedom, the Lamanites began to flee before them, And they fled even to the waters of Sidon."},{"time":718.442,"text":"57. Now the Lamanites were more numerous, yea, by more than double the number of the Nephites; Nevertheless, they were driven insomuch that they were gathered together in one body in the valley upon the bank by the River Sidon;"},{"time":733.492,"text":"58. Therefore, the armies of Moroni encircled them about, yea, even on both sides of the river, For behold, on the east were the men of Lehi;"},{"time":744.751,"text":"59. Therefore, when Zerahemnah saw the men of Lehi on the east of the River Sidon and the armies of Moroni on the west of the River Sidon, that they were encircled about by the Nephites, They were struck with terror."},{"time":756.009,"text":"60. Now Moroni, when he saw their terror, he commanded his men that they should stop shedding their blood."},{"time":762.608,"text":"61. And it came to pass that they did stop and withdrew a pace from them;"},{"time":767.716,"text":"62. And Moroni said unto Zerahemnah: \"Behold, Zerahemnah, that we do not desire to be men of blood;"},{"time":776.48,"text":"63. Ye know that ye are in our hands, yet we do not desire to slay you."},{"time":781.2,"text":"64. \"Behold, we have not come out to battle against you, that we might shed your blood for power, Neither do we desire to bring anyone to the yoke of bondage;"},{"time":790.416,"text":"65. But this is the very cause for which ye have come against us, Yea, and ye are angry with us because of our religion."},{"time":799.44,"text":"66. \"But now, ye behold that the Lord is with us, And ye behold that He hath delivered you into our hands."},{"time":806.32,"text":"67. \"And now I would that ye should understand that this is done unto us because of our religion and our faith in Christ.\"And now ye see that ye cannot destroy this our faith;"},{"time":818.0,"text":"68. Now ye see that this is the true faith of God, Yea, ye see that God will support and keep and preserve us, so long as we are faithful unto Him and unto our faith and our religion;"},{"time":829.76,"text":"69. And never will the Lord suffer that we shall be destroyed, except we should fall into transgression and deny our faith."},{"time":849.44,"text":"70. \"And now, Zerahemnah, I command you in the name of that all - powerful God who hath strengthened our arms that we have gained power over you - By our faith, By our religion, And by our rights of worship, And by our church, And by the sacred support which we owe to our wives and our children, By that liberty which binds us to our lands and our country, Yea, and also by the maintenance of the sacred word of God to which we owe all our happiness,"},{"time":869.12,"text":"71. And by all that is most dear unto us; Yea, and this is not all - I command you by all the desires which ye have for life that ye deliver up your weapons of war unto us, And we will seek not your blood, but we will spare your lives if ye will go your way and come not again to war against us."},{"time":888.56,"text":"72. \"And now if ye do not this, behold, ye are in our hands, And I will command my men that they shall fall upon you and inflict the wounds of death in your bodies, that ye may become extinct;"},{"time":901.92,"text":"73. And then we will see who shall have power over this people, Yea, we will see who shall be brought into bondage.\""},{"time":908.776,"text":"74. And now it came to pass that when Zerahemnah heard these sayings, He came forth and delivered up his sword and his scimitar and his bow into the hands of Moroni and saith unto him:"},{"time":920.744,"text":"75. \"Behold, here are our weapons of war - We will deliver them up unto you and we will not suffer ourselves to take an oath unto you, which we know that we shall break, and also our children; But take our weapons of war and suffer that we may depart into the wilderness, Otherwise we will retain our swords and we will perish or conquer."},{"time":941.813,"text":"76. \"Behold, we are not of your faith; We do not believe that it is God that hath delivered us into your hands, But we believe it is your cunning that hath preserved you from our swords;"},{"time":953.614,"text":"77. Behold, it is your breastplates and your shields that hath preserved you.\""},{"time":962.882,"text":"78. And now, when Zerahemnah had made an end of speaking these words, Moroni returned the sword and the weapons of war which he had received unto Zerahemnah, saying: \"Behold, we will end the conflict;"},{"time":972.151,"text":"79. Now I cannot retain the words which I have spoken, Therefore, as the Lord liveth, ye shall not depart except ye depart with an oath that ye will not return again against us to war;"},{"time":984.096,"text":"80. Now as ye are in our hands, we will spill your blood upon the ground, Or ye shall submit to the conditions to which I have proposed.\""},{"time":993.954,"text":"81. And now when Moroni had said these words, Zerahemnah retained his sword, And he was angry with Moroni and he rushed forward that he might slay Moroni;"},{"time":1004.122,"text":"82. But as he raised his sword, behold, one of Moroni's soldiers smote it even to the earth and it broke by the hilt, And he also smote Zerahemnah that he took off his scalp and it fell to the earth;"},{"time":1012.686,"text":"83. And Zerahemnah withdrew from before them into the midst of his soldiers."},{"time":1021.251,"text":"84. And it came to pass that the soldier which stood by, which smote off the scalp of Zerahemnah, took up the scalp from off the ground by the hair and laid it upon the point of his sword and stretched it forth unto them, saying unto them with a loud voice - saying:"},{"time":1037.528,"text":"85. \"Even as this scalp hath fallen to the earth, which is the scalp of your chief, So shall ye fall to the earth, except ye will deliver up your weapons of war and depart with a covenant of peace.\""},{"time":1049.912,"text":"86. Now there were many when they heard these words and saw the scalp which was upon the sword, they were struck with fear, And many came forth and threw down their weapons of war at the feet of Moroni and entered into a covenant of peace;"},{"time":1065.04,"text":"87. And as many as entered into a covenant, they suffered to depart into the wilderness."},{"time":1073.133,"text":"88. Now it came to pass that Zerahemnah was exceeding wroth, And he did stir up the remainder of his soldiers to anger, to contend more powerfully against the Nephites."},{"time":1081.227,"text":"89. And now Moroni was angry because of the stubbornness of the Lamanites, Therefore, he commanded his people that they should fall upon them and slay them."},{"time":1090.671,"text":"90. And it came to pass that they began to slay them, Yea, and the Lamanites did contend with their swords and their mights;"},{"time":1099.64,"text":"91. But behold, their naked skins and their bare heads were exposed to the sharp swords of the Nephites, Yea, behold, they were pierced and smitten,"},{"time":1109.987,"text":"92. yea, and did fall exceeding fast before the swords of the Nephites; And they began to be swept down, even as the soldier of Moroni had prophesied."},{"time":1123.553,"text":"93. Now Zerahemnah, when he saw that they were all about to be destroyed, he cried mightily unto Moroni, Promising that he would covenant, and also his people with them, if they would spare the remainder of their lives, that they never would come to war again against them."},{"time":1137.12,"text":"94. And it came to pass that Moroni caused that the work of death should cease again among the people."},{"time":1143.68,"text":"95. And it came to pass that he took the weapons of war from the Lamanites; And after they had entered into a covenant with him of peace, they were suffered to depart into the wilderness."},{"time":1154.4,"text":"96. Now, the number of their dead were not numbered, because of the greatness of the number, Yea, the number of their dead were exceeding great, both on the Nephites and on the Lamanites."},{"time":1166.24,"text":"97. And it came to pass that they did cast their dead into the waters of Sidon, And they have gone forth and are buried in the depths of the sea;"},{"time":1174.96,"text":"98. And the armies of the Nephites, or of Moroni, returned and came to their houses and their lands."},{"time":1182.56,"text":"99. And thus ended the eighteenth year of the reign of the judges over the people of Nephi."},{"time":1188.72,"text":"100. And thus ended the record of Alma which was written upon the plates of Nephi."}]
};
