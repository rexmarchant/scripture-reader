window.CHAPTER_DATA = {

  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 12"},{"time":7.853,"text":"1. And now there cannot be written in this book even an hundredth part of the things which Jesus did truly teach unto the people; But behold, the plates of Nephi do contain the more part of the things which He taught the people;"},{"time":15.707,"text":"2. And these things have I written which are a lesser part of the things which He taught the people, And I have written them to the intent that they may be brought again unto this people from the Gentiles according to the words which Jesus hath spoken."},{"time":28.58,"text":"3. And when they shall have received this, which is expedient that they should have first to try their faith, And if it should so be that they shall believe these things, Then shall the greater things be made manifest unto them;"},{"time":35.187,"text":"4. And if it so be that they will not believe these things, Then shall the greater things be withheld from them unto their condemnation."},{"time":49.459,"text":"5. Behold, I was about to write them all which were engraven upon the plates of Nephi, But the Lord forbid it, saying, \"I will try the faith of My people\"; Therefore, I, Mormon, do write the things which have been commanded me of the Lord."},{"time":67.173,"text":"6. And now I, Mormon, make an end of my sayings and proceed to write the things which have been commanded me; Therefore, I would that ye should behold that the Lord truly did teach the people for the space of three days; And after that, He did show Himself unto them oft and did break bread oft and bless it and give it unto them."},{"time":84.836,"text":"7. And it came to pass that He did teach and minister unto the children of the multitude of whom hath been spoken; And He did loose their tongues, And they did speak unto their fathers great and marvelous things - even greater than He had revealed unto the people - And loosed their tongues that they could utter."},{"time":102.204,"text":"8. And it came to pass that after He had ascended into heaven the second time that He showed Himself unto them, And gone unto the Father after having healed all their sick and their lame, And opened the eyes of the blind, And unstopped the ears of the deaf, And even had done all manner of cures among them, And raised a man from the dead, And had shown forth His power unto them, And had ascended unto the Father-"},{"time":126.24,"text":"9. Behold, it came to pass on the morrow that the multitude gathered themselves together, And they both saw and heard these children, yea, even babes did open their mouths and utter marvelous things; And the things which they did utter were forbidden that there should not any man write them."},{"time":143.6,"text":"10. And it came to pass that the disciples whom Jesus had chosen began from that time forth to baptize and to teach as many as did come unto them, And as many as were baptized in the name of Jesus were filled with the Holy Ghost;"},{"time":156.76,"text":"11. And many of them saw and heard unspeakable things which are not lawful to be written; And they taught and did minister one to another; And they had all things common among them, every man dealing justly one with another."},{"time":170.24,"text":"12. And it came to pass that they did do all things, even as Jesus had commanded them."},{"time":176.32,"text":"13. And they which were baptized in the name of Jesus were called the church of Christ."},{"time":182.08,"text":"14. And it came to pass that as the disciples of Jesus were journeying and were preaching the things which they had both heard and seen and were baptizing in the name of Jesus, It came to pass that the disciples were gathered together and were united in mighty prayer and fasting;"},{"time":196.47,"text":"15. And Jesus again showed Himself unto them, for they were praying unto the Father in His name; And Jesus came and stood in the midst of them and saith unto them: \"What will ye that I shall give unto you?\""},{"time":208.915,"text":"16. And they saith unto Him: \"Lord, we will that Thou wouldst tell us the name whereby we shall call this church, For there are disputations among the people concerning this matter.\""},{"time":221.36,"text":"17. And the Lord said unto them: \"Verily, verily I say unto you, why is it that the people should murmur and dispute because of this thing?"},{"time":234.611,"text":"18. Have they not read the scriptures which saith, 'Ye must take upon you the name of Christ, ' which is My name? For by this name shall ye be called at the last day, And whoso taketh upon him My name and endureth to the end, the same shall be saved at the last day."},{"time":247.861,"text":"19. \"Therefore, whatsoever ye shall do, ye shall do it in My name; Therefore, ye shall call the church in My name; And ye shall call upon the Father in My name, that He will bless the church for My sake; And howbeit My church save it be called in My name?"},{"time":264.664,"text":"20. For if a church be called in Moses' name, then it be Moses' church; Or if it be called in the name of a man, then it be the church of a man; But if it be called in My name, then it is My church - if it so be that they are built upon My gospel."},{"time":279.584,"text":"21. \"Verily I say unto you that ye are built upon My gospel, Therefore, ye shall call whatsoever things ye do call in My name; Therefore, if ye call upon the Father for the church, if it be in My name, the Father will hear you;"},{"time":294.625,"text":"22. And if it so be that the church is built upon My gospel, then will the Father show forth His own works in it."},{"time":302.0,"text":"23. \"But if it be not built upon My gospel and is built upon the works of man or upon the works of the devil, Verily I say unto you, they have joy in their works for a season; And by and by the end cometh, And they are hewn down and cast into the fire from whence there is no return;"},{"time":318.72,"text":"24. For their works do follow them, For it is because of their works that they are hewn down; Therefore, remember the things that I have told you."},{"time":328.96,"text":"25. \"Behold, I have given unto you My gospel, And this is the gospel which I have given unto you - That I came into the world to do the will of My Father because My Father sent Me;"},{"time":339.764,"text":"26. And My Father sent Me that I might be lifted up upon the cross; And after that I had been lifted up upon the cross, I might draw all men unto Me;"},{"time":348.618,"text":"27. That as I have been lifted up by men, even so should men be lifted up by the Father to stand before Me to be judged of their works, whether they be good or whether they be evil;"},{"time":361.04,"text":"28. And for this cause have I been lifted up; Therefore, according to the power of the Father, I will draw all men unto Me, that they may be judged according to their works."},{"time":372.0,"text":"29. \"And it shall come to pass that whoso repenteth and is baptized in My name shall be filled; And if he endureth to the end, Behold, him will I hold guiltless before My Father at that day when I shall stand to judge the world;"},{"time":385.333,"text":"30. And he that endureth not unto the end, The same is he that is also hewn down and cast into the fire from whence they can no more return because of the justice of the Father. \"And this is the word which He hath given unto the children of men;"},{"time":401.536,"text":"31. And for this cause He fulfilleth the words which He hath given, And He lieth not, but fulfilleth all His words; And no unclean thing can enter into His kingdom;"},{"time":413.344,"text":"32. Therefore, nothing entereth into His rest, Save it be those who have washed their garments in My blood because of their faith and the repentance of all their sins and their faithfulness unto the end."},{"time":425.37,"text":"33. \"Now this is the commandment: Repent, all ye ends of the earth! and come unto Me! and be baptized in My name! That ye may be sanctified by the reception of the Holy Ghost, That ye may stand spotless before Me at the last day!"},{"time":442.96,"text":"34. \"Verily, verily I say unto you, this is My gospel. \"And ye know the things that ye must do in My church, For the works which ye have seen Me do, that shall ye also do;"},{"time":455.44,"text":"35. For that which ye have seen Me do, even that shall ye do; Therefore, if ye do these things, blessed are ye, For ye shall be lifted up at the last day."}]
};
