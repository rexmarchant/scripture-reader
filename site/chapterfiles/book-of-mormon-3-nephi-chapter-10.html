  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 10"},{"time":10.768,"text":"1. \"But if they will repent, and hearken unto My words, and harden not their hearts, I will establish My church among them; And they shall come in unto the covenant and be numbered among this, the remnant of Jacob, unto whom I have given this land for their inheritance, And they shall assist My people, the remnant of Jacob -"},{"time":21.537,"text":"2. And also as many of the house of Israel as shall come - That they may build a city which shall be called the New Jerusalem;"},{"time":30.32,"text":"3. And then shall they assist My people that they may be gathered in, which are scattered upon all the face of the land, in unto the New Jerusalem;"},{"time":38.408,"text":"4. And then shall the powers of heaven come down among them, And I also will be in the midst; And then shall the work of the Father commence at that day, even when this gospel shall be preached among the remnant of this people."},{"time":52.0,"text":"5. \"Verily I say unto you, at that day shall the work of the Father commence among all the dispersed of My people - Yea, even the tribes which have been lost which the Father hath led away out of Jerusalem -"},{"time":63.41,"text":"6. Yea, the work shall commence among all the dispersed of My people, with the Father, To prepare the way whereby they may come unto Me, that they may call on the Father in My name."},{"time":75.2,"text":"7. \"Yea, and then shall the work commence with the Father among all nations in preparing the way whereby His people may be gathered home to the land of their inheritance;"},{"time":86.711,"text":"8. And they shall go out from all nations, And they shall not go out in haste nor go by flight; 'For I will go before them, ' saith the Father, 'And I will be their rearward.' \"And then shall that which is written come to pass:"},{"time":101.04,"text":"9. 'Sing, O barren, thou that didst not bear! Break forth into singing and cry aloud, thou that didst not travail with child! For more are the children of the desolate than the children of the married wife, ' saith the Lord."},{"time":117.844,"text":"10. 'Enlarge the place of thy tent, And let them stretch forth the curtains of thy habitations; Spare not; Lengthen thy cords and strengthen thy stakes."},{"time":127.76,"text":"11. For thou shalt break forth on the right hand and on the left, And thy seed shall inherit the Gentiles, And make the desolate cities to be inhabited."},{"time":137.04,"text":"12. 'Fear not, for thou shalt not be ashamed; Neither be thou confounded, for thou shalt not be put to shame; For thou shalt forget the shame of thy youth, And shalt not remember the reproach of thy widowhood anymore."},{"time":151.675,"text":"13. For thy Maker, thy husband, the Lord of Hosts is His name; And thy Redeemer, the Holy One of Israel, the God of the whole earth shall He be called;"},{"time":162.88,"text":"14. For the Lord hath called thee as a woman forsaken and grieved in spirit, And a wife of youth when thou wast refused, ' saith thy God."},{"time":172.56,"text":"15. 'For a small moment have I forsaken thee, But with great mercies will I gather thee."},{"time":178.24,"text":"16. In a little wrath I hid My face from thee for a moment; But with everlasting kindness will I have mercy on thee, ' saith the Lord thy Redeemer."},{"time":186.7,"text":"17. 'For this, the waters of Noah unto Me, For as I have sworn that the waters of Noah should no more go over the earth, So have I sworn that I would not be wroth with thee."},{"time":198.218,"text":"18. For the mountains shall depart, And the hills be removed, But My kindness shall not depart from thee, Neither shall the covenant of My peace be removed, ' saith the Lord that hath mercy on thee."},{"time":210.739,"text":"19. 'O thou afflicted, tossed with tempests and not comforted, Behold, I will lay thy stones with fair colors and lay thy foundations with sapphires."},{"time":221.02,"text":"20. And I will make thy windows of agates and thy gates of carbuncles, And all thy borders of pleasant stones."},{"time":228.48,"text":"21. And all thy children shall be taught of the Lord, And great shall be the peace of thy children."},{"time":235.92,"text":"22. In righteousness shalt thou be established; Thou shalt be far from oppression, for thou shalt not fear; And from terror, for it shall not come near thee."},{"time":246.113,"text":"23. 'Behold, they shall surely gather together against thee, not by Me. Whosoever shall gather together against thee shall fall for thy sake."},{"time":255.289,"text":"24. 'Behold, I have created the smith that bloweth the coals in the fire, And that bringeth forth an instrument for his work; And I have created the waster to destroy."},{"time":267.093,"text":"25. No weapon that is formed against thee shall prosper, And every tongue that shall revile against thee in judgment thou shalt condemn. This is the heritage of the servants of the Lord, And their righteousness is of Me, ' saith the Lord."},{"time":281.56,"text":"26. \"And now behold, I say unto you that ye had ought to search these things -"},{"time":288.56,"text":"27. Yea, a commandment I give unto you that ye search these things diligently, for great are the words of Isaiah,"},{"time":295.285,"text":"28. For surely he spake as touching all things concerning My people which are of the house of Israel; Therefore, it must needs be that he must speak also to the Gentiles;"},{"time":306.4,"text":"29. And all things that he spake hath been and shall be, even according to the words which he spake."},{"time":316.0,"text":"30. \"Therefore, give heed to My words; Write the things which I have told you, And according to the time and the will of the Father, they shall go forth unto the Gentiles;"},{"time":325.6,"text":"31. And whosoever will hearken unto My words and repenteth and is baptized, the same shall be saved."},{"time":332.08,"text":"32. \"Search the prophets, for many there be that testify of these things.\""},{"time":338.72,"text":"33. And now it came to pass that when Jesus had said these words, He saith unto them again - after He had expounded all the scriptures unto them which they had received - He saith unto them: \"Behold, other scriptures I would that ye should write that ye have not.\""},{"time":354.24,"text":"34. And it came to pass that He saith unto Nephi: \"Bring forth the records which ye have kept.\""},{"time":359.68,"text":"35. And when Nephi had brought forth the records and laid them before Him, And He cast His eyes upon them and saith:"},{"time":367.44,"text":"36. \"Verily I say unto you, I commanded My servant Samuel the Lamanite that he should testify unto this people, That at the day that the Father should glorify His name in Me, That there were many saints which should arise from the dead and should appear unto many and should minister unto them.\""},{"time":383.84,"text":"37. And He saith unto them, \"Were it not so?\""},{"time":388.385,"text":"38. And His disciples answered Him and said: \"Yea, Lord, Samuel did prophesy according to Thy words, And they were all fulfilled.\""},{"time":398.96,"text":"39. And Jesus saith unto them: \"Howbeit that ye have not written this thing - that many saints did arise and appear unto many and did minister unto them?\""},{"time":408.8,"text":"40. And it came to pass that Nephi remembered that this thing had not been written."},{"time":413.04,"text":"41. And it came to pass that Jesus commanded that it should be written, Therefore, it was written according as He commanded."}]
};
