<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 15",
  audioSrc: "https://archive.org/download/alma-ch-15/Alma%20Ch%2015.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 15"},{"time":7.738,"text":"1. Now it came to pass that when the Lamanites which had gone to war against the Nephites had found - after their many struggles for to destroy them - that it was in vain to seek their destruction, they returned again to the Land of Nephi."},{"time":15.476,"text":"2. And it came to pass that the Amalekites, because of their loss, were exceeding angry;"},{"time":21.209,"text":"3. And when they saw that they could not seek revenge from the Nephites, they began to stir up the people in anger against their brethren, the people of Anti-Nephi-Lehi; Therefore, they began again to destroy them."},{"time":35.68,"text":"4. Now this people again refused to take their arms, And they suffered themselves to be slain according to the desires of their enemy."},{"time":43.675,"text":"5. Now when Ammon and his brethren saw this work of destruction among those who they so dearly beloved and among those who had so dearly beloved them - for they were treated as though they were angels sent from God to save them from everlasting destruction -"},{"time":57.563,"text":"6. Therefore, when Ammon and his brethren saw this great work of destruction, they were moved with compassion and they said unto the king: \"Let us gather together this people of the Lord, And let us go down to the Land of Zarahemla to our brethren the Nephites and flee out of the hands of our enemies, that we be not destroyed.\""},{"time":78.547,"text":"7. But the king saith unto them: \"Behold, the Nephites will destroy us because of the many murders and sins we have committed against them.\""},{"time":87.44,"text":"8. And Ammon saith: \"I will go and inquire of the Lord; And if He saith unto us, 'Go down unto our brethren, ' will ye go?\""},{"time":95.509,"text":"9. And the king saith unto him: \"Yea, if the Lord saith unto us, 'Go, ' we will go down unto our brethren, And we will be their slaves until we repair unto them the many murders and sins which we have committed against them.\""},{"time":109.896,"text":"10. But Ammon saith unto him: \"It is against the law of our brethren, which was established by my father, that there should be any slaves among them; Therefore, let us go down and rely upon the mercies of our brethren.\""},{"time":123.76,"text":"11. But the king saith unto him: \"Inquire of the Lord and if He saith unto us, 'Go, ' we will go; Otherwise, we will perish in the land.\""},{"time":139.5,"text":"12. And it came to pass that Ammon went and inquired of the Lord and the Lord said unto him: \"Get this people out of this land, that they perish not, For Satan hath great hold on the hearts of the Amalekites which do stir up the Lamanites to anger against their brethren to slay them, Therefore, get thee out of this land; And blessed art this people in this generation, for I will preserve them.\""},{"time":155.24,"text":"13. And now it came to pass that Ammon went and told the king all the words which the Lord had said unto him."},{"time":162.587,"text":"14. And it came to pass that they gathered together all their people, yea, all the people of the Lord, And did gather together all their flocks and herds and departed out of the land, And came into the wilderness which divided the Land of Nephi from the Land of Zarahemla and came over near the borders of the land."},{"time":181.484,"text":"15. And it came to pass that Ammon saith unto them: \"Behold, I and my brethren will go forth into the Land of Zarahemla and ye shall remain here until we return; And we will try the hearts of our brethren, whether they will that ye shall come into their land.\""},{"time":194.622,"text":"16. And it came to pass that as Ammon was going forth into the land, that he and his brethren met Alma over in the place of which has been spoken; And behold, this was a joyful meeting."},{"time":207.76,"text":"17. Now the joy of Ammon was so great, even that he was full, Yea, he was swallowed up in the joy of his God, even to the exhausting of his strength, And he fell again to the earth;"},{"time":220.942,"text":"18. Now was not this exceeding joy? Behold, this is joy which none receiveth, save it be the truly penitent and humble seeker of happiness;"},{"time":230.8,"text":"19. Now the joy of Alma in meeting his brethren was truly great, And also the joy of Aaron, of Omner and Himni; But behold, their joy was not that to exceed their strength."},{"time":242.72,"text":"20. And now it came to pass that Alma conducted his brethren back to the Land of Zarahemla, even to his own house."},{"time":249.261,"text":"21. And it came to pass that they went and told the chief judge all the things which had happened unto them in the Land of Nephi among their brethren, the Lamanites."},{"time":261.44,"text":"22. And it came to pass that the chief judge sent a proclamation throughout all the land, desiring the voice of the people concerning the admitting their brethren which were the people of Anti-Nephi-Lehi."},{"time":271.699,"text":"23. And it came to pass that the voice of the people came, saying: \"Behold, we will give up the Land of Jershon which is on the east by the sea, which joins the Land Bountiful, which is on the south of the Land Bountiful; And this Land Jershon is the land which we will give unto our brethren for an inheritance."},{"time":291.4,"text":"24. \"And behold, we will set our armies between the Land Jershon and the Land Nephi, that we may protect our brethren in the Land of Jershon;"},{"time":302.08,"text":"25. And this we do for our brethren on account of their fear to take up arms against their brethren, lest they should commit sin; And this their great fear came because of their sore repentance which they had on account of their many murders and their awful wickedness."},{"time":317.376,"text":"26. \"And now behold, this will we do unto our brethren that they may inherit the Land Jershon; And we will guard them from their enemies by our armies on conditions that they will give us a portion of their substance to assist us, that we may maintain our armies.\""},{"time":331.568,"text":"27. Now it came to pass that when Ammon had heard this, he returned to the people of Anti-Nephi-Lehi, and also Alma with him, into the wilderness where they had pitched their tents and made known unto them all these things;"},{"time":346.262,"text":"28. And Alma also related unto them his conversion with Ammon and Aaron and his brethren. And it came to pass that it did cause great joy among them."},{"time":357.011,"text":"29. And it came to pass that they went down into the Land of Jershon and took possession of the Land of Jershon. And they were called by the Nephites, the people of Ammon,"},{"time":367.76,"text":"30. Therefore, they were distinguished by that name ever after; And they were numbered among the people of Nephi, and also numbered among the people which were of the church of God."},{"time":377.992,"text":"31. And they were also distinguished for their zeal toward God, and also toward men, for they were perfectly honest and upright in all things; And they were firm in the faith of Christ, even unto the end."},{"time":390.297,"text":"32. And they did look upon shedding the blood of their brethren with the greatest abhorrence; And they never could be prevailed upon to take up arms against their brethren."},{"time":400.635,"text":"33. And they never did look upon death with any degree of terror, for their hope and views of Christ and the resurrection; Therefore, death was swallowed up to them by the victory of Christ over it;"},{"time":413.262,"text":"34. Therefore, they would suffer death in the most aggravating and distressing manner which could be inflicted by their brethren before they would take the sword or the scimitar to smite them;"},{"time":423.28,"text":"35. And thus they were a zealous and beloved people, a highly favored people of the Lord."},{"time":428.528,"text":"36. And now it came to pass that after the people of Ammon were established in the Land of Jershon, and a church also established in the Land of Jershon, And the armies of the Nephites were set round about the Land of Jershon, yea, in all the borders round about the Land of Zarahemla, Behold, the armies of the Lamanites had followed their brethren into the wilderness;"},{"time":450.109,"text":"37. And thus there was a tremendous battle, yea, even such an one as never had been known among all the people in the land from the time Lehi left Jerusalem; Yea, and tens of thousands of the Lamanites were slain and scattered abroad,"},{"time":465.95,"text":"38. Yea, and also there was a tremendous slaughter among the people of Nephi; Nevertheless, the Lamanites were driven and scattered and the people of Nephi returned again to their land."},{"time":476.598,"text":"39. And now this was a time that there was a great mourning and lamentation heard throughout all the land among all the people of Nephi,"},{"time":487.136,"text":"40. Yea, the cry of widows mourning for their husbands, and also of fathers mourning for their sons, and the daughter for the brother, yea, the brother for the father;"},{"time":497.343,"text":"41. And thus the cry of mourning was heard among every one of them, a mourning for their kindred which had been slain;"},{"time":505.44,"text":"42. And now surely this was a sorrowful day, yea, a time of solemnity and a time of much fasting and prayer. And thus ended the fifteenth year of the reign of the judges over the people of Nephi."},{"time":519.52,"text":"43. And this is the account of Ammon and his brethren - their journeyings in the Land of Nephi, their sufferings in the land, their sorrows and their afflictions, and their incomprehensible joy, and the reception and safety of the brethren in the Land of Jershon;"},{"time":535.52,"text":"44. And now may the Lord, the Redeemer of all men, bless their souls forever."},{"time":542.08,"text":"45. And this is the account of the wars and contentions among the Nephites, and also the wars between the Nephites and the Lamanites; And the fifteenth year of the reign of the judges is ended."},{"time":552.96,"text":"46. And from the first year to the fifteenth has brought to pass the destruction of many thousand lives, yea, it has brought to pass an awful scene of bloodshed;"},{"time":562.36,"text":"47. And the bodies of many thousands are laid low in the earth, while the bodies of many thousands are moldering in heaps upon the face of the earth;"},{"time":571.03,"text":"48. Yea, and many thousands are mourning for the loss of their kindred because they have reason to fear, according to the promises of the Lord, that they are consigned to a state of endless wo;"},{"time":583.209,"text":"49. While many thousands of others truly mourn for the loss of their kindred, yet they rejoice and exult in the hope, yea, and even know, according to the promises of the Lord, that they are raised to dwell at the right hand of God in a state of never - ending happiness."},{"time":600.88,"text":"50. And thus we see how great the inequality of man is because of sin and transgression, And the power of the devil which comes by the cunning plans which he hath devised to ensnare the hearts of men;"},{"time":612.256,"text":"51. And thus we see the great call of the diligence of men to labor in the vineyards of the Lord; And thus we see the great reason of sorrow, and also of rejoicing - Sorrow, because of death and destruction among men, And joy, because of the light of Christ unto life."},{"time":628.72,"text":"52. O that I were an angel and could have the wish of mine heart! That I might go forth and speak with the trump of God, With a voice to shake the earth and cry repentance unto every people!"},{"time":641.28,"text":"53. Yea, I would declare unto every soul as with the voice of thunder, repentance and the plan of redemption, That they should repent and come unto our God, That there might be no more sorrow upon all the face of the earth."},{"time":655.277,"text":"54. But behold, I am a man and do sin in my wish, For I had ought to be content with the things which the Lord hath allotted unto me;"},{"time":664.56,"text":"55. I had not ought to harrow up in my desires the firm decree of a just God, For I know that He granteth unto men according to their desires, whether it be unto death or unto life, Yea, I know that He allotteth unto man, yea, decreeth unto them decrees which are unalterable according to their wills, whether it be unto salvation or unto destruction."},{"time":685.342,"text":"56. Yea, and I know that good and evil hath come before all men - Or he that knoweth not good from evil is blameless, But he that knoweth good and evil, to him it is given according to his desires, Whether he desireth good or evil, life or death, joy or remorse of conscience."},{"time":703.195,"text":"57. Now seeing that I know these things, why should I desire more than to perform the work to which I have been called?"},{"time":711.147,"text":"58. Why should I desire that I was an angel, that I could speak unto all the ends of the earth?"},{"time":717.836,"text":"59. For behold, the Lord doth grant unto all nations, of their own nation and tongue, to teach His word, yea, in wisdom all that He seeth fit that they should have; Therefore, we see that the Lord doth counsel in His wisdom according to that which is just and true."},{"time":734.069,"text":"60. I know that which the Lord hath commanded me and I glory in it; I do not glory of myself, but I glory in that which the Lord hath commanded me;"},{"time":744.744,"text":"61. Yea, and this is my glory, that perhaps I may be an instrument in the hands of God to bring some soul to repentance; And this is my joy."},{"time":754.02,"text":"62. And behold, when I see many of my brethren truly penitent and coming to the Lord their God, then is my soul filled with joy, Then do I remember what the Lord has done for me, yea, even that He hath heard my prayer, Yea, then do I remember His merciful arm which He extended toward me."},{"time":772.693,"text":"63. Yea, and I also remember the captivity of my fathers, For I surely do know that the Lord did deliver them out of bondage and by this did establish His church; Yea, the Lord God - the God of Abraham, the God of Isaac, and the God of Jacob - did deliver them out of bondage;"},{"time":792.24,"text":"64. Yea, I have always remembered the captivity of my fathers, And that same God who delivered them out of the hands of the Egyptians did deliver them out of bondage, Yea, and that same God did establish His church among them."},{"time":805.76,"text":"65. Yea, and that same God hath called me by a holy calling to preach the word unto this people, And hath given me much success, in the which my joy is full; But I do not joy in my own success alone, but my joy is more full because of the success of my brethren which have been up to the Land of Nephi;"},{"time":825.285,"text":"66. Behold, they have labored exceedingly and have brought forth much fruit; And how great shall be their reward."},{"time":831.929,"text":"67. Now when I think of the success of these my brethren, my soul is carried away, Even to the separation of it from the body, as it were, so great is my joy;"},{"time":843.351,"text":"68. And now may God grant unto these, my brethren, that they may sit down in the kingdom of God, yea, and also all those which are the fruit of their labor, That they may go no more out, but that they may praise Him forever;"},{"time":857.776,"text":"69. And may God grant that it may be done according to my words, even as I have spoken. Amen."}]
};
