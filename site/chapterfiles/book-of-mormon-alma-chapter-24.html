<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 24",
  audioSrc: "https://archive.org/download/alma-ch-24/Alma%20Ch%2024.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 24"},{"time":10.656,"text":"1. And now it came to pass in the twenty and sixth year of the reign of the judges over the people of Nephi, Behold, when the Lamanites awoke on the first morning of the first month, Behold, they found Amalickiah was dead in his own tent; And they also saw that Teancum was ready to give them battle on that day;"},{"time":21.313,"text":"2. And now when the Lamanites saw this, they were affrighted, And they abandoned their design in marching into the Land Northward and retreated with all their army into the City of Mulek and sought protection in their fortifications."},{"time":35.68,"text":"3. And it came to pass that the brother of Amalickiah was appointed king over the people, And his name was Ammaron; Thus King Ammaron, the brother of King Amalickiah, was appointed to reign in his stead."},{"time":46.893,"text":"4. And it came to pass that he did command that his people should maintain those cities which they had taken by the shedding of blood; For they had not taken any cities, save they had lost much blood."},{"time":58.287,"text":"5. And now Teancum saw that the Lamanites were determined to maintain those cities which they had taken and those parts of the land which they had obtained possession of;"},{"time":69.68,"text":"6. And also seeing the enormity of their number, Teancum thought it was not expedient that he should attempt to attack them in their forts; But he kept his men round about as if making preparations for war,"},{"time":80.049,"text":"7. Yea, and truly he was preparing to defend himself against them by casting up walls round about and preparing places of resort."},{"time":90.418,"text":"8. And it came to pass that he kept thus preparing for war until Moroni had sent a large number of men to strengthen his army."},{"time":100.08,"text":"9. And Moroni also sent orders unto him that he should retain all the prisoners which fell into his hands - For as the Lamanites had taken many prisoners, that he should retain all the prisoners of the Lamanites as a ransom for those which the Lamanites had taken."},{"time":115.022,"text":"10. And he also sent orders unto him that he should fortify the Land Bountiful and secure the Narrow Pass which led into the Land Northward, Lest the Lamanites should obtain that point and should have power to harass them on every side."},{"time":128.391,"text":"11. And Moroni also sent unto him desiring him that he would be faithful in maintaining that quarter of the land, And that he would seek every opportunity to scourge the Lamanites in that quarter as much as was in his power,"},{"time":142.621,"text":"12. That perhaps he might take again, by stratagem or some other way, those cities which had been taken out of their hands, And that he also would fortify and strengthen the cities round about which had not fallen into the hands of the Lamanites."},{"time":156.693,"text":"13. And he also said unto him: \"I would come unto you, But behold, the Lamanites are upon us in the borders of the land by the West Sea, And behold, I go against them; Therefore, I cannot come unto you.\""},{"time":171.524,"text":"14. Now the king, Ammaron, had departed out of the Land of Zarahemla, And had made known unto the queen concerning the death of his brother, And had gathered together a large number of men, And had marched forth against the Nephites on the borders by the West Sea;"},{"time":186.354,"text":"15. And thus he was endeavoring to harass the Nephites and to draw away a part of their forces to that part of the land, While he had commanded those which he had left to possess the cities which he had taken, that they should also harass the Nephites on the borders by the East Sea, And should take possession of their lands as much as it were in their power, according to the power of their armies."},{"time":208.725,"text":"16. And thus were the Nephites in those dangerous circumstances in the ending of the twentieth and sixth year of the reign of the judges over the people of Nephi."},{"time":217.743,"text":"17. But behold, it came to pass in the twentieth and seventh year of the reign of the judges that Teancum - By the command of Moroni who had established armies to protect the south and the west borders of the land, had begun his march toward the Land of Bountiful, that he might assist Teancum with his men in retaking the cities which they had lost -"},{"time":237.844,"text":"18. And it came to pass that Teancum had received orders to make an attack upon the City of Mulek and retake it if it were possible."},{"time":249.525,"text":"19. And it came to pass that Teancum made preparations to make an attack upon the City of Mulek and march forth with his army against the Lamanites; But he saw that it was impossible that he could overpower them while they were in their fortifications;"},{"time":261.206,"text":"20. Therefore, he abandoned his designs and returned again to the City Bountiful to wait for the coming of Moroni, that he might receive strength to his army."},{"time":270.066,"text":"21. And it came to pass that Moroni did arrive with his army to the Land of Bountiful in the latter end of the twenty and seventh year of the reign of the judges over the people of Nephi."},{"time":281.107,"text":"22. And in the commencement of the twenty and eighth year, Moroni and Teancum and many of the chief captains held a council of war what they should do to cause the Lamanites to come out against them to battle,"},{"time":293.12,"text":"23. Or that they might by some means flatter them out of their strongholds, that they might gain advantage over them and take again the City of Mulek."},{"time":302.04,"text":"24. And it came to pass that they sent embassies to the armies of the Lamanites, which protected the City of Mulek, to their leader whose name was Jacob, desiring him that he would come out with his armies to meet them upon the plains between the two cities."},{"time":316.885,"text":"25. But behold, Jacob, which was a Zoramite, would not come out with his army to meet them upon the plains."},{"time":324.564,"text":"26. And it came to pass that Moroni having no hopes of meeting them upon fair grounds, Therefore, he resolved upon a plan that he might decoy the Lamanites out of their strongholds;"},{"time":335.24,"text":"27. Therefore, he caused that Teancum should take a small number of men and march down near the seashore, And Moroni and his army, by night, marched into the wilderness on the west of the City Mulek;"},{"time":349.031,"text":"28. And thus on the morrow, when the guards of the Lamanites had discovered Teancum, they ran and told it unto Jacob their leader."},{"time":357.162,"text":"29. And it came to pass that the armies of the Lamanites did march forth against Teancum, supposing by their numbers to overpower Teancum because of the smallness of his numbers;"},{"time":367.004,"text":"30. And as Teancum saw the armies of the Lamanites coming out against him, he began to retreat down by the seashore, northward."},{"time":376.846,"text":"31. And it came to pass that when the Lamanites saw that he began to flee, they took courage and pursued them with vigor;"},{"time":387.83,"text":"32. And while Teancum was thus leading away the Lamanites which were pursuing them in vain, Behold, Moroni commanded that a part of his army which were with him should march forth into the city and take possession of it."},{"time":398.813,"text":"33. And thus they did and slew all those who had been left to protect the city, yea, all those who would not yield up their weapons of war."},{"time":408.767,"text":"34. And thus Moroni had obtained a possession of the City Mulek with a part of his army, while he marched with the remainder to meet the Lamanites when they should return from the pursuit of Teancum."},{"time":419.809,"text":"35. And it came to pass that the Lamanites did pursue Teancum until they came near the City Bountiful; And then they were met by Lehi and a small army which had been left to protect the City Bountiful."},{"time":432.543,"text":"36. And now behold, when the chief captains of the Lamanites had beheld Lehi with his army coming against them, they fled in much confusion, Lest perhaps they should not obtain the City Mulek before Lehi should overtake them, For they were wearied because of their march and the men of Lehi were fresh."},{"time":450.24,"text":"37. Now the Lamanites did not know that Moroni had been in their rear with his army, And all they feared was Lehi and his men."},{"time":458.32,"text":"38. Now Lehi was not desirous to overtake them till they should meet Moroni and his army."},{"time":464.249,"text":"39. And it came to pass that before the Lamanites had retreated far, they were surrounded by the Nephites - by the men of Moroni on one hand and the men of Lehi on the other, all of whom were fresh and full of strength; But the Lamanites were wearied because of their long march,"},{"time":480.348,"text":"40. And Moroni commanded his men that they should fall upon them until they had given up their weapons of war."},{"time":487.558,"text":"41. And it came to pass that Jacob being their leader, being also a Zoramite and having an unconquerable spirit, He led the Lamanites forth to battle with exceeding fury against Moroni -"},{"time":498.517,"text":"42. Moroni being in their course of march - Therefore, Jacob was determined to slay them and cut his way through to the City of Mulek;"},{"time":509.2,"text":"43. But behold, Moroni and his men were more powerful, Therefore, they did not give way before the Lamanites."},{"time":516.32,"text":"44. And it came to pass that they fought on both hands with exceeding fury; And there were many slain on both sides, Yea, and Moroni was wounded and Jacob was killed;"},{"time":528.0,"text":"45. And Lehi pressed upon their rear with such fury with his strong men that the Lamanites in the rear delivered up their weapons of war, And the remainder of them, being much confused, knew not whether to go or to strike."},{"time":541.402,"text":"46. Now Moroni seeing their confusion, he said unto them: \"If ye will bring forth your weapons of war and deliver them up, Behold, we will forbear shedding your blood.\""},{"time":552.63,"text":"47. And it came to pass that when the Lamanites had heard these words, Their chief captains - all those which were not slain - came forth and threw down their weapons of war at the feet of Moroni, And also commanded their men that they should do the same."},{"time":569.2,"text":"48. But behold, there were many that would not; And those who would not deliver up their swords were taken and bound and their weapons of war were taken from them, And they were compelled to march with their brethren forth into the Land Bountiful;"},{"time":582.391,"text":"49. And now the number of prisoners which were taken exceeded more than the number of those which had been slain, yea, more than those which had been slain on both sides."},{"time":592.688,"text":"50. And it came to pass that they did set guards over the prisoners of the Lamanites, And did compel them to go forth and bury their dead, yea, and also the dead of the Nephites which were slain; And Moroni placed men over them to guard them while they should perform their labors."},{"time":608.947,"text":"51. And Moroni went to the City of Mulek with Lehi and took command of the city and gave it unto Lehi."},{"time":616.616,"text":"52. Now behold, this Lehi was a man who had been with Moroni in the more part of all his battles and he was a man like unto Moroni; And they rejoiced in each other's safety, Yea, they were beloved by each other, and also beloved by all the people of Nephi."},{"time":634.16,"text":"53. And it came to pass that after the Lamanites had finished burying their dead, and also the dead of the Nephites, They were marched back into the Land Bountiful."},{"time":643.526,"text":"54. And Teancum, by the orders of Moroni, caused that they should commence in laboring in digging a ditch round about the Land or the City Bountiful."},{"time":652.893,"text":"55. And he caused that they should build a breastwork of timbers upon the inner bank of the ditch; And they cast up dirt out of the ditch against the breastwork of timbers."},{"time":661.855,"text":"56. And thus they did cause the Lamanites to labor until they had encircled the City of Bountiful round about with a strong wall of timbers and earth to an exceeding height;"},{"time":673.6,"text":"57. And this city became an exceeding stronghold ever after; And in this city they did guard the prisoners of the Lamanites, Yea, even within a wall which they had caused them to build with their own hands."},{"time":685.33,"text":"58. Now Moroni was compelled to cause the Lamanites to labor because it was easy to guard them while at their labor; And he desired all his forces when he should make an attack upon the Lamanites."},{"time":696.665,"text":"59. And it came to pass that Moroni had thus gained a victory over one of the greatest of the armies of the Lamanites, And had obtained possession of the City Mulek which was one of the strongest holds of the Lamanites in the Land of Nephi; And thus he had also built a stronghold to retain his prisoners."},{"time":713.516,"text":"60. And it came to pass that he did no more attempt a battle with the Lamanites in that year; But he did employ his men in preparing for war, Yea, and in making fortifications to guard against the Lamanites, Yea, and also delivering their women and their children from famine and affliction, And providing food for their armies."},{"time":734.88,"text":"61. And now it came to pass that the armies of the Lamanites on the West Sea South - while in the absence of Moroni on account of some intrigue amongst the Nephites, which caused dissensions amongst them - had gained some ground over the Nephites, Yea, insomuch that they had obtained possession of a number of their cities in that part of the land;"},{"time":754.268,"text":"62. And thus because of iniquity amongst themselves, yea, because of dissensions and intrigue among themselves, they were placed in the most dangerous circumstances."},{"time":765.3,"text":"63. And now behold, I have somewhat to say concerning the people of Ammon which, in the beginning, were Lamanites; But by Ammon and his brethren - or rather, by the power and word of God - they had been converted unto the Lord;"},{"time":779.12,"text":"64. And they had been brought down into the Land of Zarahemla and had ever since been protected by the Nephites; And because of their oath, they had been kept from taking up arms against their brethren,"},{"time":790.278,"text":"65. For they had taken an oath that they never would shed blood more; And according to their oath, they would have perished, Yea, they would have suffered themselves to have fallen into the hands of their brethren had it not been for the pity and the exceeding love which Ammon and his brethren had had for them;"},{"time":807.6,"text":"66. And for this cause, they were brought down into the Land of Zarahemla, And they ever had been protected by the Nephites."},{"time":815.016,"text":"67. But it came to pass that when they saw the danger and the many afflictions and tribulations which the Nephites bore for them, They were moved with compassion and were desirous to take up arms in the defense of their country;"},{"time":828.08,"text":"68. But behold, as they were about to take their weapons of war, They were overpowered by the persuasions of Helaman and his brethren, for they were about to break the oath which they had made;"},{"time":839.68,"text":"69. And Helaman feared lest by so doing, they should lose their souls; Therefore, all those which had entered into this covenant were compelled to behold their brethren wade through their afflictions in their dangerous circumstances at this time."},{"time":854.253,"text":"70. But behold, it came to pass they had many sons which had not entered into a covenant that they would not take their weapons of war to defend themselves against their enemies;"},{"time":864.528,"text":"71. Therefore, they did assemble themselves together at this time as many as were able to take up arms, And they called themselves Nephites;"},{"time":872.075,"text":"72. And they entered into a covenant to fight for the liberty of the Nephites, yea, to protect the land unto the laying down of their lives;"},{"time":882.626,"text":"73. Yea, even they covenanted that they never would give up their liberty, but they would fight in all cases to protect the Nephites and themselves from bondage."},{"time":891.24,"text":"74. Now behold, there were two thousand of those young men which entered into this covenant and took their weapons of war to defend their country."},{"time":901.86,"text":"75. And now behold, as they never had hitherto been a disadvantage to the Nephites, they became now at this period of time also a great support, For they took their weapons of war and they would that Helaman should be their leader;"},{"time":915.105,"text":"76. And they were all young men, And they were exceeding valiant for courage, and also for strength and activity; But behold, this was not all - They were men which were true at all times in whatsoever thing they were entrusted,"},{"time":929.567,"text":"77. Yea, they were men of truth and soberness, For they had been taught to keep the commandments of God and to walk uprightly before Him."},{"time":938.64,"text":"78. And now it came to pass that Helaman did march at the head of his two thousand stripling soldiers to the support of the people in the borders of the land on the south by the West Sea."},{"time":949.84,"text":"79. And thus ended the twenty and eighth year of the reign of the judges over the people of Nephi, etc."}]
};
