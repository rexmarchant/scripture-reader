<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 8",
  audioSrc: "https://archive.org/download/alma-ch-8/Alma%20Ch%208.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 8"},{"time":7.546,"text":"1. Now these are the words which Amulek preached unto the people which were in the Land of Ammonihah, saying: \"I am Amulek; I am the son of Gidanah, who was the son of Ishmael, who was a descendant of Aminadi;"},{"time":15.092,"text":"2. And it was that same Aminadi which interpreted the writing which was upon the wall of the temple which was written by the finger of God;"},{"time":24.42,"text":"3. And Aminadi was a descendant of Nephi, who was the son of Lehi, who came out of the Land of Jerusalem, who was a descendant of Manasseh, who was the son of Joseph, which was sold into Egypt by the hands of his brethren."},{"time":38.72,"text":"4. \"And behold, I am also a man of no small reputation among all those who know me."},{"time":45.68,"text":"5. \"Yea, and behold, I have many kindred and friends and I have also acquired much riches by the hand of my industry;"},{"time":53.32,"text":"6. Nevertheless, after all this, I never have known much of the ways of the Lord and His mysteries and marvelous power."},{"time":61.413,"text":"7. \"I said I never had known much of these things, but behold I mistake, for I have seen much of His mysteries and His miraculous power, Yea, even in the preservation of the lives of this people."},{"time":74.895,"text":"8. \"Nevertheless, I did harden my heart, for I was called many times and I would not hear; Therefore, I knew concerning these things, yet I would not know."},{"time":86.72,"text":"9. \"Therefore, I went on rebelling against God in the wickedness of my heart, even until the fourth day of this seventh month, which is in the tenth year of the reign of our judges."},{"time":99.585,"text":"10. \"As I was a journeying to see a very near kindred, behold, an angel of the Lord appeared unto me and said: 'Amulek, return to thine own house, for thou shalt feed a prophet of the Lord, yea, a holy man which art a chosen man of God;"},{"time":112.45,"text":"11. For he hath fasted many days because of the sins of this people and he is enhungered; And thou shall receive him into thy house and feed him, And he shall bless thee and thy house; And the blessing of the Lord shall rest upon thee and thy house.'"},{"time":125.912,"text":"12. \"And it came to pass that I obeyed the voice of the angel and returned toward my house;"},{"time":132.32,"text":"13. And as I was a going thither, I found the man which the angel said unto me, ' Thou shalt receive into thy house '; And behold, it was this same man which hath been speaking unto you concerning the things of God."},{"time":145.638,"text":"14. \"And the angel said unto me: ' He is a holy man '; Wherefore, I know he is a holy man because it was said by an angel of God."},{"time":158.0,"text":"15. \"And again, I know that the things whereof he hath testified are true; For behold I say unto you, that as the Lord liveth, even so He hath sent His angel to make these things manifest unto me; And this He hath done while this Alma hath dwelt at my house."},{"time":174.676,"text":"16. \"For behold, he hath blessed mine house; He hath blessed me and my women and my children and my father and my kinsfolk,"},{"time":182.08,"text":"17. Yea, even all my kindred hath he blessed; And the blessing of the Lord hath rested upon us according to the words which he spake.\""},{"time":191.627,"text":"18. And now when Amulek had spoken these words, the people began to be astonished, Seeing there was more than one witness which testified of the things whereof they were accused, and also of the things which were to come, according to the spirit of prophecy which was in them."},{"time":207.482,"text":"19. Nevertheless, there were some among them which thought to question them, That by their cunning devices they might catch them in their words, That they might find witness against them, That they might deliver them to the judges,"},{"time":220.066,"text":"20. That they might be judged according to the law, And that they might be slain or cast into prison according to the crime which they could make appear, or witness against them."},{"time":230.127,"text":"21. Now, it was those men which sought to destroy them which were lawyers which were hired, or appointed by the people to administer the law at their times of trials, or at the trials of the crimes of the people before the judges."},{"time":244.64,"text":"22. Now these lawyers were learned in all the arts and cunning of the people; And this was to enable them that they might be skillful in their profession."},{"time":253.28,"text":"23. And it came to pass that they began to question Amulek that thereby they might make him cross his words, or contradict the words which he should speak."},{"time":262.213,"text":"24. Now, they knew not that Amulek could know of their design;"},{"time":266.543,"text":"25. But it came to pass as they began to question him, he perceived their thoughts and he saith unto them: \"O ye wicked and perverse generation! Ye lawyers and hypocrites! For ye are laying the foundations of the devil;"},{"time":281.413,"text":"26. For ye are laying traps and snares to catch the holy ones of God; Ye are laying plans to pervert the ways of the righteous and to bring down the wrath of God upon your heads, even to the utter destruction of this people."},{"time":295.419,"text":"27. \"Yea, well did Mosiah say, who was our last king, when he was about to deliver up the kingdom - having no one to confer it upon, causing that this people should be governed by their own voices -"},{"time":308.181,"text":"28. Yea, well did he say, that if the time should come that the voice of this people should choose iniquity, That is, if the time should come that this people should fall into transgression, they would be ripe for destruction."},{"time":321.515,"text":"29. \"And now I say unto you, that well doth the Lord judge of your iniquities; Well doth He cry unto this people by the voice of His angels, 'Repent ye! repent, for the kingdom of heaven is at hand! '"},{"time":335.992,"text":"30. Yea, well doth He cry by the voice of His angels that 'I will come down among My people with equity and justice in My hands! '"},{"time":343.897,"text":"31. \"Yea, and I say unto you that if it were not for the prayers of the righteous which are now in the land, that ye would even now be visited with utter destruction;"},{"time":354.576,"text":"32. Yet it would not be by flood, as were the people in the days of Noah, but it would be by famine and by pestilence and the sword;"},{"time":362.556,"text":"33. But it is by the prayers of the righteous that ye are spared. \"Now therefore, if ye will cast out the righteous from among you, then will not the Lord stay His hand, but in His fierce anger He will come out against you;"},{"time":377.571,"text":"34. Then ye shall be smitten by famine and by pestilence and by the sword; And the time is soon at hand except ye repent.\""},{"time":385.624,"text":"35. And now it came to pass that the people were more angry with Amulek and they cried out, saying: \"This man doth revile against our laws, which are just, and our wise lawyers which we have selected.\""},{"time":399.2,"text":"36. But Amulek stretched forth his hand and cried the mightier unto them, saying: \"O ye wicked and perverse generation! Why hath Satan got such great hold upon your hearts?"},{"time":411.708,"text":"37. Why will ye yield yourselves unto him, that he may have power over you to blind your eyes, that ye will not understand the words which are spoken according to their truth?"},{"time":423.166,"text":"38. \"For behold, have I testified against your law?"},{"time":427.6,"text":"39. Ye do not understand; Ye say that I have spoken against your law, but I have not; But I have spoken in favor of your law, to your condemnation."},{"time":437.76,"text":"40. \"And now behold, I say unto you that the foundation of the destruction of this people is beginning to be laid by the unrighteousness of your lawyers and your judges.\""},{"time":447.634,"text":"41. And now it came to pass that when Amulek had spoken these words, the people cried out against him, saying: \"Now we know that this man is a child of the devil, for he hath lied unto us, for he hath spoken against our law,"},{"time":462.632,"text":"42. And now he saith that he hath not spoken against it.\""},{"time":466.98,"text":"43. And again: \"He hath reviled against our lawyers and our judges, \" etc."},{"time":472.8,"text":"44. And it came to pass that the lawyers put it into their hearts that they should remember these things against him."},{"time":479.667,"text":"45. And it came to pass that there was one among them whose name was Zeezrom,"},{"time":486.0,"text":"46. Now he being the foremost to accuse Amulek and Alma, he being one of the most expert among them, having much business to do among the people."},{"time":494.987,"text":"47. Now the object of these lawyers was to get gain; And they got gain according to their employ."},{"time":505.413,"text":"48. Now it was in the law of Mosiah that every man which was a judge of the law, or which were appointed to be judges, should receive wages according to the time which they labored to judge those which were brought before them to be judged."},{"time":515.84,"text":"49. Now if a man oweth another and he would not pay that which he did owe, he was complained of to the judge;"},{"time":521.84,"text":"50. And the judge executed authority and sent forth officers that the man should be brought before him;"},{"time":530.608,"text":"51. And he judgeth the man according to the law and the evidences which are brought against him; And thus the man is compelled to pay that which he oweth, or be striped, or be cast out from among the people as a thief and a robber."},{"time":546.968,"text":"52. And the judge receiveth for his wages according to his time - a senine of gold for a day, or a senum of silver which is equal to a senine of gold; And this is according to the law which was given."},{"time":554.56,"text":"53. Now these are the names of the different pieces of their gold and of their silver, according to their value;"},{"time":560.453,"text":"54. And the names are given by the Nephites, for they did not reckon after the manner of the Jews which were at Jerusalem; Neither did they measure after the manner of the Jews,"},{"time":571.101,"text":"55. But they altered their reckoning and their measure according to the minds and the circumstances of the people in every generation until the reign of the judges, they having been established by King Mosiah."},{"time":584.64,"text":"56. Now, the reckoning is thus: A senine of gold, a seon of gold, a shum of gold and a limnah of gold;"},{"time":589.186,"text":"57. A senum of silver, an amnor of silver, an ezrum of silver and an onti of silver;"},{"time":600.984,"text":"58. A senum of silver was equal to a senine of gold, And either for a measure of barley and also for a measure of every kind of grain."},{"time":608.236,"text":"59. Now, the amount of a seon of gold was twice the value of a senine; And a shum of gold was twice the value of a seon; And a limnah of gold was the value of them all;"},{"time":620.4,"text":"60. And an amnor of silver was as great as two senums; And an ezrum of silver was as great as four senums; And an onti was as great as them all."},{"time":629.608,"text":"61. Now this is the value of the lesser numbers of their reckoning: A shiblon is half of a senum, therefore a shiblon for half a measure of barley; And a shilum is a half of a shiblon and a leah is the half of a shilum."},{"time":644.0,"text":"62. Now an antion of gold is equal to three shiblons."},{"time":647.778,"text":"63. Now this is their number according to their reckoning."},{"time":651.186,"text":"64. Now it was for the sole purpose for to get gain, because they received their wages according to their employ,"},{"time":658.98,"text":"65. Therefore, they did stir up the people to riotings and all manner of disturbances and wickedness, That they might have more employ"},{"time":667.74,"text":"66. and that they might get money according to the suits which were brought before them; Therefore, they did stir up the people against Alma and Amulek."},{"time":672.406,"text":"67. And this Zeezrom began to question Amulek, saying: \"Will ye answer me a few questions which I shall ask you?\""},{"time":685.577,"text":"68. Now Zeezrom was a man which was expert in the devices of the devil, that he might destroy that which was good; Therefore, he saith unto Amulek: \"Will ye answer the questions which I shall put unto you?\""},{"time":701.309,"text":"69. And Amulek saith unto him: \"Yea, I will, if it be according to the Spirit of the Lord which is in me, for I shall say nothing which is contrary to the Spirit of the Lord.\""},{"time":715.141,"text":"70. And Zeezrom saith unto him: \"Behold, here are six onties of silver, And all these will I give unto thee if thou wilt deny the existence of a Supreme Being.\""},{"time":724.266,"text":"71. Now Amulek saith: \"O thou child of hell! Why tempt ye me?"},{"time":729.592,"text":"72. Knowest thou that the righteous yieldeth to no such temptations?"},{"time":732.4,"text":"73. \"Believest thou that there is no God?"},{"time":735.229,"text":"74. I say unto you, nay, thou knowest that there is a God, but thou lovest that lucre more than Him."},{"time":743.882,"text":"75. \"And now thou hast lied before God unto me,"},{"time":748.16,"text":"76. For thou saidst unto me, 'Behold these six onties which are of great worth, I will give unto thee, ' when thou had it in thy heart to retain them from me;"},{"time":758.229,"text":"77. And it was only thy desire that I should deny the true and living God, that thou mightest have cause to destroy me."},{"time":767.12,"text":"78. \"And now behold, for this great evil, thou shalt have thy reward.\""},{"time":771.721,"text":"79. And Zeezrom saith unto him: \"Thou sayest there is a true and a living God?\""},{"time":779.932,"text":"80. And Amulek saith: \"Yea, there is a true and a living God.\""},{"time":786.572,"text":"81. Now Zeezrom saith: \"Is there more than one God?\""},{"time":789.6,"text":"82. And he answered: \"No.\""},{"time":792.928,"text":"83. Now Zeezrom saith unto him again: \"How knowest thou these things?\""},{"time":799.012,"text":"84. And he saith: \"An angel hath made them known unto me.\""},{"time":805.525,"text":"85. And Zeezrom saith again: \"Who is He that shall come? Is it the Son of God?\""},{"time":809.28,"text":"86. And he said unto him: \"Yea.\""},{"time":813.68,"text":"87. And Zeezrom saith again: \"Shall He save His people in their sins?\""},{"time":818.08,"text":"88. And Amulek answered and said unto him: \"I say unto you He shall not, for it is impossible for Him to deny His word.\""},{"time":829.6,"text":"89. Now Zeezrom saith unto the people: \"See that ye remember these things, for he saith there is but one God; Yet he saith that the Son of God shall come, but He shall not save His people, as though he had authority to command God.\""},{"time":841.12,"text":"90. Now Amulek said again unto him: \"Behold, thou hast lied, for thou sayest that I spake as though I had authority to command God because I said He shall not save His people in their sins."},{"time":851.916,"text":"91. \"And I say unto you again, that He cannot save them in their sins, for I cannot deny His word, And He hath said that no unclean thing can inherit the kingdom of heaven;"},{"time":865.02,"text":"92. Therefore, how can ye be saved except ye inherit the kingdom of heaven? Therefore, ye cannot be saved in your sins.\""},{"time":869.651,"text":"93. Now Zeezrom saith again unto him: \"Is the Son of God the Very Eternal Father?\""},{"time":881.171,"text":"94. And Amulek saith unto him: \"Yea, He is the Very Eternal Father of heaven and of earth and all things which in them is;"},{"time":888.06,"text":"95. He is the beginning and the end, the first and the last;"},{"time":893.004,"text":"96. And He shall come into the world to redeem His people; And He shall take upon Him the transgressions of those who believe on His name, And these are they that shall have eternal life; And salvation cometh to none else."},{"time":905.33,"text":"97. \"Therefore, the wicked remain as though there had been no redemption made, except it be the loosing of the bands of death."},{"time":914.032,"text":"98. \"For behold, the day cometh that all shall rise from the dead and stand before God and be judged according to their works."},{"time":922.249,"text":"99. \"Now there is a death which is called temporal death; And the death of Christ shall loose the bands of this temporal death, that all shall be raised from this temporal death;"},{"time":933.56,"text":"100. The spirit and the body shall be reunited again in its perfect form; Both limb and joint shall be restored to its proper frame, even as we now are at this time;"},{"time":944.408,"text":"101. And we shall be brought to stand before God, knowing even as we know now, and have a bright recollection of all our guilt."},{"time":953.28,"text":"102. \"Now this restoration shall come to all - both old and young, both bond and free, both male and female, both the wicked and the righteous;"},{"time":963.84,"text":"103. And even there shall not so much as a hair of their heads be lost, But all things shall be restored to its perfect frame, as it is now, or in the body,"},{"time":973.503,"text":"104. And shall be brought and be arraigned before the bar of Christ the Son and God the Father and the Holy Spirit, which is one Eternal God, To be judged according to their works, whether they be good or whether they be evil."},{"time":986.588,"text":"105. \"Now behold, I have spoken unto you concerning the death of the mortal body, and also concerning the resurrection of the mortal body;"},{"time":996.64,"text":"106. I say unto you that this mortal body is raised to an immortal body, That is, from death, even from the first death unto life, that they can die no more, Their spirits uniting with their bodies, never to be divided,"},{"time":1010.54,"text":"107. Thus, the whole becoming spiritual and immortal, that they can no more see corruption.\""},{"time":1017.624,"text":"108. Now, when Amulek had finished these words, the people began again to be astonished, and also Zeezrom began to tremble."},{"time":1024.709,"text":"109. And thus ended the words of Amulek, Or this is all that I have written."}]
};
