<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 1",
  audioSrc: "https://archive.org/download/alma-ch-1/Alma%20Ch%201.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 1"},{"time":9.68,"text":"1. Now it came to pass that in the first year of the reign of the judges over the people of Nephi, From this time forward, King Mosiah, having gone the way of all the earth, having warred a good warfare, walking uprightly before God, leaving no one to reign in his stead -"},{"time":19.36,"text":"2. Nevertheless, he established laws and they were acknowledged by the people; Therefore, they were obliged to abide by the laws which he had made."},{"time":28.16,"text":"3. And it came to pass that in the first year of the reign of Alma in the judgment seat, there was a man brought before him to be judged, A man which was large and was noted for his much strength."},{"time":38.387,"text":"4. And he had gone about among the people preaching to them that which he termed to be the word of God, bearing down against the church,"},{"time":47.28,"text":"5. Declaring unto the people that every priest and teacher had ought to become popular, And they ought not to labor with their own hands, but that they had ought to be supported by the people."},{"time":60.32,"text":"6. And he also testified unto the people that all mankind should be saved at the last day and that they need not fear nor tremble, but that they might lift up their heads and rejoice;"},{"time":71.2,"text":"7. For the Lord had created all men and had also redeemed all men, And in the end all men should have eternal life."},{"time":77.827,"text":"8. And it came to pass that he did teach these things so much that many did believe on his words, even so many that they began to support him and give him money;"},{"time":89.28,"text":"9. And he began to be lifted up in the pride of his heart and to wear very costly apparel, Yea, and even began to establish a church after the manner of his preaching."},{"time":99.76,"text":"10. And it came to pass as he was going to preach to those who believed on his word, he met a man which belonged to the church of God, yea, even one of their teachers;"},{"time":109.2,"text":"11. And he began to contend with him sharply, that he might lead away the people of the church; But the man withstood him, admonishing him with the words of God."},{"time":119.12,"text":"12. Now the name of the man was Gideon; And it was him that was an instrument in the hands of God in delivering the people of Limhi out of bondage."},{"time":127.595,"text":"13. Now because Gideon withstood him with the words of God, he was wroth with Gideon and drew his sword and began to smite him;"},{"time":135.68,"text":"14. Now Gideon being stricken with many years, therefore he was not able to withstand his blows, therefore he was slain by the sword;"},{"time":143.764,"text":"15. And the man who slew him was taken by the people of the church and was brought before Alma to be judged according to the crime which he had committed."},{"time":154.4,"text":"16. And it came to pass that he stood before Alma and pled for himself with much boldness."},{"time":162.137,"text":"17. But Alma said unto him: \"Behold, this is the first time that priestcraft has been introduced among this people."},{"time":169.875,"text":"18. \"And behold, thou art not only guilty of priestcraft, but hast endeavored to enforce it by the sword; And were priestcraft to be enforced among this people, it would prove their entire destruction."},{"time":182.231,"text":"19. \"And thou hast shed the blood of a righteous man, yea, a man which has done much good among this people; And were we to spare thee, his blood would come upon us for vengeance."},{"time":195.36,"text":"20. \"Therefore, thou art condemned to die according to the law which has been given us by Mosiah, our last king;"},{"time":202.135,"text":"21. And they have been acknowledged by this people, therefore, this people must abide by the law.\""},{"time":208.857,"text":"22. And it came to pass that they took him, and his name was Nehor, and they carried him upon the top of the Hill Manti;"},{"time":217.218,"text":"23. And there he was caused, or rather, did acknowledge between the heavens and the earth that what he had taught to the people was contrary to the word of God; And there he suffered an ignominious death."},{"time":228.89,"text":"24. Nevertheless, this did not put an end to the spreading of priestcraft through the land, for there were many which loved the vain things of the world; And they went forth preaching false doctrines, And this they did for the sake of riches and honor."},{"time":242.245,"text":"25. Nevertheless, they durst not lie, if it were known, for fear of the law, for liars were punished; Therefore, they pretended to preach according to their belief -"},{"time":255.6,"text":"26. And now the law could have no power on any man for their belief;"},{"time":262.667,"text":"27. And they durst not steal for fear of the law, for such were punished; Neither durst they rob nor murder, for he that murdereth was punished unto death."},{"time":269.733,"text":"28. But it came to pass that whosoever did not belong to the church of God began to persecute those that did belong to the church of God and had taken upon them the name of Christ,"},{"time":280.589,"text":"29. Yea, they did persecute them and afflict them with all manner of words; And this because of their humility,"},{"time":288.016,"text":"30. because they were not proud in their own eyes, And because they did impart the word of God one with another, without money and without price."},{"time":297.84,"text":"31. Now there was a strict law among the people of the church that there should not any man belonging to the church arise and persecute those that did not belong to the church, And that there should be no persecution among themselves;"},{"time":309.505,"text":"32. Nevertheless, there were many among them who began to be proud and began to contend warmly with their adversaries, even unto blows, Yea, they would smite one another with their fists."},{"time":321.636,"text":"33. Now this was in the second year of the reign of Alma; And it was a cause of much affliction to the church, Yea, it was the cause of much trial with the church,"},{"time":332.998,"text":"34. For the hearts of many were hardened; And their names were blotted out, that they were remembered no more among the people of God,"},{"time":340.987,"text":"35. And also many withdrew themselves from among them."},{"time":344.684,"text":"36. Now this was a great trial to those that did stand fast in the faith; Nevertheless, they were steadfast and immovable in keeping the commandments of God, And they bore with patience the persecution which was heaped upon them."},{"time":360.0,"text":"37. And when their priests left their labor to impart the word of God unto the people, the people also left their labors to hear the word of God;"},{"time":368.284,"text":"38. And when the priest had imparted unto them the word of God, they all returned again diligently unto their labors;"},{"time":376.08,"text":"39. And the priest, not esteeming himself above his hearers, for the preacher was no better than the hearer, neither was the teacher any better than the learner, And thus they were all equal and they did all labor, every man according to his strength."},{"time":391.92,"text":"40. And they did impart of their substance, every man according to that which he had, to the poor and the needy and the sick and the afflicted;"},{"time":400.674,"text":"41. And they did not wear costly apparel, yet they were neat and comely;"},{"time":405.37,"text":"42. And thus they did establish the affairs of the church; And thus they began to have continual peace again, notwithstanding all their persecutions."},{"time":415.68,"text":"43. And now because of the steadiness of the church, they began to be exceeding rich, having abundance of all things whatsoever they stood in need -"},{"time":425.36,"text":"44. Abundance of flocks and herds and fatlings of every kind, And also abundance of grain and of gold and of silver and of precious things, And abundance of silk and fine-twined linen and all manner of good homely cloth."},{"time":439.05,"text":"45. And thus in their prosperous circumstances they did not send away any which was naked, or that was hungry, or that was athirst, or that was sick, or that had not been nourished;"},{"time":450.66,"text":"46. And they did not set their hearts upon riches; Therefore, they were liberal to all - both old and young, both bond and free, both male and female, whether out of the church or in the church - Having no respect to persons as to those who stood in need."},{"time":467.68,"text":"47. And thus they did prosper and become far more wealthy than those who did not belong to their church;"},{"time":473.6,"text":"48. For those who did not belong to their church did indulge themselves in sorceries and in idolatry or idleness and in babblings and in envyings and strife,"},{"time":485.12,"text":"49. And wearing costly apparel, being lifted up in the pride of their own eyes, Persecuting, lying, thieving, robbing, committing whoredoms and murdering and all manner of wickedness."},{"time":497.52,"text":"50. Nevertheless, the law was put in force upon all those who did transgress it, inasmuch as it were possible."},{"time":504.4,"text":"51. And it came to pass that by thus exercising the law upon them, every man suffering according to that which he had done, they became more still and durst not commit any wickedness if it were known;"},{"time":516.447,"text":"52. Therefore, there was much peace among the people of Nephi until the fifth year of the reign of the judges."},{"time":523.44,"text":"53. And it came to pass in the commencement of the fifth year of their reign there began to be a contention among the people, For a certain man, being called Amlici - He being a very cunning man, yea, a wise man as to the wisdom of the world, He being after the order of the man that slew Gideon by the sword who was executed according to the law -"},{"time":540.232,"text":"54. Now this Amlici had, by his cunning, drawn away much people after him, even so much that they began to be very powerful; And they began to endeavor to establish Amlici to be a king over the people."},{"time":557.023,"text":"55. Now this was alarming to the people of the church, and also to all those who had not been drawn away after the persuasions of Amlici,"},{"time":566.151,"text":"56. For they knew that according to their law, that such things must be established by the voice of the people;"},{"time":577.275,"text":"57. Therefore, if it were possible that Amlici should gain the voice of the people, he, being a wicked man, would deprive them of their rights and privileges of the church, etc., For it was his intent to destroy the church of God."},{"time":588.4,"text":"58. And it came to pass that the people assembled themselves together throughout all the land - Every man according to his mind, whether it were for or against Amlici - In separate bodies, having much dispute and wonderful contentions one with another;"},{"time":602.897,"text":"59. And thus they did assemble themselves together to cast in their voices concerning the matter; And they were laid before the judges."},{"time":610.752,"text":"60. And it came to pass that the voice of the people came against Amlici, that he was not made king over the people."},{"time":618.56,"text":"61. Now this did cause much joy in the hearts of those which were against him; But Amlici did stir up those which were in his favor to anger against those which were not in his favor."},{"time":629.59,"text":"62. And it came to pass that they gathered themselves together and did consecrate Amlici to be their king."},{"time":638.315,"text":"63. Now when Amlici was made king over them, he commanded them that they should take up arms against their brethren; And this he did that he might subject them to him."},{"time":647.04,"text":"64. Now the people of Amlici were distinguished by the name of Amlici, being called Amlicites, And the remainder were called Nephites, or the people of God."},{"time":657.28,"text":"65. Therefore, the people of the Nephites were aware of the intent of the Amlicites and therefore they did prepare for to meet them;"},{"time":665.318,"text":"66. Yea, they did arm themselves with swords, and with scimitars, and with bows and with arrows, and with stones and with slings, and with all manner of weapons of war of every kind;"},{"time":676.998,"text":"67. And thus they were prepared to meet the Amlicites at the time of their coming;"},{"time":683.44,"text":"68. And there were appointed captains and higher captains and chief captains, according to their numbers."},{"time":690.953,"text":"69. And it came to pass that Amlici did arm his men with all manner of weapons of war of every kind; And he also appointed rulers and leaders over his people to lead them to war against their brethren."},{"time":705.679,"text":"70. And it came to pass that the Amlicites came up upon the Hill Amnihu which was east of the River Sidon which ran by the Land of Zarahemla; And there they began to make war with the Nephites."},{"time":712.893,"text":"71. Now Alma, he being the chief judge and the governor of the people of Nephi, Therefore, he went up with his people - yea, with his captains and chief captains - yea, at the head of his armies against the Amlicites to battle; And they began to slay the Amlicites upon the hill east of Sidon."},{"time":731.693,"text":"72. And the Amlicites did contend with the Nephites with great strength, insomuch that many of the Nephites did fall before the Amlicites;"},{"time":741.784,"text":"73. Nevertheless, the Lord did strengthen the hand of the Nephites that they slew the Amlicites with a great slaughter, that they began to flee before them."},{"time":750.817,"text":"74. And it came to pass that the Nephites did pursue the Amlicites all that day and did slay them with much slaughter, Insomuch that there was slain of the Amlicites twelve thousand five hundred thirty and two souls;"},{"time":765.2,"text":"75. And there was slain of the Nephites six thousand five hundred sixty and two souls."},{"time":769.952,"text":"76. And it came to pass that when Alma could pursue the Amlicites no longer, he caused that his people should pitch their tents in the Valley of Gideon, the valley being called after that Gideon which was slain by the hand of Nehor with the sword; And in this valley the Nephites did pitch their tents for the night."},{"time":789.4,"text":"77. And Alma sent spies to follow the remnant of the Amlicites, that he might know of their plans and their plots, Whereby he might guard himself against them, that he might preserve his people from being destroyed."},{"time":801.04,"text":"78. Now those which he had sent out to watch the camp of the Amlicites were called Zeram and Amnor and Manti and Limher; These were they which went out with their men to watch the camp of the Amlicites."},{"time":812.96,"text":"79. And it came to pass that on the morrow they returned into the camp of the Nephites in great haste, being greatly astonished and struck with much fear, saying:"},{"time":823.04,"text":"80. \"Behold, we followed the camp of the Amlicites, And to our great astonishment - in the Land of Minon above the Land of Zarahemla, in the course of the Land of Nephi - we saw a numerous host of the Lamanites."},{"time":837.737,"text":"81. \"And behold, the Amlicites have joined them and they are upon our brethren in that land; And they are fleeing before them with their flocks and their wives and their children toward our city;"},{"time":849.2,"text":"82. And except we make haste, they obtain possession of our city, and our fathers and our wives and our children be slain.\""},{"time":856.72,"text":"83. And it came to pass that the people of Nephi took their tents and departed out of the Valley of Gideon toward their city which was the City of Zarahemla."},{"time":865.534,"text":"84. And behold, as they were crossing the River Sidon, the Lamanites and the Amlicites being as numerous almost as it were as the sands of the sea, coming upon them to destroy them -"},{"time":876.85,"text":"85. Nevertheless, the Nephites being strengthened by the hand of the Lord, having prayed mightily to Him that He would deliver them out of the hands of their enemies,"},{"time":886.475,"text":"86. Therefore, the Lord did hear their cries and did strengthen them; And the Lamanites and the Amlicites did fall before them."},{"time":895.874,"text":"87. And it came to pass that Alma fought with Amlici with the sword, face to face; And they did contend mightily one with another."},{"time":904.809,"text":"88. And it came to pass that Alma, he being a man of God, being exercised with much faith, And he cried, saying: \"O Lord, have mercy and spare my life, that I may be an instrument in Thy hands to save and protect this people!\""},{"time":920.32,"text":"89. Now when Alma had said these words, he contended again with Amlici, And he was strengthened insomuch that he slew Amlici with the sword;"},{"time":931.267,"text":"90. And he also contended with the king of the Lamanites, But the king of the Lamanites fled back from before Alma and sent his guards to contend with Alma;"},{"time":940.48,"text":"91. But Alma, with his guards, contended with the guards of the king of the Lamanites until he slew and drove them back."},{"time":948.64,"text":"92. And thus he cleared the ground, or rather the bank, which was on the west of the River Sidon, throwing the bodies of the Lamanites which had been slain into the waters of Sidon, That thereby his people might have room to cross and contend with the Lamanites and the Amlicites on the west side of the River Sidon."},{"time":965.903,"text":"93. And it came to pass that when they had all crossed the River Sidon, that the Lamanites and the Amlicites began to flee before them, notwithstanding they were so numerous that they could not be numbered;"},{"time":978.015,"text":"94. And they fled before the Nephites toward the wilderness which was west and north, away beyond the borders of the land;"},{"time":988.996,"text":"95. And the Nephites did pursue them with their might and did slay them, Yea, they were met on every hand and slain and driven until they were scattered on the west and on the north, until they had reached the wilderness which was called Hermounts;"},{"time":999.976,"text":"96. And it was that part of the wilderness which was infested by wild and ravenous beasts."},{"time":1005.731,"text":"97. And it came to pass that many died in the wilderness of their wounds and were devoured by those beasts, and also the vultures of the air; And their bones have been found and have been heaped upon the earth."},{"time":1018.556,"text":"98. And it came to pass that the Nephites which were not slain by the weapons of war, after having buried those which had been slain - now the number of the slain were not numbered because of the greatness of their number - And after they had finished burying their dead, they all returned to their lands and to their houses and their wives and their children."},{"time":1037.261,"text":"99. Now many women and children had been slain with the sword, and also many of their flocks and their herds;"},{"time":1045.167,"text":"100. And also many of their fields of grain were destroyed, for they were trodden down by the hosts of men."},{"time":1052.56,"text":"101. And now as many of the Lamanites and the Amlicites which had been slain upon the bank of the River Sidon were cast into the waters of Sidon; And behold, their bones are in the depths of the sea, and they are many."},{"time":1066.107,"text":"102. And the Amlicites were distinguished from the Nephites, for they had marked themselves with red in their foreheads after the manner of the Lamanites; Nevertheless, they had not shorn their heads like unto the Lamanites."},{"time":1079.6,"text":"103. Now the heads of the Lamanites were shorn, And they were naked, save it were skin which was girded about their loins, And also their armor which was girded about them, and their bows and their arrows, and their stones and their slings, etc."},{"time":1093.572,"text":"104. And the skins of the Lamanites were dark, according to the mark which was set upon their fathers, Which was a curse upon them because of their transgression and their rebellion against their brethren which consisted of Nephi, Jacob and Joseph and Sam, which were just and holy men."},{"time":1110.529,"text":"105. And their brethren sought to destroy them; Therefore, they were cursed, And the Lord God set a mark upon them, yea, upon Laman and Lemuel, and also the sons of Ishmael and the Ishmaelitish women;"},{"time":1124.018,"text":"106. And this was done that their seed might be distinguished from the seed of their brethren, that thereby the Lord God might preserve His people, that they might not mix and believe in incorrect traditions which would prove their destruction."},{"time":1138.16,"text":"107. And it came to pass that whosoever did mingle his seed with that of the Lamanites did bring the same curse upon his seed;"},{"time":1145.581,"text":"108. Therefore, whomsoever suffered himself to be led away by the Lamanites were called under that head and there was a mark set upon him."},{"time":1154.236,"text":"109. And it came to pass that whosoever would not believe in the tradition of the Lamanites, But believed those records which were brought out of the Land of Jerusalem, and also in the tradition of their fathers, which were correct, Which believed in the commandments of God and kept them, Were called the Nephites, or the people of Nephi, from that time forth;"},{"time":1174.122,"text":"110. And it is they which have kept the records, which are true, of their people, and also of the people of the Lamanites."},{"time":1183.68,"text":"111. Now we will return again to the Amlicites, for they also had a mark set upon them; Yea, they set the mark upon themselves, yea, even a mark of red upon their foreheads."},{"time":1194.56,"text":"112. Thus, the word of God is fulfilled, for these are the words which He saith to Nephi:"},{"time":1202.08,"text":"113. \"Behold, the Lamanites have I cursed; And I will set a mark upon them, that they and their seed may be separated from thee and thy seed from this time, henceforth and forever, except they repent of their wickedness and turn to me, that I may have mercy upon them."},{"time":1218.226,"text":"114. \"And again, I will set a mark upon him that mingleth his seed with thy brethren, that they may be cursed also."},{"time":1224.461,"text":"115. \"And again, will I set a mark upon him that fighteth against thee and thy seed."},{"time":1231.84,"text":"116. \"And again I say, he that departeth from thee shall no more be called thy seed; And I will bless thee, etc., and whomsoever shall be called thy seed, henceforth and forever.\" And these were the promises of the Lord unto Nephi and to his seed."},{"time":1248.0,"text":"117. Now the Amlicites knew not that they were fulfilling the words of God when they began to mark themselves in their foreheads;"},{"time":1254.747,"text":"118. Nevertheless, as they had come out in open rebellion against God, Therefore, it was expedient that the curse should fall upon them."},{"time":1264.027,"text":"119. Now I would that ye should see that they brought upon themselves the curse;"},{"time":1269.884,"text":"120. And even so doth every man that is cursed bringeth upon himself his own condemnation."},{"time":1276.107,"text":"121. Now it came to pass that not many days after the battle which was fought in the Land of Zarahemla by the Lamanites and the Amlicites, That there was another army of the Lamanites came in upon the people of Nephi in the same place where the first army met the Amlicites."},{"time":1291.656,"text":"122. And it came to pass that there was an army sent to drive them out of their land;"},{"time":1297.92,"text":"123. Now Alma, himself being afflicted with a wound, did not go up to battle at this time against the Lamanites, but he sent up a numerous army against them;"},{"time":1307.16,"text":"124. And they went up and slew many of the Lamanites and drove the remainder of them out of the borders of their land;"},{"time":1314.543,"text":"125. And then they returned again and began to establish peace in the land, being troubled no more for a time with their enemies."},{"time":1322.72,"text":"126. Now all these things were done, yea, all these wars and contentions were commenced and ended in the fifth year of the reign of the judges."},{"time":1331.516,"text":"127. And in one year were thousands and tens of thousands of souls sent to the eternal world,"},{"time":1337.91,"text":"128. That they might reap their rewards according to their works - whether they were good or whether they were bad, To reap eternal happiness or eternal misery according to the spirit which he listed to obey - whether it be a good spirit or a bad one;"},{"time":1352.96,"text":"129. For every man receiveth wages of him who he listeth to obey, And this according to the words of the spirit of prophecy; Therefore, let it be according to the truth."},{"time":1363.336,"text":"130. And thus ended the fifth year of the reign of the judges."}]
};
