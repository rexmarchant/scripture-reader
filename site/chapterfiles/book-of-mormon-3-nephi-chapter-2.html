<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",
  chapter: "Chapter 2",
  audioSrc: "https://archive.org/download/3-nephi-ch-2/3%20Nephi%20Ch%202.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 2"},{"time":6.953,"text":"1. And now it came to pass that in the sixteenth year from the coming of Christ, Lachoneus, the governor of the land, received an epistle from the leader and the governor of this band of robbers."},{"time":13.906,"text":"2. And these were the words which were written, saying: \"Lachoneus, most noble and chief governor of the land, Behold, I write this epistle unto you and do give unto you exceeding great praise because of your firmness, and also the firmness of your people, in maintaining that which ye suppose to be your right and liberty;"},{"time":34.048,"text":"3. Yea, ye do stand well - as if ye were supported by the hand of a God in the defense of your liberty and your property and your country, or that which ye do call so;"},{"time":44.272,"text":"4. And it seemeth a pity unto me, most noble Lachoneus, that ye should be so foolish and vain as to suppose that ye can stand against so many brave men which are at my command, Which do now at this time stand in their arms and do await, with great anxiety, for the word, 'Go down upon the Nephites and destroy them.'"},{"time":64.683,"text":"5. \"And I knowing of their unconquerable spirit, having proved them in the field of battle and knowing of their everlasting hatred toward you because of the many wrongs which ye have done unto them, Therefore, if they should come down against you, they would visit you with utter destruction."},{"time":80.549,"text":"6. \"Therefore, I have written this epistle, sealing it with mine own hand, Feeling for your welfare because of your firmness in that which ye believe to be right and your noble spirit in the field of battle."},{"time":93.572,"text":"7. \"Therefore, I write unto you desiring that ye would yield up unto this my people your cities, your lands and your possessions, Rather than that they should visit you with the sword and that destruction should come upon you;"},{"time":106.0,"text":"8. Or, in other words, yield yourselves up unto us, and unite with us, and become acquainted with our secret works, and become our brethren, That ye may be like unto us - Not our slaves, but our brethren and partners of all our substance."},{"time":122.72,"text":"9. \"And behold, I swear unto you, if ye will do this with an oath, ye shall not be destroyed, But if ye will not do this, I swear unto you with an oath that on the morrow month I will command that my armies shall come down against you,"},{"time":136.48,"text":"10. And they shall not stay their hand and shall spare not, But shall slay you and shall let fall the sword upon you, yea, even until ye shall become extinct."},{"time":146.499,"text":"11. \"And behold, I am Giddianhi and am the governor of this, the secret society of Gaddianton, which society and the works thereof I know to be good; And they are of ancient date and they have been handed down unto us;"},{"time":162.443,"text":"12. And I write this epistle unto you, Lachoneus, And I hope that ye will deliver up your lands and your possessions without the shedding of blood, That this my people may recover their rights and government which have dissented away from you because of your wickedness in retaining from them their rights of government; And except ye do this, I will avenge their wrongs; I am Giddianhi.\""},{"time":186.153,"text":"13. And now it came to pass when Lachoneus received this epistle, he was exceedingly astonished because of the boldness of Giddianhi in demanding the possession of the land of the Nephites,"},{"time":193.92,"text":"14. And also of threatening the people and avenging the wrongs of those that had received no wrong, save it were they had wronged themselves by dissenting away unto those wicked and abominable robbers."},{"time":204.015,"text":"15. Now behold, this Lachoneus, the governor, was a just man and could not be frightened by the demands and the threatenings of a robber;"},{"time":214.11,"text":"16. Therefore, he did not hearken to the epistle of Giddianhi, the governor of the robbers, But he did cause that his people should cry unto the Lord for strength against the time that the robbers should come down against them."},{"time":227.649,"text":"17. Yea, he sent a proclamation among all the people that they should gather together their women and their children, their flocks and their herds and all their substance - save it were their land - unto one place."},{"time":241.189,"text":"18. And he caused that fortifications should be built round about them and the strength thereof should be exceeding great."},{"time":248.72,"text":"19. And he caused that there should be armies - both of the Nephites and of the Lamanites, or of all them which were numbered among the Nephites - should be placed as guards round about to watch them and to guard them from the robbers day and night."},{"time":261.272,"text":"20. Yea, he said unto them, \"As the Lord liveth, except ye repent of all your iniquities and cry unto the Lord\" - That they could in no wise be delivered out of the hands of those Gaddianton robbers."},{"time":273.824,"text":"21. And so great and marvelous were the words and prophecies of Lachoneus that they did cause fear to come upon all the people, And they did exert themselves in their might to do according to the words of Lachoneus."},{"time":287.181,"text":"22. And it came to pass that Lachoneus did appoint chief captains over all the armies of the Nephites to command them at the time that the robbers should come down out of the wilderness against them;"},{"time":298.805,"text":"23. Now the chiefest among all the chief captains and the great commander of all the armies of the Nephites was appointed, and his name was Gidgiddoni;"},{"time":307.572,"text":"24. Now it was the custom among all the Nephites to appoint for their chief captains - save it were in their times of wickedness - someone that had the spirit of revelation, and also prophecy; Therefore, this Gidgiddoni was a great prophet among them, and also was the chief judge."},{"time":325.41,"text":"25. Now the people said unto Gidgiddoni: \"Pray unto the Lord, And let us go up upon the mountains and into the wilderness, that we may fall upon the robbers and destroy them in their own lands.\""},{"time":336.105,"text":"26. But Gidgiddoni saith unto them: \"The Lord forbid, for if we should go up against them, the Lord would deliver us into their hands;"},{"time":346.8,"text":"27. Therefore, we will prepare ourselves in the center of our lands, And we will gather all our armies together, And we will not go against them, but we will wait till they shall come against us;"},{"time":357.68,"text":"28. Therefore, as the Lord liveth, if we do this, He will deliver them into our hands.\""},{"time":365.76,"text":"29. And it came to pass in the seventeenth year in the latter end of the year, the proclamation of Lachoneus had gone forth throughout all the face of the land,"},{"time":375.263,"text":"30. And they had taken their horses and their chariots and their cattle and all their flocks and their herds and their grain and all their substance,"},{"time":383.986,"text":"31. And did march forth by thousands and by tens of thousands, until they had all gone forth to the place which had been appointed that they should gather themselves together to defend themselves against their enemies;"},{"time":397.36,"text":"32. And the land which was appointed was the Land of Zarahemla and the land which was between the Land of Zarahemla and the Land Bountiful, yea, to the line which was betwixt the Land Bountiful and the Land Desolation;"},{"time":409.98,"text":"33. And there were a great many thousand people which were called Nephites which did gather themselves together in this land."},{"time":419.737,"text":"34. Now Lachoneus did cause that they should gather themselves together in the Land Southward because of the great curse which was upon the Land Northward; And they did fortify themselves against their enemies,"},{"time":429.493,"text":"35. And they did dwell in one land and in one body, And they did fear the words which had been spoken by Lachoneus, insomuch that they did repent of all their sins;"},{"time":440.4,"text":"36. And they did put up their prayers unto the Lord their God, that he would deliver them in the time that their enemies should come down against them to battle;"},{"time":448.768,"text":"37. And they were exceeding sorrowful because of their enemies;"},{"time":456.55,"text":"38. And Gidgiddoni did cause that they should make weapons of war of every kind, that they should be strong with armor and with shields and with bucklers after the manner of his instructions."},{"time":464.333,"text":"39. And it came to pass that in the latter end of the eighteenth year, those armies of robbers had prepared for battle and began to come down and to sally forth from the hills and out of the mountains and the wilderness and their strongholds and their secret places,"},{"time":479.148,"text":"40. And began to take possession of the lands, both which was in the Land South and which was in the Land North, And began to take possession of all the lands which had been deserted by the Nephites and the cities which had been left desolate."},{"time":494.231,"text":"41. But behold, there were no wild beasts nor game in those lands which had been deserted by the Nephites, And there was no game for the robbers, save it were in the wilderness;"},{"time":505.341,"text":"42. And the robbers could not exist - save it were in the wilderness - for the want of food, For the Nephites had left their lands desolate, and had gathered their flocks and their herds and all their substance; And they were in one body,"},{"time":518.204,"text":"43. Therefore, there was no chance for the robbers to plunder and to obtain food, save it were to come up in open battle against the Nephites;"},{"time":527.742,"text":"44. And the Nephites being in one body and having so great a number and having reserved for themselves provisions and horses and cattle and flocks of every kind that they might subsist for the space of seven years,"},{"time":540.88,"text":"45. In the which time they did hope to destroy the robbers from off the face of the land. And thus the eighteenth year did pass away."},{"time":549.2,"text":"46. And it came to pass that in the nineteenth year, Giddianhi found that it was expedient that he should go up to battle against the Nephites, For there was no way that they could subsist, save it were to plunder and rob and murder;"},{"time":557.757,"text":"47. And they durst not spread themselves upon the face of the land insomuch that they could raise grain, lest the Nephites should come upon them and slay them;"},{"time":573.041,"text":"48. Therefore, Giddianhi gave commandment unto his armies that in this year they should go up to battle against the Nephites."},{"time":579.768,"text":"49. And it came to pass that they did come up to battle, And it was in the sixth month, And behold, great and terrible was the day that they did come up to battle."},{"time":591.52,"text":"50. And they were girded about after the manner of robbers; And they had a lambskin about their loins and they were dyed in blood; And their heads were shorn and they had headplates upon them;"},{"time":602.4,"text":"51. And great and terrible was the appearance of the armies of Giddianhi because of their armor and because of their being dyed in blood."},{"time":610.8,"text":"52. And it came to pass that the armies of the Nephites - when they saw the appearance of the army of Giddianhi - hast all fallen to the earth, And did lift their cries to the Lord their God, that He would spare them and deliver them out of the hands of their enemies."},{"time":625.84,"text":"53. And it came to pass that when the armies of Giddianhi saw this, they began to shout with a loud voice because of their joy, For they had supposed that the Nephites had fallen with fear because of the terror of their armies;"},{"time":637.84,"text":"54. But in this thing they were disappointed, for the Nephites did not fear them, But they did fear their God and did supplicate Him for protection;"},{"time":647.44,"text":"55. Therefore, when the armies of Giddianhi did rush upon them, they were prepared to meet them - Yea, in the strength of the Lord they did receive them. And the battle commenced in this, the sixth month;"},{"time":659.555,"text":"56. And great and terrible was the battle thereof - Yea, great and terrible was the slaughter thereof, insomuch that there never was known so great a slaughter among all the people of Lehi since he left Jerusalem;"},{"time":673.067,"text":"57. And notwithstanding the threatenings and the oaths which Giddianhi had made, Behold, the Nephites did beat them, insomuch that they did fall back from before them."},{"time":685.04,"text":"58. And it came to pass that Gidgiddoni commanded that his armies should pursue them as far as to the borders of the wilderness, And that they should not spare any that should fall into their hands by the way;"},{"time":695.776,"text":"59. And thus they did pursue them and did slay them to the borders of the wilderness, even until they had fulfilled the commandment of Gidgiddoni."},{"time":705.327,"text":"60. And it came to pass that Giddianhi, who had stood and fought with boldness, was pursued as he fled; And being weary because of his much fighting, he was overtaken and slain; And thus was the end of Giddianhi the robber."},{"time":719.6,"text":"61. And it came to pass that the armies of the Nephites did return again to their place of security."},{"time":725.607,"text":"62. And it came to pass that this nineteenth year did pass away and the robbers did not come again to battle, Neither did they come in the twentieth year."},{"time":737.231,"text":"63. But in the twenty and first year they did not come up to battle, But they came up on all sides to lay siege round about the people of Nephi;"},{"time":742.848,"text":"64. For they did suppose that if they should cut off the people of Nephi from their lands and should hem them in on every side, And if they should cut them off from all their outward privileges, That they could cause them to yield themselves according to their wishes."},{"time":756.629,"text":"65. Now they had appointed unto themselves another leader whose name was Zemnarihah, Therefore, it was Zemnarihah that did cause that this siege should take place."},{"time":766.853,"text":"66. But behold, this was an advantage unto the Nephites, For it was impossible for the robbers to lay siege sufficiently long to have any effect upon the Nephites because of their much provision which they had laid up in store and because of the scantiness of provisions among the robbers;"},{"time":783.829,"text":"67. For behold, they had nothing save it were meat for their subsistence, which meat they did obtain in the wilderness."},{"time":791.813,"text":"68. And it came to pass that the wild game became scarce in the wilderness, insomuch that the robbers were about to perish with hunger."},{"time":801.2,"text":"69. And the Nephites were continually marching out by day and by night and falling upon their armies and cutting them off by thousands and by tens of thousands;"},{"time":810.249,"text":"70. And thus it became the desire of the people of Zemnarihah to withdraw from their design because of the great destruction which came upon them by night and by day."},{"time":820.304,"text":"71. And it came to pass that Zemnarihah did give command unto his people that they should withdraw themselves from the siege and to march into the farthermost parts of the Land Northward."},{"time":831.021,"text":"72. And now Gidgiddoni being aware of their design and knowing of their weakness because of the want of food and the great slaughter which had been made among them, Therefore, he did send out his armies in the nighttime and did cut off the way of their retreat and did place his armies in the way of their retreat;"},{"time":848.8,"text":"73. And this did they do in the nighttime and got on their march beyond the robbers, So that on the morrow when the robbers began their march, they were met by the armies of the Nephites, both in their front and in their rear;"},{"time":862.8,"text":"74. And the robbers which were on the south were also cut off in their places of retreat; And all these things were done by command of Gidgiddoni."},{"time":871.05,"text":"75. And there were many thousands which did yield themselves up prisoners unto the Nephites, And the remainder of them were slain; And their leader, Zemnarihah, was taken and hanged upon a tree - yea, even upon the top thereof - until he was dead;"},{"time":887.76,"text":"76. And when they had hanged him until he was dead, they did fell the tree to the earth and did cry with a loud voice, saying: \"May the Lord preserve His people in righteousness and in holiness of heart! That they may cause to be felled to the earth all who shall seek to slay them because of power and secret combinations, even as this man hath been felled to the earth.\""},{"time":909.68,"text":"77. And they did rejoice and cry again with one voice, saying, \"May the God of Abraham and the God of Isaac and the God of Jacob protect this people in righteousness, so long as they shall call on the name of their God for protection!\""},{"time":922.838,"text":"78. And it came to pass that they did break forth - all as one - in singing and praising their God for the great thing which He had done for them in preserving them from falling into the hands of their enemies;"},{"time":935.591,"text":"79. Yea, they did cry, \"Hosanna to the Most High God!\" And they did cry, \"Blessed be the name of the Lord God Almighty, the Most High God!\""},{"time":945.92,"text":"80. And their hearts were swollen with joy unto the gushing out of many tears because of the great goodness of God in delivering them out of the hands of their enemies;"},{"time":954.938,"text":"81. And they knew it was because of their repentance and their humility that they had been delivered from an everlasting destruction."},{"time":961.831,"text":"82. And now behold, there was not a living soul among all the people of the Nephites which did doubt in the least thing in the words of all the holy prophets which had spoken;"},{"time":974.08,"text":"83. For they knew that it must needs be that they must be fulfilled; And they knew that it must be expedient that Christ had come because of the many signs which had been given according to the words of the prophets;"},{"time":985.107,"text":"84. And because of the things which had come to pass already, they knew it must needs be that all things should come to pass according to that which had been spoken;"},{"time":996.409,"text":"85. Therefore, they did forsake all their sins and their abominations and their whoredoms and did serve God with all diligence day and night."},{"time":1003.696,"text":"86. And now it came to pass that when they had taken all the robbers prisoners, insomuch that none did escape which were not slain, They did cast their prisoners into prison and did cause the word of God to be preached unto them;"},{"time":1017.949,"text":"87. And as many as would repent of their sins and enter into a covenant that they would murder no more were set at liberty;"},{"time":1026.08,"text":"88. But as many as there were who did not enter into a covenant and who did still continue to have those secret murders in their hearts - Yea, as many as were found breathing out threatenings against their brethren were condemned and punished according to the law;"},{"time":1039.848,"text":"89. And thus they did put an end to all those wicked and secret and abominable combinations, in the which there were so much wickedness and so many murders committed."},{"time":1049.704,"text":"90. And thus had the twenty and second year passed away, And the twenty and third year also, And the twenty and fourth, And the twenty and fifth."},{"time":1060.021,"text":"91. And thus had twenty and five years passed away; And there had been many things transpired which in the eyes of some would be great and marvelous;"},{"time":1068.52,"text":"92. Nevertheless, they could not all be written in this book, Yea, this book cannot contain even a hundredth part of what was done among so many people in the space of twenty and five years."},{"time":1080.619,"text":"93. But behold, there are records which do contain all the proceedings of this people, And a more short but a true account is given by Nephi;"},{"time":1091.264,"text":"94. Therefore, I have made my record of these things according to the record of Nephi which was engraven on the plates which were called the plates of Nephi;"},{"time":1100.029,"text":"95. And behold, I do make the record on plates which I have made with mine own hands."},{"time":1107.76,"text":"96. And behold, I am called Mormon, being called after the Land of Mormon - The land in the which Alma did establish the church among this people, yea, the first church which was established among them after their transgression."},{"time":1121.228,"text":"97. Behold, I am a disciple of Jesus Christ, the Son of God; I have been called of Him to declare His word among His people, that they might have everlasting life."},{"time":1133.12,"text":"98. And it hath become expedient that I - according to the will of God that the prayers of those which have gone hence, which were the holy ones, should be fulfilled according to their faith - should make a record of these things which have been done,"},{"time":1147.36,"text":"99. Yea, a small record of that which hath taken place from the time that Lehi left Jerusalem, even down until the present time."},{"time":1155.76,"text":"100. Therefore, I do make my record from the accounts which hath been given by those which were before me until the commencement of my day, And then do I make a record of the things which I have seen with mine own eyes;"},{"time":1169.143,"text":"101. And I know the record which I make to be a just and a true record; Nevertheless, there are many things which, according to our language, we are not able to write;"},{"time":1179.4,"text":"102. And now I make an end of my saying, which is of myself, and proceed to give my account of the things which hath been before me. I am Mormon and a pure descendant of Lehi;"},{"time":1191.34,"text":"103. I have reason to bless my God and my Savior Jesus Christ - That He brought our fathers out of the Land of Jerusalem - and no one knew it, save it were Himself and those which He brought out of that land - And that He hath given me and my people so much knowledge unto the salvation of our souls."},{"time":1209.095,"text":"104. Surely He hath blessed the house of Jacob and hath been merciful unto the seed of Joseph;"},{"time":1216.979,"text":"105. And inasmuch as the children of Lehi hath kept His commandments, He hath blessed them and prospered them according to His word."},{"time":1224.864,"text":"106. Yea, and surely shall He again bring a remnant of the seed of Joseph to the knowledge of the Lord their God;"},{"time":1232.32,"text":"107. And as surely as the Lord liveth will He gather in from the four quarters of the earth all the remnant of the seed of Jacob which are scattered abroad upon all the face of the earth."},{"time":1242.184,"text":"108. And as He hath covenanted with all the house of Jacob, Even so shall the covenant wherewith He hath covenanted with the house of Jacob be fulfilled in His own due time, Unto the restoring all the house of Jacob unto the knowledge of the covenant that He hath covenanted with them."},{"time":1258.16,"text":"109. And then shall they know their Redeemer, which is Jesus Christ the Son of God; And then shall they be gathered in from the four quarters of the earth unto their own lands, from whence they have been dispersed. Yea, as the Lord liveth, so shall it be! Amen."}]
};
