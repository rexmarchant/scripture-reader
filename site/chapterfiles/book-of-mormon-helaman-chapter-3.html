<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Helaman",
  chapter: "Chapter 3",
  audioSrc: "https://archive.org/download/helaman-ch-3/Helaman%20Ch%203.mp3",
  lyrics: [{"time":0.0,"text":"Helaman Chapter 3"},{"time":11.8,"text":"1. Behold, now it came to pass in the sixty and ninth year of the reign of the judges over the people of the Nephites that Nephi, the son of Helaman, returned to the Land of Zarahemla from the Land Northward; For he had been forth among the people which were in the Land Northward, And did preach the word of God unto them, And did prophesy many things unto them;"},{"time":23.6,"text":"2. And they did reject all his words insomuch that he could not stay among them, but returned again unto the land of his nativity."},{"time":31.305,"text":"3. And seeing the people in a state of such awful wickedness and those Gaddianton robbers filling the judgment seats, Having usurped the power and authority of the land, Laying aside the commandments of God and not in the least aright before Him, Doing no justice unto the children of men, Condemning the righteous because of their righteousness, Letting the guilty and the wicked go unpunished because of their money;"},{"time":55.44,"text":"4. And moreover, to be held in office at the head of government to rule and to do according to their wills, that they might get gain and glory of the world; And moreover, that they might the more easy commit adultery and steal and kill and do according to their own wills -"},{"time":71.84,"text":"5. Now this great iniquity had come upon the Nephites in the space of not many years - And when Nephi saw it, his heart was swollen with sorrow within his breast;"},{"time":81.36,"text":"6. And he did exclaim in the agony of his soul: \"O that I could have had my days in the days when my father Nephi first came out of the Land of Jerusalem! That I could have joyed with him in the Promised Land!"},{"time":93.864,"text":"7. Then were his people easy to be entreated, firm to keep the commandments of God and slow to be led to do iniquity; And they were quick to hearken unto the words of the Lord;"},{"time":103.789,"text":"8. Yea, if my days could have been in those days, then would my soul have had joy in the righteousness of my brethren."},{"time":113.714,"text":"9. \"But behold, I am consigned that these are my days, and that my soul shall be filled with sorrow because of this, the wickedness of my brethren.\""},{"time":124.48,"text":"10. And behold, now it came to pass that it was upon a tower which was in the garden of Nephi - which was by the highway which led to the chief market which was in the City of Zarahemla -"},{"time":136.08,"text":"11. Therefore, as Nephi had bowed himself upon the tower which was in his garden - which tower was also near unto the garden gate which led by the highway -"},{"time":146.16,"text":"12. And it came to pass that there were certain men passing by and saw Nephi as he was a pouring out his soul unto God upon the tower; And they ran and told the people what they had seen; And the people came together in multitudes that they might know the cause of so great mourning for the wickedness of the people."},{"time":163.072,"text":"13. And now when Nephi arose, he beheld the multitudes of people which had gathered together."},{"time":168.733,"text":"14. And it came to pass that he opened his mouth and said unto them: \"Behold, why have ye gathered yourselves together? That I may tell you of your iniquities?"},{"time":180.287,"text":"15. \"Yea, because I have got upon my tower, that I might pour out my soul unto my God because of the exceeding sorrow of my heart, which is because of your iniquities,"},{"time":191.84,"text":"16. And because of my mourning and lamentation, Ye have gathered yourselves together and do marvel; Yea, and ye have great need to marvel;"},{"time":203.909,"text":"17. Yea, ye had ought to marvel because ye are given away, that the devil hath got so great hold upon your hearts; Yea, how could ye have given away to the enticing of him who art seeking to hurl away your souls down to everlasting misery and endless wo?"},{"time":215.979,"text":"18. \"O repent ye! repent ye! Why will ye die? \"Turn ye! turn ye unto the Lord your God! Why hath He forsaken you?"},{"time":229.151,"text":"19. \"It is because you have hardened your hearts; Yea, ye will not hearken unto the voice of the Good Shepherd; Yea, ye have provoked Him to anger against you;"},{"time":239.33,"text":"20. And behold, instead of gathering you, except ye will repent, Behold, He shall scatter you forth, that ye shall become meat for dogs and wild beasts."},{"time":250.933,"text":"21. \"O how could you have forgotten your God in the very day that He hath delivered you?"},{"time":256.88,"text":"22. \"But behold, it is to get gain - to be praised of men - yea, and that ye might get gold and silver;"},{"time":264.16,"text":"23. And ye have set your hearts upon the riches and the vain things of this world, For the which ye do murder and plunder and steal and bear false witness against your neighbor and do all manner of iniquity; And for this cause, wo shall come unto you, except ye shall repent!"},{"time":280.918,"text":"24. \"For if ye will not repent, Behold, this great city, and also all those great cities which are round about, which are in the land of our possession, shall be taken away, that ye shall have no place in them, For behold, the Lord will not grant unto you strength, as He hath hitherto done, to withstand against your enemies."},{"time":297.824,"text":"25. \"For behold, thus saith the Lord: 'I will not show unto the wicked of My strength, to one more than the other, Save it be unto those who repenteth of their sins and hearken unto My words.'"},{"time":314.729,"text":"26. \"Now therefore, I would that ye should behold, my brethren, that it shall be better for the Lamanites than for you, except ye shall repent; For behold, they are more righteous than you, For they have not sinned against that great knowledge which ye have received;"},{"time":330.542,"text":"27. Therefore, the Lord will be merciful unto them; Yea, He will lengthen out their days and increase their seed, Even when thou shalt be utterly destroyed, except thou shalt repent."},{"time":339.122,"text":"28. \"Yea, wo be unto you because of that great abomination which hath come among you! And ye have united yourselves unto it, yea, to that secret band which was established by Gaddianton."},{"time":359.512,"text":"29. \"Yea, wo shall come unto you because of that pride which ye have suffered to enter your hearts, Which hath lifted you up beyond that which is good because of your exceeding great riches. \"Yea, wo be unto you because of your wickedness and abominations!"},{"time":378.011,"text":"30. And except ye repent, ye shall perish! Yea, even your lands shall be taken from you and ye shall be destroyed from off the face of the earth."},{"time":384.7,"text":"31. \"Behold, now I do not say that these things shall be of myself, Because it is not of myself that I know these things; But behold, I know that these things are true because the Lord God hath made them known unto me; Therefore, I testify that they shall be.\""},{"time":401.191,"text":"32. And now it came to pass that when Nephi had said these words, Behold, there were men which were judges, which also belonged to the secret band of Gaddianton, And they were angry;"},{"time":412.981,"text":"33. And they cried out against him, saying unto the people: \"Why do ye not seize upon this man and bring him forth, that he may be condemned according to the crime which he hath done?"},{"time":422.251,"text":"34. Why seest thou this man and hearest him revile against this people and against our law?\""},{"time":431.52,"text":"35. For behold, Nephi had spoken unto them concerning the corruptness of their law; Yea, many things did Nephi speak which cannot be written; And nothing did he speak which was contrary to the commandments of God."},{"time":444.55,"text":"36. And those judges were angry with him because he spake plain unto them concerning their secret works of darkness; Nevertheless, they durst not lay their own hands upon him, For they feared the people, lest they should cry out against them. Therefore, they did cry unto the people, saying: \"Why do ye suffer this man to revile against us?"},{"time":467.067,"text":"37. For behold, he doth condemn all this people, even unto destruction, Yea, and also that these our great cities shall be taken from us, that we shall have no place in them;"},{"time":479.04,"text":"38. And now we know that this is impossible, For behold, we are powerful and our cities great; Therefore, our enemies can have no power over us.\""},{"time":489.52,"text":"39. Now it came to pass that thus they did stir up the people to anger against Nephi and raised contentions among them; For there were some which did cry out: \"Let this man alone! For he is a good man and those things which he saith will surely come to pass except we repent;"},{"time":507.605,"text":"40. Yea, behold, all the judgments will come upon us which he hath testified unto us, For we know that he hath testified aright unto us concerning our iniquities -"},{"time":517.164,"text":"41. And behold, they are many - And he knoweth as well all things which shall befall us, as he knoweth of our iniquities; Yea, and behold, if he had not been a prophet, he could not have testified concerning those things.\""},{"time":532.301,"text":"42. And it came to pass that those people which sought to destroy Nephi were compelled because of their fear, that they did not lay their hands on him;"},{"time":541.906,"text":"43. Therefore, he began again to speak unto them, seeing that he had gained favor in the eyes of some, insomuch that the remainder of them did fear;"},{"time":550.56,"text":"44. Therefore, he was constrained to speak more unto them, saying: \"Behold, my brethren, have ye not read that God gave power unto one man - even Moses - to smite upon the waters of the Red Sea? And they parted hither and thither, insomuch that the Israelites, which were our fathers, came through upon dry ground? And the waters closed upon the armies of the Egyptians and swallowed them up?"},{"time":576.907,"text":"45. \"And now behold, if God gave unto this man such power, Then why should ye dispute among yourselves and say that He hath given unto me no power whereby I may know concerning the judgments that shall come upon you except ye repent?"},{"time":592.409,"text":"46. \"But behold, ye not only deny my words, But ye also deny all the words which hath been spoken by our fathers, And also the words which were spoken by this man Moses which had such great power given unto him, Yea, the words which he hath spoken concerning the coming of Messiah."},{"time":610.278,"text":"47. \"Yea, did he not bear record that the Son of God should come? And as he lifted up the brazen serpent in the wilderness, even so should He be lifted up which should come;"},{"time":622.371,"text":"48. And as many as should look upon that serpent should live, Even so, as many as should look upon the Son of God with faith, having a contrite spirit, might live, even unto that life which is eternal."},{"time":635.053,"text":"49. \"And now behold, Moses did not only testify of these things, but also all the holy prophets, From his day even to the days of Abraham -"},{"time":646.556,"text":"50. Yea, and behold, Abraham saw of His coming and was filled with gladness and did rejoice!"},{"time":653.625,"text":"51. \"Yea, and behold, I say unto you that Abraham not only knew of these things, But there were many before the days of Abraham which were called by the order of God, yea, even after the order of His Son;"},{"time":666.822,"text":"52. And this that it should be shown unto the people a great many thousand years before His coming that even redemption should come unto them."},{"time":676.08,"text":"53. \"And now I would that ye should know that even since the days of Abraham, that there hath been many prophets that hath testified these things - Yea, behold, the prophet Zenos did testify boldly, for the which he was slain;"},{"time":691.227,"text":"54. And behold, also Zenoch, and also Ezaias, and also Isaiah and Jeremiah - Jeremiah being that same prophet which testified of the destruction of Jerusalem."},{"time":703.2,"text":"55. \"And now we know that Jerusalem was destroyed according to the words of Jeremiah; O then, why not the Son of God come according to his prophecy?"},{"time":713.52,"text":"56. \"And now will you dispute that Jerusalem was not destroyed? Will ye say that the sons of Zedekiah were not slain, all except it were Mulek?"},{"time":723.741,"text":"57. Yea, and do ye not behold that the seed of Zedekiah are with us? And they were driven out of the Land of Jerusalem?"},{"time":733.684,"text":"58. \"But behold, this is not all - Our father Lehi was driven out of Jerusalem because he testified of these things;"},{"time":742.75,"text":"59. Nephi also testified of these things, and also almost all of our fathers, even down to this time; Yea, they have testified of the coming of Christ and have looked forward and have rejoiced in His day which is to come."},{"time":756.189,"text":"60. \"And behold, He is God and He is with them; And He did manifest Himself unto them, that they were redeemed by Him; And they gave unto Him glory because of that which is to come."},{"time":768.8,"text":"61. \"And now, seeing ye know these things and cannot deny them except ye shall lie, Therefore, in this ye have sinned, for ye have rejected all these things notwithstanding so many evidences which ye have received;"},{"time":781.567,"text":"62. Yea, even ye have received all things - both things in heaven and all things which are in earth - as a witness that they are true."},{"time":791.622,"text":"63. \"But behold, ye have rejected the truth and rebelled against your Holy God; And even at this time, instead of laying up for yourselves treasures in heaven where nothing doth corrupt and where nothing can come which is unclean, Ye are heaping up for yourselves wrath against the day of judgment;"},{"time":808.88,"text":"64. Yea, even at this time ye are ripening - because of your murders and your fornication and wickedness - for everlasting destruction; Yea, and except ye repent, it will come unto you soon;"},{"time":821.92,"text":"65. Yea, behold, it is now even at your doors.\"Yea, go ye in unto the judgment seat and search; And behold, your judge is murdered and he lieth in his blood; And he hath been murdered by his brother who seeketh to sit in the judgment seat."},{"time":839.44,"text":"66. \"And behold, they both belong to your secret band, whose author is Gaddianton and the evil one which seeketh to destroy the souls of men.\""},{"time":849.6,"text":"67. Behold, now it came to pass that when Nephi had spoken these words, certain men which were among them ran to the judgment seat, Yea, even there were five which went;"},{"time":860.933,"text":"68. And they said among themselves as they went: \"Behold, now we will know of a surety whether this man be a prophet, And God hath commanded him to prophesy such marvelous things unto us -"},{"time":873.016,"text":"69. Behold, we do not believe that He hath - Yea, we do not believe that he is a prophet; Nevertheless, if this thing which he hath said concerning the chief judge be true - that he be dead - Then will we believe that the other words which he hath spoken are true.\""},{"time":888.742,"text":"70. And it came to pass that they ran in their might and came in unto the judgment seat; And behold, the chief judge had fallen to the earth and did lie in his blood."},{"time":900.32,"text":"71. And now behold, when they saw this they were astonished exceedingly, insomuch that they fell to the earth, For they had not believed the words which Nephi had spoken concerning the chief judge;"},{"time":911.364,"text":"72. But now when they saw, they believed; And fear came upon them lest all the judgments which Nephi had spoken should come upon the people; Therefore, they did quake and had fallen to the earth."},{"time":924.278,"text":"73. Now immediately when the judge had been murdered - He being stabbed by his brother by a garb of secrecy and he fled - And the servants ran and told the people, raising the cry of murder among them."},{"time":936.73,"text":"74. And behold, the people did gather themselves together unto the place of the judgment seat; And behold, to their astonishment they saw those five men which had fallen to the earth."},{"time":949.2,"text":"75. And now behold, the people knew nothing concerning the multitude which had gathered together at the garden of Nephi; Therefore, they said among themselves: \"These men are they which have murdered the judge, And God hath smitten them, that they could not flee from us.\""},{"time":964.4,"text":"76. And it came to pass that they laid hold on them and bound them and cast them into prison;"},{"time":970.711,"text":"77. And there was a proclamation sent abroad that the judge was slain and that the murderers had been taken and were cast into prison."},{"time":978.458,"text":"78. And it came to pass that on the morrow, the people did assemble themselves together to mourn and to fast at the burial of the great and chief judge which had been slain;"},{"time":990.24,"text":"79. And thus were also those judges - which were at the garden of Nephi and heard his words - were also gathered together at the burial."},{"time":998.231,"text":"80. And it came to pass that they inquired among the people, saying: \"Where are the five which were sent to inquire concerning the chief judge, whether he was dead?\""},{"time":1008.489,"text":"81. And they answered and said: \"Concerning this five which ye say ye have sent, we know not; But there are five which are the murderers whom we have cast into prison.\""},{"time":1019.6,"text":"82. And it came to pass that the judges desired that they should be brought; And they were brought, And behold, they were the five which were sent."},{"time":1028.04,"text":"83. And behold, the judges inquired of them to know concerning the matter, And they told them all that they had done, saying: \"We ran and came to the place of the judgment seat; And when we saw all things, even as Nephi had testified, We were astonished, insomuch that we fell to the earth; And when we were recovered from our astonishment, Behold, they cast us into prison."},{"time":1050.76,"text":"84. \"Now as for the murder of this man, we know not who hath done it, And only this much we know - we ran and came according as ye desired; And behold, he was dead according to the words of Nephi.\""},{"time":1064.156,"text":"85. And now it came to pass that the judges did expound the matter unto the people and did cry out against Nephi, saying: \"Behold, we know that this Nephi must have agreed with someone to slay the judge, And then he might declare it unto us, that he might convert us unto his faith, That he might raise himself to be a great man chosen of God and a prophet."},{"time":1085.328,"text":"86. \"And now behold, we will detect this man, And he shall confess his fault and make known unto us the true murderer of this judge.\""},{"time":1094.34,"text":"87. And it came to pass that the five were liberated on the day of the burial;"},{"time":1099.915,"text":"88. Nevertheless, they did rebuke the judges in the words which they had spoken against Nephi, And did contend with them one by one, insomuch that they did confound them."},{"time":1110.56,"text":"89. Nevertheless, they caused that Nephi should be taken and bound and brought before the multitude; And they began to question him in divers ways, that they might cross him, that they might accuse him, to death,"},{"time":1122.118,"text":"90. Saying unto him: \"Thou art confederate with this man that hath done this murder! Now tell us and acknowledge thy fault!\" - Saying, \"Behold, here is money\"; And also, \"We will grant unto thee thy life if thou wilt tell us and acknowledge the agreement which thou hast made with him.\""},{"time":1143.227,"text":"91. But Nephi saith unto them: \"O ye fools! Ye uncircumcised of heart! Ye blind and ye stiff-necked people! \"Do ye know how long the Lord your God will suffer you that ye shall go on in this your ways of sin?"},{"time":1158.706,"text":"92. O ye had ought to begin to howl and mourn because of the great destruction at this time which doth await you, except ye shall repent!"},{"time":1168.88,"text":"93. \"Behold, ye say that I have agreed with a man that he should murder Seezoram, our chief judge."},{"time":1175.84,"text":"94. \"But behold, I say unto you that this is because I have testified unto you, That ye might know concerning this thing - yea, even for a witness unto you - that I did know of the wickedness and abominations which are among you."},{"time":1189.242,"text":"95. \"And because I have done this, ye say that I have agreed with a man that he should do this thing; Yea, because I showed unto you this sign, ye are angry with me and seek to destroy my life."},{"time":1202.52,"text":"96. \"And now behold, I will show unto you another sign, And see if ye will in this thing seek to destroy me."},{"time":1211.006,"text":"97. \"Behold, I say unto you, go to the house of Seantum, which is the brother of Seezoram, and say unto him: 'Hath Nephi, the pretended prophet which doth prophesy so much evil concerning this people, agreed with thee in the which ye have murdered Seezoram, which is your brother?' \"And behold, he shall say unto you, 'Nay.'"},{"time":1232.265,"text":"98. \"And ye shall say unto him: 'Have ye murdered your brother?' \"And he shall stand with fear and wist not what to say."},{"time":1240.64,"text":"99. \"And behold, he shall deny unto you; And he shall make as if he were astonished; Nevertheless, he shall declare unto you that he is innocent."},{"time":1250.4,"text":"100. \"But behold, ye shall examine him, And ye shall find blood upon the skirts of his cloak."},{"time":1256.974,"text":"101. \"And when ye have seen this, ye shall say: 'From whence cometh this blood? Do we not know that it is the blood of your brother?' \"And then shall he tremble and shall look pale, even as if death had come upon him."},{"time":1273.6,"text":"102. \"And then shall ye say: 'Because of this fear and this paleness which hath come upon your face, Behold, we know that thou art guilty.'"},{"time":1281.872,"text":"103. \"And then shall greater fear come upon him; And then shall he confess unto you and deny no more that he hath done this murder."},{"time":1291.04,"text":"104. \"And then shall he say unto you that I, Nephi, know nothing concerning the matter, save it were given unto me by the power of God;"},{"time":1299.427,"text":"105. And then shall ye know that I am an honest man and that I am sent unto you from God.\""},{"time":1305.783,"text":"106. And it came to pass that they went and did even according as Nephi had said unto them."},{"time":1311.789,"text":"107. And behold, the words which he had said were true; For according to the words, he did deny; And also according to the words, he did confess;"},{"time":1322.312,"text":"108. And he was brought to prove that he himself was the very murderer, insomuch that the five were set at liberty, and also was Nephi."},{"time":1330.653,"text":"109. And there were some of the Nephites which did believe on the words of Nephi; And there were some also which believed because of the testimony of the five, For they had been converted while they were in prison."},{"time":1343.124,"text":"110. And now there were some among the people which said that Nephi was a prophet; And there were others which said: \"Behold, he is a god, For except he was a god, he could not know of all things;"},{"time":1355.482,"text":"111. For behold, he hath told us the thoughts of our hearts, and also hath told us things; And even he hath brought unto our knowledge the true murderer of our chief judge.\""},{"time":1366.8,"text":"112. And it came to pass that there arose a division among the people, Insomuch that they divided hither and thither and went their ways, leaving Nephi alone as he was standing in the midst of them."},{"time":1379.52,"text":"113. And it came to pass that Nephi went his way toward his own house, pondering upon the things which the Lord had shown unto him."},{"time":1386.707,"text":"114. And it came to pass as he was thus pondering - Being much cast down because of the wickedness of the people of the Nephites, their secret works of darkness and their murderings and their plunderings and all manner of iniquities - And it came to pass as he was thus pondering in his heart, Behold, a voice came unto him, saying:"},{"time":1402.145,"text":"115. \"Blessed art thou, Nephi, for those things which thou hast done; For I have beheld how thou hast with unwearyingness declared the word which I have given unto thee unto this people;"},{"time":1417.583,"text":"116. And thou hast not feared them and hast not sought thine own life, But hath sought My will and to keep My commandments."},{"time":1426.063,"text":"117. \"And now because thou hast done this with such unwearyingness, Behold, I will bless thee forever; And I will make thee mighty in word and in deed, in faith and in works; Yea, even that all things shall be done unto thee according to thy word, For thou shalt not ask that which is contrary to My will."},{"time":1446.384,"text":"118. \"Behold, thou art Nephi and I Am God."},{"time":1449.52,"text":"119. \"Behold, I declare it unto thee in the presence of Mine angels, That ye shall have power over this people and shall smite the earth with famine and with pestilence and destruction, according to the wickedness of this people."},{"time":1462.389,"text":"120. \"Behold, I give unto you power that whatsoever ye shall seal on earth shall be sealed in heaven, And whatsoever ye shall loose on earth shall be loosed in heaven; And thus shall ye have power among this people."},{"time":1476.424,"text":"121. \"And thus, if ye shall say unto this temple, ' It shall be rent in twain ' - And it shall be done."},{"time":1483.985,"text":"122. \"And if ye shall say unto this mountain, ' Be thou cast down and become smooth! '- And it shall be done."},{"time":1493.467,"text":"123. \"And behold, if ye shall say that God shall smite this people, it shall come to pass."},{"time":1500.347,"text":"124. \"And now behold, I command you that ye shall go and declare unto this people that, 'Thus saith the Lord God, who is the Almighty, Except ye repent, ye shall be smitten, even unto destruction! '\""},{"time":1513.68,"text":"125. And behold, now it came to pass that when the Lord had spoken these words unto Nephi, he did stop and did not go unto his own house, But did return unto the multitudes which were scattered about upon the face of the land, And began to declare unto them the word of the Lord which had been spoken unto him concerning their destruction, if they did not repent."},{"time":1533.44,"text":"126. Now behold, notwithstanding that great miracle which Nephi had done in telling them concerning the death of the chief judge, They did harden their hearts and did not hearken unto the words of the Lord."},{"time":1545.168,"text":"127. Therefore, Nephi did declare unto them the word of the Lord, saying: \"Except ye repent, thus saith the Lord, Ye shall be smitten, even unto destruction!\""},{"time":1557.04,"text":"128. And it came to pass that when Nephi had declared unto them the word, Behold, they did still harden their hearts and would not hearken unto his words; Therefore, they did revile against him and did seek to lay their hands upon him, that they might cast him into prison."},{"time":1573.87,"text":"129. But behold, the power of God was with him and they could not take him to cast him into prison, For he was taken by the Spirit and conveyed away out of the midst of them."},{"time":1584.739,"text":"130. And it came to pass that thus he did go forth in the Spirit from multitude to multitude, declaring the word of God, Even until he had declared it unto them all, or sent it forth among all the people."},{"time":1598.16,"text":"131. And it came to pass that they would not hearken unto his words; And there began to be contentions, insomuch that they were divided against themselves and began to slay one another with the sword."},{"time":1610.0,"text":"132. And thus ended the seventy and first year of the reign of the judges over the people of Nephi."}]
};
