<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 19",
  audioSrc: "https://archive.org/download/alma-ch-19/Alma%20Ch%2019.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 19"},{"time":8.147,"text":"1. And now my son, I have somewhat more to say unto thee than what I said unto thy brother; For behold, have ye not observed the steadiness of thy brother, his faithfulness and his diligence in keeping the commandments of God?"},{"time":16.293,"text":"2. Behold, has he not set a good example for thee?"},{"time":20.96,"text":"3. For thou didst not give so much heed unto my words as did thy brother among the people of the Zoramites."},{"time":26.72,"text":"4. Now this is what I have against thee - Thou didst go on unto boasting in thy strength and thy wisdom."},{"time":34.08,"text":"5. And this is not all, my son - Thou didst do that which was grievous unto me, For thou didst forsake the ministry and did go over into the Land of Siron, among the borders of the Lamanites, after the harlot Isabel; Yea, she did steal away the hearts of many; But this was no excuse for thee, my son;"},{"time":54.388,"text":"6. Thou shouldst have tended to the ministry wherewith thou wast entrusted."},{"time":64.514,"text":"7. Know ye not, my son, that these things are an abomination in the sight of the Lord? Yea, most abominable above all sins, save it be the shedding of innocent blood or denying the Holy Ghost."},{"time":74.64,"text":"8. For behold, if ye deny the Holy Ghost when it once hath had place in you - And ye know that ye deny it - Behold, this is a sin which is unpardonable."},{"time":85.575,"text":"9. Yea, and whosoever murdereth against the light and knowledge of God, it is not easy for him to obtain forgiveness, Yea, I say unto you my son, that it is not easy for him to obtain a forgiveness!"},{"time":98.764,"text":"10. And now my son, I would to God that ye had not been guilty of so great a crime;"},{"time":105.076,"text":"11. I would not dwell upon your crimes to harrow up your soul, if it were not for your good;"},{"time":111.655,"text":"12. But behold, ye cannot hide your crimes from God, And except ye repent, they will stand as a testimony against you at the last day."},{"time":121.52,"text":"13. Now my son, I would that ye should repent and forsake your sins and go no more after the lusts of your eyes, but cross yourself in all these things, For except ye do this, ye can in no wise inherit the kingdom of God;"},{"time":134.933,"text":"14. O remember, and take it upon you and cross yourself in these things."},{"time":140.044,"text":"15. And I command you to take it upon you to counsel your elder brothers in your undertakings, For behold, thou art in thy youth and ye stand in need to be nourished by your brothers;"},{"time":152.56,"text":"16. And give heed to their counsel; Suffer not yourself to be led away by any vain or foolish thing, Suffer not that the devil lead away your heart again after those wicked harlots."},{"time":163.52,"text":"17. Behold, O my son, how great iniquity ye brought upon the Zoramites! For when they saw your conduct, they would not believe in my words."},{"time":173.898,"text":"18. And now the Spirit of the Lord doth say unto me: \"Command thy children to do good, lest they lead away the hearts of many people to destruction.\""},{"time":184.64,"text":"19. Therefore, I command you, my son, in the fear of God, that ye refrain from your iniquities, That ye turn to the Lord with all your mind, might and strength, That ye lead away the hearts of no more to do wickedly;"},{"time":198.145,"text":"20. But rather return unto them and acknowledge your faults and retain that wrong which ye have done; Seek not after riches nor the vain things of this world, For behold, you cannot carry them with you."},{"time":210.274,"text":"21. And now my son, I would say somewhat unto you concerning the coming of Christ -"},{"time":216.046,"text":"22. Behold, I say unto you that it is He that surely shall come to take away the sins of the world, Yea, He cometh to declare glad tidings of salvation unto His people."},{"time":229.04,"text":"23. And now my son, this was the ministry unto which ye were called - To declare these glad tidings unto this people, To prepare their minds, or rather, that salvation might come unto them, that they may prepare the minds of their children to hear the word at the time of His coming."},{"time":245.92,"text":"24. And now I will ease your mind somewhat on this subject. Behold, you marvel why these things should be known so long beforehand;"},{"time":255.04,"text":"25. Behold, I say unto you, is not a soul at this time as precious unto God as a soul will be at the time of His coming?"},{"time":263.76,"text":"26. Is it not as necessary that the plan of redemption should be made known unto this people as well as unto their children?"},{"time":271.596,"text":"27. Is it not as easy at this time for the Lord to send His angel to declare those glad tidings unto us as unto our children or as after the time of His coming?"},{"time":281.736,"text":"28. Now my son, here is somewhat more I would say unto thee, For I perceive that thy mind is worried concerning the resurrection of the dead;"},{"time":291.745,"text":"29. Behold, I say unto you that there is no resurrection - Or I would say in other words, that this mortal does not put on immortality, this corruption does not put on incorruption - Until after the coming of Christ;"},{"time":304.62,"text":"30. Behold, He bringeth to pass the resurrection of the dead; But behold, my son, the resurrection is not yet."},{"time":313.662,"text":"31. Now I unfold unto you a mystery - nevertheless, there are many mysteries which are kept that no one knoweth them save God Himself,"},{"time":322.96,"text":"32. But I show unto you one thing which I have inquired diligently of God that I might know - that is, concerning the resurrection."},{"time":330.187,"text":"33. Behold, there is a time appointed that all shall come forth from the dead,"},{"time":336.48,"text":"34. Now when this time cometh, no one knows, But God knoweth the time which is appointed;"},{"time":342.817,"text":"35. Now whether there shall be one time or a second time or a third time that men shall come forth from the dead, it mattereth not, For God knoweth all these things; And it sufficeth me to know that this is the case, that there is a time appointed that all shall rise from the dead."},{"time":361.04,"text":"36. Now there must needs be a space betwixt the time of death and the time of the resurrection;"},{"time":366.4,"text":"37. And now I would inquire, what becometh of the souls of men from this time of death to the time appointed for the resurrection?"},{"time":373.395,"text":"38. Now whether there is more than one time appointed for men to rise, it mattereth not, For all do not die at once, and this mattereth not; All is as one day with God and time only is measured unto man;"},{"time":387.882,"text":"39. Therefore, there is a time appointed unto men that they shall rise from the dead, And there is a space between the time of death and the resurrection."},{"time":398.08,"text":"40. And now concerning this space of time - What becometh of the souls of men is the thing which I have inquired diligently of the Lord to know, And this is the thing of which I do know;"},{"time":409.604,"text":"41. And when the time cometh when all shall rise, then shall they know that God knoweth all the times which are appointed unto man."},{"time":418.193,"text":"42. Now concerning the state of the soul between death and the resurrection -"},{"time":422.827,"text":"43. Behold, it hath been made known unto me by an angel that the spirits of all men, as soon as they are departed from this mortal body, Yea, the spirits of all men, whether they be good or evil, are taken home to that God who gave them life."},{"time":439.76,"text":"44. And then shall it come to pass that the spirits of those which are righteous are received into a state of happiness which is called paradise - a state of rest, a state of peace - Where they shall rest from all their troubles and from all care and sorrow, etc."},{"time":454.177,"text":"45. And then shall it come to pass that the spirits of the wicked, yea, which are evil - For behold, they have no part nor portion of the Spirit of the Lord, For behold, they chose evil works rather than good, Therefore, the spirit of the devil did enter into them and take possession of their house -"},{"time":473.44,"text":"46. And these shall be cast out into outer darkness; There shall be weeping and wailing and gnashing of teeth, And this because of their own iniquity, being led captive by the will of the devil."},{"time":484.777,"text":"47. Now this is the state of the souls of the wicked, yea, in darkness, And a state of awful, fearful, looking for, of the fiery indignation of the wrath of God upon them; Thus they remain in this state, as well as the righteous in paradise, until the time of their resurrection."},{"time":502.273,"text":"48. Now there are some that have understood that this state of happiness and this state of misery of the soul before the resurrection was a first resurrection;"},{"time":512.56,"text":"49. Yea, I admit it may be termed a resurrection - the raising of the spirit or the soul and their consignation to happiness or misery - according to the words which have been spoken."},{"time":524.021,"text":"50. And behold, again it hath been spoken that there is a first resurrection - A resurrection of all those which have been, or which are, or which shall be, down to the resurrection of Christ from the dead."},{"time":536.88,"text":"51. Now we do not suppose that this first resurrection which has been spoken of in this manner can be the resurrection of the souls and their consignation to happiness or misery - Ye cannot suppose that this is what it meaneth;"},{"time":549.646,"text":"52. Behold, I say unto you, Nay, But it meaneth the reuniting of the soul with the body of those from the days of Adam down to the resurrection of Christ."},{"time":561.124,"text":"53. Now whether the souls and the bodies of those of which have been spoken shall all be reunited at once, the wicked as well as the righteous, I do not say;"},{"time":570.6,"text":"54. Let it suffice that I say that they all come forth, Or in other words, their resurrection cometh to pass before the resurrection of those which die after the resurrection of Christ."},{"time":581.502,"text":"55. Now my son, I do not say that their resurrection cometh at the resurrection of Christ, But behold, I give it as my opinion that the souls and the bodies are reunited of the righteous at the resurrection of Christ and His ascension into heaven;"},{"time":597.07,"text":"56. But whether it be at His resurrection, or after, I do not say. But this much I say - that there is a space between death and the resurrection of the body, and a state of the soul in happiness or in misery, Until the time which is appointed of God that the dead shall come forth and be reunited, both soul and body, And be brought to stand before God and be judged according to their works."},{"time":621.2,"text":"57. Yea, this bringeth about the restoration of those things of which have been spoken by the mouths of the prophets -"},{"time":627.196,"text":"58. The soul shall be restored to the body and the body to the soul, Yea, and every limb and joint shall be restored to its body, Yea, even a hair of their heads shall not be lost; But all things shall be restored to its proper and perfect frame."},{"time":644.046,"text":"59. And now my son, this is the restoration of which has been spoken by the mouths of the prophets, And then shall the righteous shine forth in the kingdom of God."},{"time":654.324,"text":"60. But behold, an awful death cometh upon the wicked, For they die as to things pertaining to things of righteousness, For they are unclean and no unclean thing can inherit the kingdom of God;"},{"time":665.701,"text":"61. But they are cast out and consigned to partake of the fruits of their labors or their works which have been evil, And they drink the dregs of a bitter cup."},{"time":675.84,"text":"62. And now my son, I have somewhat to say concerning the restoration of which has been spoken, For behold, some have wrested the scriptures and have gone far astray because of this thing;"},{"time":687.68,"text":"63. And I perceive that thy mind hath been worried also concerning this thing, But behold, I will explain it unto thee."},{"time":695.074,"text":"64. I say unto thee, my son, that the plan of restoration is requisite with the justice of God, For it is requisite that all things should be restored to their proper order;"},{"time":706.075,"text":"65. Behold, it is requisite and just, according to the power and resurrection of Christ, that the soul of man should be restored to its body, And that every part of the body should be restored to itself."},{"time":718.249,"text":"66. And it is requisite with the justice of God that men should be judged according to their works; And if their works were good in this life and the desires of their hearts were good, that they should also at the last day be restored unto that which is good;"},{"time":732.64,"text":"67. And if his works are evil, they shall be restored unto him for evil. Therefore, all things shall be restored to its proper order - everything to its natural frame, mortality raised to immortality, corruption to incorruption, Raised to endless happiness, to inherit the kingdom of God, Or, to endless misery, to inherit the kingdom of the devil;"},{"time":755.52,"text":"68. The one, on one hand; the other, on the other - The one, raised to happiness, according to his desires of happiness, or good, according to his desires of good; And the other, to evil, according to his desires of evil, For as he has desired to do evil all the day long, even so shall he have his reward of evil when the night cometh."},{"time":779.68,"text":"69. And so it is on the other hand - If he hath repented of his sins and desired righteousness until the end of his days, even so shall he be rewarded unto righteousness -"},{"time":791.36,"text":"70. These are they that are redeemed of the Lord, Yea, these are they that are taken out, that are delivered from that endless night of darkness. And thus they stand or fall, For behold, they are their own judges, whether to do good or do evil."},{"time":807.04,"text":"71. Now the decrees of God are unalterable; Therefore, the way is prepared that whosoever will may walk therein and be saved."},{"time":814.711,"text":"72. And now behold, my son, do not risk one more offense against your God upon those points of doctrine which ye hath hitherto risked to commit sin;"},{"time":826.16,"text":"73. Do not suppose because it hath been spoken concerning restoration that ye shall be restored from sin to happiness;"},{"time":834.754,"text":"74. Behold, I say unto you, wickedness never was happiness."},{"time":840.72,"text":"75. And now, my son, all men that are in a state of nature - or I would say in a carnal state - are in the gall of bitterness and in the bonds of iniquity; They are without God in the world, And they have gone contrary to the nature of God, Therefore, they are in a state contrary to the nature of happiness."},{"time":858.466,"text":"76. And now behold, is the meaning of the word \"restoration\" to take a thing of a natural state and place it in an unnatural state, or to place it in a state opposite to its nature?"},{"time":869.792,"text":"77. O my son, this is not the case, But the meaning of the word \"restoration\" is to bring back again evil for evil, or carnal for carnal, or devilish for devilish, good for that which is good, righteous for that which is righteous, just for that which is just, merciful for that which is merciful."},{"time":888.443,"text":"78. Therefore, my son, see that ye are merciful unto your brethren, Deal justly, judge righteously and do good continually; And if ye do all these things, then shall ye receive your reward -"},{"time":903.36,"text":"79. Yea, ye shall have mercy restored unto you again, Ye shall have justice restored unto you again, Ye shall have a righteous judgment restored unto you again,"},{"time":913.61,"text":"80. And ye shall have good rewarded unto you again; For that which ye doth send out shall return unto you again and be restored; Therefore, the word \"restoration\" more fully condemneth the sinner and justifieth him not at all."},{"time":928.32,"text":"81. And now, my son, I perceive there is somewhat more which doth worry your mind which ye cannot understand, Which is concerning the justice of God in the punishment of the sinner, For ye do try to suppose that it is injustice that the sinner should be consigned to a state of misery."},{"time":945.12,"text":"82. Now behold, my son, I will explain this thing unto thee. For behold, after the Lord God sent our first parents forth from the garden of Eden to till the ground, from whence he was taken, Yea, He drove out the man and He placed at the east end of the garden of Eden cherubim and flaming sword which turned every way to keep the tree of life -"},{"time":966.64,"text":"83. Now we see that the man had become as God, knowing good and evil, And lest he should put forth his hand and take also of the tree of life and eat and live forever, That the Lord God placed cherubim and the flaming sword that he should not partake of the fruit."},{"time":981.794,"text":"84. And thus we see that there was a time granted unto man to repent, Yea, a probationary time - A time to repent and serve God."},{"time":991.289,"text":"85. For behold, if Adam had put forth his hand immediately and partook of the tree of life, He would have lived forever, according to the word of God, having no space for repentance;"},{"time":1004.96,"text":"86. Yea, and also the word of God would have been void, And the great plan of salvation would have been frustrated."},{"time":1011.205,"text":"87. But behold, it was appointed unto man to die; Therefore, as they were cut off from the tree of life, Therefore, they should be cut off from the face of the earth and man became lost forever; Yea, they became fallen man."},{"time":1025.895,"text":"88. And now we see by this that our first parents were cut off, both temporally and spiritually, from the presence of the Lord, And thus we see they became subjects to follow after their own will."},{"time":1039.313,"text":"89. Now behold, it was not expedient that man should be reclaimed from this temporal death, For that would destroy the great plan of happiness;"},{"time":1049.2,"text":"90. Therefore, as the soul could never die, And the fall had brought upon all mankind a spiritual death as well as a temporal - That is, they were cut off from the presence of the Lord - Therefore, it was expedient that mankind should be reclaimed from this spiritual death;"},{"time":1066.24,"text":"91. Therefore, as they had become carnal, sensual and devilish by nature, This probationary state became a state for them to prepare - It became a preparatory state."},{"time":1077.605,"text":"92. And now remember, my son, if it were not for the plan of redemption - laying it aside - As soon as they were dead, their souls were miserable, being cut off from the presence of the Lord."},{"time":1089.92,"text":"93. And now, there was no means to reclaim men from this fallen state which man had brought upon himself because of his own disobedience;"},{"time":1098.511,"text":"94. Therefore, according to justice, the plan of redemption could not be brought about, only on conditions of repentance of men in this probationary state, yea, this preparatory state; For, except it were for these conditions, mercy could not take effect, except it should destroy the work of justice;"},{"time":1117.324,"text":"95. Now the work of justice could not be destroyed - If so, God would cease to be God."},{"time":1124.04,"text":"96. And thus we see that all mankind were fallen; And they were in the grasp of justice, yea, the justice of God which consigned them forever to be cut off from His presence."},{"time":1135.346,"text":"97. And now the plan of mercy could not be brought about, except an atonement should be made; Therefore, God Himself atoneth for the sins of the world to bring about the plan of mercy to appease the demands of justice, that God might be a perfect, just God and a merciful God also."},{"time":1152.44,"text":"98. Now repentance could not come unto men except there were a punishment, which also was as eternal as the life of the soul should be, Affixed opposite to the plan of happiness, which was as eternal also as the life of the soul."},{"time":1166.72,"text":"99. Now how could a man repent, except he should sin? How could he sin, if there was no law? How could there be a law, save there was a punishment?"},{"time":1177.435,"text":"100. Now there was a punishment affixed and a just law given which brought remorse of conscience unto man."},{"time":1184.187,"text":"101. Now if there was no law given, if a man murdered, he should die, Would he be afraid he should die if he should murder?"},{"time":1193.259,"text":"102. And also, if there was no law given against sin, men would not be afraid to sin;"},{"time":1199.52,"text":"103. And if there was no law given, if men sinned, what could justice do? or mercy either? For they would have no claim upon the creature."},{"time":1211.12,"text":"104. But there is a law given, and a punishment affixed, and repentance granted, which repentance mercy claimeth; Otherwise, justice claimeth the creature and executeth the law, And the law inflicteth the punishment; If not so, the works of justice would be destroyed and God would cease to be God."},{"time":1229.68,"text":"105. But God ceaseth not to be God, And mercy claimeth the penitent, And mercy cometh because of the atonement; And the atonement bringeth to pass the resurrection of the dead, And the resurrection of the dead bringeth back men into the presence of God."},{"time":1243.378,"text":"106. And thus they are restored into His presence, to be judged according to their works, according to the law and justice; For behold, justice exerciseth all his demands, And also mercy claimeth all which is her own; And thus, none but the truly penitent are saved."},{"time":1262.075,"text":"107. What! Do ye suppose that mercy can rob justice? I say unto you, nay, not one whit; If so, God would cease to be God!"},{"time":1273.52,"text":"108. And thus God bringeth about His great and eternal purposes which were prepared from the foundation of the world."},{"time":1279.947,"text":"109. And thus cometh about the salvation and the redemption of men, And also their destruction and misery. Therefore, O my son, whosoever will come, may come and partake of the waters of life freely;"},{"time":1295.106,"text":"110. And whosoever will not come, the same is not compelled to come, But in the last day it shall be restored unto him according to his deeds -"},{"time":1304.88,"text":"111. If he hath desired to do evil and hath not repented in his days, Behold, evil shall be done unto him, according to the restoration of God."},{"time":1314.151,"text":"112. And now my son, I desire that ye should let these things trouble you no more, And only let your sins trouble you with that trouble which shall bring you down unto repentance."},{"time":1325.259,"text":"113. O my son, I desire that ye should deny the justice of God no more;"},{"time":1330.99,"text":"114. Do not endeavor to excuse yourself in the least point because of your sins, by denying the justice of God, But do you let the justice of God and His mercy and His longsuffering have full sway in your heart, But let it bring you down to the dust in humility."},{"time":1347.76,"text":"115. And now O my son, ye are called of God to preach the word unto this people."},{"time":1354.4,"text":"116. And now, my son, go thy way; Declare the word with truth and soberness, that thou mayest bring souls unto repentance, That the great plan of mercy may have claim upon them."},{"time":1366.56,"text":"117. And may God grant unto you even according to my word. Amen."}]
};
