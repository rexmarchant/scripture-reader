<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 10",
  audioSrc: "https://archive.org/download/alma-ch-10/Alma%20Ch%2010.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 10"},{"time":5.68,"text":"1. \"Now as I said concerning the holy order, or this high priesthood, there were many which were ordained and became high priests of God;"},{"time":11.36,"text":"2. And it was on account of the exceeding faith and repentance and their righteousness before God, they choosing to repent and work righteousness rather than to perish,"},{"time":21.36,"text":"3. Therefore, they were called after this holy order and were sanctified, And their garments were washed white through the blood of the Lamb."},{"time":28.88,"text":"4. \"Now they, after being sanctified by the Holy Ghost, having their garments made white, being pure and spotless before God, could not look upon sin save it were with abhorrence."},{"time":40.4,"text":"5. \"And there were many, an exceeding great many, which were made pure and entered into the rest of the Lord their God."},{"time":47.387,"text":"6. \"And now my brethren, I would that ye should humble yourselves before God and bring forth fruit meet for repentance, that ye may also enter into that rest;"},{"time":60.08,"text":"7. Yea, humble yourselves even as the people in the days of Melchizedek, who was also a high priest after this same order which I have spoken, who also took upon him the high priesthood forever;"},{"time":72.48,"text":"8. And it was this same Melchizedek to whom Abraham paid tithes, Yea, even our father Abraham paid tithes of one tenth part of all he possessed."},{"time":83.285,"text":"9. \"Now these ordinances were given after this manner, that thereby the people might look forward on the Son of God, it being a type of His order, or it being His order;"},{"time":93.12,"text":"10. And this that they might look forward to Him for a remission of their sins, that they might enter into the rest of the Lord."},{"time":101.32,"text":"11. \"Now this Melchizedek was a king over the Land of Salem; And his people had waxed strong in iniquity and abominations, yea, they had all gone astray - they were full of all manner of wickedness;"},{"time":114.699,"text":"12. But Melchizedek, having exercised mighty faith and received the office of the high priesthood according to the holy order of God, did preach repentance unto his people,"},{"time":124.453,"text":"13. And behold, they did repent; And Melchizedek did establish peace in the land in his days,"},{"time":132.109,"text":"14. Therefore, he was called the prince of peace, For he was the king of Salem and he did reign under his father."},{"time":139.781,"text":"15. \"Now there were many before him and also there were many afterward, but none were greater, Therefore, of him they have more particularly made mention;"},{"time":150.24,"text":"16. Now I need not rehearse the matter; What I have said may suffice;"},{"time":155.613,"text":"17. Behold, the scriptures are before you; If ye will wrest them, it shall be to your own destruction.\""},{"time":162.088,"text":"18. And now it came to pass that when Alma had said these words unto them, he stretched forth his hand unto them and cried with a mighty voice, saying: \"Now is the time to repent! for the day of salvation draweth nigh."},{"time":178.08,"text":"19. \"Yea, and the voice of the Lord, by the mouth of angels, doth declare it unto all nations, Yea, doth declare it, that they may have glad tidings of great joy."},{"time":189.709,"text":"20. \"Yea, and He doth sound these glad tidings among all His people, yea, even to them that are scattered abroad upon the face of the earth; Wherefore, they have come unto us"},{"time":200.472,"text":"21. and they are made known unto us in plain terms that we may understand, that we cannot err, And this because of our being wanderers in a strange land;"},{"time":210.24,"text":"22. Therefore, we are thus highly favored, for we have these glad tidings declared unto us in all parts of our vineyard."},{"time":217.537,"text":"23. \"For behold, angels are declaring it unto many at this time in our land, And this is for the purpose of preparing the hearts of the children of men for to receive His word at the time of His coming in His glory."},{"time":230.853,"text":"24. \"And now we only wait to hear the joyful news - declared unto us by the mouth of angels of His coming, for the time cometh, we know not how soon;"},{"time":242.96,"text":"25. Would to God that it might be in my day, but let it be sooner or later, in it I will rejoice."},{"time":249.76,"text":"26. \"And it shall be made known unto just and holy men by the mouth of angels at the time of His coming, That the words of our fathers might be fulfilled according to that which they have spoken concerning Him, which was according to the spirit of prophecy which was in them."},{"time":264.734,"text":"27. \"And now my brethren, I wish from the inmost part of my heart, yea, with great anxiety even unto pain, That ye would hearken unto my words and cast off your sins and not procrastinate the day of your repentance;"},{"time":276.932,"text":"28. But that ye would humble yourselves before the Lord and call on His holy name and watch and pray continually, That ye may not be tempted above that which ye can bear; And thus be led by the Holy Spirit, becoming humble, meek, submissive, patient, full of love and all longsuffering, having faith on the Lord,"},{"time":297.12,"text":"29. having a hope that ye shall receive eternal life, having the love of God always in your hearts, That ye may be lifted up at the last day and enter into His rest."},{"time":307.255,"text":"30. \"And may the Lord grant unto you repentance, That ye may not bring down His wrath upon you, That ye may not be bound down by the chains of hell, That ye may not suffer the second death.\""},{"time":318.505,"text":"31. And it came to pass that Alma spake many more words unto the people which are not written in this book."},{"time":325.328,"text":"32. And it came to pass that after he had made an end of speaking unto the people, Many of them did believe on his words and began to repent and to search the scriptures;"},{"time":337.04,"text":"33. But the more part of them were desirous that they might destroy Alma and Amulek, For they were angry with Alma because of the plainness of his words unto Zeezrom;"},{"time":346.96,"text":"34. And they also said that Amulek had lied unto them and had reviled against their law, And also against their lawyers and judges;"},{"time":354.62,"text":"35. And they were also angry with Alma and Amulek; And because they had testified so plainly against their wickedness, they sought to put them away privily."},{"time":363.933,"text":"36. But it came to pass that they did not, But they took them and bound them with strong cords and took them before the chief judge of the land."},{"time":373.564,"text":"37. And the people went forth and witnessed against them, testifying that they had reviled against their law and their lawyers and judges of the land, And also all the people that were in the land;"},{"time":385.646,"text":"38. And also testified that there was but one God, And that He should send His Son among the people, but He should not save them; And many such things did the people testify against Alma and Amulek."},{"time":397.461,"text":"39. And it came to pass that it was done before the chief judge of the land."},{"time":406.404,"text":"40. And it also came to pass that Zeezrom was astonished at the words which had been spoken, And he also knew concerning the blindness of the minds which he had caused among the people by his lying words;"},{"time":415.347,"text":"41. And his soul began to be harrowed up under a consciousness of his own guilt, Yea, he began to be encircled about by the pains of hell."},{"time":425.44,"text":"42. And it came to pass that he began to cry unto the people, saying: \"Behold, I am guilty and these men are spotless before God!\""},{"time":433.7,"text":"43. And it came to pass that he began to plead for them from that time forth, but they reviled him, saying: \"Art thou also possessed with the devil?\""},{"time":443.596,"text":"44. And it came to pass that they spit upon him and cast him out from among them, And also all those who believed in the words which had been spoken by Alma and Amulek; And they cast them out and sent men to cast stones at them;"},{"time":458.24,"text":"45. And they brought their wives and children together, And whosoever have believed, or had been taught to believe in the word of God, they caused that they should be cast into the fire;"},{"time":468.96,"text":"46. And they also brought forth their records which contained the holy scriptures and cast them into the fire also, that they might be burned and destroyed by fire."},{"time":478.293,"text":"47. And it came to pass that they took Alma and Amulek and carried them forth to the place of martyrdom, that they might witness the destruction of those which were consumed by fire."},{"time":488.84,"text":"48. And it came to pass that when Amulek saw the pains of the women and children which were consuming in the fire, he was also pained and he saith unto Alma: \"How can we witness this awful scene?"},{"time":501.396,"text":"49. Therefore, let us stretch forth our hands and exercise the power of God which is in us and save them from the flames.\""},{"time":510.489,"text":"50. But Alma saith unto him: \"The Spirit constraineth me that I must not stretch forth mine hand, For behold, the Lord receiveth them up unto Himself in glory;"},{"time":519.583,"text":"51. And He doth suffer that they may do this thing, or that the people may do this thing unto them according to the hardness of their hearts, that the judgments which He shall exercise upon them in His wrath may be just;"},{"time":532.96,"text":"52. And the blood of the innocent shall stand as a witness against them, yea, and cry mightily against them at the last day.\""},{"time":537.161,"text":"53. Now Amulek saith unto Alma: \"Behold, perhaps they will burn us also.\""},{"time":548.784,"text":"54. And Alma saith: \"Be it according to the will of the Lord; But behold, our work is not finished, therefore, they burn us not.\""},{"time":556.207,"text":"55. Now it came to pass that when the bodies of those which had been cast into the fire were consumed, and also the records which were cast in with them, The chief judge of the land came and stood before Alma and Amulek, as they were bound,"},{"time":569.937,"text":"56. And he smote them with his hand upon their cheeks and saith unto them: \"After what ye have seen, will ye preach again unto this people that they shall be cast into a lake of fire and brimstone?"},{"time":582.128,"text":"57. \"Behold, ye see that ye had not power to save these which had been cast into the fire, Neither hath God saved them because they were of thy faith.\""},{"time":592.48,"text":"58. And the judge smote them again upon their cheeks and asked: \"What say ye for yourselves?\""},{"time":598.96,"text":"59. Now this judge was after the order and faith of Nehor which slew Gideon."},{"time":603.2,"text":"60. And it came to pass that Alma and Amulek answered him nothing; And he smote them again and delivered them to the officers to be cast into prison."},{"time":613.68,"text":"61. And it came to pass that when they had been cast into prison three days, there came many lawyers and judges and priests and teachers which were of the profession of Nehor;"},{"time":622.444,"text":"62. And they came in unto the prison to see them, And they questioned them about many words, but they answered them nothing."},{"time":630.396,"text":"63. And it came to pass that the judge stood before them and saith: \"Why do ye not answer the words of this people?"},{"time":636.498,"text":"64. Know ye not that I have power to deliver ye up unto the flames?\""},{"time":642.6,"text":"65. And he commanded them to speak, but they answered nothing."},{"time":647.0,"text":"66. And it came to pass that they departed and went their ways, but came again on the morrow; And the judge also smote them again on their cheeks,"},{"time":656.276,"text":"67. And many came forth also and smote them, saying: \"Will ye stand again and judge this people and condemn our law?"},{"time":665.272,"text":"68. If ye have such great power, why do ye not deliver yourselves?\""},{"time":670.88,"text":"69. And many such things did they say unto them, gnashing their teeth upon them and spitting upon them and saying, \"How shall we look when we are damned?\""},{"time":680.409,"text":"70. And many such things, yea, all manner of such things did they say unto them; And thus they did mock them for many days."},{"time":689.04,"text":"71. And they did withhold food from them, that they might hunger, And water, that they might thirst;"},{"time":696.24,"text":"72. And they also did take from them their clothes, that they were naked; And thus they were bound with strong cords and confined in prison."},{"time":703.777,"text":"73. And it came to pass after they had thus suffered for many days - and it was on the twelfth day, in the tenth month, in the tenth year of the reign of the judges over the people of Nephi - That the chief judge over the Land of Ammonihah, and many of their teachers and their lawyers, went in unto the prison where Alma and Amulek were bound with cords;"},{"time":725.28,"text":"74. And the chief judge stood before them and smote them again and saith unto them: \"If ye have the power of God, deliver yourselves from these bands; And then we will believe that the Lord will destroy this people, according to your words.\""},{"time":738.613,"text":"75. And it came to pass that they all went forth and smote them, saying the same words, even until the last;"},{"time":746.725,"text":"76. And when the last had spoken unto them, the power of God was upon Alma and Amulek and they arose and stood upon their feet; And Alma cried, saying: \"How long shall we suffer these great afflictions, O Lord?"},{"time":760.56,"text":"77. O Lord! give us strength according to our faith which is in Christ, even unto deliverance.\" And they brake the cords with which they were bound; And when the people saw this, they began to flee, for the fear of destruction had come upon them."},{"time":778.4,"text":"78. And it came to pass that so great was their fear that they fell to the earth and did not obtain the outer door of the prison;"},{"time":785.12,"text":"79. And the earth shook mightily and the walls of the prison were rent in twain so that they fell to the earth;"},{"time":792.404,"text":"80. And the chief judge and the lawyers and priests and teachers which smote upon Alma and Amulek were slain by the fall thereof."},{"time":801.36,"text":"81. And Alma and Amulek came forth out of the prison and they were not hurt, for the Lord had granted unto them power according to their faith which was in Christ;"},{"time":811.52,"text":"82. And they straightway came forth out of the prison and they were loosed from their bands."},{"time":816.4,"text":"83. And the prison had fallen to the earth, And every soul which was within the walls thereof, save it were Alma and Amulek, were slain; And they straightway came forth into the city."},{"time":828.08,"text":"84. Now the people, having heard a great noise, came running together by multitudes to know the cause of it;"},{"time":834.674,"text":"85. And when they saw Alma and Amulek coming forth out of the prison and the walls thereof had fallen to the earth, They were struck with great fear and fled from the presence of Alma and Amulek, even as a goat fleeth with her young from two lions; And thus they did flee from the presence of Alma and Amulek."},{"time":854.72,"text":"86. And it came to pass that Alma and Amulek were commanded to depart out of that land; And they departed and came out even into the Land of Sidom;"},{"time":863.84,"text":"87. And behold, there they found all the people which had departed out of the Land of Ammonihah, who had been cast out and stoned because they believed in the words of Alma;"},{"time":874.4,"text":"88. And they related unto them all that had happened unto their wives and children, And also concerning themselves and of their power of deliverance."},{"time":886.24,"text":"89. And also Zeezrom lay sick at Sidom with a burning fever which was caused by the great tribulations of his mind on account of his wickedness, For he supposed that Alma and Amulek were no more, And he supposed that they had been slain by the cause of his iniquity;"},{"time":898.08,"text":"90. And this great sin, and his many other sins, did harrow up his mind until it did become exceeding sore, having no deliverance; Therefore, he began to be scorched with a burning heat."},{"time":910.64,"text":"91. Now when he heard that Alma and Amulek were in the Land of Sidom, his heart began to take courage, And he sent a message immediately unto them, desiring them to come unto him."},{"time":922.16,"text":"92. And it came to pass that they went immediately, obeying the message which he had sent unto them; And they went in unto the house unto Zeezrom,"},{"time":932.32,"text":"93. And they found him upon his bed sick, being very low with a burning fever, And his mind also was exceeding sore because of his iniquities;"},{"time":941.52,"text":"94. And when he saw them, he stretched forth his hand and besought them that they would heal him."},{"time":947.76,"text":"95. And it came to pass that Alma said unto him, taking him by the hand: \"Believest thou in the power of Christ unto salvation?\""},{"time":956.48,"text":"96. And he answered and said: \"Yea, I believe all the words that thou hast taught.\""},{"time":962.123,"text":"97. And Alma saith: \"If thou believest in the redemption of Christ, thou canst be healed.\""},{"time":971.403,"text":"98. And he saith: \"Yea, I believe according to thy words.\""},{"time":975.04,"text":"99. And then Alma cried unto the Lord, saying: \"O Lord our God, have mercy on this man and heal him according to his faith which is in Christ!\""},{"time":985.12,"text":"100. And it came to pass that when Alma had said these words, that Zeezrom leaped upon his feet and began to walk;"},{"time":991.385,"text":"101. And this was done to the great astonishment of all the people; And the knowledge of this went forth throughout all the Land of Sidom."},{"time":999.773,"text":"102. And Alma baptized Zeezrom unto the Lord; And he began from that time forth to preach unto the people."},{"time":1008.16,"text":"103. And Alma established a church in the Land of Sidom, And consecrated priests and teachers in the land to baptize unto the Lord whosoever were desirous to be baptized."},{"time":1019.44,"text":"104. And it came to pass that they were many, for they did flock in from all the region round about Sidom and were baptized."},{"time":1026.009,"text":"105. But as to the people that were in the Land of Ammonihah, they yet remained a hard-hearted and a stiff - necked people;"},{"time":1034.32,"text":"106. And they repented not of their sins, ascribing all the power of Alma and Amulek to the devil, For they were of the profession of Nehor and did not believe in the repentance of their sins."},{"time":1045.84,"text":"107. And it came to pass that Alma and Amulek - Amulek having forsaken all his gold and his silver and his precious things which were in the Land of Ammonihah for the word of God, He being rejected by those which were once his friends, and also by his father and his kindred -"},{"time":1061.2,"text":"108. Therefore, after Alma having established the church at Sidom, seeing a great check, Yea, seeing that the people were checked as to the pride of their hearts and began to humble themselves before God,"},{"time":1072.806,"text":"109. And began to assemble themselves together at their sanctuaries to worship God before the altar, Watching and praying continually that they might be delivered from Satan and from death and from destruction -"},{"time":1085.162,"text":"110. Now as I said, Alma having seen all these things, Therefore, he took Amulek and came over to the Land of Zarahemla, And took him to his own house and did administer unto him in his tribulations and strengthened him in the Lord."},{"time":1099.84,"text":"111. And thus ended the tenth year of the reign of the judges over the people of Nephi."}]
};
</script>
