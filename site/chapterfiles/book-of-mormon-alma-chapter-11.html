  lyrics: [{"time":0.0,"text":"Alma Chapter 11"},{"time":11.259,"text":"1. And it came to pass in the eleventh year of the reign of the judges over the people of Nephi, on the fifth day of the second month - There having been much peace in the Land of Zarahemla, There having been no wars nor contentions for a certain number of years, even until the fifth day of the second month in the eleventh year - There was a cry of war heard throughout the land;"},{"time":22.518,"text":"2. For behold, the armies of the Lamanites had come in on the wilderness side into the borders of the land, even into the City of Ammonihah, and began to slay the people and to destroy the city."},{"time":34.8,"text":"3. And now it came to pass, before the Nephites could raise a sufficient army to drive them out of the land, They had destroyed the people which were in the City of Ammonihah, and also some around the borders of Noah, and taking others captive into the wilderness."},{"time":51.44,"text":"4. Now it came to pass that the Nephites were desirous to obtain those which had been carried away captive into the wilderness,"},{"time":58.208,"text":"5. Therefore, he that had been appointed chief captain over the armies of the Nephites - and his name was Zoram and he had two sons, Lehi and Aha -"},{"time":69.238,"text":"6. Now Zoram and his two sons, knowing that Alma was high priest over the church and having heard that he had the spirit of prophecy,"},{"time":76.938,"text":"7. Therefore, they went unto him and desired of him to know whither the Lord would that they should go into the wilderness in search of their brethren who had been taken captive by the Lamanites."},{"time":89.76,"text":"8. And it came to pass that Alma inquired of the Lord concerning the matter,"},{"time":95.04,"text":"9. And Alma returned and said unto them: \"Behold, the Lamanites will cross the River Sidon in the South Wilderness, away up beyond the borders of the Land of Manti;"},{"time":105.699,"text":"10. And behold, there shall ye meet them on the east of the River Sidon; And there the Lord will deliver unto thee thy brethren which have been taken captive by the Lamanites.\""},{"time":115.575,"text":"11. And it came to pass that Zoram and his sons crossed over the River Sidon with their armies, And marched away beyond the borders of Manti into the South Wilderness which was on the east side of the River Sidon;"},{"time":128.604,"text":"12. And they came upon the armies of the Lamanites, And the Lamanites were scattered and driven into the wilderness; And they took their brethren which had been taken captive by the Lamanites and there was not one soul of them which had been lost that were taken captive;"},{"time":143.036,"text":"13. And they were brought by their brethren to possess their own lands."},{"time":147.205,"text":"14. And thus ended the eleventh year of the judges, the Lamanites having been driven out of the land and the people of Ammonihah were destroyed,"},{"time":157.32,"text":"15. Yea, every living soul of the Ammonihahites were destroyed, and also their great city which they said God could not destroy because of its greatness;"},{"time":166.88,"text":"16. But behold, in one day it was left desolate, And their carcasses were mangled by dogs and by wild beasts of the wilderness."},{"time":174.94,"text":"17. Nevertheless, after many days, their dead bodies were heaped up upon the face of the earth and they were covered with a shallow covering;"},{"time":184.189,"text":"18. And now so great was the scent thereof that the people did not go in to possess the Land of Ammonihah for many years;"},{"time":194.16,"text":"19. And it was called Desolation of Nehors, for they were of the profession of Nehor which were slain, And their lands remained desolate."},{"time":201.138,"text":"20. And it came to pass that the Lamanites did not come again to war against the Nephites until the fourteenth year of the reign of the judges over the people of Nephi;"},{"time":212.64,"text":"21. And thus, for three years did the people of Nephi have continual peace in all the land."},{"time":221.2,"text":"22. And Alma and Amulek went forth preaching repentance unto the people in their temples and in their sanctuaries, and also in their synagogues, which were built after the manner of the Jews;"},{"time":229.76,"text":"23. And as many as would hear their words, unto them they did impart the word of God without any respect of persons, continually."},{"time":237.002,"text":"24. And thus did Alma and Amulek go forth - and also many more which had been chosen for the work - to preach the word throughout all the land;"},{"time":247.892,"text":"25. And the establishment of the church became general throughout the land, in all the region round about, among all the people of the Nephites."},{"time":256.034,"text":"26. And there was no inequality among them, For the Lord did pour out His Spirit on all the face of the land for to prepare the minds of the children of men - or to prepare their hearts to receive the word which should be taught among them at the time of His coming -"},{"time":270.56,"text":"27. That they might not be hardened against the word, That they might not be unbelieving and go on to destruction,"},{"time":276.778,"text":"28. But that they might receive the word with joy and, as a branch, be grafted into the True Vine, That they might enter into the rest of the Lord their God."},{"time":288.053,"text":"29. Now those priests which did go forth among the people did preach against all lyings and deceivings and envyings and strifes and malice and revilings and stealing, robbing, plundering, murdering, committing adultery and all manner of lasciviousness, Crying that these things ought not so to be;"},{"time":307.76,"text":"30. Holding forth things which must shortly come - Yea, holding forth the coming of the Son of God, His sufferings and death, And the resurrection of the dead."},{"time":317.431,"text":"31. And many of the people did inquire concerning the place where the Son of God should come; And they were taught that He would appear unto them after His resurrection; And this the people did hear with great joy and gladness."},{"time":330.88,"text":"32. And now, after the church having been established throughout all the land, having got the victory over the devil, And the word of God being preached in its purity in all the land and the Lord pouring out His blessings upon the people,"},{"time":344.016,"text":"33. And thus ended the fourteenth year of the reign of the judges over the people of Nephi."}]
