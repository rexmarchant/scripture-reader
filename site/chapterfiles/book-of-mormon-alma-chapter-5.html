<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",

  audioSrc: "https://archive.org/download/alma-ch-5/Alma%20Ch%205.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 5"},{"time":6.12,"text":"1. Behold, my beloved brethren, seeing that I have been permitted to come unto you, Therefore, I attempt to address you in my language,"},{"time":12.24,"text":"2. yea, by my own mouth, Seeing that it is the first time that I have spoken unto you by the words of my mouth, I having been wholly confined to the judgment seat, having had much business that I could not come unto you."},{"time":25.646,"text":"3. And even I could not have come now at this time, were it not that the judgment seat hath been given to another to reign in my stead; And the Lord in much mercy hath granted that I should come unto you."},{"time":38.369,"text":"4. And behold, I have come having great hopes and much desire that I should find that ye had humbled yourselves before God, And that ye had continued in the supplicating of His grace, that I should find that ye were blameless before Him,"},{"time":42.72,"text":"5. That I should find that ye were not in the awful dilemma that our brethren were in at Zarahemla,"},{"time":59.6,"text":"6. But, blessed be the name of God! that He hath given unto me to know, yea, hath given unto me the exceeding great joy of knowing that they are established again in the way of His righteousness;"},{"time":71.392,"text":"7. And I trust, according to the Spirit of God which is in me, that I shall also have joy over you."},{"time":78.728,"text":"8. Nevertheless, I do not desire that my joy over you should come by the cause of so much afflictions and sorrow which I have had for the brethren at Zarahemla;"},{"time":89.402,"text":"9. For behold, my joy cometh over them after wading through much afflictions and sorrow."},{"time":96.139,"text":"10. But behold, I trust that ye are not in a state of so much unbelief as were your brethren;"},{"time":104.187,"text":"11. I trust that ye are not lifted up in the pride of your hearts; Yea, I trust that ye have not set your hearts upon riches and the vain things of the world;"},{"time":112.236,"text":"12. Yea, I trust that you do not worship idols, but that ye do worship the true and the living God, And that ye look forward for the remission of your sins with an everlasting faith which is to come."},{"time":125.067,"text":"13. For behold, I say unto you, there be many things to come; And behold, there is one thing which is of more importance than they all."},{"time":133.422,"text":"14. For behold, the time is not far distant that the Redeemer liveth and cometh among His people."},{"time":139.992,"text":"15. Behold, I do not say that He will come among us at the time of His dwelling in His mortal tabernacle, For behold, the Spirit hath not said unto me that this should be the case;"},{"time":151.68,"text":"16. Now as to this thing, I do not know; But this much I do know, that the Lord God hath power to do all things which are according to His word."},{"time":160.913,"text":"17. But behold, the Spirit hath said this much unto me, saying: \"Cry unto this people, saying: 'Repent ye, repent ye! and prepare the way of the Lord, And walk in His paths which are strait.'\""},{"time":175.512,"text":"18. For behold, the kingdom of heaven is at hand and the Son of God cometh upon the face of the earth."},{"time":183.16,"text":"19. And behold, He shall be born of Mary at Jerusalem, which is the land of our forefathers, She being a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, And bring forth a son, yea, even the Son of God."},{"time":200.595,"text":"20. And He shall go forth, suffering pains and afflictions and temptations of every kind,"},{"time":206.6,"text":"21. And this that the word might be fulfilled which saith He will take upon Him the pains and the sicknesses of His people; And He will take upon Him death, that He may loose the bands of death which bind His people;"},{"time":219.42,"text":"22. And He will take upon Him their infirmities, that His bowels may be filled with mercy, according to the flesh, That He may know, according to the flesh, how to succor His people according to their infirmities."},{"time":232.24,"text":"23. Now the Spirit knoweth all things; Nevertheless, the Son of God suffereth, according to the flesh, That He might take upon Him the sins of His people, That He might blot out their transgressions according to the power of His deliverance. And now behold, this is the testimony which is in me."},{"time":249.778,"text":"24. Now I say unto you, that ye must repent and be born again, For the Spirit saith: \"If ye are not born again, ye cannot inherit the kingdom of heaven.\""},{"time":262.588,"text":"25. Therefore, come and be baptized unto repentance, that ye may be washed from your sins, That ye may have faith on the Lamb of God which taketh away the sins of the world, which is mighty to save and to cleanse from all unrighteousness."},{"time":278.32,"text":"26. Yea, I say unto you, come and fear not, And lay aside every sin which easily doth beset you, which doth bind you down to destruction."},{"time":287.684,"text":"27. Yea, come and go forth and show unto your God that ye are willing to repent of your sins and enter into a covenant with Him to keep His commandments, And witness it unto Him this day by going into the waters of baptism;"},{"time":302.249,"text":"28. And whosoever doeth this and keepeth the commandments of God from thenceforth, The same will remember that I say unto him, yea, he will remember that I have said unto him, he shall have eternal life according to the testimony of the Holy Spirit which testifieth in me."},{"time":318.414,"text":"29. And now my beloved brethren, do you believe these things?"},{"time":322.688,"text":"30. Behold, I say unto you, yea, I know that you believe them; And the way that I know that ye believe them is by the manifestations of the Spirit which is in me."},{"time":335.562,"text":"31. And now because your faith is strong concerning that, yea, concerning the things which I have spoken, great is my joy!"},{"time":344.64,"text":"32. For as I said unto you from the beginning that I had much desire that ye were not in the state of dilemma like your brethren, Even so I have found that my desires have been gratified."},{"time":356.08,"text":"33. For I perceive that ye are in the paths of righteousness; I perceive that ye are in the path which leads to the kingdom of God;"},{"time":363.84,"text":"34. Yea, I perceive that ye are making His paths strait; I perceive that it hath been made known unto you by the testimony of His word that He cannot walk in crooked paths,"},{"time":373.928,"text":"35. Neither doth He vary from that which He hath said, Neither hath He a shadow of turning from the right to the left, Or from that which is right to that which is wrong, Therefore, His course is one eternal round."},{"time":387.253,"text":"36. And He doth not dwell in unholy temples; Neither can filthiness or anything which is unclean be received into the kingdom of God."},{"time":396.0,"text":"37. Therefore I say unto you, the time shall come, yea, and it shall be at the last day, that he which is filthy shall remain in his filthiness."},{"time":406.053,"text":"38. And now my beloved brethren, I have said these things unto you that I might awaken you to a sense of your duty to God, that ye may walk blameless before Him, That ye may walk after the holy order of God, after which ye have been received."},{"time":420.384,"text":"39. And now, I would that ye should be humble, and be submissive and gentle, easy to be entreated, full of patience and longsuffering, Being temperate in all things, Being diligent in keeping the commandments of God at all times,"},{"time":436.86,"text":"40. Asking for whatsoever things ye stand in need, both spiritual and temporal, Always returning thanks unto God for whatsoever things ye do receive;"},{"time":447.374,"text":"41. And see that ye have faith, hope and charity, And then ye will always abound in good works."},{"time":455.36,"text":"42. And may the Lord bless you and keep your garments spotless, That ye may at last be brought to sit down with Abraham, Isaac and Jacob and the holy prophets which have been ever since the world began, Having your garments spotless, even as their garments are spotless, In the kingdom of heaven, to go no more out."},{"time":473.238,"text":"43. And now my beloved brethren, I have spoken these words unto you according to the Spirit which testifieth in me; And my soul doth exceedingly rejoice because of the exceeding diligence and heed which ye have given unto my word."},{"time":487.84,"text":"44. And now may the peace of God rest upon you, and upon your houses and lands, and upon your flocks and herds, and all that you possess, your women and your children, According to your faith and good works from this time, henceforth and forever. And thus I have spoken. Amen."}]
};
