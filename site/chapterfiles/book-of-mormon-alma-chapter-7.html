window.CHAPTER_DATA = {

  audioSrc: "https://archive.org/download/alma-ch-7/Alma%20Ch%207.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 7"},{"time":9.586,"text":"1. And again, I, Alma, having been commanded of God that I should take Amulek and go forth and preach again unto this people, or the people which were in the City of Ammonihah, And it came to pass as I began to preach unto them, they began to contend with me, saying: \"Who art thou?"},{"time":19.172,"text":"2. Suppose ye that we shall believe the testimony of one man, although he should preach unto us that the earth should pass away?\""},{"time":27.732,"text":"3. Now they understood not the words which they spake, for they knew not that the earth should pass away."},{"time":35.506,"text":"4. And they saith also: \"We will not believe thy words if thou shouldst prophesy that this great city should be destroyed in one day.\""},{"time":43.28,"text":"5. Now they knew not that God could do such marvelous works, for they were a hard-hearted and a stiff - necked people."},{"time":52.16,"text":"6. And they saith: \"Who is God that sendeth no more authority than one man among this people to declare unto them the truth of such great and marvelous things?\""},{"time":61.04,"text":"7. And they stood forth to lay their hands on me, But behold, they did not."},{"time":66.62,"text":"8. And I stood with boldness to declare unto them, yea, I did boldly testify unto them, saying: \"Behold, O ye wicked and perverse generation, How have ye forgotten the tradition of your fathers? Yea, how soon ye have forgotten the commandments of God!"},{"time":84.381,"text":"9. Do ye not remember that our father Lehi was brought out of Jerusalem by the hand of God?"},{"time":91.625,"text":"10. Do ye not remember that they were all led by Him through the wilderness?"},{"time":97.52,"text":"11. And have ye forgotten so soon how many times He delivered our fathers out of the hands of their enemies and preserved them from being destroyed, even by the hands of their own brethren?"},{"time":108.48,"text":"12. Yea, and if it had not been for His matchless power and His mercy and His longsuffering toward us, We should unavoidably have been cut off from the face of the earth long before this period of time and perhaps been consigned to a state of endless misery and wo."},{"time":123.587,"text":"13. \"Behold now I say unto you, that He commandeth you to repent; And except ye repent, ye can in no wise inherit the kingdom of God."},{"time":133.44,"text":"14. \"But behold, this is not all - He hath commanded you to repent or He will utterly destroy you from off the face of the earth; Yea, He will visit you in His anger, And in His fierce anger He will not turn away."},{"time":146.034,"text":"15. \"Behold, do ye not remember the words which He spake unto Lehi, saying that: ' Inasmuch as ye shall keep My commandments, ye shall prosper in the land '?"},{"time":158.661,"text":"16. And again, it is said that: 'Inasmuch as ye will not keep My commandments, ye shall be cut off from the presence of the Lord.'"},{"time":167.76,"text":"17. \"Now, I would that ye should remember that inasmuch as the Lamanites have not kept the commandments of God, they have been cut off from the presence of the Lord."},{"time":177.2,"text":"18. \"Now, we see that the word of the Lord hath been verified in this thing, And the Lamanites have been cut off from His presence from the beginning of their transgressions in the land."},{"time":187.76,"text":"19. \"Nevertheless, I say unto you that it shall be more tolerable for them in the day of judgment than for you, if ye remain in your sins,"},{"time":197.68,"text":"20. Yea, and even more tolerable for them in this life, than for you, except ye repent, For there are many promises which are extended to the Lamanites."},{"time":207.012,"text":"21. \"For it is because of the traditions of their fathers that causes them to remain in their state of ignorance, Therefore, the Lord will be merciful unto them and prolong their existence in the land;"},{"time":219.28,"text":"22. And at some period of time they will be brought to believe in His word and to know of the incorrectness of the traditions of their fathers;"},{"time":228.8,"text":"23. And many of them will be saved, for the Lord will be merciful unto all who call on His name."},{"time":236.24,"text":"24. \"But behold, I say unto you that if ye persist in your wickedness, that your days shall not be prolonged in the land, for the Lamanites shall be sent upon you;"},{"time":246.787,"text":"25. And if ye repent not, they shall come in a time when you know not and ye shall be visited with utter destruction;"},{"time":253.68,"text":"26. And it shall be according to the fierce anger of the Lord, For He will not suffer you that ye shall live in your iniquities to destroy His people."},{"time":263.128,"text":"27. \"I say unto you, nay, He would rather suffer that the Lamanites might destroy all this people which are called the people of Nephi, If it were possible that they could fall into sins and transgressions after having had so much light and so much knowledge given unto them of the Lord their God,"},{"time":279.99,"text":"28. Yea, after having been such a highly favored people of the Lord, Yea, after having been favored above every other nation, kindred, tongue or people,"},{"time":289.591,"text":"29. After having had all things made known unto them, according to their desires and their faith and prayers, of that which has been and which is and which is to come,"},{"time":300.704,"text":"30. Having been visited by the Spirit of God, Having conversed with angels, And having been spoken unto by the voice of the Lord,"},{"time":308.245,"text":"31. And having the spirit of prophecy and the spirit of revelation and also many gifts - the gift of speaking with tongues and the gift of preaching and the gift of the Holy Ghost and the gift of translation,"},{"time":320.409,"text":"32. Yea, and after having been delivered of God out of the Land of Jerusalem by the hand of the Lord,"},{"time":327.813,"text":"33. Having been saved from famine and from sicknesses and all manner of diseases of every kind,"},{"time":333.332,"text":"34. And they having been waxed strong in battle that they might not be destroyed, Having been brought out of bondage time after time, And having been kept and preserved until now; And they have been prospered until they are rich in all manner of things."},{"time":348.747,"text":"35. \"And now behold I say unto you, that if this people, who have received so many blessings from the hand of the Lord, should transgress contrary to the light and knowledge which they do have -"},{"time":359.839,"text":"36. I say unto you, that if this be the case - that if they should fall into transgressions, That it would be far more tolerable for the Lamanites than for them."},{"time":370.932,"text":"37. \"For behold, the promises of the Lord are extended to the Lamanites, but they are not unto you if ye transgress;"},{"time":378.64,"text":"38. For hath not the Lord expressly promised and firmly decreed that if ye will rebel against Him, that ye shall utterly be destroyed from off the face of the earth?"},{"time":388.08,"text":"39. \"And now for this cause - that ye may not be destroyed - the Lord hath sent His angel to visit many of His people, declaring unto them that they must go forth and cry mightily unto this people, saying: ' Repent ye, repent ye! for the kingdom of heaven is nigh at hand;"},{"time":406.343,"text":"40. And not many days hence, the Son of God shall come in His glory; And His glory shall be the glory of the Only Begotten of the Father, Full of grace, equity and truth, Full of patience, mercy and longsuffering, Quick to hear the cries of His people and to answer their prayers."},{"time":424.32,"text":"41. 'And behold, He cometh to redeem those who will be baptized unto repentance through faith on His name."},{"time":430.756,"text":"42. 'Therefore, prepare ye the way of the Lord, For the time is at hand that every man shall reap a reward of their works according to that which they have been:"},{"time":441.755,"text":"43. If they have been righteous, they shall reap the salvation of their souls according to the power and deliverance of Jesus Christ;"},{"time":448.842,"text":"44. And if they have been evil, they shall reap the damnation of their souls according to the power and captivation of the devil.'"},{"time":457.506,"text":"45. \"Now behold, this is the voice of the angel crying unto the people."},{"time":462.611,"text":"46. \"And now my beloved brethren, for ye are my brethren and ye had ought to be beloved, And ye had ought to bring forth works which are meet for repentance, Seeing that your hearts have been grossly hardened against the word of God and seeing that ye are a lost and a fallen people.\""},{"time":478.511,"text":"47. Now it came to pass that when I, Alma, had spoken these words, Behold, the people were wroth with me because I said unto them that they were a hard-hearted and a stiff - necked people;"},{"time":492.16,"text":"48. And also because I said unto them that they were a lost and a fallen people, they were angry with me and sought to lay their hands upon me, that they might cast me into prison."},{"time":502.8,"text":"49. But it came to pass that the Lord did not suffer them that they should take me at that time and cast me into prison."},{"time":508.821,"text":"50. And it came to pass that Amulek went and stood forth and began to preach unto them also."},{"time":515.213,"text":"51. And now the words of Amulek are not all written, Nevertheless, a part of his words are written in this book."}]
};
