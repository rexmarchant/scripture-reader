<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 3",
  audioSrc: "https://archive.org/download/alma-ch-3/Alma%20Ch%203.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 3"},{"time":5.803,"text":"1. Now it came to pass that Alma began to declare the word of God unto the people, first in the Land of Zarahemla and from thence throughout all the land;"},{"time":11.606,"text":"2. And these are the words which he spake to the people in the church which was established in the City of Zarahemla, according to his own record, saying:"},{"time":21.68,"text":"3. \"I, Alma, having been consecrated by my father Alma to be a high priest over the church of God, he having power and authority from God to do these things, Behold, I say unto you that he began to establish a church in the land which was in the borders of Nephi -"},{"time":34.376,"text":"4. yea, the land was called the Land of Mormon - Yea, and he did baptize his brethren in the Waters of Mormon."},{"time":47.073,"text":"5. \"And behold I say unto you, they were delivered out of the hands of the people of King Noah by the mercy and power of God."},{"time":54.622,"text":"6. \"And behold, after that they were brought into bondage by the hands of the Lamanites in the wilderness, Yea, I say unto you, they were in captivity and again the Lord did deliver them out of bondage by the power of His word;"},{"time":69.344,"text":"7. And we were brought into this land and here we began to establish the church of God throughout this land also."},{"time":77.105,"text":"8. \"And now behold I say unto you my brethren, you that belong to this church, Have you sufficiently retained in remembrance the captivity of your fathers?"},{"time":82.989,"text":"9. Yea, and have you sufficiently retained in remembrance His mercy and longsuffering toward them?"},{"time":95.356,"text":"10. And moreover, have ye sufficiently retained in remembrance that He hath delivered their souls from hell?"},{"time":101.84,"text":"11. \"Behold, He changed their hearts, Yea, He awaked them out of a deep sleep and they awake unto God;"},{"time":109.14,"text":"12. Behold, they were in the midst of darkness, Nevertheless, their souls were illuminated by the light of the everlasting word;"},{"time":117.717,"text":"13. Yea, they were encircled about by the bands of death and the chains of hell, And an everlasting destruction did await them."},{"time":126.293,"text":"14. \"And now I ask of you my brethren, were they destroyed?"},{"time":131.28,"text":"15. Behold I say unto you, nay, they were not."},{"time":135.676,"text":"16. \"And again I ask, were the bands of death broken? And the chains of hell which encircled them about, were they loosed?"},{"time":144.52,"text":"17. I say unto you, yea, they were loosed, And their souls did expand and they did sing redeeming love;"},{"time":153.364,"text":"18. And I say unto you that they are saved."},{"time":157.087,"text":"19. \"And now I ask of you, on what conditions are they saved? Yea, what grounds had they to hope for salvation?"},{"time":165.784,"text":"20. What is the cause of their being loosed from the bands of death, yea, and also the chains of hell?"},{"time":173.314,"text":"21. \"Behold, I can tell you; Did not my father Alma believe in the words which were delivered by the mouth of Abinadi? And was he not a holy prophet?"},{"time":183.769,"text":"22. Did he not speak the word of God and my father Alma believed them?"},{"time":189.68,"text":"23. And according to his faith there was a mighty change wrought in his heart;"},{"time":195.355,"text":"24. Behold, I say unto you that this is all true."},{"time":199.44,"text":"25. \"And behold, he preached the word unto your fathers, And a mighty change was also wrought in their hearts, And they humbled themselves and put their trust in the true and living God."},{"time":211.6,"text":"26. \"And behold, they were faithful until the end, therefore, they were saved."},{"time":216.74,"text":"27. \"And now behold, I ask of you my brethren of the church, Have ye spiritually been born of God?"},{"time":225.685,"text":"28. Have ye received His image in your own countenances?"},{"time":230.32,"text":"29. Have ye experienced this mighty change in your hearts?"},{"time":233.84,"text":"30. Do ye exercise faith in the redemption of Him who created you?"},{"time":239.92,"text":"31. Do you look forward with an eye of faith and view this mortal body raised in immortality? And this corruption raised in incorruption, to stand before God to be judged according to the deeds which hath been done in the mortal body?"},{"time":254.657,"text":"32. \"I say unto you, can you imagine to yourselves that ye hear the voice of the Lord saying unto you in that day: ' Come unto Me, ye blessed, For behold, your works have been the works of righteousness upon the face of the earth '?"},{"time":270.48,"text":"33. \"Or do ye imagine to yourselves that ye can lie unto the Lord at that day and say: 'Lord, our works have been righteous works upon the face of the earth, ' And that He will save you?"},{"time":281.92,"text":"34. \"Or otherwise, can ye imagine yourselves brought before the tribunal of God with your souls filled with guilt and remorse, having a remembrance of all your guilt?"},{"time":292.626,"text":"35. Yea, a perfect remembrance of all your wickedness? Yea, a remembrance that ye have set at defiance the commandments of God?"},{"time":316.16,"text":"36. \"I say unto you, can ye look up to God at that day with a pure heart and clean hands?"},{"time":317.895,"text":"37. \"I say unto you, can you look up, having the image of God engraven upon your countenances?"},{"time":321.735,"text":"38. \"I say unto you, can ye think of being saved when you have yielded yourselves to become subjects to the devil?"},{"time":323.84,"text":"39. \"I say unto you, ye will know at that day that ye cannot be saved, For there can no man be saved except his garments are washed white;"},{"time":332.35,"text":"40. Yea, his garments must be purified until they are cleansed from all stain through the blood of Him of whom it hath been spoken by our fathers which should come to redeem His people from their sins."},{"time":344.11,"text":"41. \"And now I ask of you my brethren, How will any of you feel if ye shall stand before the bar of God, having your garments stained with blood and all manner of filthiness?"},{"time":355.67,"text":"42. \"Behold, what will these things testify against you?"},{"time":360.55,"text":"43. \"Behold, will they not testify that ye are murderers? Yea, and also that ye are guilty of all manner of wickedness?"},{"time":370.96,"text":"44. \"Behold, my brethren, do ye suppose that such an one can have a place to sit down in the kingdom of God with Abraham, with Isaac and with Jacob? And also all the holy prophets whose garments are cleansed and are spotless, pure and white?"},{"time":387.422,"text":"45. \"I say unto you, nay, except ye make our Creator a liar from the beginning, or suppose that He is a liar from the beginning; Or also, ye cannot suppose that such an one can have place in the kingdom of heaven, But they shall be cast out, for they are the children of the kingdom of the devil."},{"time":405.84,"text":"46. \"And now behold I say unto you my brethren, if ye have experienced a change of heart, And if ye have felt to sing the song of redeeming love, I would ask, can ye feel so now?"},{"time":417.986,"text":"47. Have ye walked, keeping yourselves blameless before God?"},{"time":421.646,"text":"48. Could ye say, if ye were called to die at this time, within yourselves that ye have been sufficiently humble?"},{"time":429.05,"text":"49. That your garments have been cleansed and made white through the blood of Christ which will come to redeem His people from their sins?"},{"time":438.496,"text":"50. \"Behold, are ye stripped of pride? I say unto you, if ye are not, ye are not prepared to meet God."},{"time":447.941,"text":"51. \"Behold, ye must prepare quickly, for the kingdom of heaven is soon at hand, And such an one hath not eternal life."},{"time":456.8,"text":"52. \"Behold I say, is there one among you who is not stripped of envy?"},{"time":461.31,"text":"53. I say unto you that such an one is not prepared; And I would that he should prepare quickly, for the hour is close at hand and he knoweth not when the time shall come, For such an one is not found guiltless."},{"time":474.265,"text":"54. \"And again I say unto you, is there one among you that doth make a mock of his brother or that heapeth upon him persecutions?"},{"time":483.462,"text":"55. Wo unto such an one! for he is not prepared, And the time is at hand that he must repent or he cannot be saved;"},{"time":492.658,"text":"56. Yea, even wo unto all ye workers of iniquity! Repent, repent! for the Lord God hath spoken it."},{"time":501.549,"text":"57. \"Behold, He sendeth an invitation unto all men, for the arms of mercy are extended toward them, And He saith, ' Repent, and I will receive you ';"},{"time":512.68,"text":"58. Yea, He saith, 'Come unto Me and ye shall partake of the fruit of the tree of life; Yea, ye shall eat and drink of the bread and the waters of life freely;"},{"time":523.811,"text":"59. Yea, come unto Me and bring forth works of righteousness and ye shall not be hewn down and cast into the fire."},{"time":531.624,"text":"60. 'For behold, the time is at hand that whosoever bringeth forth not good fruit, or whosoever doeth not the works of righteousness, The same hath cause to wail and mourn.'"},{"time":543.074,"text":"61. \"O, ye workers of iniquity! Ye that are puffed up in the vain things of the world! Ye that have professed to have known the ways of righteousness, Nevertheless, ye have gone astray as sheep having no shepherd, notwithstanding a Shepherd hath called after you and art still calling after you, but ye will not hearken unto His voice -"},{"time":565.049,"text":"62. Behold, I say unto you that the Good Shepherd doth call you, Yea, and in His own name He doth call you, which is the name of Christ."},{"time":573.68,"text":"63. \"And if ye will not hearken unto the voice of the Good Shepherd, to the name by which ye are called, Behold, ye are not the sheep of the Good Shepherd;"},{"time":583.76,"text":"64. And now if ye are not the sheep of the Good Shepherd, of what fold are ye?"},{"time":589.848,"text":"65. \"Behold, I say unto you that the devil is your shepherd and ye are of his fold; And now who can deny this?"},{"time":598.044,"text":"66. \"Behold I say unto you, whosoever denieth this is a liar and a child of the devil,"},{"time":604.19,"text":"67. For I say unto you that whatsoever is good cometh from God, And whatsoever is evil cometh from the devil."},{"time":611.44,"text":"68. \"Therefore, if a man bringeth forth good works, he hearkeneth unto the voice of the Good Shepherd and he doth follow Him;"},{"time":618.93,"text":"69. But whosoever bringeth forth evil works, the same becometh a child of the devil, for he hearkeneth unto his voice and doth follow him,"},{"time":628.579,"text":"70. And whosoever doeth this must receive his wages of him, Therefore, for his wages he receiveth death as to things pertaining unto righteousness, being dead unto all good works."},{"time":639.74,"text":"71. \"And now my brethren, I say unto you, I would that ye should hear me, for I speak in the energy of my soul;"},{"time":649.08,"text":"72. For behold, I have spoken unto you plain that ye cannot err, or have spoken according to the commandments of God,"},{"time":657.68,"text":"73. For I am called to speak after this manner, according to the holy order of God which is in Christ Jesus;"},{"time":666.562,"text":"74. Yea, I am commanded to stand and testify unto this people the things which have been spoken by our fathers concerning the things which are to come."},{"time":675.444,"text":"75. \"And this is not all - Do ye suppose that I know not of these things myself?"},{"time":681.368,"text":"76. Behold, I testify unto you that I do know that these things whereof I have spoken are true."},{"time":688.636,"text":"77. \"And how do ye suppose that I know of their surety?"},{"time":693.36,"text":"78. Behold I say unto you, they are made known unto me by the Holy Spirit of God."},{"time":700.16,"text":"79. \"Behold, I have fasted and prayed many days that I might know these things of myself,"},{"time":706.72,"text":"80. And now I do know of myself that they are true; For the Lord God hath made them manifest unto me by His Holy Spirit, And this is the spirit of revelation which is in me."},{"time":717.808,"text":"81. \"And moreover I say unto you, that as it has thus been revealed unto me that the words which have been spoken by our fathers are true,"},{"time":725.708,"text":"82. Even so, according to the spirit of prophecy which is in me, which is also by the manifestation of the Spirit of God, I say unto you that I know of myself that whatsoever I shall say unto you concerning that which is to come is true;"},{"time":740.469,"text":"83. And I say unto you that I know that Jesus Christ shall come, Yea, the Son of - the Only Begotten of - the Father, full of grace and mercy and truth."},{"time":751.008,"text":"84. \"And behold, it is He that cometh to take away the sins of the world; Yea, the sins of every man which steadfastly believeth on His name."},{"time":761.293,"text":"85. \"And now I say unto you, that this is the order after which I am called, Yea, to preach unto my beloved brethren, Yea, and everyone that dwelleth in the land;"},{"time":773.52,"text":"86. Yea, to preach unto all - both old and young, both bond and free; Yea, I say unto you - the aged and also the middle aged, and the rising generation - Yea, to cry unto them that they must repent and be born again."},{"time":789.19,"text":"87. \"Yea, thus saith the Spirit: 'Repent all ye ends of the earth, for the kingdom of heaven is soon at hand! ' Yea, the Son of God cometh in His glory, in His might, majesty, power and dominion;"},{"time":804.86,"text":"88. Yea, my beloved brethren, I say unto you that the Spirit saith: 'Behold! The glory of the King of all the earth and also the King of heaven shall very soon shine forth among all the children of men! '"},{"time":820.24,"text":"89. \"And also the Spirit saith unto me, yea, crieth unto me with a mighty voice, saying: 'Go forth and say unto this people, Repent! For except ye repent ye can in no wise inherit the kingdom of heaven.'"},{"time":836.0,"text":"90. \"And again I say unto you, the Spirit saith: 'Behold, the axe is laid at the root of the tree; Therefore, every tree that bringeth not forth good fruit shall be hewn down and cast into the fire, Yea, a fire which cannot be consumed, even an unquenchable fire.'"},{"time":854.0,"text":"91. \"Behold and remember the Holy One hath spoken it."},{"time":857.92,"text":"92. \"And now my beloved brethren, I say unto you, can ye withstand these sayings? Yea, can ye lay aside these things and trample the Holy One under your feet?"},{"time":869.928,"text":"93. Yea, can ye be puffed up in the pride of your hearts? Yea, will ye still persist in the wearing of costly apparel and setting your hearts upon the vain things of the world, upon your riches?"},{"time":884.56,"text":"94. Yea, will ye persist in supposing that ye are better, one than another?"},{"time":890.4,"text":"95. Yea, will ye persist in the persecutions of your brethren who humble themselves and do walk after the holy order of God wherewith they have been brought into this church, having been sanctified by the Holy Spirit? - And they do bring forth works which are meet for repentance -"},{"time":906.24,"text":"96. Yea, and will you persist in turning your backs upon the poor and the needy and in withholding your substance from them?"},{"time":913.017,"text":"97. \"And finally, all ye that will persist in your wickedness, I say unto you that these are they which shall be hewn down and cast into the fire except they speedily repent."},{"time":923.232,"text":"98. \"And now I say unto you, all you that are desirous to follow the voice of the Good Shepherd: Come ye out from the wicked! and be ye separate! and touch not their unclean things!"},{"time":940.16,"text":"99. \"And behold, their names shall be blotted out, that the names of the wicked shall not be numbered among the names of the righteous, that the word of God may be fulfilled which saith: 'The names of the wicked shall not be mingled with the names of My people,"},{"time":954.56,"text":"100. For the names of the righteous shall be written in the Book of Life, And unto them will I grant an inheritance at My right hand.'"},{"time":962.863,"text":"101. \"And now my brethren, what have ye to say against this?"},{"time":967.556,"text":"102. I say unto you, if ye speak against it, it matters not, for the word of God must be fulfilled;"},{"time":975.158,"text":"103. For what shepherd is there among you having many sheep doth not watch over them, that the wolves enter not and devour his flock?"},{"time":982.96,"text":"104. And behold, if a wolf enter his flock, doth he not drive him out? Yea, and at the last, if he can, he will destroy him."},{"time":992.853,"text":"105. \"And now I say unto you that the Good Shepherd doth call after you; And if you will hearken unto His voice, He will bring you into His fold and ye are His sheep;"},{"time":1004.24,"text":"106. And He commandeth you that ye suffer no ravenous wolf to enter among you, that ye may not be destroyed."},{"time":1010.48,"text":"107. \"And now I, Alma, do command you in the language of Him who hath commanded me, that ye observe to do the words which I have spoken unto you;"},{"time":1020.48,"text":"108. I speak by way of command unto you that belong to the church.\"And unto those which do not belong to the church, I speak by way of invitation, saying, Come and be baptized unto repentance that ye also may be partakers of the fruit of the tree of life.\""}]
};
</script>
