<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 9",
  audioSrc: "https://archive.org/download/alma-ch-9/Alma%20Ch%209.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 9"},{"time":12.24,"text":"1. Now Alma seeing that the words of Amulek had silenced Zeezrom, for he beheld that Amulek had caught him in his lying and deceiving to destroy him, And seeing that he began to tremble under a consciousness of his guilt, He opened his mouth and began to speak unto him and to establish the words of Amulek and to explain things beyond, or to unfold the scriptures beyond that which Amulek had done."},{"time":24.48,"text":"2. Now the words that Alma spake unto Zeezrom were heard by the people round about, for the multitude was great. And he spake on this wise:"},{"time":35.4,"text":"3. \"Now Zeezrom, seeing that thou hast been taken in thy lyings and craftiness, for thou hast not lied unto men only, but thou hast lied unto God,"},{"time":46.32,"text":"4. For behold, He knows all thy thoughts; And thou seest that thy thoughts are made known unto us by His Spirit;"},{"time":56.592,"text":"5. And thou seest that we know that thy plan was a very subtle plan, as to the subtlety of the devil, for to lie and to deceive this people, That thou mightest set them against us, to revile us and to cast us out."},{"time":66.865,"text":"6. \"Now this was a plan of thine adversary and he hath exercised his power in thee."},{"time":72.476,"text":"7. \"Now I would that ye should remember that what I say unto thee, I say unto all."},{"time":78.512,"text":"8. \"And behold, I say unto you all that this was a snare of the adversary which he hath laid to catch this people,"},{"time":86.99,"text":"9. That he might bring you into subjection unto him, That he might encircle you about with his chains, That he might chain you down to everlasting destruction, according to the power of his captivity.\""},{"time":99.04,"text":"10. Now when Alma had spoken these words, Zeezrom began to tremble more exceedingly, for he was convinced more and more of the power of God;"},{"time":109.6,"text":"11. And he was also convinced that Alma and Amulek had a knowledge of him, for he was convinced that they knew the thoughts and intents of his heart,"},{"time":117.869,"text":"12. For power was given unto them that they might know of these things according to the spirit of prophecy."},{"time":122.136,"text":"13. And Zeezrom began to inquire of them diligently, that he might know more concerning the kingdom of God."},{"time":136.569,"text":"14. And he saith unto Alma: \"What does this mean which Amulek hath spoken concerning the resurrection of the dead, That all shall rise from the dead, both the just and the unjust, and are brought to stand before God to be judged according to their works?\""},{"time":146.736,"text":"15. And now Alma began to expound these things unto him, saying: \"It is given unto many to know the mysteries of God,"},{"time":155.849,"text":"16. Nevertheless, they are laid under a strict command that they shall not impart only according to the portion of His word which He doth grant unto the children of men, according to the heed and diligence which they give unto Him."},{"time":168.88,"text":"17. \"And therefore, he that will harden his heart, the same receiveth the lesser portion of the word,"},{"time":175.68,"text":"18. And he that will not harden his heart, to him is given the greater portion of the word until it is given unto him to know the mysteries of God, until they know them in full;"},{"time":186.16,"text":"19. And he that will harden his heart, to him is given the lesser portion of the word until they know nothing concerning His mysteries;"},{"time":193.322,"text":"20. And then they are taken captive by the devil and led by his will down to destructions;"},{"time":199.76,"text":"21. Now this is what is meant by the chains of hell. \"And Amulek hath spoken plainly concerning death, And being raised from this mortality to a state of immortality, And being brought before the bar of God to be judged according to our works."},{"time":216.4,"text":"22. \"Then if our hearts have been hardened, yea, if we have hardened our hearts against the word insomuch that it hath not been found in us, Then will our state be awful, for then we shall be condemned;"},{"time":226.754,"text":"23. For our work will condemn us, yea, all our work will condemn us - We shall not be found spotless;"},{"time":234.956,"text":"24. And our thoughts will also condemn us; And in this awful state, we shall not durst look up to our God;"},{"time":242.863,"text":"25. And we would fain be glad if we could command the rocks and the mountains to fall upon us to hide us from His presence."},{"time":250.771,"text":"26. \"But this cannot be; We must come forth and stand before Him in His glory and in His power and in His might, majesty and dominion, And acknowledge to our everlasting shame that all His judgments are just,"},{"time":263.524,"text":"27. That He is just in all His works, And that He is merciful unto the children of men, And that He hath all power to save every man that believeth on His name and bringeth forth fruit meet for repentance."},{"time":277.431,"text":"28. \"And now behold, I say unto you, then cometh a death, even a second death which is a spiritual death;"},{"time":285.377,"text":"29. Then is a time that whosoever dieth in his sins, as to the temporal death, shall also die a spiritual death; Yea, he shall die as to things pertaining unto righteousness."},{"time":296.747,"text":"30. \"Then is the time when their torments shall be as a lake of fire and brimstone whose flames ascendeth up forever and ever."},{"time":305.164,"text":"31. \"And then is the time that they shall be chained down to an everlasting destruction according to the power and captivity of Satan, he having subjected them according to his will."},{"time":316.578,"text":"32. \"Then, I say unto you, they shall be as though there had been no redemption made, For they cannot be redeemed according to God's justice, And they cannot die, seeing there is no more corruption.\""},{"time":329.12,"text":"33. Now it came to pass that when Alma had made an end of speaking these words, the people began to be more astonished;"},{"time":337.36,"text":"34. But there was one, Antionah, who was a chief ruler among them, came forth and said unto him: \"What is this that thou hast said, that man should rise from the dead and be changed from this mortal to an immortal state, that the soul can never die?"},{"time":352.96,"text":"35. \"What does this scripture mean which saith that God placed cherubim and a flaming sword on the east of the garden of Eden, lest our first parents should enter and partake of the fruit of the tree of life and live forever?"},{"time":367.36,"text":"36. And thus we see that there was no possible chance that they should live forever.\""},{"time":372.96,"text":"37. Now Alma saith unto him: \"This is the thing which I was about to explain."},{"time":378.56,"text":"38. \"Now, we see that Adam did fall by partaking of the forbidden fruit, according to the word of God; And thus we see that by his fall that all mankind became a lost and a fallen people."},{"time":390.24,"text":"39. \"And now behold I say unto you, that if it had been possible for Adam for to have partaken of the fruit of the tree of life at that time, that there would have been no death and the word would have been void, making God a liar, For He said: 'If thou eat thereof, thou shalt surely die.'"},{"time":407.12,"text":"40. \"And we see that death comes upon mankind, yea, the death which has been spoken of by Amulek, which is the temporal death; Nevertheless, there was a space granted unto man in which he might repent."},{"time":420.33,"text":"41. \"Therefore, this life became a probationary state, a time to prepare to meet God, A time to prepare for that endless state which has been spoken of by us, which is after the resurrection of the dead."},{"time":432.716,"text":"42. \"Now if it had not been for the plan of redemption which was laid from the foundation of the world, there could have been no resurrection of the dead;"},{"time":442.113,"text":"43. But there was a plan of redemption laid which shall bring to pass the resurrection of the dead of which has been spoken."},{"time":448.284,"text":"44. \"And now behold, if it were possible that our first parents could have gone forth and partaken of the tree of life, they would have been forever miserable, having no preparatory state;"},{"time":460.96,"text":"45. And thus the plan of redemption would have been frustrated, And the word of God would have been void, taking none effect."},{"time":467.28,"text":"46. \"But behold, it was not so, but it was appointed unto man that they must die; And after death they must come to judgment, even that same judgment of which we have spoken, which is the end."},{"time":480.16,"text":"47. \"And after God had appointed that these things should come unto man, Behold, then He saw that it was expedient that man should know concerning the things whereof He had appointed unto them."},{"time":491.867,"text":"48. \"Therefore, He sent angels to converse with them which caused men to behold of His glory;"},{"time":499.12,"text":"49. And they began from that time forth to call on His name. \"Therefore, God conversed with men and made known unto them the plan of redemption which had been prepared from the foundation of the world;"},{"time":512.4,"text":"50. And this He made known unto them according to their faith and repentance and their holy works."},{"time":518.88,"text":"51. \"Wherefore, He gave commandments unto men, they having first transgressed the first commandments as to things which were temporal and becoming as gods, knowing good from evil, Placing themselves in a state to act, or being placed in a state to act, according to their wills and pleasures, whether to do evil or to do good."},{"time":539.177,"text":"52. \"Therefore, God gave unto them commandments, after having made known unto them the plan of redemption, that they should not do evil, The penalty thereof being a second death which was an everlasting death as to things pertaining unto righteousness,"},{"time":551.889,"text":"53. For on such the plan of redemption could have no power, for the works of justice could not be destroyed according to the supreme goodness of God."},{"time":562.56,"text":"54. \"But God did call on men in the name of His Son, this being the plan of redemption which was laid, saying: 'If ye will repent and harden not your hearts, then will I have mercy upon you through Mine Only Begotten Son;"},{"time":575.547,"text":"55. Therefore, whosoever repenteth and hardeneth not his heart, he shall have claim on mercy through Mine Only Begotten Son unto a remission of their sins, And these shall enter into My rest;"},{"time":587.487,"text":"56. And whosoever will harden his heart and will do iniquity, behold, I swear in My wrath that they shall not enter into My rest.'"},{"time":596.978,"text":"57. \"And now my brethren, behold I say unto you, that if ye will harden your hearts ye shall not enter into the rest of the Lord;"},{"time":604.32,"text":"58. Therefore, your iniquity provoketh Him, that He sendeth down His wrath upon you as in the first provocation,"},{"time":611.586,"text":"59. Yea, according to His word in the last provocation, as well as in the first, to the everlasting destruction of your souls, Therefore, according to His word, unto the last death as well as the first."},{"time":626.139,"text":"60. \"And now my brethren, seeing we know these things and they are true, Let us repent and harden not our hearts, that we provoke not the Lord our God to pull down His wrath upon us in these His second commandments which He hath given unto us,"},{"time":641.36,"text":"61. But let us enter into the rest of God which is prepared according to His word."},{"time":647.36,"text":"62. \"And again my brethren, I would cite your minds forward to the time which the Lord God gave these commandments unto His children;"},{"time":654.499,"text":"63. And I would that ye should remember that the Lord God ordained priests after His holy order which was after the order of His Son, to teach these things unto the people;"},{"time":664.658,"text":"64. And those priests were ordained after the order of His Son in a manner that thereby the people might know in what manner to look forward to His Son for redemption."},{"time":675.175,"text":"65. \"And this is the manner after which they were ordained, being called and prepared from the foundation of the world according to the foreknowledge of God, On account of their exceeding faith and good works, in the first place being left to choose good or evil -"},{"time":690.705,"text":"66. \"Therefore they, having chosen good and exercising exceeding great faith, are called with a holy calling, Yea, with that holy calling which was prepared with, and according to, a preparatory redemption for such,"},{"time":704.0,"text":"67. And thus they having been called to this holy calling on account of their faith - \"While others would reject the Spirit of God on account of the hardness of their hearts and blindness of their minds, While, if it had not been for this, they might have had as great privilege as their brethren;"},{"time":721.102,"text":"68. Or in fine, in the first place they were on the same standing with their brethren - \"Thus this holy calling being prepared from the foundation of the world for such as would not harden their hearts, Being in and through the atonement of the Only Begotten Son which was prepared;"},{"time":736.71,"text":"69. And thus being called by this holy calling and ordained unto the high priesthood of the holy order of God, to teach His commandments unto the children of men, that they also might enter into His rest,"},{"time":749.896,"text":"70. This high priesthood being after the order of His Son, which order was from the foundation of the world,"},{"time":757.061,"text":"71. Or in other words, being without beginning of days or end of years, being prepared from eternity to all eternity according to His foreknowledge of all things -"},{"time":767.12,"text":"72. \"Now they were ordained after this manner, being called with a holy calling and ordained with a holy ordinance, And taking upon themselves the high priesthood of the holy order, which calling and ordinance and high priesthood is without beginning or end."},{"time":781.784,"text":"73. \"Thus they become high priests forever after the order of the Son of - the Only Begotten of - the Father, which is without beginning of days or end of years, which is full of grace, equity and truth.\"And thus it is. Amen.\""}]
};
