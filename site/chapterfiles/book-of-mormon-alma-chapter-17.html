<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 17",
  audioSrc: "https://archive.org/download/alma-ch-17/Alma%20Ch%2017.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 17"},{"time":5.622,"text":"1. My son, give ear to my words, For I swear unto you that inasmuch as ye shall keep the commandments of God, ye shall prosper in the land;"},{"time":11.244,"text":"2. I would that ye should do as I have done in remembering the captivity of our fathers, For they were in bondage and none could deliver them except it was the God of Abraham and the God of Isaac and the God of Jacob, And He surely did deliver them in their afflictions."},{"time":26.984,"text":"3. And now, O my son Helaman, behold, thou art in thy youth, And, therefore, I beseech of thee that thou wilt hear my words and learn of me; For I do know that whomsoever shall put his trust in God shall be supported in their trials and their troubles and their afflictions and shall be lifted up at the last day;"},{"time":46.427,"text":"4. And I would not that ye think that I know of myself - not of the temporal, but of the spiritual, not of the carnal mind, but of God."},{"time":56.8,"text":"5. Now behold, I say unto you, if I had not been born of God, I should not have known these things; But God hath by the mouth of His holy angel made these things known unto me, Not of any worthiness of myself, for I went about with the sons of Mosiah seeking to destroy the church of God; But behold, God sent His holy angel to stop us by the way;"},{"time":77.84,"text":"6. And behold, he spake unto us as it were the voice of thunder, And the whole earth did tremble beneath our feet, And we all fell to the earth, for the fear of the Lord came upon us."},{"time":89.928,"text":"7. But behold, the voice said unto me, \"Arise!\" And I arose and stood up and beheld the angel, And he said unto me: \"If thou wilt of thyself be destroyed, seek no more to destroy the church of God!\""},{"time":103.76,"text":"8. And it came to pass that I fell to the earth; And it was for the space of three days and three nights that I could not open my mouth, neither had I the use of my limbs;"},{"time":116.496,"text":"9. And the angel spake more things unto me which were heard by my brethren, but I did not hear them, For when I heard the words - \"If thou wilt be destroyed of thyself, seek no more to destroy the church of God!\" - I was struck with such great fear and amazement, lest perhaps that I should be destroyed, that I fell to the earth and I did hear no more;"},{"time":136.982,"text":"10. But I was racked with eternal torment, for my soul was harrowed up to the greatest degree and racked with all my sins - Yea, I did remember all my sins and iniquities, for which I was tormented with the pains of hell,"},{"time":150.817,"text":"11. Yea, I saw that I had rebelled against my God and that I had not kept His holy commandments, Yea, and I had murdered many of His children, or rather, led them away unto destruction,"},{"time":163.818,"text":"12. Yea, and in fine, so great had been my iniquities that the very thoughts of coming into the presence of my God did rack my soul with inexpressible horror;"},{"time":173.33,"text":"13. O, thought I, that I could be banished and become extinct, both soul and body! That I might not be brought to stand in the presence of my God to be judged of my deeds!"},{"time":185.68,"text":"14. And now, for three days and for three nights was I racked even with the pains of a damned soul."},{"time":192.64,"text":"15. And it came to pass that as I was thus racked with torment - while I was harrowed up by the memory of my many sins - Behold, I remembered also to have heard my father prophesy unto the people concerning the coming of one Jesus Christ, a Son of God, to atone for the sins of the world."},{"time":209.44,"text":"16. Now, as my mind caught hold upon this thought, I cried within my heart, O Jesus, Thou Son of God, have mercy on me who art in the gall of bitterness and art encircled about by the everlasting chains of death!"},{"time":223.191,"text":"17. And now behold, when I thought this, I could remember my pains no more, Yea, I was harrowed up by the memory of my sins no more;"},{"time":234.24,"text":"18. And O, what joy and what marvelous light I did behold! Yea, my soul was filled with joy as exceeding as was my pain; Yea, I say unto you my son, that there can be nothing so exquisite and so bitter as were my pains;"},{"time":250.971,"text":"19. Yea, and again I say unto you my son, that on the other hand there can be nothing so exquisite and sweet as was my joy."},{"time":262.266,"text":"20. Yea, and methought I saw, even as our father Lehi saw, God sitting upon His throne surrounded with numberless concourses of angels in the attitude of singing and praising their God, Yea, and my soul did long to be there;"},{"time":273.56,"text":"21. But behold, my limbs did receive their strength again, And I stood upon my feet and did manifest unto the people that I had been born of God;"},{"time":282.56,"text":"22. Yea, and from that time even until now, I have labored without ceasing that I might bring souls unto repentance, That I might bring them to taste of the exceeding joy of which I did taste, That they might also be born of God and be filled with the Holy Ghost."},{"time":298.48,"text":"23. Yea, and now behold, O my son, the Lord doth give me exceeding great joy in the fruits of my labors, For because of the word which He hath imparted unto me, Behold, many hath been born of God, and hath tasted, as I have tasted, and hath seen eye to eye, as I have seen;"},{"time":320.88,"text":"24. Therefore, they do know of these things of which I have spoken, as I do know, And the knowledge which I have is of God."},{"time":330.0,"text":"25. And I have been supported under trials and troubles of every kind, yea, and in all manner of afflictions, Yea, God hath delivered me from prisons and from bonds and from death, Yea, and I do put my trust in Him and He will still deliver me;"},{"time":345.92,"text":"26. And I know that He will raise me up at the last day to dwell with Him in glory. Yea, and I will praise Him forever! For He hath brought our fathers out of Egypt - And He hath swallowed up the Egyptians in the Red Sea - And He led them by His power into the Promised Land,"},{"time":362.927,"text":"27. Yea, and He hath delivered them out of bondage and captivity from time to time, Yea, and He hath also brought our fathers out of the Land of Jerusalem, And He hath also, by His everlasting power, delivered them out of bondage and captivity from time to time, even down to the present day;"},{"time":382.329,"text":"28. And I have always retained in remembrance their captivity, Yea, and ye also had ought to retain in remembrance, as I have done, their captivity."},{"time":392.96,"text":"29. But behold, my son, this is not all - For ye had ought to know, as I do know, that inasmuch as ye shall keep the commandments of God, ye shall prosper in the land,"},{"time":404.9,"text":"30. And ye had ought to know also that inasmuch as ye will not keep the commandments of God, ye shall be cut off from His presence; Now this is according to His word."},{"time":415.76,"text":"31. And now my son Helaman, I command you that ye take the records which have been entrusted with me, And I also command you that ye shall keep a record of this people, according as I have done, upon the plates of Nephi; And keep all these things sacred which I have kept, even as I have kept them - for it is for a wise purpose that they are kept -"},{"time":437.04,"text":"32. And these plates of brass which contain these engravings, which have the records of the holy scriptures upon them, which have the genealogy of our forefathers, even from the beginning;"},{"time":448.16,"text":"33. And behold, it hath been prophesied by our fathers that they should be kept and handed down from one generation to another and be kept and preserved by the hand of the Lord, Until they shall go forth unto every nation, kindred, tongue and people, that they shall know of the mysteries contained thereon."},{"time":466.88,"text":"34. And now behold, if they are kept, they must retain their brightness, Yea, and they will retain their brightness, Yea, and also shall all the plates which do contain that which is holy writ."},{"time":479.609,"text":"35. Now ye may suppose that this is foolishness in me; But behold, I say unto you that by small and simple things are great things brought to pass, And small means, in many instances, doth confound the wise;"},{"time":494.64,"text":"36. And the Lord God doth work by means to bring about His great and eternal purposes, And by very small means the Lord doth confound the wise and bringeth about the salvation of many souls."},{"time":505.31,"text":"37. And now, it hath hitherto been wisdom in God that these things should be preserved; For behold, they have enlarged the memory of this people, Yea, and convinced many of the error of their ways, And brought them to the knowledge of their God, unto the salvation of their souls;"},{"time":522.96,"text":"38. Yea, I say unto you, were it not for these things that these records do contain, which are on these plates, Ammon and his brethren could not have convinced so many thousands of the Lamanites of the incorrect tradition of their fathers;"},{"time":538.448,"text":"39. Yea, these records and their words brought them unto repentance, That is, they brought them to the knowledge of the Lord their God and to rejoice in Jesus Christ their Redeemer;"},{"time":548.824,"text":"40. And who knoweth but what they will be the means of bringing many thousands of them - yea, and also many thousands of our stiff - necked brethren the Nephites, which are now hardening their hearts in sins and iniquities - to the knowledge of their Redeemer."},{"time":564.899,"text":"41. Now these mysteries are not yet fully made known unto me, therefore I shall forbear;"},{"time":570.539,"text":"42. And it may suffice if I only say they are preserved for a wise purpose, which purpose is known unto God, For He doth counsel in wisdom over all His works, And His paths are strait, And His course is one eternal round."},{"time":586.688,"text":"43. O remember, remember, my son Helaman, how strict are the commandments of God!"},{"time":592.248,"text":"44. And He saith, \"If ye will keep My commandments, ye shall prosper in the land, \" But if ye keep not His commandments, ye shall be cut off from His presence."},{"time":601.887,"text":"45. And now remember, my son, that God hath entrusted you with these things which are sacred, which He hath kept sacred, And also which He will keep and preserve for a wise purpose in Him, that He may show forth His power unto future generations."},{"time":618.347,"text":"46. And now behold, I tell you by the spirit of prophecy that if ye trangress the commandments of God, Behold, these things which are sacred shall be taken away from you by the power of God, And ye shall be delivered up unto Satan that he may sift you as chaff before the wind;"},{"time":635.288,"text":"47. But if ye keep the commandments of God and do with these things which are sacred, according to that which the Lord doth command you - for you must appeal unto the Lord for all things whatsoever ye must do with them - Behold, no power of earth or hell can take them from you; For God is powerful to the fulfilling of all His words,"},{"time":655.44,"text":"48. For He will fulfill all His promises which He shall make unto you, For He hath fulfilled His promise which He hath made unto our fathers,"},{"time":663.581,"text":"49. For He promised unto them that He would preserve these things for a wise purpose in Him, that He might show forth His power unto future generations."},{"time":674.08,"text":"50. And now behold, one purpose hath He fulfilled, even to the restoration of many thousands of the Lamanites to the knowledge of the truth; And He hath shown forth His power in them, And He will also still show forth His power in them unto future generations, Therefore, they shall be preserved;"},{"time":691.28,"text":"51. Therefore, I command you, my son Helaman, that ye be diligent in fulfilling all my words, And that ye be diligent in keeping the commandments of God as they are written."},{"time":702.8,"text":"52. And now, I will speak unto you concerning those twenty - four plates, that ye keep them, That the mysteries and the works of darkness and their secret works - or the secret works of those people which have been destroyed - may be made manifest unto this people -"},{"time":718.0,"text":"53. Yea, all their murders and robbings and their plunderings, and all their wickedness and abominations may be made manifest unto this people - Yea, and that ye preserve these directors."},{"time":732.88,"text":"54. For, behold, the Lord saw that His people began to work in darkness, yea, work secret murders and abominations; Therefore, the Lord said if they did not repent, they should be destroyed from off the face of the earth."},{"time":747.379,"text":"55. And the Lord said: \"I will prepare unto My servant Gazelem a stone which shall shine forth in darkness unto light, That I may discover unto My people which serve Me - That I may discover unto them the works of their brethren - Yea, their secret works, their works of darkness and their wickedness and abominations.\""},{"time":766.64,"text":"56. And now, my son, these directors were prepared that the word of God might be fulfilled which He spake, saying: \"I will bring forth out of darkness unto light all their secret works and their abominations;"},{"time":778.494,"text":"57. And, except they repent, I will destroy them from off the face of the earth; And I will bring to light all their secrets and abominations unto every nation that shall hereafter possess the land.\""},{"time":791.473,"text":"58. And now my son, we see that they did not repent, Therefore, they have been destroyed; And thus far the word of God hath been fulfilled, Yea, their secret abominations have been brought out of darkness and made known unto us."},{"time":807.68,"text":"59. And now my son, I command you that ye retain all their oaths and their covenants and their agreements in their secret abominations; Yea, and all their signs and their wonders ye shall retain from this people, that they know them not, Lest peradventure they should fall into darkness also and be destroyed;"},{"time":824.82,"text":"60. For behold, there is a curse upon all this land that destruction shall come upon all those workers of darkness - according to the power of God - when they are fully ripe. Therefore, I desire that this people might not be destroyed;"},{"time":841.446,"text":"61. Therefore, ye shall keep these secret plans of their oaths and their covenants from this people, And only their wickedness and their murders and their abominations shall ye make known unto them,"},{"time":852.32,"text":"62. And ye shall teach them to abhor such wickedness and abominations and murders, And ye shall also teach them that these people were destroyed on account of their wickedness and abominations and their murders;"},{"time":863.595,"text":"63. For behold, they murdered all the prophets of the Lord which came among them to declare unto them concerning their iniquities, And the blood of those which they murdered did cry unto the Lord their God for vengeance upon those which were their murderers."},{"time":878.0,"text":"64. And thus the judgments of God did come upon these workers of darkness and secret combinations; Yea, and cursed be the land forever and ever unto those workers of darkness and secret combinations, even unto destruction, except they repent before they are fully ripe."},{"time":895.92,"text":"65. And now my son, remember the words which I have spoken unto you; Trust not those secret plans unto this people, but teach them an everlasting hatred against sin and iniquity,"},{"time":908.24,"text":"66. Preach unto them repentance and faith on the Lord Jesus Christ, Teach them to humble themselves and to be meek and lowly in heart, Teach them to withstand every temptation of the devil with their faith on the Lord Jesus Christ,"},{"time":921.92,"text":"67. Teach them to never be weary of good works, but to be meek and lowly in heart; For such shall find rest to their souls."},{"time":930.204,"text":"68. O remember, my son, and learn wisdom in thy youth, Yea, learn in thy youth to keep the commandments of God, Yea, and cry unto God for all thy support,"},{"time":942.48,"text":"69. Yea, let all thy doings be unto the Lord, And whithersoever thou goest, let it be in the Lord, Yea, let all thy thoughts be directed unto the Lord, Yea, let the affections of thy heart be placed upon the Lord forever, Counsel the Lord in all thy doings and He will direct thee for good,"},{"time":960.16,"text":"70. Yea, when thou liest down at night, lie down unto the Lord that He may watch over you in your sleep, And when thou risest in the morning, let thy heart be full of thanks unto God; And if ye always do these things, ye shall be lifted up at the last day."},{"time":976.16,"text":"71. And now, my son, I have somewhat to say concerning the thing which our fathers call a ball or director, Or our fathers called it \"liahona, \" which is, being interpreted, a \"compass, \" And the Lord prepared it;"},{"time":990.568,"text":"72. And behold, there cannot any man work after the manner of so curious a workmanship,"},{"time":997.059,"text":"73. And behold, it was prepared to show unto our fathers the course which they should travel in the wilderness. And it did work for them according to their faith in God;"},{"time":1010.435,"text":"74. Therefore, if they had faith to believe that God could cause that those spindles should point the way they should go, Behold, it was done; Therefore, they had this miracle, and also many other miracles wrought by the power of God, day by day;"},{"time":1026.094,"text":"75. Nevertheless, because those miracles were worked by small means, nevertheless it did show unto them marvelous works."},{"time":1033.615,"text":"76. They were slothful and forgot to exercise their faith and diligence, And then those marvelous works ceased and they did not progress in their journey;"},{"time":1042.68,"text":"77. Therefore, they tarried in the wilderness, or did not travel a direct course, and were afflicted with hunger and thirst because of their transgression."},{"time":1052.795,"text":"78. And now my son, I would that ye should understand that these things are not without a shadow; For as our fathers were slothful to give heed to this compass - now these things were temporal - they did not prosper, Even so it is with things which are spiritual;"},{"time":1068.133,"text":"79. For behold, it is as easy to give heed to the word of Christ, which will point to you a strait course to eternal bliss, As it was for our fathers to give heed to this compass, which would point unto them a strait course to the Promised Land."},{"time":1083.55,"text":"80. And now I say, is there not a type in this thing? For just assuredly as this director did bring our fathers, by following its course, to the Promised Land, Shall the word of Christ, if we follow its course, carry us beyond this vale of sorrow into a far better Land of Promise."},{"time":1102.467,"text":"81. O my son, do not let us be slothful because of the easiness of the way, for so was it with our fathers; For so was it prepared for them - that if they would look, they might live - even so it is with us."},{"time":1115.6,"text":"82. The way is prepared - And if we will look, we may live forever."},{"time":1120.8,"text":"83. And now my son, see that ye take care of these sacred things, Yea, see that ye look to God and live;"},{"time":1128.808,"text":"84. Go unto this people and declare the word and be sober. My son, farewell."}]
};
