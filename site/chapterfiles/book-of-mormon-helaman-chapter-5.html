<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Helaman",
  chapter: "Chapter 5",
  audioSrc: "https://archive.org/download/helaman-ch-5/Helaman%20Ch%205.mp3",
  lyrics: [{"time":0.0,"text":"Helaman Chapter 5"},{"time":8.22,"text":"1. And now it came to pass in the eighty and sixth year, the Nephites did still remain in wickedness - yea, in great wickedness - While the Lamanites did observe strictly to keep the commandments of God according to the law of Moses."},{"time":16.44,"text":"2. And it came to pass that in this year there was one, Samuel, a Lamanite, came into the Land of Zarahemla and began to preach unto the people."},{"time":27.28,"text":"3. And it came to pass that he did preach many days repentance unto the people, And they did cast him out; And he was about to return to his own land,"},{"time":36.496,"text":"4. But behold, the voice of the Lord came unto him that he should return again and prophesy unto the people whatsoever things should come into his heart."},{"time":45.14,"text":"5. And it came to pass that they would not suffer that he should enter into the city; Therefore, he went and got upon the wall thereof and stretched forth his hand, And cried with a loud voice and prophesied unto the people whatsoever things the Lord put into his heart."},{"time":62.0,"text":"6. And he said unto them: \"Behold, I, Samuel, a Lamanite, do speak the words of the Lord which He doth put into my heart; And behold, He hath put it into my heart to say unto this people that the sword of justice hangeth over this people; And four hundred years passeth not away save the sword of justice falleth upon this people -"},{"time":82.341,"text":"7. Yea, heavy destruction awaiteth this people; And it surely cometh unto this people and nothing can save this people, Save it be repentance and faith on the Lord Jesus Christ which surely shall come into the world and shall suffer many things and shall be slain for His people."},{"time":98.456,"text":"8. \"And behold, an angel of the Lord hath declared it unto me, And he did bring glad tidings to my soul;"},{"time":106.514,"text":"9. And behold, I was sent unto you to declare it unto you also, that ye might have glad tidings; But behold, ye would not receive me."},{"time":116.68,"text":"10. \"Therefore, thus saith the Lord: 'Because of the hardness of the hearts of the people of the Nephites, except they repent I will take away My word from them, And I will withdraw My Spirit from them, And I will suffer them no longer, And I will turn the hearts of their brethren against them."},{"time":133.962,"text":"11. ' And four hundred years shall not pass away before I will cause that they shall be smitten - Yea, I will visit them with the sword and with famine and with pestilence,"},{"time":144.392,"text":"12. Yea, I will visit them in My fierce anger; And there shall be those of the fourth generation which shall live of your enemies to behold your utter destruction;"},{"time":155.715,"text":"13. And this shall surely come except ye repent, ' saith the Lord, 'And those of the fourth generation shall visit your destruction."},{"time":163.209,"text":"14. 'But if ye will repent and return unto the Lord your God, I will turn away Mine anger, ' saith the Lord; 'Yea, ' thus saith the Lord, 'blessed are they who will repent and turn unto Me. 'But wo unto him that repenteth not!"},{"time":180.588,"text":"15. Yea, wo unto this great City of Zarahemla! For behold, it is because of they which are righteous that it is saved;"},{"time":190.56,"text":"16. Yea, wo unto this great city! For I perceive, ' saith the Lord, 'that there are many, yea, even the more part of this great city that will harden their hearts against Me, ' saith the Lord; 'But blessed are they who will repent, for them will I spare."},{"time":208.08,"text":"17. 'But behold, if it were not for the righteous which are in this great city, Behold, I would cause that fire should come down out of heaven and destroy it; But behold, it is for the righteous' sake that it is spared."},{"time":221.796,"text":"18. 'But behold, the time cometh, ' saith the Lord, 'that when ye shall cast out the righteous from among you, Then shall ye be ripe for destruction;"},{"time":231.52,"text":"19. Yea, wo be unto this great city because of the wickedness and abominations which are in her!"},{"time":238.0,"text":"20. 'Yea, and wo be unto the City of Gideon for the wickedness and abominations which are in her!"},{"time":245.04,"text":"21. Yea, and wo be unto all the cities which are in the land round about, which are possessed by the Nephites, because of the wickedness and abominations which are in them!"},{"time":255.6,"text":"22. 'And behold, a curse shall come upon the land, ' saith the Lord of Hosts, 'because of the people's sake-Which is upon the land, yea, because of their wickedness and their abominations."},{"time":267.92,"text":"23. 'And it shall come to pass, ' saith the Lord of Hosts, yea, our great and true God, 'That whoso shall hide up treasures in the earth shall find them again no more because of the great curse of the land, save it be a righteous man and shall hide it up unto the Lord;"},{"time":284.229,"text":"24. For I will, ' saith the Lord, 'that they shall hide up their treasures unto Me; And cursed be they who hideth not up their treasures unto Me; For none hideth up their treasures unto Me save it be the righteous;"},{"time":296.48,"text":"25. And he that hideth not up his treasure unto Me, cursed is he, and also the treasure, And none shall redeem it because of the curse of the land."},{"time":305.06,"text":"26. 'And the day shall come that they shall hide up their treasures because they have set their hearts upon riches;"},{"time":312.052,"text":"27. And because they have set their hearts upon their riches and will hide up their treasures when they shall flee before their enemies - Because they will not hide them up unto Me - cursed be they, and also their treasures; And in that day shall they be smitten, ' saith the Lord."},{"time":327.629,"text":"28. \"Behold ye, the people of this great city, and hearken unto my words; Yea, hearken unto the words which the Lord saith; For behold, He saith that ye are cursed because of your riches,"},{"time":340.456,"text":"29. And also are your riches cursed because ye have set your hearts upon them and hath not hearkened unto the words of Him who gave them unto you."},{"time":348.249,"text":"30. \"Ye do not remember the Lord your God in the things which He hath blessed you, But ye do always remember your riches - not to thank the Lord your God for them -"},{"time":359.36,"text":"31. Yea, your heart is not drawn out unto the Lord, But they do swell with great pride unto boasting and unto great swelling, envyings, strifes, malice, persecutions and murders and all manner of iniquities;"},{"time":373.2,"text":"32. For this cause hath the Lord God caused that a curse should come upon the land, and also upon your riches; And this because of your iniquities."},{"time":382.273,"text":"33. \"Yea, wo unto this people because of this time which has arrived, That ye do cast out the prophets and do mock them and cast stones at them and do slay them and do do all manner of iniquity unto them, even as they did of old time!"},{"time":397.04,"text":"34. \"And now when ye talk, ye say, 'If our days had been in the days of our fathers of old, We would not have slain the prophets; We would not have stoned them and cast them out.'"},{"time":408.72,"text":"35. \"Behold, ye are worse than they; For as the Lord liveth, if a prophet come among you and declareth unto you the word of the Lord which testifieth of your sins and iniquities, Ye are angry with him and cast him out and seek all manner of ways to destroy him;"},{"time":424.32,"text":"36. Yea, you will say that he is a false prophet and that he is a sinner and of the devil because he testifieth that your deeds are evil."},{"time":432.065,"text":"37. \"But behold, if a man shall come among you and shall say, ' Do this and there is no iniquity, do that and ye shall not suffer ' - Yea, he will say, ' Walk after the pride of your own hearts, yea, walk after the pride of your eyes and do whatsoever your heart desireth '-And if a man shall come among you and say this, Ye will receive him and ye will say that he is a prophet;"},{"time":456.029,"text":"38. Yea, ye will lift him up and ye will give unto him of your substance - Ye will give unto him of your gold and of your silver, And ye will clothe him with costly apparel -"},{"time":468.64,"text":"39. And because he speaketh flattering words unto you and he saith that all is well, And then ye will not find any fault with him."},{"time":477.294,"text":"40. \"O ye wicked and ye perverse generation! Ye hardened and ye stiff-necked people! \"How long will ye suppose that the Lord will suffer you? Yea, how long will ye suffer yourselves to be led by foolish and blind guides? Yea, how long will ye choose darkness rather than light?"},{"time":498.4,"text":"41. \"Yea, behold, the anger of the Lord is already kindled against you! Behold, He hath cursed the land because of your iniquity; And behold, the time cometh that He curseth your riches; that it becometh slippery, that ye cannot hold them;"},{"time":514.72,"text":"42. And in the days of your poverty, ye cannot retain them; And in the days of your poverty, ye shall cry unto the Lord; And in vain shall ye cry, For your desolation is already come upon you, And your destruction is made sure."},{"time":530.32,"text":"43. 'And then shall ye weep and howl in that day, ' saith the Lord of Hosts."},{"time":536.0,"text":"44. \"And then shall ye lament, and say: 'O that I had repented and had not killed the prophets and stoned them and cast them out! '"},{"time":543.864,"text":"45. \"Yea, in that day shall ye say: 'O that we had remembered the Lord our God in the day that He gave us our riches! And then they would not have become slippery, that we should lose them. 'For behold, our riches are gone from us-"},{"time":559.76,"text":"46. Behold, we layeth a tool here and on the morrow it is gone; And behold, our swords are taken from us in the day we have sought them for battle;"},{"time":571.04,"text":"47. Yea, we have hid up our treasures and they have slipped away from us because of the curse of the land."},{"time":576.842,"text":"48. 'O that we had repented in the day that the word of the Lord came unto us! For behold, the land is cursed, And all things are become slippery, And we cannot hold them."},{"time":590.4,"text":"49. 'Behold, we are surrounded by demons, Yea, we are encircled about by the angels of him who hath sought to destroy our souls;"},{"time":600.64,"text":"50. Behold, our iniquities are great! O Lord, canst Thou not turn away Thine anger from us?' \"And this shall be your language in those days."},{"time":612.0,"text":"51. \"But behold, your days of probation are past; Ye have procrastinated the day of your salvation until it is everlastingly too late and your destruction is made sure;"},{"time":623.36,"text":"52. Yea, for ye have sought all the days of your lives for that which ye could not obtain; And ye have sought for happiness in doing iniquity, Which thing is contrary to the nature of that righteousness which is in our great and Eternal Head."},{"time":636.918,"text":"53. \"O ye people of the land, that ye would hear my words! And I pray that the anger of the Lord be turned away from you! And that ye would repent and be saved!\""},{"time":648.664,"text":"54. And now it came to pass that Samuel the Lamanite did prophesy a great many more things which cannot be written."},{"time":657.04,"text":"55. And behold, he saith unto them: \"Behold, I give unto you a sign - For five years more cometh, And behold, then cometh the Son of God to redeem all those who shall believe on His name;"},{"time":670.0,"text":"56. And behold, this will I give unto you for a sign at the time of His coming - For behold, there shall be great lights in heaven, Insomuch that in the night before He cometh, there shall be no darkness, Insomuch that it shall appear unto man as if it was day;"},{"time":686.16,"text":"57. Therefore, there shall be one day and a night and a day, as if it were one day and there were no night. \"And this shall be unto you for a sign, for ye shall know of the rising of the sun, and also of its setting;"},{"time":699.779,"text":"58. Therefore, they shall know of a surety that there shall be two days and a night; Nevertheless, the night shall not be darkened; And it shall be the night before He is born."},{"time":710.249,"text":"59. \"And behold, there shall be a new star arise, such an one as ye never have beheld; And this also shall be a sign unto you."},{"time":720.345,"text":"60. \"And behold this is not all - There shall be many signs and wonders in heaven;"},{"time":725.524,"text":"61. And it shall come to pass that ye shall all be amazed and wonder, Insomuch that ye shall fall to the earth."},{"time":733.44,"text":"62. \"And it shall come to pass that whosoever shall believe on the Son of God, the same shall have everlasting life."},{"time":741.089,"text":"63. \"And behold, thus hath the Lord commanded me, by His angel, that I should come and tell this thing unto you; Yea, He hath commanded that I should prophesy these things unto you; Yea, He hath said unto me, 'Cry unto this people, Repent and prepare the way of the Lord! '"},{"time":758.828,"text":"64. \"And now because I am a Lamanite and hath spoken unto you the words which the Lord hath commanded me, And because it was hard against you, Ye are angry with me and do seek to destroy me and have cast me out from among you."},{"time":773.36,"text":"65. \"And ye shall hear my words! For, for this intent I have come up upon the walls of this city, That ye might hear and know of the judgments of God which doth await you because of your iniquities; And also that ye might know the conditions of repentance;"},{"time":784.747,"text":"66. And also that ye might know of the coming of Jesus Christ, the Son of God, the Father of heaven and of earth, the Creator of all things from the beginning; And that ye might know of the signs of His coming, to the intent that ye might believe on His name;"},{"time":804.16,"text":"67. And if ye believe on His name, ye will repent of all your sins, that thereby ye may have remission of them through His merits."},{"time":812.32,"text":"68. \"And behold, again, another sign I give unto you - yea, a sign of His death - For behold, He surely must die that salvation may come;"},{"time":823.243,"text":"69. Yea, it behooveth Him and becometh expedient that He dieth to bring to pass the resurrection of the dead, That thereby men may be brought into the presence of the Lord;"},{"time":834.053,"text":"70. Yea, behold, this death bringeth to pass the resurrection and redeemeth all mankind from the first death - that spiritual death, For all mankind - by the fall of Adam, being cut off from the presence of the Lord - are considered as dead, both as to things temporal and to things spiritual."},{"time":853.262,"text":"71. \"But behold, the resurrection of Christ redeemeth mankind - yea, even all mankind - and bringeth them back into the presence of the Lord;"},{"time":863.36,"text":"72. Yea, and it bringeth to pass the conditions of repentance, That whosoever repenteth, the same is not hewn down and cast into the fire;"},{"time":872.684,"text":"73. But whosoever repenteth not is hewn down and cast into the fire, And there cometh upon them again a spiritual death, yea, a second death, For they are cut off again as to things pertaining to righteousness."},{"time":886.843,"text":"74. \"Therefore, repent ye, repent ye! Lest by knowing these things and not doing them, ye shall suffer yourselves to come under condemnation and ye are brought down unto this second death."},{"time":899.84,"text":"75. \"But behold, as I said unto you concerning another sign - a sign of His death - Behold, in that day that He shall suffer death, the sun shall be darkened and refuse to give her light unto you, and also the moon and the stars;"},{"time":913.716,"text":"76. And there shall be no light upon the face of the land, even from the time that He shall suffer death, for the space of three days, to the time that He shall rise again from the dead."},{"time":925.482,"text":"77. \"Yea, at the time that He shall yield up the ghost, There shall be thunderings and lightnings for the space of many hours; And the earth shall shake and tremble; And the rocks which are upon the face of the earth - which are both above the earth and beneath, which ye know at this time is solid, or the more part of it is one solid mass - shall be broken up;"},{"time":945.8,"text":"78. Yea, they shall be rent in twain and shall ever after be found in seams and in cracks and in broken fragments upon the face of the whole earth, Yea, both above the earth and both beneath."},{"time":957.87,"text":"79. \"And behold, there shall be great tempests, And there shall be many mountains laid low, like unto a valley, And there shall be many places which are now called valleys which shall become mountains, whose height thereof is great;"},{"time":972.92,"text":"80. And many highways shall be broken up, And many cities shall become desolate, And many graves shall be opened and shall yield up many of their dead; And many saints shall appear unto many."},{"time":984.926,"text":"81. \"And behold, thus hath the angel spoken unto me; For he said unto me that there should be thunderings and lightnings for the space of many hours;"},{"time":994.996,"text":"82. And he said unto me that while the thunder and the lightning lasted and the tempest, that these things should be, And that darkness should cover the face of the whole earth for the space of three days."},{"time":1007.864,"text":"83. \"And the angel said unto me that many shall see greater things than these, To the intent that they might believe that these signs and these wonders should come to pass upon all the face of this land; To the intent that there should be no cause for unbelief among the children of men;"},{"time":1023.467,"text":"84. And this to the intent that whosoever will believe, might be saved, And that whosoever will not believe, a righteous judgment might come upon them; And also, if they are condemned, they bring upon themselves their own condemnation."},{"time":1037.613,"text":"85. \"And now remember, remember, my brethren, That whosoever perisheth, perisheth unto himself; And whosoever doeth iniquity, doeth it unto himself; For behold, ye are free - ye are permitted to act for yourselves; For behold, God hath given unto you a knowledge and He hath made you free -"},{"time":1057.507,"text":"86. He hath given unto you that ye might know good from evil, And He hath given unto you that ye might choose life or death; And ye can do good and be restored unto that which is good, Or have that which is good restored unto you; Or ye can do evil and have that which is evil restored unto you."},{"time":1074.475,"text":"87. \"And now my beloved brethren, Behold, I declare unto you that except ye shall repent, your houses shall be left unto you desolate; Yea, except ye repent, your women shall have great cause to mourn in the day that they shall give suck;"},{"time":1091.2,"text":"88. For ye shall attempt to flee and there shall be no place for refuge. \"Yea, and wo unto them which are with child! for they shall be heavy and cannot flee; Therefore, they shall be trodden down and shall be left to perish."},{"time":1108.164,"text":"89. \"Yea, wo unto this people which are called the people of Nephi! Except they shall repent when they shall see all those signs and wonders which shall be showed unto them;"},{"time":1119.129,"text":"90. For behold, they have been a chosen people of the Lord; Yea, the people of Nephi hath He loved; And also hath He chastened them, yea, in the days of their iniquities hath He chastened them because He loveth them."},{"time":1134.11,"text":"91. \"But behold, my brethren, the Lamanites hath He hated because their deeds have been evil continually, And this because of the iniquity of the tradition of their fathers."},{"time":1143.99,"text":"92. \"But behold, salvation hath come unto them through the preaching of the Nephites; And for this intent hath the Lord prolonged their days."},{"time":1152.462,"text":"93. \"And I would that ye should behold that the more part of them are in the path of their duty - And they do walk circumspectly before God, And they do observe to keep His commandments and His statutes and His judgments, according to the law of Moses -"},{"time":1166.808,"text":"94. Yea, I say unto you that the more part of them are doing this, And they are striving with unwearied diligence, that they may bring the remainder of their brethren to the knowledge of the truth; Therefore, there are many which do add to their numbers daily."},{"time":1182.8,"text":"95. \"And behold, ye do know of yourselves - for ye have witnessed it - That as many of them as are brought to the knowledge of the truth and to know of the wicked and abominable traditions of their fathers and are led to believe the holy scriptures,"},{"time":1196.692,"text":"96. Yea, the prophecies of the holy prophets which are written, which leadeth them to faith on the Lord and unto repentance, Which faith and repentance bringeth a change of heart unto them -"},{"time":1208.28,"text":"97. Therefore, as many as have come to this - ye know of yourselves - are firm and steadfast in the faith and in the things wherewith they have been made free."},{"time":1218.094,"text":"98. \"And ye know also that they have buried their weapons of war, And they fear to take them up lest by any means they shall sin; Yea, ye can see that they fear to sin."},{"time":1228.612,"text":"99. \"For behold, they will suffer themselves that they be trodden down and slain by their enemies and will not lift their swords against them; And this because of their faith in Christ."},{"time":1240.64,"text":"100. \"And now because of their steadfastness - when they do believe in that thing which they do believe - For because of their firmness when they are once enlightened, Behold, the Lord shall bless them and prolong their days, notwithstanding their iniquity;"},{"time":1254.4,"text":"101. Yea, even if they should dwindle in unbelief, the Lord shall prolong their days until the time shall come which hath been spoken of by our fathers - And also by the prophet Zenos, and many other prophets - Concerning the restoration of our brethren the Lamanites again, to the knowledge of the truth."},{"time":1273.84,"text":"102. \"Yea, I say unto you that in the latter times, the promises of the Lord hath been extended to our brethren the Lamanites;"},{"time":1282.88,"text":"103. And notwithstanding the many afflictions which they shall have, And notwithstanding they shall be driven to and fro upon the face of the earth and be hunted and shall be smitten and scattered abroad, having no place for refuge, The Lord shall be merciful unto them;"},{"time":1297.991,"text":"104. And this is according to the prophecy that they shall again be brought to the true knowledge - Which is knowledge of their Redeemer and their great and their true Shepherd - And be numbered among His sheep."},{"time":1310.16,"text":"105. \"Therefore, I say unto you, it shall be better for them than for you, except ye repent."},{"time":1317.28,"text":"106. \"For behold, had the mighty works been shown unto them which have been shown unto you - Yea, unto them which have dwindled in unbelief because of the traditions of their fathers - Ye can see of yourselves that they never would again have dwindled in unbelief;"},{"time":1331.28,"text":"107. 'Therefore, ' saith the Lord, 'I will not utterly destroy them, But I will cause that in the days of My wisdom, they shall return again unto Me, ' saith the Lord;"},{"time":1341.68,"text":"108. 'And now behold, ' saith the Lord concerning the people of the Nephites, 'if they will not repent and observe to do My will, I will utterly destroy them, ' saith the Lord, 'because of their unbelief, Notwithstanding the many mighty works which I have done among them; And as surely as the Lord liveth shall these things be, ' saith the Lord.\""},{"time":1361.751,"text":"109. And now it came to pass that there were many which heard the words of Samuel the Lamanite which he spake upon the walls of the city;"},{"time":1371.68,"text":"110. And as many as believed on his words went forth and sought for Nephi; And when they came forth and found him, they confessed unto him their sins and denied not, desiring that they might be baptized unto the Lord."},{"time":1384.08,"text":"111. But as many as there were which did not believe in the words of Samuel were angry with him; And they cast stones at him upon the wall, and also many shot arrows at him as he stood upon the wall;"},{"time":1394.674,"text":"112. But the Spirit of the Lord was with him, insomuch that they could not hit him with their stones, neither with their arrows."},{"time":1402.69,"text":"113. Now when they saw that they could not hit him, there were many more which did believe on his words, Insomuch that they went away unto Nephi to be baptized;"},{"time":1414.017,"text":"114. For behold, Nephi was baptizing and prophesying and preaching, crying repentance unto the people, Showing signs and wonders, working miracles among the people, That they might know that the Christ must shortly come;"},{"time":1429.2,"text":"115. Telling them of things which must shortly come, That they might know and remember at the time of their coming that they had been made known unto them beforehand, to the intent that they might believe;"},{"time":1440.375,"text":"116. Therefore, as many as believed on the words of Samuel went forth unto him to be baptized, For they came repenting and confessing their sins."},{"time":1450.88,"text":"117. But the more part of them did not believe in the words of Samuel; Therefore, when they saw that they could not hit him with their stones and their arrows, they cried out unto their captains, saying: \"Take this fellow and bind him, for behold, he hath a devil;"},{"time":1466.2,"text":"118. And because of the power of the devil which is in him, we cannot hit him with our stones and our arrows; Therefore, take him and bind him and away with him!\""},{"time":1476.411,"text":"119. And as they went forth to lay their hands on him, Behold, he did cast himself down from the wall and did flee out of their hands, yea, even unto his own country, And began to preach and to prophesy among his own people;"},{"time":1491.867,"text":"120. And behold, he was never heard of more among the Nephites. And thus were the affairs of the people;"},{"time":1499.533,"text":"121. And thus ended the eighty and sixth year of the reign of the judges over the people of Nephi."},{"time":1506.656,"text":"122. And thus ended also the eighty and seventh year of the reign of the judges - The more part of the people remaining in their pride and wickedness, And the lesser part walking more circumspectly before God."},{"time":1518.535,"text":"123. And thus were the conditions also in the eighty and eighth year of the reign of the judges."},{"time":1525.156,"text":"124. And there was but little alteration in the affairs of the people, Save it were the people began to be more hardened in iniquity and do more and more of that which was contrary to the commandments of God in the eighty and ninth year of the reign of the judges."},{"time":1539.611,"text":"125. But behold, it came to pass in the ninetieth year of the reign of the judges, there were great signs given unto the people, and wonders; And the words of the prophets began to be fulfilled;"},{"time":1551.628,"text":"126. And angels did appear unto men - wise men - and did declare unto them glad tidings of great joy; And thus in this year the scriptures began to be fulfilled."},{"time":1562.88,"text":"127. Nevertheless, the people began to harden their hearts - all, save it were the most believing part of them, both of the Nephites, and also of the Lamanites - And began to depend upon their own strength and upon their own wisdom, saying:"},{"time":1577.1,"text":"128. \"Some things they may have guessed right among so many; But behold, we know that all these great and marvelous works cannot come to pass which hath been spoken.\""},{"time":1588.411,"text":"129. And they began to reason and to contend among themselves, saying that, \"It is not reasonable that such a Being as a Christ shall come;"},{"time":1598.4,"text":"130. If so, and He be the Son of God, the Father of heaven and of earth, as it hath been spoken, Why will He not show Himself unto us, as well as unto they which shall be at Jerusalem?"},{"time":1610.08,"text":"131. Yea, why will He not show Himself in this land, as well as in the Land of Jerusalem?"},{"time":1617.28,"text":"132. \"But behold, we know that this is a wicked tradition which has been handed down unto us by our fathers to cause us that we should believe in some great and marvelous thing which should come to pass, But not among us, but in a land which is far distant, a land which we know not;"},{"time":1632.88,"text":"133. Therefore, they can keep us in ignorance, for we cannot witness with our own eyes that they are true;"},{"time":1638.616,"text":"134. And they will, by the cunning and the mysterious arts of the evil one, work some great mystery which we cannot understand, which will keep us down to be servants to their words, and also servants unto them, For we depend upon them for to teach us the word;"},{"time":1655.68,"text":"135. And thus will they keep us in ignorance if we will yield ourselves unto them all the days of our lives.\""},{"time":1662.339,"text":"136. And many more things did the people imagine up in their hearts which were foolish and vain;"},{"time":1669.318,"text":"137. And they were much disturbed, for Satan did stir them up to do iniquity continually; Yea, he did go about spreading rumors and contentions upon all the face of the land, That he might harden the hearts of the people against that which was good and against that which should come;"},{"time":1685.552,"text":"138. And notwithstanding the signs and the wonders which were wrought among the people of the Lord, and the many miracles which they did, Satan did get great hold upon the hearts of the people upon all the face of the land."},{"time":1699.086,"text":"139. And thus ended the ninetieth year of the reign of the judges over the people of Nephi."},{"time":1705.12,"text":"140. And thus ended the book of Helaman, according to the record of Helaman and his sons."}]
