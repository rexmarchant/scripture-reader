<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",
  chapter: "Chapter 9",
  audioSrc: "https://archive.org/download/3-nephi-ch-9/3%20Nephi%20Ch%209.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 9"},{"time":6.812,"text":"1. And now it came to pass that when Jesus had ascended into heaven, the multitude did disperse and every man did take his wife and his children and did return to his own home;"},{"time":13.624,"text":"2. And it was noised abroad among the people immediately, before it was yet dark, that the multitude had seen Jesus and that He had ministered unto them and that He would also show Himself on the morrow unto the multitude;"},{"time":26.64,"text":"3. Yea, and even all the night it was noised abroad concerning Jesus; And insomuch did they send forth unto the people, that there were many - yea, an exceeding great number did labor exceedingly all that night - That they might be on the morrow in the place where Jesus should show Himself unto the multitude."},{"time":44.147,"text":"4. And it came to pass that on the morrow when the multitude was gathered together, Behold, Nephi and his brother whom he had raised from the dead, whose name was Timothy, and also his son, whose name was Jonas, and also Mathoni and Mathonihah, his brother, and Kumen and Kumenonhi and Jeremiah and Shemnon and Jonas and Zedekiah and Isaiah - Now these were the names of the disciples whom Jesus had chosen -"},{"time":72.24,"text":"5. And it came to pass that they went forth and stood in the midst of the multitude;"},{"time":77.84,"text":"6. And behold, the multitude was so great that they did cause that they should be separated into twelve bodies,"},{"time":84.33,"text":"7. And the twelve did teach the multitude; But behold, they did cause that the multitude should kneel down upon the face of the earth and should pray unto the Father in the name of Jesus,"},{"time":96.446,"text":"8. And the disciples did pray unto the Father also in the name of Jesus."},{"time":102.4,"text":"9. And it came to pass that they arose and ministered unto the people;"},{"time":107.28,"text":"10. And when they had ministered those same words which Jesus had spoken, nothing varying from the words which Jesus had spoken, Behold, they knelt again and prayed to the Father in the name of Jesus; And they did pray for that which they most desired, And they desired that the Holy Ghost should be given unto them;"},{"time":125.92,"text":"11. And when they had thus prayed, they went down unto the water's edge and the multitude followed them."},{"time":131.48,"text":"12. And it came to pass that Nephi went down into the water and was baptized,"},{"time":138.08,"text":"13. And he came up out of the water and began to baptize, And he did baptize all they whom Jesus had chosen."},{"time":144.496,"text":"14. And it came to pass when they were all baptized and had come up out of the water, the Holy Ghost did fall upon them, And they were filled with the Holy Ghost and with fire;"},{"time":156.64,"text":"15. And behold, they were encircled about as if it were fire; And it came down from heaven and the multitude did witness it and do bear record; And angels did come down out of heaven and did minister unto them."},{"time":168.79,"text":"16. And it came to pass that while the angels were ministering unto the disciples, Behold, Jesus came and stood in the midst and ministered unto them."},{"time":178.693,"text":"17. And it came to pass that He spake unto the multitude and commanded them that they should kneel down again upon the earth, and also that His disciples should kneel down upon the earth."},{"time":189.507,"text":"18. And it came to pass that when they had all knelt down upon the earth, He commanded His disciples that they should pray;"},{"time":198.0,"text":"19. And behold, they began to pray, And they did pray unto Jesus, calling Him their Lord and their God."},{"time":205.76,"text":"20. And it came to pass that Jesus departed out of the midst of them and went a little way off from them and bowed Himself to the earth, And He saith: \"Father, I thank Thee that Thou hast given the Holy Ghost unto these whom I have chosen, And it is because of their belief in Me that I have chosen them out of the world;"},{"time":222.922,"text":"21. Father, I pray Thee that Thou wilt give the Holy Ghost unto all them that shall believe in their words;"},{"time":230.39,"text":"22. Father, Thou hast given them the Holy Ghost because they believed in Me, And Thou seest that they believe in Me because Thou hearest them and they pray unto Me; And they pray unto Me because I am with them;"},{"time":243.36,"text":"23. And now Father, I pray unto Thee for them, And also for all they which shall believe on their words, that they may believe in Me, that I may be in them as Thou, Father, art in Me, that we may be one.\""},{"time":256.88,"text":"24. And it came to pass that when Jesus had thus prayed unto the Father, He came unto His disciples, And behold, they did still continue without ceasing to pray unto Him; And they did not multiply many words, for it was given unto them what they should pray, And they were filled with desire."},{"time":272.935,"text":"25. And it came to pass that Jesus beheld them as they did pray unto Him, And His countenance did smile upon them, And the light of His countenance did shine upon them; And behold, they were as white as the countenance and also the garments of Jesus;"},{"time":289.28,"text":"26. And behold, the whiteness thereof did exceed all the whiteness - yea, even there could be nothing upon earth so white as the whiteness thereof."},{"time":297.52,"text":"27. And Jesus saith unto them, \"Pray on\"; Nevertheless, they did not cease to pray."},{"time":305.76,"text":"28. And He turned from them again and went a little way off and bowed Himself to the earth, And He prayed again unto the Father, saying: \"Father, I thank Thee that Thou hast purified these which I have chosen because of their faith;"},{"time":319.049,"text":"29. And I pray for them, and also for them which shall believe on their words, that they may be purified in Me through faith on their words, even as they are purified in Me;"},{"time":329.704,"text":"30. Father, I pray not for the world, But for them which Thou hast given unto Me out of the world because of their faith, that they may be purified in Me, that I may be in them as Thou, Father, art in Me, that we may be one, that I may be glorified in them.\""},{"time":345.448,"text":"31. And it came to pass that when Jesus had spake these words, He came again unto His disciples; And behold, they did pray steadfastly without ceasing unto Him; And He did smile upon them again; And behold, they were white even as Jesus."},{"time":360.535,"text":"32. And it came to pass that He went again a little way off and prayed unto the Father; And tongue cannot speak the words which He prayed, Neither can be written by man the words which He prayed;"},{"time":373.24,"text":"33. And the multitude did hear and do bear record, And their hearts were open, And they did understand in their hearts the words which He prayed;"},{"time":382.96,"text":"34. Nevertheless, so great and marvelous were the words which He prayed, that they cannot be written, Neither can they be uttered by man."},{"time":390.827,"text":"35. And it came to pass that when Jesus had made an end of praying, He came again to the disciples and saith unto them: \"So great faith have I never seen among all the Jews, Wherefore, I could not show unto them so great miracles because of their unbelief;"},{"time":406.88,"text":"36. Verily I say unto you, there are none of them that have seen so great things as ye have seen, Neither have they heard so great things as ye have heard.\""},{"time":416.025,"text":"37. And it came to pass that He commanded the multitude that they should cease to pray, and also His disciples,"},{"time":423.82,"text":"38. And He commanded them that they should not cease to pray in their hearts;"},{"time":429.141,"text":"39. And He commanded them that they should arise and stand up upon their feet, And they arose up and stood up upon their feet."},{"time":437.32,"text":"40. And it came to pass that He brake bread again and blessed it and gave to the disciples to eat;"},{"time":444.12,"text":"41. And when they had eaten, He commanded them that they should break bread and give unto the multitude;"},{"time":450.404,"text":"42. And when they had given unto the multitude, He also gave them wine to drink and commanded them that they should give unto the multitude."},{"time":458.405,"text":"43. Now there had been no bread, neither wine, brought by the disciples, neither by the multitude, But He truly gave unto them bread to eat, and also wine to drink;"},{"time":471.482,"text":"44. And He saith unto them: \"He that eateth this bread, eateth of My body to their soul, And he that drinketh of this wine, drinketh of My blood to their soul, And their soul shall never hunger nor thirst, but shall be filled.\""},{"time":484.56,"text":"45. Now when the multitude had all eaten and drank, Behold, they were filled with the Spirit; And they did cry out with one voice and gave glory to Jesus whom they both saw and heard."},{"time":496.64,"text":"46. And it came to pass that when they had all given glory unto Jesus, He saith unto them: \"Behold, now I finish the commandment which the Father hath commanded Me concerning this people which are a remnant of the house of Israel."},{"time":509.92,"text":"47. \"Ye remember that I spake unto you and said that when the words of Isaiah should be fulfilled - Behold, they are written, Ye have them before you; Therefore, search them -"},{"time":521.605,"text":"48. And verily, verily I say unto you that when they shall be fulfilled, Then is the fulfilling of the covenant which the Father hath made unto His people,"},{"time":532.72,"text":"49. O house of Israel; And then shall the remnants which shall be scattered abroad upon the face of the earth be gathered in - from the east and from the west, and from the south and from the north; And they shall be brought to the knowledge of the Lord their God who hath redeemed them;"},{"time":548.08,"text":"50. And the Father hath commanded Me that I should give unto you this land for your inheritance."},{"time":554.4,"text":"51. \"And I say unto you that if the Gentiles do not repent after the blessing which they shall receive after that they have scattered My people, Then shall ye which are a remnant of the house of Jacob go forth among them;"},{"time":565.38,"text":"52. And ye shall be in the midst of them, which shall be many; And ye shall be among them, as a lion among the beasts of the forest, and as a young lion among the flocks of sheep, Who, if he goeth through, both treadeth down and teareth in pieces, And none can deliver."},{"time":583.76,"text":"53. Thy hand shall be lifted up upon thine adversaries, And all thine enemies shall be cut off."},{"time":590.08,"text":"54. \"And I will gather My people together as a man gathereth his sheaves into the floor, For I will make My people with whom the Father hath covenanted - yea, I will make thy horn iron, And I will make thy hoofs brass;"},{"time":604.08,"text":"55. And thou shalt beat in pieces many people; And I will consecrate their gain unto the Lord, And their substance unto the Lord of the whole earth; And behold, I Am He which doeth it."},{"time":615.84,"text":"56. \"'And it shall come to pass, ' saith the Father, 'that the sword of My justice shalt hang over them at that day; And except they repent, it shall fall upon them, ' saith the Father, 'yea, even upon all the nations of the Gentiles.'"},{"time":629.5,"text":"57. \"And it shall come to pass that I will establish My people, O house of Israel."},{"time":635.148,"text":"58. And behold, this people will I establish in this land, unto the fulfilling of the covenant which I made with your father Jacob, And it shall be a New Jerusalem."},{"time":646.704,"text":"59. And the powers of heaven shall be in the midst of this people, Yea, even I will be in the midst of you."},{"time":654.33,"text":"60. \"Behold, I Am He of whom Moses spake, saying: 'A Prophet shall the Lord your God raise up unto you of your brethren like unto me; Him shall ye hear in all things whatsoever He shall say unto you."},{"time":666.692,"text":"61. And it shall come to pass that every soul which will not hear that Prophet, shall be cut off from among the people.'"},{"time":674.656,"text":"62. \"Verily I say unto you - Yea, and all the prophets from Samuel and those that follow after, as many as have spoken, have testified of Me -"},{"time":684.122,"text":"63. And behold, ye are the children of the prophets; And ye are of the house of Israel; And ye are of the covenant which the Father made with your fathers, saying unto Abraham: ' And in thy Seed shall all the kindreds of the earth be blessed '-"},{"time":700.187,"text":"64. The Father having raised Me up unto you first and sent Me to bless you in turning away every one of you from his iniquities, And this because ye are the children of the covenant."},{"time":717.133,"text":"65. \"And after that ye were blessed, then fulfilleth the Father the covenant which He made with Abraham saying: ' In thy Seed shall all the kindreds of the earth be blessed, ' Unto the pouring out of the Holy Ghost through Me upon the Gentiles, Which blessing upon the Gentiles shall make them mighty above all, Unto the scattering of My people, O house of Israel; And they shall be a scourge unto the people of this land."},{"time":734.08,"text":"66. \"Nevertheless, when they shall have received the fullness of My gospel, then if they shall harden their hearts against Me, 'I will return their iniquities upon their own heads, ' saith the Father;"},{"time":745.76,"text":"67. 'And I will remember the covenant which I have made with My people, And I have covenanted with them that I would gather them together in Mine own due time,"},{"time":754.96,"text":"68. That I would give unto them again the land of their fathers for their inheritance, Which is the Land of Jerusalem, which is the Promised Land unto them forever, ' saith the Father."},{"time":765.2,"text":"69. \"And it shall come to pass that the time cometh when the fullness of My gospel be preached unto them, And they shall believe in Me, that I Am Jesus Christ, the Son of God, And shall pray unto the Father in My name."},{"time":777.28,"text":"70. 'Then shall their watchmen lift up their voice, And with the voice together shall they sing; For they shall see eye to eye."},{"time":785.624,"text":"71. Then will the Father gather them together again, And give unto them Jerusalem for the land of their inheritance."},{"time":793.36,"text":"72. Then shall they break forth into joy! Sing together, ye waste places of Jerusalem! For the Father hath comforted His people, He hath redeemed Jerusalem."},{"time":805.36,"text":"73. The Father hath made bare His holy arm in the eyes of all the nations; And all the ends of the earth shall see the salvation of the Father; And the Father and I are one.'"},{"time":816.0,"text":"74. \"And then shall be brought to pass that which is written: 'Awake! awake again, and put on thy strength, O Zion! Put on thy beautiful garments, O Jerusalem, the holy city! For henceforth there shall no more come into thee the uncircumcised and the unclean."},{"time":836.18,"text":"75. Shake thyself from the dust - arise! Sit down, O Jerusalem! Loose thyself from the bands of thy neck, O captive daughter of Zion!"},{"time":848.64,"text":"76. For thus saith the Lord: \"Ye have sold yourselves for naught; And ye shall be redeemed without money.\""},{"time":856.16,"text":"77. ' Verily, verily I say unto you that My people shall know My name - Yea, in that day they shall know that I Am He that doth speak."},{"time":864.64,"text":"78. And then shall they say, \"How beautiful upon the mountains are the feet of Him that bringeth good tidings unto them, That publisheth peace, That bringeth good tidings unto them of good, That publisheth salvation, That saith unto Zion, 'Thy God reigneth! '\""},{"time":881.76,"text":"79. 'And then shall a cry go forth, Depart ye! Depart ye! Go ye out from thence. Touch not that which is unclean; Go ye out of the midst of her; Be ye clean that bear the vessels of the Lord."},{"time":897.2,"text":"80. For ye shall not go out with haste, nor go by flight; For the Lord will go before you, And the God of Israel shall be your rearward."},{"time":906.992,"text":"81. 'Behold, My Servant shall deal prudently - He shall be exalted and extolled and be very high."},{"time":913.48,"text":"82. As many were astonished at thee; His visage was so marred - more than any man, And His form more than the sons of men;"},{"time":922.4,"text":"83. So shall He sprinkle many nations. The kings shall shut their mouths at Him; For that which had not been told them shall they see, And that which they had not heard shall they consider.'"},{"time":933.472,"text":"84. \"Verily, verily I say unto you, all these things shall surely come, even as the Father hath commanded Me;"},{"time":941.92,"text":"85. And then shall this covenant which the Father hath covenanted with His people be fulfilled; And then shall Jerusalem be inhabited again with My people, And it shall be the land of their inheritance."},{"time":954.189,"text":"86. \"And verily I say unto you, I give unto you a sign that ye may know the time when these things shall be about to take place, That I shall gather in from their long dispersion My people, O house of Israel, And shall establish again among them My Zion."},{"time":969.067,"text":"87. \"And behold, this is the thing which I will give unto you for a sign - \"For verily I say unto you, that when these things which I deliver unto you - And which I shall deliver unto you hereafter of Myself and by the power of the Holy Ghost which shall be given unto you of the Father - Shall be made known unto the Gentiles,"},{"time":989.019,"text":"88. that they may know concerning this people which are a remnant of the house of Jacob, And concerning this My people which shall be scattered by them -"},{"time":998.0,"text":"89. \"Verily, verily I say unto you, when these things shall be made known unto them of the Father, And shall come forth of the Father from them unto you - For it is wisdom in the Father that they should be established in this land"},{"time":1011.23,"text":"90. and be set up as a free people by the power of the Father, That these things might come forth from them unto a remnant of your seed, That the covenant of the Father may be fulfilled which He hath covenanted with His people, O house of Israel -"},{"time":1025.36,"text":"91. \"Therefore, when these works, and the work which shall be wrought among you hereafter, shall come forth from the Gentiles unto your seed, which shall dwindle in unbelief because of iniquity -"},{"time":1038.8,"text":"92. For thus it behooveth the Father that it should come forth from the Gentiles, That He may show forth His power unto the Gentiles for this cause: That the Gentiles - if they will not harden their hearts - That they may repent and come unto Me and be baptized in My name and know of the true points of My doctrine, That they may be numbered among My people, O house of Israel -"},{"time":1059.76,"text":"93. \"And when these things come to pass - that thy seed shall begin to know these things - It shall be a sign unto them that they may know that the work of the Father hath already commenced, Unto the fulfilling of the covenant which He hath made unto the people which are of the house of Israel."},{"time":1074.538,"text":"94. \"And when that day shall come, it shall come to pass that kings shall shut their mouths, For that which had not been told them, shall they see, And that which they had not heard, shall they consider;"},{"time":1086.948,"text":"95. For in that day, for My sake shall the Father work a work which shall be a great and a marvelous work among them; And there shall be among them which will not believe it, although a man shall declare it unto them."},{"time":1100.088,"text":"96. \"But behold, the life of My servant shall be in My hand; Therefore, they shall not hurt him, although he shall be marred because of them,"},{"time":1110.0,"text":"97. Yet I will heal him, for I will show unto them that My wisdom is greater than the cunning of the devil."},{"time":1116.344,"text":"98. \"Therefore, it shall come to pass that whosoever will not believe in My words - which am Jesus Christ - Which the Father shall cause him to bring forth unto the Gentiles, And shall give unto him power that he shall bring them forth unto the Gentiles - it shall be done even as Moses said - They shall be cut off from among My people which are of the covenant."},{"time":1136.1,"text":"99. 'And My people which are a remnant of Jacob shall be among the Gentiles, Yea, in the midst of them, as a lion among the beasts of the forest, as a young lion among the flocks of sheep, Who, if he go through, both treadeth down and teareth in pieces, And none can deliver."},{"time":1155.44,"text":"100. Their hand shall be lifted up upon their adversaries, And all their enemies shall be cut off.'"},{"time":1161.92,"text":"101. \"Yea, wo be unto the Gentiles, except they repent! 'For it shall come to pass in that day, ' saith the Father, 'That I will cut off thy horses out of the midst of thee, And I will destroy thy chariots, And I will cut off the cities of thy land And throw down all thy strongholds."},{"time":1174.661,"text":"102. And I will cut off witchcrafts out of thy hand, And thou shalt have no more soothsayers."},{"time":1185.431,"text":"103. Thy graven images I will also cut off, And thy standing images out of the midst of thee; And thou shalt no more worship the works of thy hands;"},{"time":1196.057,"text":"104. And I will pluck up thy groves out of the midst of thee - So will I destroy thy cities."},{"time":1202.4,"text":"105. 'And it shall come to pass that all lyings and deceivings and envyings and strifes and priestcrafts and whoredoms shall be done away."},{"time":1215.9,"text":"106. For it shall come to pass, ' saith the Father, ' that at that day, whosoever will not repent and come unto My beloved Son, Them will I cut off from among My people, O house of Israel, And I will execute vengeance and fury upon them - even as upon the heathen - such as they have not heard! '"}]
};
</script>
