<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 25",
  audioSrc: "https://archive.org/download/alma-ch-25/Alma%20Ch%2025.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 25"},{"time":6.146,"text":"1. And now it came to pass in the commencement of the twenty and ninth year of the judges that Ammaron sent unto Moroni, desiring that he would exchange prisoners."},{"time":12.292,"text":"2. And it came to pass that Moroni felt to rejoice exceedingly at this request; For he desired the provisions which were imparted for the support of the Lamanite prisoners for the support of his own people, And he also desired his own people for the strengthening of his army."},{"time":28.48,"text":"3. Now the Lamanites had taken many women and children; And there was not a woman nor a child among all the prisoners of Moroni, or the prisoners which Moroni had taken;"},{"time":39.52,"text":"4. Therefore, Moroni resolved upon a stratagem to obtain as many prisoners of the Nephites from the Lamanites as it were possible; Therefore, he wrote an epistle and sent it by the servant of Ammaron, the same who had brought an epistle to Moroni."},{"time":53.52,"text":"5. Now these are the words which he wrote unto Ammaron, saying: \"Behold, Ammaron, I have written unto you somewhat concerning this war which ye have waged against my people, Or rather, which thy brother hath waged against them and which ye are still determined to carry on after his death."},{"time":72.019,"text":"6. \"Behold, I would tell you something concerning the justice of God and the sword of His almighty wrath which doth hang over you, Except ye repent and withdraw your armies into your own lands, or the lands of your possessions, which is the Land of Nephi.\"Yea, I would tell you these things if ye were capable of hearkening unto them;"},{"time":93.44,"text":"7. Yea, I would tell you concerning that awful hell which awaits to receive such murderers as thou and thy brother hath been, Except ye repent and withdraw your murderous purposes and return with your armies to your own lands."},{"time":106.778,"text":"8. \"But as ye have once rejected these things and have fought against the people of the Lord, Even so I may expect you will do it again."},{"time":116.838,"text":"9. \"And now behold, we are prepared to receive you; Yea, and except you withdraw your purposes, Behold, ye will pull down the wrath of that God whom you have rejected upon you, yea, even to your utter destruction;"},{"time":130.066,"text":"10. But, as the Lord liveth, our armies shall come upon you, except ye withdraw, And ye shall soon be visited with death; For we will retake our cities and our lands, Yea, and we will maintain our religion and the cause of our God."},{"time":146.977,"text":"11. \"But behold, it supposeth me that I talk to you concerning these things in vain, Or, it supposeth me that thou art a child of hell; Therefore, I will close my epistle by telling you that I will not exchange prisoners, Save it be on conditions that ye will deliver up a man and his wife and his children for one prisoner - If this be the case that ye will do it, I will exchange."},{"time":170.68,"text":"12. \"And behold, if ye do not this, I will come against you with my armies, Yea, even I will arm my women and my children and I will come against you; And I will follow you even into your own land, which is the land of our first inheritance; Yea, and it shall be blood for blood, yea, life for life; And I will give you battle, even until you are destroyed from off the face of the earth."},{"time":196.827,"text":"13. \"Behold, I am in my anger! And also my people! Ye have sought to murder us, And we have only sought to defend ourselves."},{"time":207.2,"text":"14. \"But behold, if ye seek to destroy us more, we will seek to destroy you; Yea, and we will seek our lands, the lands of our first inheritance."},{"time":217.027,"text":"15. \"Now I close my epistle; I am Moroni; I am a leader of the people of the Nephites.\""},{"time":228.827,"text":"16. Now it came to pass that Ammaron, when he had received this epistle, he was angry; And he wrote another epistle unto Moroni; And these are the words which he wrote, saying: \"I am Ammaron, the king of the Lamanites; I am the brother of Amalickiah whom ye have murdered."},{"time":240.627,"text":"17. \"Behold, I will avenge his blood upon you Yea, and I will come upon you with my armies for I fear not your threatenings."},{"time":249.925,"text":"18. \"For behold, your fathers did wrong their brethren, insomuch that they did rob them of their right to the government when it rightfully belonged unto them."},{"time":258.76,"text":"19. \"And now behold, if ye will lay down your arms and subject yourselves to be governed by those to whom the government doth rightly belong, Then will I cause that my people shall lay down their weapons and shall be at war no more."},{"time":273.707,"text":"20. \"Behold, ye have breathed out many threatenings against me and my people; But behold, we fear not your threatenings."},{"time":282.16,"text":"21. \"Nevertheless, I will grant to exchange prisoners according to your request, gladly, that I may preserve my food for my men of war;"},{"time":290.922,"text":"22. And we will wage a war which shall be eternal, either to the subjecting the Nephites to our authority, or to their eternal extinction!"},{"time":299.36,"text":"23. \"And as concerning that God whom ye say we have rejected, Behold, we know not such a Being; Neither do ye; But if it so be that there is such a Being, we know not but that He hath made us as well as you;"},{"time":312.927,"text":"24. And if it so be that there is a devil and a hell, Behold, will he not send you there to dwell with my brother which ye have murdered, which ye have hinted that he hath gone to such a place? But behold, these things mattereth not."},{"time":326.687,"text":"25. \"I am Ammaron and a descendant of Zoram whom your fathers pressed and brought out of Jerusalem. And behold, I am now a bold Lamanite."},{"time":340.447,"text":"26. \"Behold, this war hath been waged to avenge their wrongs and to maintain and to obtain their rights to the government; And I close my epistle to Moroni.\""},{"time":349.822,"text":"27. Now it came to pass that when Moroni had received this epistle, he was more angry because he knew that Ammaron had a perfect knowledge of his fraud - Yea, he knew that Ammaron knew that it was not a just cause that had caused him to wage a war against the people of Nephi -"},{"time":366.431,"text":"28. And he said: \"Behold, I will not exchange prisoners with Ammaron, save he will withdraw his purpose as I have stated in my epistle; For I will not grant unto him that he shall have any more power than what he hath got."},{"time":380.749,"text":"29. \"Behold, I know that place where the Lamanites doth guard my people which they have taken prisoners; And as Ammaron would not grant unto me mine epistle, Behold, I will give unto him according to my words; Yea, I will seek death among them until they shall sue for peace.\""},{"time":397.267,"text":"30. And now it came to pass that when Moroni had said these words, he caused that a search should be made among his men that perhaps he might find a man which was a descendant of Laman among them."},{"time":408.956,"text":"31. And it came to pass that they found one whose name was Laman; And he was one of the servants of the king which was murdered by Amalickiah."},{"time":418.48,"text":"32. Now Moroni caused that Laman and a small number of his men should go forth unto the guards which were over the Nephites;"},{"time":425.4,"text":"33. Now the Nephites were guarded in the City of Gid; Therefore, Moroni caused that Laman and a small number of men, which was appointed, to go with him."},{"time":436.64,"text":"34. And it came to pass that when it was evening, Laman went to the guards which were over the Nephites, And behold, they saw him coming and they hailed him;"},{"time":446.08,"text":"35. But he saith unto them: \"Fear not - Behold, I am a Lamanite; Behold, we have escaped from the Nephites and they sleepeth; And behold, we have taken of their wine and brought with us.\""},{"time":459.261,"text":"36. Now when the Lamanites heard these words, they received him with joy; And they said unto him: \"Give us of your wine that we may drink; We are glad that ye have thus taken wine with you, for we are weary.\""},{"time":472.288,"text":"37. But Laman saith unto them: \"Let us keep of our wine till we go against the Nephites to battle.\" But this saying only made them more desirous to drink of the wine;"},{"time":483.609,"text":"38. For, said they: \"We are weary, therefore, let us take of the wine, And by and by we shall receive wine for our rations which will strengthen us to go against the Nephites.\" And Laman saith unto them: \"You may do according to your desires.\""},{"time":500.64,"text":"39. And it came to pass that they did take of the wine freely, And it was pleasant to their taste; Therefore, they took of it more freely; And it was strong, having been prepared in its strength."},{"time":512.32,"text":"40. And it came to pass they did drink and were merry; And by and by they were all drunken."},{"time":518.64,"text":"41. And now when Laman and his men saw that they were all drunken and were in a deep sleep, they returned to Moroni and told him all the things that had happened; And now this was according to the design of Moroni."},{"time":531.5,"text":"42. And Moroni had prepared his men with weapons of war; And he went to the City Gid while the Lamanites were in a deep sleep and drunken, And cast in the weapons of war in unto the prisoners, insomuch that they were all armed, Yea, even to their women and all those of their children - as many as were able to use a weapon of war - when Moroni had armed all those prisoners;"},{"time":553.72,"text":"43. And all those things were done in a profound silence; But had they awakened the Lamanites, Behold, they were drunken and the Nephites could have slain them."},{"time":564.206,"text":"44. But behold, this was not the desire of Moroni; He did not delight in murder or bloodshed, But he delighted in the saving of his people from destruction; And for this cause he might not bring upon him injustice, he would not fall upon the Lamanites and destroy them in their drunkenness."},{"time":580.231,"text":"45. But he had obtained his desire, for he had armed those prisoners of the Nephites which were within the walls of the city, And had given them power to gain possession of those parts which were within the walls;"},{"time":592.816,"text":"46. And then he caused the men which were with him to withdraw a pace from them and surround the armies of the Lamanites;"},{"time":600.833,"text":"47. Now behold, this was done in the nighttime so that when the Lamanites awoke in the morning, they beheld that they were surrounded by the Nephites without and that their prisoners were armed within."},{"time":612.693,"text":"48. And thus they saw that the Nephites had power over them; And in these circumstances, they found that it was not expedient that they should fight with the Nephites;"},{"time":622.491,"text":"49. Therefore, their chief captains demanded their weapons of war, And they brought them forth and cast them at the feet of the Nephites, pleading for mercy. Now behold, this was the desire of Moroni;"},{"time":636.2,"text":"50. He took them prisoners of war and took possession of the city, And caused that all the prisoners should be liberated, which were Nephites; And they did join the army of Moroni and were a great strength to his army."},{"time":649.744,"text":"51. And it came to pass that he did cause the Lamanites which he had taken prisoners, that they should commence a labor in strengthening the fortifications round about the City Gid."},{"time":659.653,"text":"52. And it came to pass that when he had fortified the City Gid according to his desires, he caused that his prisoners should be taken to the City Bountiful;"},{"time":669.755,"text":"53. And he also guarded that city with an exceeding strong force."},{"time":673.807,"text":"54. And it came to pass that they did - notwithstanding all the intrigues of the Lamanites - keep and protect all the prisoners which they had taken, And also maintain all the ground and the advantage which they had retaken."},{"time":686.964,"text":"55. And it came to pass that the Nephites began again to be victorious and to reclaim their rights and their privileges."},{"time":695.2,"text":"56. Many times did the Lamanites attempt to encircle them about by night, but in these attempts they did lose many prisoners."},{"time":702.196,"text":"57. And many times did they attempt to administer of their wine to the Nephites that they might destroy them with poison or with drunkenness."},{"time":711.46,"text":"58. But behold, the Nephites were not slow to remember the Lord their God in this, their times of affliction;"},{"time":718.244,"text":"59. They could not be taken in their snares, Yea, they would not partake of their wine, Yea, they would not take of wine, save they had firstly given to some of the Lamanite prisoners;"},{"time":730.12,"text":"60. And they were thus cautious that no poison should be administered among them; For if their wine would poison a Lamanite, it would also poison a Nephite; And thus they did try all their liquors."},{"time":741.84,"text":"61. And now it came to pass that it was expedient for Moroni to make preparations to attack the City Morionton;"},{"time":749.48,"text":"62. For behold, the Lamanites had by their labors fortified the City Morionton until it had become an exceeding stronghold; And they were continually bringing new forces into that city, and also new supplies of provisions."},{"time":763.86,"text":"63. And thus ended the twenty and ninth year of the reign of the judges over the people of Nephi."}]
};
