h was established in the Valley of Gideon, According to the revelation of the truth of the word which had been spoken by his fathers,"},{"time":114.611,"text":"10. And according to the spirit of prophecy which was in him, According to the testimony of Jesus Christ, the Son of God, which should come for to redeem His people from their sins, And the holy order by which he was called. And thus it is written. Amen."}]
