<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "Alma",
  chapter: "Chapter 12",
  audioSrc: "https://archive.org/download/alma-ch-12/Alma%20Ch%2012.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 12"},{"time":7.747,"text":"1. And now it came to pass that as Alma was journeying from the Land of Gideon southward, away to the Land of Manti, Behold, to his astonishment, he met the sons of Mosiah a journeying toward the Land of Zarahemla."},{"time":15.493,"text":"2. Now these sons of Mosiah were with Alma at the time the angel first appeared unto him, therefore, Alma did rejoice exceedingly to see his brethren;"},{"time":26.56,"text":"3. And what added more to his joy, they were still his brethren in the Lord, yea, and they had waxed strong in the knowledge of the truth,"},{"time":34.8,"text":"4. For they were men of a sound understanding and they had searched the scriptures diligently, that they might know the word of God."},{"time":42.951,"text":"5. But this is not all - They had given themselves to much prayer and fasting, Therefore, they had the spirit of prophecy and the spirit of revelation, And when they taught, they taught with power and authority, even as with the power and authority of God."},{"time":58.372,"text":"6. And they had been teaching the word of God for the space of fourteen years among the Lamanites, having had much success in bringing many to the knowledge of the truth;"},{"time":68.192,"text":"7. Yea, by the power of their words many were brought before the altar of God to call on His name and confess their sins before Him."},{"time":77.52,"text":"8. Now these are the circumstances which attended them in their journeyings, for they had many afflictions -"},{"time":84.213,"text":"9. They did suffer much, both in body and in mind, such as hunger, thirst and fatigue, And also much labor in the spirit."},{"time":94.142,"text":"10. Now these were their journeyings, Having taken leave of their father Mosiah in the first year of the reign of the judges, Having refused the kingdom which their father was desirous to confer upon them, and also this was the minds of the people;"},{"time":108.905,"text":"11. Nevertheless, they departed out of the Land of Zarahemla and took their swords and their spears and their bows and their arrows and their slings;"},{"time":116.96,"text":"12. And this they did that they might provide food for themselves while in the wilderness;"},{"time":124.16,"text":"13. And thus they departed into the wilderness with their numbers which they had selected, to go up to the Land of Nephi to preach the word of God unto the Lamanites."},{"time":134.4,"text":"14. And it came to pass that they journeyed many days in the wilderness; And they fasted much and prayed much, that the Lord would grant unto them a portion of His Spirit to go with them and abide with them,"},{"time":144.888,"text":"15. That they might be an instrument in the hands of God to bring, if it were possible, their brethren the Lamanites to the knowledge of the truth,"},{"time":153.95,"text":"16. To the knowledge of the baseness of the traditions of their fathers, which were not correct."},{"time":159.547,"text":"17. And it came to pass that the Lord did visit them with His Spirit and said unto them: \"Be comforted\"; And they were comforted."},{"time":168.4,"text":"18. And the Lord said unto them also: \"Go forth among the Lamanites, thy brethren, and establish My word;"},{"time":176.64,"text":"19. Yet ye shall be patient in longsuffering and afflictions, that ye may show forth good examples unto them in Me, And I will make an instrument of thee in My hands unto the salvation of many souls.\""},{"time":189.2,"text":"20. And it came to pass that the hearts of the sons of Mosiah, and also those which were with them, took courage to go forth unto the Lamanites to declare unto them the word of God."},{"time":200.56,"text":"21. And it came to pass when they had arrived in the borders of the land of the Lamanites, That they separated themselves and departed one from another, trusting in the Lord that they should meet again at the close of their harvest, For they supposed that great was the work which they had undertaken."},{"time":215.333,"text":"22. And assuredly it was great, for they had undertaken to preach the word of God to a wild and a hardened and a ferocious people, A people which delighted in murdering the Nephites, and robbing and plundering them;"},{"time":228.858,"text":"23. And their hearts were set upon riches, or upon gold and silver and precious stones,"},{"time":234.985,"text":"24. Yet they sought to obtain these things by murdering and plundering, that they might not labor for them with their own hands."},{"time":244.213,"text":"25. Thus they were a very indolent people, many of whom did worship idols; And the curse of God had fallen upon them because of the traditions of their fathers, Notwithstanding the promises of the Lord were extended unto them on the conditions of repentance."},{"time":257.976,"text":"26. Therefore, this was the cause for which the sons of Mosiah had undertaken the work: That perhaps they might bring them unto repentance, That perhaps they might bring them to know of the plan of redemption;"},{"time":270.703,"text":"27. Therefore, they separated themselves one from another and went forth among them, every man alone, according to the word and power of God which was given unto him."},{"time":282.4,"text":"28. Now Ammon being the chief among them, or rather he did minister unto them, And he departed from them after having blessed them according to their several stations, having imparted the word of God unto them, or administered unto them before his departure; And thus they took their several journeys throughout the land."},{"time":299.049,"text":"29. And Ammon went to the Land of Ishmael, the land being called after the sons of Ishmael which also became Lamanites."},{"time":307.72,"text":"30. And as Ammon entered the Land of Ishmael, the Lamanites took him and bound him, as was their custom to bind all the Nephites which fell into their hands and carry them before the king;"},{"time":318.88,"text":"31. And thus it was left to the pleasure of the king - to slay them, or to retain them in captivity, or to cast them into prison, or to cast them out of his land - according to his will and pleasure."},{"time":331.04,"text":"32. And thus Ammon was carried before the king which was over the Land of Ishmael; And his name was Lamoni, And he was a descendant of Ishmael."},{"time":341.44,"text":"33. And the king inquired of Ammon if it were his desires to dwell in the land among the Lamanites, or among his people."},{"time":348.48,"text":"34. And Ammon said unto him: \"Yea, I desire to dwell among this people for a time, yea, and perhaps until the day I die.\""},{"time":357.76,"text":"35. And it came to pass that King Lamoni was much pleased with Ammon and caused that his bands should be loosed; And he would that Ammon should take one of his daughters to wife."},{"time":367.127,"text":"36. But Ammon saith unto him: \"Nay, but I will be thy servant\"; Therefore, Ammon became a servant to King Lamoni."},{"time":376.493,"text":"37. And it came to pass that he was set among other servants to watch the flocks of Lamoni according to the custom of the Lamanites."},{"time":385.92,"text":"38. And it came to pass that after he had been in the service of the king three days, that as he was with the Lamanitish servants a going forth with their flocks to the place of water which was called the Waters of Sebus - and all the Lamanites drive their flocks hither that they might have water -"},{"time":401.106,"text":"39. Therefore, as Ammon and the servants of the king were driving forth their flocks to this place of water, Behold, a certain number of the Lamanites who had been with their flocks to water stood and scattered the flocks of Ammon and the servants of the king; And they scattered them insomuch that they fled many ways."},{"time":419.495,"text":"40. Now the servants of the king began to murmur, saying: \"Now the king will slay us as he has our brethren because their flocks were scattered by the wickedness of these men.\""},{"time":429.975,"text":"41. And they began to weep exceedingly, saying: \"Behold, our flocks are scattered already.\""},{"time":436.16,"text":"42. Now they wept because of the fear of being slain;"},{"time":440.96,"text":"43. Now when Ammon saw this, his heart was swollen within him with joy, for, said he: \"I will show forth my power unto these my fellow servants, or the power which is in me, in restoring these flocks unto the king, That I may win the hearts of these my fellow servants, That I may lead them to believe in my words.\""},{"time":460.029,"text":"44. Now these were the thoughts of Ammon when he saw the affliction of those which he termed to be his brethren."},{"time":467.507,"text":"45. And it came to pass that he flattered them by his words, saying: \"My brethren, be of good cheer and let us go in search of the flocks, And we will gather them together and bring them back unto the place of water,"},{"time":480.976,"text":"46. And thus we will preserve the flocks unto the king and he will not slay us.\""},{"time":486.118,"text":"47. And it came to pass that they went in search of the flocks and they did follow Ammon, And they rushed forth with much swiftness and did head the flocks of the king and did gather them together again to the place of water."},{"time":499.48,"text":"48. And those men again stood to scatter their flocks; But Ammon saith unto his brethren: \"Encircle the flocks round about, that they flee not; And I go and contend with these men which do scatter our flocks.\""},{"time":512.498,"text":"49. Therefore, they did as Ammon commanded them; And he went forth and stood to contend with those which stood by the Waters of Sebus;"},{"time":525.597,"text":"50. And they were not in number a very few, therefore, they did not fear Ammon, For they supposed that one of their men could slay him according to their pleasure, For they knew not that the Lord had promised Mosiah that he would deliver his sons out of their hands, Neither did they know anything concerning the Lord;"},{"time":538.695,"text":"51. Therefore, they delighted in the destruction of their brethren, And for this cause they stood to scatter the flocks of the king."},{"time":546.64,"text":"52. But Ammon stood forth and began to cast stones at them with his sling, yea, with mighty power he did sling stones amongst them;"},{"time":554.32,"text":"53. And thus he slew a certain number of them insomuch that they began to be astonished at his power;"},{"time":561.845,"text":"54. Nevertheless, they were angry because of the slain of their brethren and they were determined that he should fall;"},{"time":569.52,"text":"55. Therefore, seeing that they could not hit him with their stones, they came forth with clubs to slay him."},{"time":577.299,"text":"56. But behold, every man that lifted his club to smite Ammon, he smote off their arms with his sword,"},{"time":584.602,"text":"57. For he did withstand their blows by smiting their arms with the edge of his sword, insomuch that they began to be astonished and began to flee before him,"},{"time":593.832,"text":"58. yea, and they were not few in number, And he caused them to flee by the strength of his arm -"},{"time":600.736,"text":"59. Now six of them had fallen by the sling, but he slew none save it were their leader - And he smote off as many of their arms as were lifted against him, and they were not a few."},{"time":612.56,"text":"60. And when he had driven them afar off, he returned; And they watered their flocks and returned them to the pasture of the king, And then went in unto the king, bearing the arms which had been smote off by the sword of Ammon of those who sought to slay him;"},{"time":627.124,"text":"61. And they were carried in unto the king for a testimony of the things which they had done."},{"time":632.8,"text":"62. And it came to pass that King Lamoni caused that his servants should stand forth and testify to all the things which they had seen concerning the matter."},{"time":641.8,"text":"63. And when they had all testified to the things which they had seen, And he had learned of the faithfulness of Ammon in preserving his flocks, And also of his great power in contending against those who sought to slay him, He was astonished exceedingly and saith: \"Surely this is more than a man;"},{"time":659.722,"text":"64. Behold, is not this the Great Spirit which doth send such great punishments upon this people because of their murders?\""},{"time":667.605,"text":"65. And they answered the king and said: \"Whether he be the Great Spirit or a man, we know not; But this much we do know, that he cannot be slain by the enemies of the king,"},{"time":679.253,"text":"66. Neither can they scatter the king's flocks when he is with us because of his expertness and great strength; Therefore, we know that he is a friend to the king;"},{"time":688.8,"text":"67. And now, O king, we do not believe that a man hath such great power, for we know that he cannot be slain.\""},{"time":697.44,"text":"68. And now when the king heard these words, he said unto them: \"Now I know that it is the Great Spirit, And he hath come down at this time to preserve your lives, that I might not slay you as I did your brethren;"},{"time":710.64,"text":"69. Now this is the Great Spirit of which our fathers have spoken.\""},{"time":714.942,"text":"70. Now this was the tradition of Lamoni which he had received from his father, that there was a Great Spirit;"},{"time":723.104,"text":"71. Notwithstanding they believed in a Great Spirit, they supposed that whatsoever they did was right."},{"time":730.126,"text":"72. Nevertheless, Lamoni began to fear exceedingly with fear, lest he had done wrong in slaying his servants,"},{"time":737.36,"text":"73. For he had slain many of them because their brethren had scattered their flocks at the place of water; And thus, because they had had their flocks scattered, they were slain."},{"time":747.162,"text":"74. Now it was the practice of the Lamanites to stand by the Waters of Sebus to scatter the flocks of the people, That thereby they might drive away many that were scattered unto their own land, it being a practice of plunder among them."},{"time":761.288,"text":"75. And it came to pass that King Lamoni inquired of his servants, saying: \"Where is this man that hath such great power?\""},{"time":770.48,"text":"76. And they saith unto him: \"Behold, he is feeding thy horses.\""},{"time":775.92,"text":"77. Now the king had commanded his servants previous to the time of the watering of their flocks that they should prepare his horses and his chariots and conduct him forth to the Land of Nephi,"},{"time":787.04,"text":"78. For there had been a great feast appointed at the Land of Nephi by the father of Lamoni, who was king over all the land."},{"time":794.867,"text":"79. Now when King Lamoni heard that Ammon was preparing his horses and his chariots, he was more astonished because of the faithfulness of Ammon, saying:"},{"time":805.44,"text":"80. \"Surely there has not been any servant among all my servants that has been so faithful as this man, for even he doth remember all my commandments to execute them;"},{"time":815.158,"text":"81. Now I surely know that this is the Great Spirit; And I would desire him that he come in unto me, but I durst not.\""},{"time":823.665,"text":"82. And it came to pass that when Ammon had made ready the horses and the chariots for the king and his servants, he went in unto the king and he saw that the countenance of the king was changed; Therefore, he was about to return out of his presence,"},{"time":837.511,"text":"83. And one of the king's servants said unto him: \"Rabbanah\"-which is, being interpreted, \"powerful\" or \"great king, \" considering their kings to be powerful -"},{"time":848.04,"text":"84. And thus he said unto him: \"Rabbanah, the king desireth thee to stay.\""},{"time":853.76,"text":"85. Therefore, Ammon turned himself unto the king and saith unto him: \"What wilt thou that I should do for thee, O king?\""},{"time":860.341,"text":"86. And the king answered him not for the space of an hour according to their time, for he knew not what he should say unto him."},{"time":869.01,"text":"87. And it came to pass that Ammon said unto him again: \"What desirest thou of me?\" But the king answered him not."},{"time":876.952,"text":"88. And it came to pass that Ammon, being filled with the Spirit of God, therefore, he perceived the thoughts of the king,"},{"time":890.398,"text":"89. And he saith unto him: \"Is it because that thou hast heard that I defended thy servants and thy flocks and slew seven of their brethren with the sling and with the sword and smote off the arms of others in order to defend thy flocks and thy servants? Behold, is it this that causeth thy marvelings?"},{"time":903.845,"text":"90. \"I say unto you, what is it, that thy marvelings are so great?"},{"time":910.64,"text":"91. \"Behold, I am a man and am thy servant; Therefore, whatsoever thou desirest which is right, that will I do.\""},{"time":918.773,"text":"92. Now when the king had heard these words, he marveled again, for he beheld that Ammon could discern his thoughts."},{"time":926.656,"text":"93. But notwithstanding this, King Lamoni did open his mouth and said unto him: \"Who art thou? Art thou that Great Spirit which knows all things?\""},{"time":937.12,"text":"94. Ammon answered and said unto him: \"I am not.\""},{"time":940.36,"text":"95. And the king saith: \"How knowest thou the thoughts of my heart?"},{"time":944.735,"text":"96. Thou mayest speak boldly and tell me concerning these things; And also tell me by what power ye slew and smote off the arms of my brethren that scattered my flocks."},{"time":956.72,"text":"97. \"And now, if thou wilt tell me concerning these things, whatsoever thou desirest I will give unto thee;"},{"time":963.68,"text":"98. And if it were needed, I would guard thee with my armies, but I know that thou art more powerful than all they, Nevertheless, whatsoever thou desirest of me, I will grant it unto thee.\""},{"time":978.0,"text":"99. Now Ammon being wise, yet harmless, he saith unto Lamoni: \"Wilt thou hearken unto my words if I tell thee by what power I do these things? And this is the thing that I desire of thee.\""},{"time":990.88,"text":"100. And the king answered him and said: \"Yea, I will believe all thy words\"; And thus he was caught with guile."},{"time":998.245,"text":"101. And Ammon began to speak unto him with boldness and said unto him: \"Believest thou that there is a God?\""},{"time":1006.366,"text":"102. And he answered and said unto him: \"I do not know what that meaneth.\""},{"time":1012.534,"text":"103. And then Ammon saith: \"Believest thou that there is a Great Spirit?\""},{"time":1018.703,"text":"104. And he saith: \"Yea.\""},{"time":1020.225,"text":"105. And Ammon saith: \"This is God.\""},{"time":1027.803,"text":"106. And Ammon saith unto him again: \"Believest thou that this Great Spirit, which is God, created all things which are in heaven and in the earth?\""},{"time":1033.924,"text":"107. And he saith: \"Yea, I believe that He created all things which are in the earth, but I do not know the heavens.\""},{"time":1037.661,"text":"108. And Ammon saith unto him: \"The heavens is a place where God dwells and all His holy angels.\""},{"time":1043.401,"text":"109. And King Lamoni saith: \"Is it above the earth?\""},{"time":1052.8,"text":"110. And Ammon saith: \"Yea, and He looketh down upon all the children of men; And He knows all the thoughts and intents of the heart, for by His hand were they all created from the beginning.\""},{"time":1064.203,"text":"111. And King Lamoni saith: \"I believe all these things which thou hast spoken; Art thou sent from God?\""},{"time":1077.725,"text":"112. Ammon saith unto him: \"I am a man, And man in the beginning was created after the image of God; And I am called by His Holy Spirit to teach these things unto this people, that they may be brought to a knowledge of that which is just and true;"},{"time":1087.24,"text":"113. And a portion of that Spirit dwelleth in me which giveth me knowledge, and also power, according to my faith and desires which are in God.\""},{"time":1097.36,"text":"114. Now when Ammon had said these words, he began to the creation of the world, and also to the creation of Adam, And told him all the things concerning the fall of man;"},{"time":1108.96,"text":"115. And rehearsed and laid before him the records and the holy scriptures of the people, and which had been spoken by the prophets, even down to the time that their father Lehi left Jerusalem."},{"time":1119.111,"text":"116. And he also rehearsed unto them - for it was unto the king and to his servants - all the journeyings of their fathers in the wilderness, And all their sufferings with hunger and thirst and their travail, etc."},{"time":1132.528,"text":"117. And he also rehearsed unto them concerning the rebellions of Laman and Lemuel and the sons of Ishmael, Yea, all their rebellions did he relate unto them."},{"time":1143.44,"text":"118. And he expounded unto them all the records and scriptures from the time that Lehi left Jerusalem down to the present time."},{"time":1150.907,"text":"119. But this is not all - For he expounded unto them the plan of redemption which was prepared from the foundation of the world;"},{"time":1159.605,"text":"120. And he also made known unto them concerning the coming of Christ; And all the works of the Lord did he make known unto them."},{"time":1166.827,"text":"121. And it came to pass that after he had said all these things and expounded them to the king, that the king believed all his words."},{"time":1176.16,"text":"122. And he began to cry unto the Lord, saying: \"O Lord, have mercy! According to Thy abundant mercy, which Thou hast had upon the people of Nephi, have upon me and my people!\""},{"time":1188.858,"text":"123. And now when he had said this, he fell unto the earth as if he were dead."},{"time":1194.21,"text":"124. And it came to pass that his servants took him and carried him in unto his wife and laid him upon a bed; And he lay as if he were dead for the space of two days and two nights;"},{"time":1205.913,"text":"125. And his wife and his sons and his daughters mourned over him after the manner of the Lamanites, greatly lamenting his loss."},{"time":1213.12,"text":"126. And it came to pass that after two days and two nights, They were about to take his body and lay it in a sepulcher which they had made for the purpose of burying their dead."},{"time":1224.708,"text":"127. Now the queen, having heard of the fame of Ammon, Therefore, she sent and desired that he should come in unto her."},{"time":1232.64,"text":"128. And it came to pass that Ammon did as he was commanded and went in unto the queen and desired to know what she would that he should do."},{"time":1241.509,"text":"129. And she saith unto him: \"The servants of my husband have made it known unto me that thou art a prophet of a Holy God and that thou hast power to do many mighty works in His name;"},{"time":1250.377,"text":"130. Therefore, if this is the case, I would that ye should go in and see my husband, for he has been laid upon his bed for the space of two days and two nights;"},{"time":1261.544,"text":"131. And some say that he is not dead, But others say that he is dead and that he stinketh and that he ought to be placed in the sepulcher; But as for myself, to me he doth not stink.\""},{"time":1273.271,"text":"132. Now this was what Ammon desired, for he knew that King Lamoni was under the power of God;"},{"time":1279.872,"text":"133. He knew that the dark veil of unbelief being cast away from his mind, And the light which did light up his mind, which was the light of the glory of God which was a marvelous light of His goodness -"},{"time":1292.529,"text":"134. Yea, this light had infused such joy into his soul, the cloud of darkness having been dispelled - And the light of everlasting light was lit up in his soul,"},{"time":1302.808,"text":"135. Yea, he knew that this had overcome his natural frame and he was carried away in God; Therefore, what the queen desired of him was his only desire."},{"time":1314.019,"text":"136. Therefore, he went in to see the king according as the queen had desired him; And he saw the king and he knew that he was not dead."},{"time":1322.108,"text":"137. And he saith unto the queen: \"He is not dead, but he sleepeth in God and on the morrow he shall rise again, Therefore, bury him not.\""},{"time":1332.635,"text":"138. And Ammon saith unto her: \"Believest thou this?\""},{"time":1337.04,"text":"139. And she said unto him: \"I have had no witness, save thy word and the word of our servants, Nevertheless, I believe that it shall be according as thou hast said.\""},{"time":1347.816,"text":"140. And Ammon said unto her: \"Blessed art thou because of thy exceeding faith; I say unto thee woman, there has not been such great faith among all the people of the Nephites.\""},{"time":1357.968,"text":"141. And it came to pass that she watched over the bed of her husband from that time even until that time on the morrow which Ammon had appointed that he should rise."},{"time":1367.176,"text":"142. And it came to pass that he arose according to the words of Ammon; And as he arose, he stretched forth his hand unto the woman and said: \"Blessed be the name of God! and blessed art thou,"},{"time":1380.48,"text":"143. For as sure as thou livest, behold, I have seen my Redeemer! And He shall come forth and be born of a woman, And He shall redeem all mankind who believe on His name.\""},{"time":1392.536,"text":"144. Now when he had said these words, his heart was swollen within him and he sunk again with joy; And the queen also sank down, being overpowered by the Spirit."},{"time":1403.242,"text":"145. Now Ammon seeing the Spirit of the Lord poured out according to his prayers upon the Lamanites, his brethren, which had been the cause of so much mourning among the Nephites, or among all the people of God because of their iniquities and their traditions,"},{"time":1420.32,"text":"146. And Ammon fell upon his knees and began to pour out his soul in prayer and thanksgiving to God for what He had done for his brethren;"},{"time":1428.384,"text":"147. And he was also overpowered with joy; And thus they all three had sunk to the earth."},{"time":1434.182,"text":"148. Now when the servants of the king had seen that they had fallen, they also began to cry unto God, for the fear of the Lord had come upon them also,"},{"time":1444.48,"text":"149. For it was they which had stood before the king and testified unto him concerning the great power of Ammon."},{"time":1450.56,"text":"150. And it came to pass that they did call on the name of the Lord in their might, even until they had all fallen to the earth, Save it were one of the Lamanitish women whose name was Abish, she having been converted unto the Lord for many years on account of a remarkable vision of her father, Thus having been converted to the Lord, never had made it known."},{"time":1471.986,"text":"151. Therefore, when she saw that all the servants of Lamoni had fallen to the earth, and also her mistress, the queen, And the king and Ammon lay prostrate upon the earth, She knew that it was the power of God;"},{"time":1483.765,"text":"152. And supposing that this opportunity, by making known unto the people what had happened among them, that by beholding this scene it would cause them to believe in the power of God,"},{"time":1495.68,"text":"153. Therefore, she ran forth from house to house, making it known unto the people; And they began to assemble themselves together unto the house of the king."},{"time":1504.844,"text":"154. And there came a multitude; And to their astonishment they beheld the king and the queen and their servants prostrate upon the earth; And they all lay there as though they were dead;"},{"time":1516.198,"text":"155. And they also saw Ammon, And behold, he was a Nephite."},{"time":1520.622,"text":"156. And now the people began to murmur among themselves, Some saying that it was a great evil that had come upon them, or upon the king and his house because he had suffered that the Nephite should remain in the land."},{"time":1534.0,"text":"157. But others rebuked them, saying: \"The king hath brought this evil upon his house because he slew his servants who had had their flocks scattered at the Waters of Sebus.\""},{"time":1543.627,"text":"158. And they were also rebuked by those men which had stood at the Waters of Sebus and scattered the flocks which belonged to the king,"},{"time":1552.493,"text":"159. For they were angry with Ammon because of the number which he had slain of their brethren at the Waters of Sebus while defending the flocks of the king."},{"time":1560.56,"text":"160. Now one of them whose brother had been slain with the sword of Ammon, being exceeding angry with Ammon, drew his sword and went forth that he might let it fall upon Ammon to slay him; And as he lifted the sword to smite him, behold, he fell dead."},{"time":1575.6,"text":"161. Now we see that Ammon could not be slain, for the Lord had said unto Mosiah, his father: \"I will spare him and it shall be unto him according to thy faith\"; Therefore, Mosiah trusted him unto the Lord."},{"time":1587.676,"text":"162. And it came to pass that when the multitude beheld that the man had fallen dead who lifted the sword to slay Ammon, fear came upon them all, And they durst not put forth their hands to touch him or any of those which had fallen."},{"time":1603.272,"text":"163. And they began to marvel again among themselves what could be the cause of this great power, or what all these things could mean."},{"time":1612.08,"text":"164. And it came to pass that there were many among them who said that Ammon was the Great Spirit; And others said he was sent by the Great Spirit;"},{"time":1620.8,"text":"165. But others rebuked them all, saying that, \"He was a monster which hath been sent from the Nephites to torment us\";"},{"time":1628.32,"text":"166. And there were some which said that Ammon was sent by the Great Spirit to afflict them because of their iniquities, And that it was the Great Spirit that had always attended the Nephites, which had even delivered them out of their hands,"},{"time":1640.762,"text":"167. And they said that it was this Great Spirit which had destroyed so many of their brethren, the Lamanites; And thus the contention began to be exceeding sharp among them."},{"time":1651.685,"text":"168. And while they were thus contending, the woman servant, which had caused the multitude to be gathered together, came; And when she saw the contention which was among the multitude, she was exceeding sorrowful, even unto tears."},{"time":1666.48,"text":"169. And it came to pass that she went and took the queen by the hand, that perhaps she might raise her from the ground; And as soon as she touched her hand, she arose and stood upon her feet and cried with a loud voice, saying:"},{"time":1679.44,"text":"170. \"O blessed Jesus who has saved me from an awful hell! O blessed God, have mercy on this people!\""},{"time":1688.88,"text":"171. And when she had said this, she clapped her hands, being filled with joy, speaking many words which were not understood."},{"time":1696.673,"text":"172. And when she had done this, she took the king, Lamoni, by the hand and behold, he arose and stood upon his feet;"},{"time":1706.7,"text":"173. And he immediately, seeing the contention among his people, went forth and began to rebuke them and to teach them the words which he had heard from the mouth of Ammon; And as many as heard his words believed and were converted unto the Lord;"},{"time":1720.507,"text":"174. But there were many among them who would not hear his words, therefore, they went their way."},{"time":1726.749,"text":"175. And it came to pass that when Ammon arose, he also administered unto them, And also did all the servants of Lamoni;"},{"time":1735.92,"text":"176. And they did all declare unto the people the selfsame thing - that their hearts had been changed, that they had no more desire to do evil;"},{"time":1744.814,"text":"177. And behold, many did declare unto the people that they had seen angels and had conversed with them; And thus they had told them things of God and of His righteousness."},{"time":1754.695,"text":"178. And it came to pass that there were many that did believe in their words; And as many as did believe were baptized; And they became a righteous people and they did establish a church among them;"},{"time":1766.598,"text":"179. And thus the work of the Lord did commence among the Lamanites; Thus the Lord did begin to pour out His Spirit upon them."},{"time":1775.44,"text":"180. And we see that His arm is extended to all people who will repent and believe on His name."},{"time":1781.84,"text":"181. And it came to pass that when they had established a church in that land, that King Lamoni desired that Ammon should go with him to the Land of Nephi, that he might show him unto his father."},{"time":1792.366,"text":"182. And it came to pass that the voice of the Lord came to Ammon, saying: \"Thou shalt not go up to the Land of Nephi, for behold, the king will seek thy life; But thou shalt go to the Land of Middoni, for behold, thy brother Aaron and also Muloki and Ammah are in prison.\""},{"time":1810.328,"text":"183. Now it came to pass that when Ammon had heard this, he saith unto Lamoni: \"Behold, my brother and brethren are in prison at Middoni and I go that I may deliver them.\""},{"time":1823.344,"text":"184. Now Lamoni saith unto Ammon: \"I know in the strength of the Lord thou canst do all things; But behold, I will go with thee to the Land of Middoni, for the king of the Land of Middoni, whose name is Antiomno, is a friend unto me;"},{"time":1836.36,"text":"185. Therefore, I go to the Land of Middoni that I may flatter the king of the land; And he will cast thy brethren out of prison.\""},{"time":1843.78,"text":"186. Now Lamoni saith unto him: \"Who told thee that thy brethren were in prison?\""},{"time":1851.2,"text":"187. And Ammon saith unto him: \"No one hath told me, save it be God; And He said unto me: 'Go and deliver thy brethren, for they are in prison in the Land of Middoni.'\""},{"time":1859.86,"text":"188. Now when Lamoni had heard this, he caused that his servants should make ready his horses and his chariots;"},{"time":1868.52,"text":"189. And he saith unto Ammon: \"Come, I will go with thee down to the Land of Middoni and there I will plead with the king, that he will cast thy brethren out of prison.\""},{"time":1879.931,"text":"190. And it came to pass that as Ammon and Lamoni were a journeying thither, that they met the father of Lamoni who was king over all the land."},{"time":1888.366,"text":"191. And behold, the father of Lamoni saith unto him: \"Why did ye not come to the feast on that great day when I made a feast unto my sons and unto my people?\""},{"time":1900.08,"text":"192. And he also saith: \"Whither art thou going with this Nephite which is one of the children of a liar?\""},{"time":1906.8,"text":"193. And it came to pass that Lamoni rehearsed unto him whither he was going, for he feared to offend him."},{"time":1914.0,"text":"194. And he also told him all the cause of his tarrying in his own kingdom, that he did not go unto his father to the feast which he had prepared."},{"time":1924.909,"text":"195. And now when Lamoni had rehearsed unto him all these things, behold, to his astonishment his father was angry with him and saith: \"Lamoni, thou art going to deliver these Nephites which are sons of a liar!"},{"time":1935.819,"text":"196. Behold, he robbed our fathers, And now his children are also come amongst us that they may by their cunning and their lyings deceive us, that they again may rob us of our property.\""},{"time":1946.73,"text":"197. Now the father of Lamoni commanded him that he should slay Ammon with the sword,"},{"time":1954.08,"text":"198. And he also commanded him that he should not go to the Land of Middoni, but that he should return with him to the Land of Ishmael."},{"time":1965.44,"text":"199. But Lamoni saith unto him: \"I will not slay Ammon, neither will I return to the Land of Ishmael, But I go to the Land of Middoni that I may release the brethren of Ammon, for I know that they are just men and holy prophets of the true God.\""},{"time":1976.8,"text":"200. Now when his father heard these words, he was angry with him and he drew his sword, that he might smite him to the earth."},{"time":1984.96,"text":"201. But Ammon stood forth and saith unto him: \"Behold, thou shalt not slay thy son; Nevertheless, it were better that he should fall than thee,"},{"time":1994.988,"text":"202. For behold, he hath repented of his sins; But if thou shouldst fall at this time in thine anger, thy soul could not be saved."},{"time":2004.08,"text":"203. \"And again, it is expedient that thou shouldst forbear; For if thou shouldst slay thy son - he being an innocent man - his blood would cry from the ground to the Lord his God for vengeance to come upon thee, And perhaps thou wouldst lose thy soul.\""},{"time":2019.084,"text":"204. Now when Ammon had said these words unto him, he answered him, saying: \"I know that if I should slay my son that I should shed innocent blood, for it is thou that hast sought to destroy him.\" And he stretched forth his hand to slay Ammon,"},{"time":2035.6,"text":"205. But Ammon withstood his blows and also smote his arm, that he could not use it."},{"time":2041.68,"text":"206. Now when the king saw that Ammon could slay him, he began to plead with Ammon that he would spare his life;"},{"time":2047.621,"text":"207. But Ammon raised his sword and said unto him: \"Behold, I will smite thee except thou wilt grant unto me that my brethren may be cast out of prison.\""},{"time":2058.096,"text":"208. Now the king, fearing that he should lose his life, said: \"If thou wilt spare me, I will grant unto thee whatsoever thou wilt ask, even to the half of the kingdom.\""},{"time":2068.703,"text":"209. Now when Ammon saw that he had wrought upon the old king according to his desire, he saith unto him: \"If thou wilt grant that my brethren may be cast out of prison, and also that Lamoni may retain his kingdom, And that ye be not displeased with him, but grant that he may do according to his own desires in whatsoever thing he thinketh, And then will I spare thee; Otherwise, I will smite thee to the earth.\""},{"time":2093.145,"text":"210. Now when Ammon had said these words, the king began to rejoice because of his life;"},{"time":2099.12,"text":"211. And when he saw that Ammon had no desires to destroy him, And when he also saw the great love he had for his son Lamoni, he was astonished exceedingly and saith:"},{"time":2110.96,"text":"212. \"Because this is all that thou hast desired, that I would release thy brethren and suffer that my son Lamoni should retain his kingdom, Behold, I will grant unto you that my son may retain his kingdom from this time and forever; And I will govern him no more."},{"time":2126.552,"text":"213. \"And I will also grant unto thee that thy brethren may be cast out of prison and thou and thy brethren may come unto me in my kingdom, for I shall greatly desire to see thee.\""},{"time":2136.867,"text":"214. For the king was greatly astonished at the words which he had spoken, and also at the words which had been spoken by his son Lamoni; Therefore, he was desirous to learn them."},{"time":2148.067,"text":"215. And it came to pass that Ammon and Lamoni proceeded on their journey toward the Land of Middoni."},{"time":2154.194,"text":"216. And it came to pass that Lamoni found favor in the eyes of the king of the land, therefore, the brethren of Ammon were brought forth out of prison."},{"time":2164.395,"text":"217. And when Ammon did meet them he was exceeding sorrowful, For behold, they were naked and their skins were worn exceedingly because of being bound with strong cords."},{"time":2175.08,"text":"218. And they also had suffered hunger, thirst and all kind of afflictions; Nevertheless, they were patient in all their sufferings."},{"time":2184.261,"text":"219. And as it happened, it was their lot to have fallen into the hands of a more hardened and a more stiff-necked people;"},{"time":2192.32,"text":"220. Therefore, they would not hearken unto their words, And they had cast them out and had smote them and had driven them from house to house and from place to place even until they had arrived to the Land of Middoni."},{"time":2204.051,"text":"221. And there they were taken and cast into prison and bound with strong cords and kept in prison for many days, And were delivered by Lamoni and Ammon."}]
