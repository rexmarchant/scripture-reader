<script>
window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",
  chapter: "Chapter 13",
  audioSrc: "https://archive.org/download/3-nephi-ch-13/3%20Nephi%20Ch%2013.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 13"},{"time":6.96,"text":"1. \"Write the things which ye have seen and heard, save it be those which are forbidden; Write the works of this people, which shall be even as hath been written of that which hath been;"},{"time":13.92,"text":"2. For behold, out of the books which have been written, and which shall be written, shall this people be judged, For by them should their works be known unto men."},{"time":23.92,"text":"3. \"And behold, all things are written by the Father; Therefore, out of the books which shall be written shall the world be judged."},{"time":32.8,"text":"4. \"And know ye that ye shall be judges of this people, according to the judgment which I shall give unto you, which shall be just;"},{"time":40.64,"text":"5. Therefore, what manner of men had ye ought to be? Verily I say unto you, even as I am. And now I go unto the Father."},{"time":51.928,"text":"6. \"And verily I say unto you, whatsoever things ye shall ask the Father in My name, it shall be given unto you; Therefore, ask, and ye shall receive, Knock, and it shall be opened unto you; For he that asketh, receiveth, And unto him that knocketh, it shall be opened."},{"time":71.186,"text":"7. \"And now behold, My joy is great, even unto fullness, because of you, and also this generation; Yea, and even the Father rejoiceth, and also all the holy angels, because of you and this generation, For none of them are lost."},{"time":88.133,"text":"8. \"Behold, I would that ye should understand - For I mean them which are now alive of this generation; And none of them are lost; And in them I have fullness of joy."},{"time":99.369,"text":"9. \"But behold, it sorroweth Me because of the fourth generation from this generation, For they are led away captive by him, even as was the son of perdition; For they will sell Me for silver and for gold, And for that which moth doth corrupt and which thieves can break through and steal;"},{"time":115.402,"text":"10. And in that day will I visit them, even in turning their works upon their own heads.\""},{"time":121.68,"text":"11. And it came to pass that when Jesus had ended these sayings, He saith unto His disciples: \"Enter ye in at the strait gate, For strait is the gate and narrow is the way that leads to life, And few there be that find it; But wide is the gate and broad the way which leads to death, And many there be that traveleth therein, until the night cometh wherein no man can work.\""},{"time":144.259,"text":"12. And it came to pass when Jesus had said these words, He spake unto His disciples one by one, saying unto them: \"What is it that ye desire of Me after that I am gone to the Father?\""},{"time":156.656,"text":"13. And they all spake, save it were three, saying: \"We desire that after we have lived unto the age of man, That our ministry wherein Thou hast called us may have an end, That we may speedily come unto Thee in Thy kingdom.\""},{"time":169.905,"text":"14. And He saith unto them: \"Blessed are ye because ye desire this thing of Me; Therefore, after that ye are seventy and two years old, ye shall come unto Me in My kingdom; And with Me ye shall find rest.\""},{"time":183.154,"text":"15. And when He had spake unto them, He turned Himself unto the three and said unto them: \"What will ye that I should do unto you when I am gone unto the Father?\""},{"time":192.876,"text":"16. And they sorrowed in their hearts, for they durst not speak unto Him the thing which they desired."},{"time":202.718,"text":"17. And He saith unto them: \"Behold, I know your thoughts; And ye have desired the thing which John My beloved, which was with Me in My ministry before that I was lifted up by the Jews, desired of Me;"},{"time":212.56,"text":"18. Therefore, more blessed are ye, for ye shall never taste of death, But ye shall live to behold all the doings of the Father unto the children of men, Even until all things shall be fulfilled according to the will of the Father, when I shall come in My glory with the powers of heaven;"},{"time":228.88,"text":"19. And ye shall never endure the pains of death; But when I shall come in My glory, ye shall be changed in the twinkling of an eye from mortality to immortality; And then shall ye be blessed in the kingdom of My Father."},{"time":242.4,"text":"20. \"And again, ye shall not have pain while ye shall dwell in the flesh, Neither sorrow, save it be for the sins of the world;"},{"time":250.457,"text":"21. And all this will I do because of the thing which ye have desired of Me, For ye have desired that ye might bring the souls of men unto Me while the world shall stand; And for this cause ye shall have fullness of joy and ye shall sit down in the kingdom of My Father;"},{"time":266.503,"text":"22. Yea, your joy shall be full, even as the Father hath given Me fullness of joy; And ye shall be even as I am; And I am even as the Father, And the Father and I are one,"},{"time":277.827,"text":"23. And the Holy Ghost beareth record of the Father and Me; And the Father giveth the Holy Ghost unto the children of men because of Me.\""},{"time":286.509,"text":"24. And it came to pass that when Jesus had spake these words, He touched every one of them with His finger, save it were the three which were to tarry; And then He departed."},{"time":297.238,"text":"25. And behold, the heavens were opened, And they were caught up into heaven and saw and heard unspeakable things;"},{"time":304.692,"text":"26. And it was forbidden them that they should utter, Neither was it given unto them power that they could utter the things which they saw and heard;"},{"time":312.682,"text":"27. And whether they were in the body or out of the body, they could not tell; For it did seem unto them like a transfiguration of them, That they were changed from this body of flesh into an immortal state that they could behold the things of God."},{"time":327.091,"text":"28. But it came to pass that they did again minister upon the face of the earth; Nevertheless, they did not minister of the things which they had heard and seen because of the commandment which was given them in heaven."},{"time":339.52,"text":"29. And now whether they were mortal or immortal from the day of their transfiguration, I know not; But this much I know, according to the record which hath been given - They did go forth upon the face of the land and did minister unto all the people, uniting as many to the church as would believe in their preaching, baptizing them,"},{"time":357.86,"text":"30. And as many as were baptized did receive the Holy Ghost; And they were cast into prison by them who did not belong to the church,"},{"time":367.684,"text":"31. And the prisons could not hold them, for they were rent in twain; And they were cast down into the earth,"},{"time":374.88,"text":"32. But they did smite the earth with the word of God, insomuch that by His power they were delivered out of the depths of the earth; And therefore, they could not dig pits sufficiently to hold them;"},{"time":386.4,"text":"33. And thrice they were cast into a furnace and received no harm;"},{"time":391.031,"text":"34. And twice were they cast into a den of wild beasts, And behold, they did play with the beasts as a child with a suckling lamb and received no harm."},{"time":400.337,"text":"35. And it came to pass that thus they did go forth among all the people of Nephi and did preach the gospel of Christ unto all people upon the face of the land;"},{"time":411.416,"text":"36. And they were converted unto the Lord and were united unto the church of Christ; And thus the people of that generation were blessed according to the word of Jesus."},{"time":421.68,"text":"37. And now I, Mormon, make an end of speaking concerning these things for a time."},{"time":428.48,"text":"38. Behold, I was about to write the names of those who were never to taste of death; But the Lord forbade, Therefore, I write them not, for they are hid from the world;"},{"time":439.6,"text":"39. But behold, I have seen them and they have ministered unto me; And behold, they will be among the Gentiles and the Gentiles knoweth them not;"},{"time":449.68,"text":"40. They will also be among the Jews and the Jews shall know them not."},{"time":454.88,"text":"41. And it shall come to pass that when the Lord seeth fit in His wisdom, That they shall minister unto all the scattered tribes of Israel and unto all nations, kindreds, tongues and people, And shall bring out of them unto Jesus many souls, That their desire may be fulfilled, and also because of the convincing power of God which is in them."},{"time":474.56,"text":"42. And they are as the angels of God, And if they shall pray unto the Father in the name of Jesus, they can show themselves unto whatsoever man it seemeth them good;"},{"time":484.56,"text":"43. Therefore, great and marvelous works shall be wrought by them before the great and coming day when all people must surely stand before the judgment seat of Christ;"},{"time":495.12,"text":"44. Yea, even among the Gentiles shall there be a great and marvelous work wrought by them before that judgment day."},{"time":503.36,"text":"45. And if ye had all the scriptures which give an account of all the marvelous works of Christ, Ye would, according to the words of Christ, know that these things must surely come to pass;"},{"time":513.48,"text":"46. And wo be unto him that will not hearken unto the words of Jesus, and also to them which He hath chosen and sent among them!"},{"time":523.6,"text":"47. For whoso receiveth not the words of Jesus, and the words of them which He hath sent, receiveth not Him; And therefore, He will not receive them at the last day; And it would be better for them if they had not been born;"},{"time":537.52,"text":"48. For do ye suppose that ye can get rid of the justice of an offended God who hath been trampled under feet of men that thereby salvation might come?"},{"time":546.8,"text":"49. And now behold, as I spoke concerning them whom the Lord had chosen, Yea, even three which were caught up into the heavens, that I knew not whether they were cleansed from mortality to immortality;"},{"time":559.68,"text":"50. But behold, since I wrote I have inquired of the Lord, And He hath made it manifest unto me that there must needs be a change wrought upon their bodies or else it needs be that they must taste of death;"},{"time":572.0,"text":"51. Therefore, that they might not taste of death, there was a change wrought upon their bodies that they might not suffer pain nor sorrow, save it were for the sins of the world."},{"time":582.64,"text":"52. Now this change was not equal to that which should take place at the last day; But there was a change wrought upon them, insomuch that Satan could have no power over them - that he could not tempt them - And they were sanctified in the flesh, that they were holy and that the powers of the earth could not hold them;"},{"time":599.92,"text":"53. And in this state they were to remain until the judgment day of Christ; And at that day they were to receive a greater change, And to be received into the kingdom of the Father to go no more out, But to dwell with God eternally in the heavens."},{"time":614.0,"text":"54. And now behold I say unto you, that when the Lord shall see fit in His wisdom that these sayings shall come unto the Gentiles according to His word, Then ye may know that the covenant which the Father hath made with the children of Israel concerning their restoration to the lands of their inheritance is already beginning to be fulfilled,"},{"time":633.12,"text":"55. And ye may know that the words of the Lord which have been spoken by the holy prophets shall all be fulfilled; And ye need not say that the Lord delays His coming unto the children of Israel,"},{"time":644.96,"text":"56. And ye need not imagine in your hearts that the words which have been spoken are vain; For behold, the Lord will remember His covenant which He hath made unto His people of the house of Israel."},{"time":655.831,"text":"57. And when ye shall see these sayings coming forth among you, Then ye need not any longer spurn at the doings of the Lord; For the sword of His justice is in His right hand, And behold, at that day, if ye shall spurn at His doings, He will cause it that it shall soon overtake you."},{"time":673.284,"text":"58. Wo unto him that spurneth at the doings of the Lord! Yea, wo unto him that shall deny the Christ and His works!"},{"time":678.147,"text":"59. Yea, wo unto him that shall deny the revelations of the Lord! And that shall say: \"The Lord no longer worketh by revelations, or by prophecy, or by gifts, or by tongues, or by healings, or by the power of the Holy Ghost\";"},{"time":701.68,"text":"60. Yea, and wo unto him that shall say at that day that there can be no miracle wrought by Jesus Christ, for to get gain! For he that doeth this shall become like unto the son of perdition for whom there was no mercy, according to the words of Christ."},{"time":718.072,"text":"61. Yea, and ye need not any longer hiss, nor spurn, nor make game of the Jews, nor of any of the remnant of the house of Israel; For behold, the Lord remembereth His covenant unto them, And He will do unto them according to that which He hath sworn;"},{"time":734.025,"text":"62. Therefore, ye need not suppose that ye can turn the right hand of the Lord unto the left, That He may not execute judgment unto the fulfilling of the covenant which He hath made unto the house of Israel."}]
};
</script>
