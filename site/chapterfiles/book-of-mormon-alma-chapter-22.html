window.CHAPTER_DATA = {

  audioSrc: "https://archive.org/download/alma-ch-22/Alma%20Ch%2022.mp3",
  lyrics: [{"time":0.0,"text":"Alma Chapter 22"},{"time":12.078,"text":"1. And now it came to pass that Moroni did not stop making preparations for war - or to defend themselves against the Lamanites. For he caused that his armies should commence - in the commencement of the twentieth year of the reign of the judges - That they should commence in digging up heaps of earth round about all the cities throughout all the land which was possessed by the Nephites."},{"time":24.156,"text":"2. And upon the top of these ridges of earth he caused that there should be timbers, yea, works of timbers built up to the height of a man round about the cities."},{"time":35.36,"text":"3. And he caused that upon those works of timbers that there should be a frame of pickets built upon the timbers round about, And they were strong and high. And he caused towers to be erected that overlooked those works of pickets."},{"time":48.047,"text":"4. And he caused places of security to be built upon those towers, that the stones and the arrows of the Lamanites could not hurt them;"},{"time":57.44,"text":"5. And they were prepared that they could cast stones from the top thereof, according to their pleasure and their strength, And slay him which should attempt to approach near the walls of the city."},{"time":67.865,"text":"6. Thus Moroni did prepare strongholds against the coming of their enemies, round about every city in all the land."},{"time":80.093,"text":"7. And it came to pass that Moroni caused that his armies should go forth into the East Wilderness; Yea, and they went forth and drove all the Lamanites which were in the East Wilderness into their own lands, which were south of the Land of Zarahemla."},{"time":92.32,"text":"8. And the Land of Nephi did run in a straight course from the East Sea to the west."},{"time":98.24,"text":"9. And it came to pass that when Moroni had driven all the Lamanites out of the East Wilderness, which was north of the lands of their own possessions, He caused that the inhabitants, which were in the Land of Zarahemla and in the land round about, should go forth into the East Wilderness, even to the borders by the seashore, and possess the land."},{"time":117.087,"text":"10. And he also placed armies on the south in the borders of their possessions, And caused them to erect fortifications, that they might secure their armies and their people from the hands of their enemies."},{"time":129.511,"text":"11. And thus he cut off all the strongholds of the Lamanites in the East Wilderness, yea, and also on the west, Fortifying the line between the Nephites and the Lamanites, between the Land of Zarahemla and the Land of Nephi, from the West Sea running by the head of the River Sidon,"},{"time":147.92,"text":"12. The Nephites possessing all the Land Northward, yea, even all the land which was northward of the Land Bountiful, according to their pleasure."},{"time":156.923,"text":"13. Thus Moroni with his armies, which did increase daily because of the assurance of protection which his works did bring forth unto them, Therefore, they did seek to cut off the strength and the power of the Lamanites from off the lands of their possessions, That they should have no power upon the lands of their possessions."},{"time":173.435,"text":"14. And it came to pass that the Nephites began the foundation of a city, And they called the name of the city Moroni; And it was by the East Sea, And it was on the south by the line of the possessions of the Lamanites."},{"time":187.32,"text":"15. And they also began a foundation for a city between the City of Moroni and the City of Aaron, joining the borders of Aaron and Moroni; And they called the name of the city, or the land, Nephihah."},{"time":200.084,"text":"16. And they also began in that same year to build many cities on the north, One in a particular manner which they called Lehi, which was in the north by the borders of the seashore. And thus ended the twentieth year."},{"time":214.56,"text":"17. And in these prosperous circumstances were the people of Nephi, in the commencement of the twenty and first year of the reign of the judges over the people of Nephi;"},{"time":224.455,"text":"18. And they did prosper exceedingly and they became exceeding rich, Yea, and they did multiply and wax strong in the land."},{"time":232.46,"text":"19. And thus we see how merciful and just are all the dealings of the Lord, to the fulfilling of all His words unto the children of men;"},{"time":241.628,"text":"20. Yea, we can behold that His words are verified, even at this time, which He spake unto Lehi, saying: \"Blessed art thou and thy children; And they shall be blessed, and inasmuch as they shall keep My commandments, They shall prosper in the land;"},{"time":258.04,"text":"21. But remember, inasmuch as they will not keep My commandments, They shall be cut off from the presence of the Lord.\""},{"time":265.436,"text":"22. And we see that these promises have been verified to the people of Nephi; For it has been their quarrelings and their contentions - yea, their murderings and their plunderings, their idolatry, their whoredoms and their abominations which were among themselves - which brought upon them their wars and their destructions."},{"time":284.56,"text":"23. And those who were faithful in keeping the commandments of the Lord were delivered at all times, Whilst thousands of their wicked brethren have been consigned to bondage, or to perish by the sword, or to dwindle in unbelief and mingle with the Lamanites."},{"time":298.4,"text":"24. But behold, there never was a happier time among the people of Nephi since the days of Nephi than in the days of Moroni, Yea, even at this time in the twenty and first year of the reign of the judges."},{"time":309.684,"text":"25. And it came to pass that the twenty and second year of the reign of the judges also ended in peace, Yea, and also the twenty and third year."},{"time":319.96,"text":"26. And it came to pass that in the commencement of the twenty and fourth year of the reign of the judges, There would also have been peace among the people of Nephi had it not been for a contention which took place among them concerning the Land of Lehi and the Land of Morionton, which joined upon the borders of Lehi, Both of which were on the borders by the seashore."},{"time":341.6,"text":"27. For behold, the people which possessed the Land of Morionton did claim a part of the Land of Lehi; Therefore, there began to be a warm contention between them, insomuch that the people of Morionton took up arms against their brethren, And they were determined by the sword to slay them."},{"time":358.84,"text":"28. But behold, the people which possessed the Land of Lehi fled to the camp of Moroni and appealed unto him for assistance, For behold, they were not in the wrong."},{"time":368.8,"text":"29. And it came to pass that when the people of Morionton, which were led by a man whose name was Morionton, found that the people of Lehi had fled to the camp of Moroni, They were exceeding fearful lest the army of Moroni should come upon them and destroy them;"},{"time":383.51,"text":"30. Therefore, Morionton put it into their hearts that they should flee to the land which was northward, which was covered with large bodies of water, And take possession of the land which was northward."},{"time":395.345,"text":"31. And behold, they would have carried this plan into effect, which would have been a cause to have been lamented, But behold, Morionton, being a man of much passion, Therefore, he was angry with one of his maidservants and he fell upon her and beat her much."},{"time":412.56,"text":"32. And it came to pass that she fled and came over to the camp of Moroni and told Moroni all things concerning the matter; And also concerning their intentions to flee into the Land Northward."},{"time":424.4,"text":"33. Now behold, the people which were in the Land Bountiful - Or rather, Moroni feared that they would hearken to the words of Morionton and unite with his people; And thus he would obtain possession of those parts of the land, which would lay a foundation for serious consequences among the people of Nephi, Yea, which consequences would lead to the overthrow of their liberty;"},{"time":445.84,"text":"34. Therefore, Moroni sent an army, with their camp, to head the people of Morionton to stop their flight into the Land Northward."},{"time":453.2,"text":"35. And it came to pass that they did not head them until they had come to the borders of the Land Desolation; And there they did head them by the Narrow Pass which led by the sea into the Land Northward, Yea, by the sea on the west and on the east."},{"time":468.629,"text":"36. And it came to pass that the army which was sent by Moroni - which was led by a man whose name was Teancum - did meet the people of Morionton;"},{"time":477.76,"text":"37. And so stubborn were the people of Morionton, being inspired by his wickedness and his flattering words, That a battle commenced between them in the which Teancum did slay Morionton and defeat his army and took them prisoners and returned to the camp of Moroni."},{"time":492.901,"text":"38. And thus ended the twenty and fourth year of the reign of the judges over the people of Nephi. And thus were the people of Morionton brought back."},{"time":503.892,"text":"39. And upon their covenanting to keep the peace, they were restored to the Land of Morionton, And a union took place between them and the people of Lehi; And they were also restored to their lands."},{"time":515.36,"text":"40. And it came to pass that in the same year that the people of Nephi had peace restored unto them, That Nephihah, the second chief judge, died, having filled the judgment seat with perfect uprightness before God;"},{"time":530.468,"text":"41. Nevertheless, he had refused Alma to take possession of those records and those things which were esteemed by Alma and his fathers to be most sacred; Therefore, Alma had conferred them upon his son Helaman."},{"time":541.667,"text":"42. Behold, it came to pass that the son of Nephihah was appointed to fill the judgment seat in the stead of his father; Yea, he was appointed chief judge and governor over the people, with an oath and sacred ordinance to judge righteously, And to keep the peace and the freedom of the people, And to grant unto them their sacred privileges to worship the Lord their God,"},{"time":564.72,"text":"43. Yea, to support and maintain the cause of God all his days, And to bring the wicked to justice according to their crime. Now behold, his name was Pahoron;"},{"time":575.351,"text":"44. And Pahoron did fill the seat of his father and did commence his reign in the end of the twenty and fourth year over the people of Nephi."}]
};
