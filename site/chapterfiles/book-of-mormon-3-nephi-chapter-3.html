window.CHAPTER_DATA = {
  scriptureSet: "Book of Mormon",
  book: "3 Nephi",

  audioSrc: "https://archive.org/download/3-nephi-ch-3/3%20Nephi%20Ch%203.mp3",
  lyrics: [{"time":0.0,"text":"Third Nephi Chapter 3"},{"time":7.86,"text":"1. And now it came to pass that the people of the Nephites did all return to their own lands in the twenty and sixth year, Every man with his family, his flocks and his herds, his horses and his cattle and all things whatsoever did belong unto them."},{"time":23.075,"text":"2. And it came to pass that they had not eaten up all their provisions, Therefore, they did take with them all that they had not devoured of all their grain of every kind and their gold and their silver and all their precious things,"},{"time":30.43,"text":"3. And they did return to their own lands and their possessions - both on the north and on the south, both on the Land Northward and on the Land Southward."},{"time":39.821,"text":"4. And they granted unto those robbers which had entered into a covenant to keep the peace of the land - which were desirous to remain Lamanites - lands according to their numbers, that they might have with their labors wherewith to subsist upon; And thus they did establish peace in all the land;"},{"time":56.177,"text":"5. And they began again to prosper and to wax great. And the twenty and sixth and seventh years passed away and there was great order in the land; And they had formed their laws according to equity and justice."},{"time":69.684,"text":"6. And now there was nothing in all the land to hinder the people from prospering continually, except they should fall into transgressions;"},{"time":78.88,"text":"7. And now it was Gidgiddoni and the judge Lachoneus and those which had been appointed leaders which had established this great peace in the land."},{"time":90.32,"text":"8. And it came to pass that there were many cities built anew and there were many old cities repaired, And there were many highways cast up and many roads made which led from city to city and from land to land and from place to place;"},{"time":101.76,"text":"9. And thus passed away the twenty and eighth year and the people had continual peace."},{"time":106.88,"text":"10. But it came to pass in the twenty and ninth year, there began to be some disputings among the people;"},{"time":113.92,"text":"11. And some were lifted up unto pride and boastings because of their exceeding great riches, yea, even unto great persecutions, For there were many merchants in the land, and also many lawyers and many officers."},{"time":126.54,"text":"12. And the people began to be distinguished by ranks according to their riches and their chance for learning -"},{"time":135.497,"text":"13. Yea, some were ignorant because of their poverty, and others did receive great learning because of their riches;"},{"time":143.89,"text":"14. Some were lifted up in pride, and others were exceeding humble; Some did return railing for railing, while others would receive railing and persecution and all manner of afflictions and would not turn and revile again, but were humble and penitent before God."},{"time":159.156,"text":"15. And thus there became a great inequality in all the land, insomuch that the church began to be broken up; Yea, insomuch that in the thirtieth year the church was broken up in all the land, save it were among a few of the Lamanites which were converted unto the true faith;"},{"time":175.449,"text":"16. And they would not depart from it, for they were firm and steadfast and immovable, willing with all diligence to keep the commands of the Lord."},{"time":184.645,"text":"17. Now the cause of this iniquity of the people was this: Satan had great power unto the stirring up of the people to do all manner of iniquity, And to the puffing them up with pride, tempting them to seek for power and authority and riches and the vain things of the world."},{"time":200.818,"text":"18. And thus Satan did lead away the hearts of the people to do all manner of iniquity; Therefore, they had not enjoyed peace but a few years."},{"time":211.04,"text":"19. And thus in the commencement of the thirtieth year - the people having been delivered up for the space of a long time, to be carried about by the temptations of the devil whithersoever he desired to carry them, and to do whatsoever iniquity he desired they should - And thus in the commencement of this, the thirtieth year, they were in a state of awful wickedness;"},{"time":230.818,"text":"20. Now they did not sin ignorantly, for they knew the will of God concerning them, for it had been taught unto them; Therefore, they did willfully rebel against God."},{"time":240.876,"text":"21. And now it was in the days of Lachoneus, the son of Lachoneus, For Lachoneus did fill the seat of his father and did govern the people that year."},{"time":251.92,"text":"22. And there began to be men inspired from heaven and sent forth, standing among the people in all the land, preaching and testifying boldly of the sins and iniquities of the people,"},{"time":263.28,"text":"23. And testifying unto them concerning the redemption which the Lord would make for His people, or in other words, the resurrection of Christ; And they did testify boldly of His death and sufferings."},{"time":274.475,"text":"24. Now there were many of the people which were exceeding angry because of those which testified of these things;"},{"time":281.976,"text":"25. And those which were angry were chiefly the chief judges and they which had been high priests and lawyers;"},{"time":289.487,"text":"26. Yea, all they which were lawyers were angry with those which testified of these things."},{"time":295.346,"text":"27. Now there was no lawyer nor judge nor high priest that could have power to condemn anyone to death, save their condemnation was signed by the governor of the land;"},{"time":307.04,"text":"28. Now there were many of those which testified of the things pertaining to Christ, which testified boldly, which were taken and put to death secretly by the judges, that the knowledge of their death came not unto the governor of the land until after their death;"},{"time":320.72,"text":"29. Now behold, this was contrary to the laws of the land - that any man should be put to death except they had power from the governor of the land;"},{"time":329.638,"text":"30. Therefore, a complaint came up unto the Land of Zarahemla, to the governor of the land, against these judges which had condemned the prophets of the Lord unto death not according to the law."},{"time":340.855,"text":"31. Now it came to pass that they were taken and brought up before the judge to be judged of their crime which they had done, according to the law which had been given by the people."},{"time":351.427,"text":"32. Now it came to pass that those judges had many friends and kindreds; And the remainder - yea, even almost all the lawyers and the high priests - did gather themselves together and unite with the kindreds of those judges which were to be tried according to the law;"},{"time":367.054,"text":"33. And they did enter into a covenant one with another - Yea, even into that covenant which was given by them of old, which covenant was given and administered by the devil to combine against all righteousness -"},{"time":381.206,"text":"34. Therefore, they did combine against the people of the Lord and enter into a covenant to destroy them and to deliver those which were guilty of murder from the grasp of justice, which was about to be administered according to the law;"},{"time":393.591,"text":"35. And they did set at defiance the law and the rights of their country; And they did covenant one with another to destroy the governor and to establish a king over the land, That the land should no more be at liberty, but should be subject unto kings."},{"time":408.88,"text":"36. Now behold, I will show unto you that they did not establish a king over the land, But in this same year - yea, the thirtieth year - they did destroy upon the judgment seat, yea, did murder the chief judge of the land;"},{"time":423.095,"text":"37. And the people were divided one against another, And they did separate one from another into tribes, every man according to his family and his kindred and friends - And thus they did destroy the government of the land -"},{"time":436.038,"text":"38. And every tribe did appoint a chief or a leader over them; And thus they became tribes and leaders of tribes."},{"time":444.782,"text":"39. Now behold, there was no man among them save he had much family and many kindreds and friends, Therefore, their tribes became exceeding great."},{"time":453.256,"text":"40. Now all this was done and there were no wars as yet among them; And all this iniquity had come upon the people because they did yield themselves unto the power of Satan;"},{"time":464.7,"text":"41. And the regulations of the government were destroyed because of the secret combination of the friends and the kindreds of them which murdered the prophets;"},{"time":474.64,"text":"42. And they did cause a great contention in the land, insomuch that the more righteous part of the people - although they were nearly all become wicked - yea, there were but few righteous men among them."},{"time":485.457,"text":"43. And thus six years had not passed away since the more part of the people had turned from their righteousness like the dog to his vomit, or like the sow to her wallowing in the mire."},{"time":497.52,"text":"44. Now this secret combination which had brought so great iniquity upon the people did gather themselves together and did place at their head a man whom they did call Jacob, And they did call him their king;"},{"time":508.632,"text":"45. Therefore, he became a king over this wicked band, And he was one of the chiefest which had given his voice against the prophets which testified of Jesus."},{"time":518.773,"text":"46. And it came to pass that they were not so strong in numbers as the tribes of the people which were united together, Save it were their leaders did establish their laws, everyone according to his tribe;"},{"time":532.049,"text":"47. Nevertheless, they were enemies - notwithstanding they were not a righteous people - Yet they were united in the hatred of those who had entered into a covenant to destroy the government."},{"time":543.125,"text":"48. Therefore, Jacob seeing that their enemies were more numerous than they, he being the king of the band, Therefore, he commanded his people that they should take their flight into the northernmost part of the land,"},{"time":554.855,"text":"49. And there build up unto themselves a kingdom until they were joined by dissenters - for he flattered them that there would be many dissenters - And they become sufficiently strong to contend with the tribes of the people;"},{"time":566.584,"text":"50. And they did so; And so speedy was their march that it could not be impeded until they had gone forth out of the reach of the people."},{"time":575.68,"text":"51. And thus ended the thirtieth year; And thus were the affairs of the people of Nephi."},{"time":583.8,"text":"52. And it came to pass in the thirty and first year that they were divided into tribes, every man according to his family, kindred and friends;"},{"time":591.92,"text":"53. Nevertheless, they had come to an agreement that they would not go to war one with another; But they were not united as to their laws and their manner of government, for they were established according to the minds of them which were their chiefs and their leaders;"},{"time":605.387,"text":"54. But they did establish very strict laws that one tribe should not trespass against another, insomuch that in some degree they had peace in the land;"},{"time":614.427,"text":"55. Nevertheless, their hearts were turned from the Lord their God and they did stone the prophets and did cast them out from among them."},{"time":622.624,"text":"56. And it came to pass that Nephi - Having been visited by angels, and also the voice of the Lord, Therefore, having seen angels and being eyewitness, And having had power given unto him that he might know concerning the ministry of Christ, And also being eyewitness to their quick return from righteousness unto their wickedness and also abominations,"},{"time":643.177,"text":"57. Therefore, being grieved for the hardness of their hearts and the blindness of their minds - Went forth among them in that same year and began to testify boldly repentance and remission of sins through faith on the Lord Jesus Christ."},{"time":658.038,"text":"58. And he did minister many things unto them - And all of them cannot be written and a part of them would not suffice, Therefore, they are not written in this book - And Nephi did minister with power and with great authority."},{"time":670.185,"text":"59. And it came to pass that they were angry with him, even because he had greater power than they, For it were not possible that they could disbelieve his words, For so great was his faith on the Lord Jesus Christ that angels did minister unto him daily;"},{"time":685.648,"text":"60. And in the name of Jesus did he cast out devils and unclean spirits; And even his brother did he raise from the dead after he had been stoned and suffered death by the people;"},{"time":696.446,"text":"61. And the people saw it and did witness of it and were angry with him because of his power; And he did also do many more miracles in the sight of the people in the name of Jesus."},{"time":707.253,"text":"62. And it came to pass that the thirty and first year did pass away and there were but few which were converted unto the Lord;"},{"time":715.04,"text":"63. But as many as were converted did truly signify unto the people that they had been visited by the power and Spirit of God which was in Jesus Christ in whom they believed."},{"time":724.842,"text":"64. And as many as had devils cast out from them and were healed of their sicknesses and their infirmities did truly manifest unto the people that they had been wrought upon by the Spirit of God and had been healed;"},{"time":738.076,"text":"65. And they did show forth signs also and did do some miracles among the people."},{"time":743.335,"text":"66. And it came to pass that thus passed away the thirty and second year also."},{"time":748.488,"text":"67. And Nephi did cry unto the people in the commencement of the thirty and third year; And he did preach unto them repentance and remission of sins."},{"time":758.56,"text":"68. Now I would have you remember also that there were none which were brought unto repentance who were not baptized with water;"},{"time":767.04,"text":"69. Therefore, there were ordained of Nephi men unto this ministry, that all such as should come unto them should be baptized with water, And this as a witness and a testimony before God and unto the people that they had repented and received a remission of their sins;"},{"time":782.42,"text":"70. And there were many in the commencement of this year that were baptized unto repentance. And thus the more part of the year did pass away."}]
};
